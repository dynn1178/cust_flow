  });
}

/* ---------------- 자동 정렬 ----------------
   지금 자리를 기준점으로 삼아 흐름 순서대로 다시 세운다.
   메뉴 라벨 "세로 정렬" — 흐름이 위→아래로 흐르도록 깊이(depth)를 세로축(y)에 놓고,
                       같은 깊이의 형제 노드는 가로로(x) 늘어놓는다.
   메뉴 라벨 "가로 정렬" — 흐름이 왼→오른쪽으로 흐르도록 깊이를 가로축(x)에 놓고,
                       같은 깊이의 형제 노드는 세로로(y) 쌓는다.
   화면(zoom·pan)은 건드리지 않으므로 시야가 튀지 않고, 되돌리기를 제공한다. */
function autoLayout(menuDir) {
  const dir0 = menuDir === "h" ? "h" : "v";
  autoLayoutDir = dir0;
  /* 아래 계산 로직은 원래 dir "h"=세로축 깊이, "v"=가로축 깊이로 짜여 있어서,
     메뉴 라벨과 맞추기 위해 여기서 뒤집어 넘긴다. */
  const dir = dir0 === "h" ? "v" : "h";
  const nodes = B().nodes, edges = B().edges;
  if (!nodes.length) return;
  const prev = nodes.map(n => ({ id: n.id, x: n.x, y: n.y }));
  const ox = Math.min.apply(null, nodes.map(n => n.x));
  const oy = Math.min.apply(null, nodes.map(n => n.y));

  const parent = {}; nodes.forEach(n => parent[n.id] = n.id);
  const find = a => parent[a] === a ? a : (parent[a] = find(parent[a]));
  edges.forEach(e => { if (parent[e.from] && parent[e.to]) parent[find(e.from)] = find(e.to); });
  const groups = {};
  nodes.forEach(n => (groups[find(n.id)] = groups[find(n.id)] || []).push(n));

  let cursor = oy;   // 다음 그룹은 항상 아래쪽으로 이어 쌓는다
  Object.keys(groups).forEach(key => {
    const g = groups[key], ids = g.map(n => n.id);
    const inner = edges.filter(e => ids.indexOf(e.from) >= 0 && ids.indexOf(e.to) >= 0 && e.from !== e.to);
    const depth = {}; ids.forEach(id => depth[id] = 0);
    for (let pass = 0; pass < ids.length + 2; pass++) {
      let moved = false;
      inner.forEach(e => { if (depth[e.to] < depth[e.from] + 1) { depth[e.to] = depth[e.from] + 1; moved = true; } });
      if (!moved) break;
    }
    const cols = {};
    g.forEach(n => (cols[depth[n.id]] = cols[depth[n.id]] || []).push(n));
    const colKeys = Object.keys(cols).map(Number).sort((a, b) => a - b);
    const order = {};
    colKeys.forEach((c, ci) => {
      cols[c].forEach((n, i) => {
        /* 화살표로 이어지지 않은(부모가 없는) 첫 열은, 생성 순서가 아니라 지금 화면에
           놓인 위치(세로 정렬은 위→아래, 가로 정렬은 왼→오른)를 기준으로 순서를 정한다 */
        if (!ci) { order[n.id] = dir === "h" ? n.x : n.y; return; }
        const ps = inner.filter(e => e.to === n.id).map(e => order[e.from]).filter(v => v != null);
        order[n.id] = ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : i + 0.5;
      });
      cols[c].sort((a, b) => order[a.id] - order[b.id]);
      cols[c].forEach((n, i) => order[n.id] = i);
    });

    /* 같은 순번(i)에 있는 형제 노드들의 교차축 크기 — 세로 정렬은 높이, 가로 정렬은 너비 */
    const crossSize = [];
    const maxItems = Math.max.apply(null, colKeys.map(c => cols[c].length));
    for (let i = 0; i < maxItems; i++) {
      crossSize[i] = Math.max.apply(null, colKeys.map(c => {
        const n = cols[c][i]; if (!n) return 0;
        const z = NSZ[n.id];
        return dir === "h" ? (z ? z.w : nodeW(n)) : (z ? z.h : 150);
      }).concat([dir === "h" ? 160 : 110]));
    }

    /* 세로 정렬: main(깊이)=x는 항상 ox에서 시작, cross(형제)=y는 그룹마다 cursor에서 시작.
       가로 정렬: main(깊이)=y는 그룹마다 cursor에서 시작, cross(형제)=x는 항상 ox에서 시작. */
    const crossStart = dir === "h" ? ox : cursor;
    let main = dir === "h" ? cursor : ox;
    colKeys.forEach(c => {
      let cross = crossStart;
      const mainSize = Math.max.apply(null, cols[c].map(n => {
        const z = NSZ[n.id];
        return dir === "h" ? (z ? z.h : 150) : (z ? z.w : nodeW(n));
      }));
      cols[c].forEach((n, i) => {
        if (dir === "h") { n.x = Math.round(cross / GRID) * GRID; n.y = Math.round(main / GRID) * GRID; cross += crossSize[i] + 78; }
        else { n.x = Math.round(main / GRID) * GRID; n.y = Math.round(cross / GRID) * GRID; cross += crossSize[i] + 56; }
      });
      main += mainSize + (dir === "h" ? 56 : 78);
    });
    cursor = dir === "h" ? (main + 30) : (cursor + crossSize.reduce((a, b) => a + b + 56, 0) + 30);
  });

  markDirty(); renderFlow();
  toast("흐름 순서대로 정렬했습니다" + (dir0 === "h" ? " (가로)" : ""), "ok", {
    label: "되돌리기",
    fn: () => { prev.forEach(p => { const n = nodeById(p.id); if (n) { n.x = p.x; n.y = p.y; } }); markDirty(); renderFlow(); }
  });
}

  const n = curNode(), L = n && n.layers.find(x => x.id === sel.layer);
  const hasTab = fillTarget(L) || borderTarget(L);
  if (!hasTab) colorMode = "primary";
  modeSeg.style.display = hasTab ? "" : "none";
  if (hasTab) {
    const labels = fillTarget(L) ? ["선", "채우기"] : ["글자", "테두리"];
    modeSeg.innerHTML = ["primary", "secondary"].map((k, i) =>
      '<button class="btn sm' + (colorMode === k ? " on" : "") + '" data-mode="' + k + '">' + labels[i] + "</button>").join("");
  }

  const secondary = colorMode === "secondary" && hasTab;
  let cur;
  if (!L) cur = drawColor;
  else if (secondary) cur = fillTarget(L) ? (L.fill || "none") : (L.stroke > 0 ? (L.borderColor || "#111827") : "none");
  else cur = L.color || drawColor;

  $("#swatches").innerHTML =
    (secondary ? '<button class="sw sw-none' + (cur === "none" ? " on" : "") + '" data-c="none" title="없음"></button>' : "") +
    SWATCH.map(c => '<button class="sw' + (c === cur ? " on" : "") + '" data-c="' + c + '" style="background:' + c + '" title="' + c + '"></button>').join("");

  const curStroke = L && "stroke" in L ? (L.stroke || 0) : drawStroke;
  $("#strokeSeg").innerHTML = Object.entries(STROKES).map(([w, name]) =>
    '<button class="btn sm' + (+w === curStroke ? " on" : "") + '" data-sw="' + w + '" title="' + name + '">' + name + "</button>").join("");
}
function editTextLayer(n, l) {
  if (!canEdit()) return;

    title: "텍스트 레이어 수정", icon: "text", okText: "저장",
    fields: [{ k: "text", label: "내용" }, { k: "size", label: "글자 크기(px)", ph: "18" }, { k: "outline", label: "그림자 효과(흰 테두리)", type: "check" }],

/* ---------------- 이미지 처리 ---------------- */
let webpOk = null;
function supportsWebp() {
  if (webpOk === null) {
    const cv = document.createElement("canvas"); cv.width = cv.height = 1;
    webpOk = cv.toDataURL("image/webp").indexOf("data:image/webp") === 0;
  }
  return webpOk;
}
function readImage(file, maxW, quality, keepAlpha) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const r = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * r)), h = Math.max(1, Math.round(img.height * r));
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        const type = supportsWebp() ? "image/webp" : (keepAlpha ? "image/png" : "image/jpeg");
        res({ src: cv.toDataURL(type, quality), w, h, type });
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
async function setShot(file, node, quiet) {
  const n = node || curNode(); if (!n || !file) return;
  try {
    const big = await readImage(file, 1200, 0.82, false);
    const th = await readImage(file, 300, 0.6, false);
    n.shotData = big.src; n.shotW = big.w; n.shotH = big.h; n.shotType = big.type;
    n.thumb = th.src; n.shotDirty = true;
    if (n.id === sel.node) stageZoom = 1;
    markDirty();
    if (!quiet) {
      renderFlow();
      if (n.id === sel.node) renderStage();
      toast("화면 이미지를 등록했습니다 · " + Math.round(big.src.length / 1365) + "KB", "ok");
    }
  } catch (e) {
    if (quiet) throw e;
    toast("이미지를 읽지 못했습니다", "bad");
  }
}
async function addImageLayer(file) {
  const n = curNode(); if (!n || !file) return;
  try {
    const im = await readImage(file, 1200, 0.85, true);
    const d = docSize(n);
    /* 예전에는 항상 페이지 폭의 55%로 줄여 넣었다 — 실제 이미지보다 훨씬 작게
       보이는 원인이었다. 이제는 페이지 안에 다 들어가면 원래(디코딩된) 크기
       그대로 넣고, 넘칠 때만 딱 맞을 만큼만 줄인다. */
    const r = Math.min(1, (d.w * 0.85) / im.w, (d.h * 0.85) / im.h);
    n.layers.push({ id: uid("l"), kind: "image", src: im.src, x: Math.round(d.w * 0.1), y: Math.round(d.h * 0.1), w: Math.round(im.w * r), h: Math.round(im.h * r), color: null, stroke: 0, campId: null });
    sel.layer = n.layers[n.layers.length - 1].id;
    markDirty(); renderFlow(); renderStage(); renderPanels();
  } catch (e) { toast("이미지를 읽지 못했습니다", "bad"); }
}
function removeShot(node) {
  const n = node || curNode(); if (!n) return;
  n.shotData = null; n.shot = null; n.thumb = null; n.shotW = DOC_W; n.shotH = DOC_H; n.shotDirty = false;
  markDirty(); renderFlow(); if (n.id === sel.node) renderStage();
}
/* 화면 이미지 올리기/교체/삭제 — 노드 카드의 "설정"과 스테이지 카메라 버튼이 함께 쓴다.
   onDone은 이 흐름(올리기·교체·삭제·그냥 닫기)이 끝난 뒤 한 번 불린다 — 페이지
   정보 수정 창에서 열었을 때 그 창을 다시 띄워 입력하던 내용을 이어가게 하기 위함. */
function openShotModal(n, onDone) {
  const done = () => { if (onDone) onDone(); };
  if (n && shotSrc(n)) {
    openForm({
      title: "화면 이미지", icon: "image", okText: "새 이미지 올리기",
      fields: [], note: "현재 등록된 화면을 교체하거나 삭제합니다. 레이어는 그대로 유지됩니다.",
      values: {}, onSave: () => pickFile(f => setShot(f, n).then(done), done),
      onDelete: () => confirmDel("이 화면의 이미지를 삭제할까요?", () => { removeShot(n); done(); }),

function pickFile(cb, onCancel) {

  inp.value = "";
  inp.onchange = () => { if (inp.files && inp.files[0]) cb(inp.files[0]); else if (onCancel) onCancel(); };
  inp.oncancel = () => { if (onCancel) onCancel(); };   // 최신 브라우저: 선택 취소도 감지
  inp.click();
}

/* ---------------- 레이어 상호작용 ---------------- */
function initStage() {
  const doc = $("#stageDoc"), wrap = $("#stageWrap");
  const toDoc = ev => {
    const n = curNode(), d = docExtent(n), r = doc.getBoundingClientRect();
    return { x: d.x1 + (ev.clientX - r.left) / (r.width / d.w), y: d.y1 + (ev.clientY - r.top) / (r.height / d.h) };
  };

  doc.addEventListener("pointerdown", e => {
    const n = curNode(); if (!n || !canEdit()) return;
    const editBtn = e.target.closest("[data-edit-layer]");
    if (editBtn) {                                       /* 텍스트 레이어 위 편집 버튼 — 어떤 도구든 항상 동작 */
      e.preventDefault(); e.stopPropagation();
      const l = n.layers.find(x => x.id === editBtn.dataset.editLayer);
      if (l) editTextLayer(n, l);
      return;
    }
    const p = toDoc(e);
    const handle = e.target.closest("[data-handle]");
    const lyrEl = e.target.closest("[data-layer]");

    if (layerTool !== "select") {                       /* 새 레이어 그리기 */
      e.preventDefault();
      if (layerTool === "text") {
        openForm({
          title: "텍스트 레이어", icon: "text",
          fields: [{ k: "text", label: "내용" }, { k: "size", label: "글자 크기(px)", ph: "18" }, { k: "outline", label: "그림자 효과(흰 테두리)", type: "check" }],
          values: { text: "", size: "18", outline: true },
          onSave: v => {
            n.layers.push({ id: uid("l"), kind: "text", text: v.text || "텍스트", size: Number(v.size) || 18, outline: !!v.outline, x: Math.round(p.x), y: Math.round(p.y), color: drawColor, stroke: 0, borderColor: "#111827", campId: null });
            sel.layer = n.layers[n.layers.length - 1].id;
            setTool("select"); markDirty(); renderFlow(); renderStage(); renderPanels();
          }
        });
        return;
      }
      const l = layerTool === "pen"
        ? { id: uid("l"), kind: "pen", points: [[p.x, p.y]], color: drawColor, stroke: drawStroke, campId: null }
        : { id: uid("l"), kind: layerTool, x: p.x, y: p.y, w: 0, h: 0, color: drawColor, stroke: drawStroke, fill: "none", campId: null };
      n.layers.push(l); sel.layer = l.id;
      const mv = ev => {
        const q = toDoc(ev);
        if (l.kind === "pen") { const last = l.points[l.points.length - 1]; if (Math.abs(q.x - last[0]) + Math.abs(q.y - last[1]) > 2) l.points.push([q.x, q.y]); }
        else { l.w = q.x - l.x; l.h = q.y - l.y; }
        paintLayers();
      };
      const up = () => {
        doc.removeEventListener("pointermove", mv); doc.removeEventListener("pointerup", up); doc.removeEventListener("pointercancel", up);
        if (l.kind !== "pen" && Math.abs(l.w) < 6 && Math.abs(l.h) < 6) { n.layers = n.layers.filter(x => x.id !== l.id); sel.layer = null; }
        if (l.kind === "pen" && l.points.length < 3) { n.layers = n.layers.filter(x => x.id !== l.id); sel.layer = null; }
        setTool("select"); markDirty(); renderFlow(); renderStage(); renderPanels();
      };
      doc.setPointerCapture(e.pointerId);
      doc.addEventListener("pointermove", mv); doc.addEventListener("pointerup", up); doc.addEventListener("pointercancel", up);
      return;
    }

    if (handle && sel.layer) {                           /* 리사이즈 */
      e.preventDefault();
      const l = n.layers.find(x => x.id === sel.layer);
      const mv = ev => { const q = toDoc(ev); l.w = q.x - l.x; l.h = q.y - l.y; paintLayers(); };
      const up = () => { doc.removeEventListener("pointermove", mv); doc.removeEventListener("pointerup", up); doc.removeEventListener("pointercancel", up); markDirty(); renderLayers(); resyncStageExtent(); };
      doc.setPointerCapture(e.pointerId);
      doc.addEventListener("pointermove", mv); doc.addEventListener("pointerup", up); doc.addEventListener("pointercancel", up);
      return;
    }

    if (lyrEl) {                                         /* 선택 + 이동 */
      e.preventDefault();
      const l = n.layers.find(x => x.id === lyrEl.dataset.layer);
      if (sel.layer !== l.id) { sel.layer = l.id; renderLayers(); renderStageFoot(n, l); renderPanels(); }
      const st = { x: p.x, y: p.y }, orig = l.kind === "pen" ? l.points.map(q => q.slice()) : { x: l.x, y: l.y };
      let moved = false;
      const mv = ev => {
        const q = toDoc(ev), dx = q.x - st.x, dy = q.y - st.y;
        if (!moved && Math.abs(dx) + Math.abs(dy) < 1) return;
        moved = true;
        if (l.kind === "pen") l.points = orig.map(pt => [pt[0] + dx, pt[1] + dy]);
        else { l.x = orig.x + dx; l.y = orig.y + dy; }
        paintLayers();
      };
      const up = () => { doc.removeEventListener("pointermove", mv); doc.removeEventListener("pointerup", up); doc.removeEventListener("pointercancel", up); if (moved) { markDirty(); renderLayers(); resyncStageExtent(); } };
      doc.setPointerCapture(e.pointerId);
      doc.addEventListener("pointermove", mv); doc.addEventListener("pointerup", up); doc.addEventListener("pointercancel", up);
      return;
    }
    if (sel.layer) { sel.layer = null; renderLayers(); renderStageFoot(n, null); renderPanels(); }
  });

  $("#stageFoot").addEventListener("click", e => {
    const b = e.target.closest("[data-lact]"); if (!b) return;
    const n = curNode(); if (!n) return;
    if (b.dataset.lact === "list") return openLayerListMenu(n, b);
    const i = n.layers.findIndex(x => x.id === sel.layer);
    if (i < 0) return;
    const l = n.layers[i];
    if (b.dataset.lact === "edittext") return editTextLayer(n, l);
    if (b.dataset.lact === "del") { n.layers.splice(i, 1); sel.layer = null; }
    if (b.dataset.lact === "front") { n.layers.splice(i, 1); n.layers.push(l); }
    if (b.dataset.lact === "back") { n.layers.splice(i, 1); n.layers.unshift(l); }
    markDirty(); renderFlow(); renderStage(); renderPanels();
  });
  doc.addEventListener("dblclick", e => {
    const n = curNode(); if (!n || !canEdit()) return;
    const lyrEl = e.target.closest("[data-layer]"); if (!lyrEl) return;
    const l = n.layers.find(x => x.id === lyrEl.dataset.layer);
    if (l && l.kind === "text") editTextLayer(n, l);
  });

  $("#layerTools").addEventListener("click", e => {
    const b = e.target.closest("[data-tool]"); if (b) setTool(b.dataset.tool);
  });
  renderStageTools();
  $("#colorMode").addEventListener("click", e => {
    const b = e.target.closest("[data-mode]"); if (!b) return;
    colorMode = b.dataset.mode;
    renderStageTools();
  });
  $("#swatches").addEventListener("click", e => {
    const b = e.target.closest("[data-c]"); if (!b) return;
    const c = b.dataset.c;
    const n = curNode(), L = n && n.layers.find(x => x.id === sel.layer);
    const secondary = colorMode === "secondary" && (fillTarget(L) || borderTarget(L));
    if (secondary && fillTarget(L)) { L.fill = c; markDirty(); renderLayers(); renderStageTools(); return; }
    if (secondary && borderTarget(L)) {
      if (c === "none") { L.stroke = 0; }
      else { L.borderColor = c; if (!(L.stroke > 0)) L.stroke = drawStroke || 2; }
      markDirty(); renderLayers(); renderStageTools(); return;
    }
    if (c === "none") return;               /* '없음'은 채우기·테두리 모드에서만 의미가 있다 */
    drawColor = c;
    if (L) L.color = c;
    markDirty(); if (L) renderLayers();
    renderStageTools();
  });

  $("#strokeSeg").addEventListener("click", e => {
    const b = e.target.closest("[data-sw]"); if (!b) return;
    const sw = +b.dataset.sw;
    drawStroke = sw || drawStroke;
    const n = curNode(), L = n && n.layers.find(x => x.id === sel.layer);
    if (L && "stroke" in L) { L.stroke = sw; markDirty(); renderLayers(); }
    renderStageTools();
  });

  $("#btnShot").addEventListener("click", () => openShotModal(curNode()));
  $("#btnLayerImg").addEventListener("click", () => pickFile(addImageLayer));
  $("#sIn").addEventListener("click", () => { stageZoom = clamp(stageScale(curNode()) * 1.2, .1, 4); renderStage(); });
  $("#sOut").addEventListener("click", () => { stageZoom = clamp(stageScale(curNode()) / 1.2, .1, 4); renderStage(); });
  $("#sFit").addEventListener("click", () => {
    openMenu(Object.entries(STAGE_FIT).map(([k, v]) =>
      '<button class="mi' + (k === stageFitMode && !stageZoom ? " on" : "") + '" data-act="' + k + '">' + ico("fit", "xs") + v.name +
      (k === "width" ? '<span class="cnt">기본</span>' : "") + "</button>").join(""), $("#sFit"), it => {
        stageFitMode = it.dataset.act; stageZoom = null; renderStage();
      });
  });

  /* Alt + 휠 = 화면 확대/축소, Alt를 누르지 않으면 평소대로 세로 스크롤 */
  $("#stageScroll").addEventListener("wheel", e => {
    if (!e.altKey) return;
    e.preventDefault();
    const n = curNode(); if (!n) return;
    stageZoom = clamp(stageScale(n) * (e.deltaY < 0 ? 1.08 : 1 / 1.08), .05, 4);
    renderStage();
  }, { passive: false });

  /* 실제 OS 파일 드래그일 때만 반응한다 — 레이어를 옮기다가(포인터 드래그) 우연히
     브라우저 기본 이미지 드래그가 겹쳐도 드롭존이 잘못 뜨지 않도록 방어한다. */
  const hasFiles = e => e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") >= 0;
  ["dragenter", "dragover"].forEach(t => wrap.addEventListener(t, e => { if (!hasFiles(e)) return; e.preventDefault(); wrap.classList.add("dragover"); }));
  wrap.addEventListener("dragleave", e => { if (wrap.contains(e.relatedTarget)) return; wrap.classList.remove("dragover"); });
  wrap.addEventListener("drop", e => {
    wrap.classList.remove("dragover");
    if (!canEdit() || !hasFiles(e)) return;
    e.preventDefault();
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && /^image\//.test(f.type)) { const n = curNode(); n && shotSrc(n) ? addImageLayer(f) : setShot(f); }
  });
  document.addEventListener("paste", e => {
    if (!canEdit()) return;
    const items = e.clipboardData && e.clipboardData.items; if (!items) return;
    for (const it of items) {
      if (it.type && it.type.indexOf("image") === 0) {
        const f = it.getAsFile();
        if (f) { const n = curNode(); n && shotSrc(n) ? addImageLayer(f) : setShot(f); e.preventDefault(); }
        return;
      }
    }
  });
  const fitSoon = onFrame(() => { if (!stageZoom) renderStage(); });
  new ResizeObserver(fitSoon).observe($("#stageScroll"));
}

   왕복 호환되게 만든다. */
function csvQ(s) { return '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"'; }
function csvLine(arr) { return arr.map(csvQ).join(","); }
function parseCsv(text) {
  text = String(text || "").replace(/^﻿/, "");
  const rows = []; let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\r") { /* \n 에서 행을 닫는다 */ }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r[0] || "").trim() !== "");
}
function keyByLabel(map, label, fallback) {
  const s = String(label == null ? "" : label).trim();
  if (!s) return fallback;
  if (map[s]) return s;
  const hit = Object.entries(map).find(([, v]) => (typeof v === "string" ? v : v.name) === s);
  return hit ? hit[0] : fallback;
}
/* 속성 한 줄 = "한글 :: 영문key :: 타입 :: 샘플", 속성 사이는 " | "로 구분한다 */
function serializePropsStr(props) {
  return (props || []).map(p => [p.ko || "", p.en || "", PTYPE[p.type] || p.type || PTYPE.string, p.sample || ""].join(" :: ")).join(" | ");
}
function parsePropsStr(s) {
  /* 항목 끝의 공백은 " :: " 구분자의 일부(샘플이 빈 값일 때)일 수 있어 trim하지 않는다 */
  return String(s || "").split(" | ").filter(x => x.trim()).map(x => {
    const parts = x.split(" :: ").map(v => v.trim());
    return { ko: parts[0] || "", en: parts[1] || "", type: keyByLabel(PTYPE, parts[2], "string"), sample: parts[3] || "" };
  });
}
function channelsToStr(codes) { return (codes || []).map(c => TCHAN[c] || c).join(", "); }
function channelsFromStr(s) {

  const n = {
    id: uid("n"), kind: "page", name: name || "새 페이지", path: path || "", note: "",
    x: Math.round(minX), y: Math.round(b.nodes.length ? maxY + 60 : 90), shot: null, shotData: null, thumb: null,
    shotW: DOC_W, shotH: DOC_H, hue: "none", size: "m", sharp: false, tags: [], camps: [], layers: []
  };

}
function resolveNode(b, name, path) {

/* 운영상태는 기본으로 "진행"만 본다 — 중단된 캠페인까지 섞이면 목록이 지저분해진다 */
const campFilter = { chan: "all", aarrr: "all", goal: "all", seg: "all", owner: "all",
  status: "진행", measure: "all", place: "all", q: "" };
/* 구간(스윔레인) 배경은 지금 보고 있는 보드가 아닌 다른 보드일 수도 있어서,
   B()(현재 보드) 전제인 laneRect() 대신 보드를 인자로 받는 버전을 따로 둔다 */
function laneExtentYFor(b) {
  const nodes = b.nodes;
  if (!nodes.length) return { y1: -200, y2: 800 };
  let y1 = Infinity, y2 = -Infinity;
  nodes.forEach(n => { const q = nodeRect(n); y1 = Math.min(y1, q.y); y2 = Math.max(y2, q.y + q.h); });
  return { y1: y1 - 160, y2: y2 + 160 };
}
function laneRectFor(b, l) {
  if (l.y != null && l.h != null) return { x: l.x, y: l.y, w: l.w || 300, h: l.h };
  const { y1, y2 } = laneExtentYFor(b);
  return { x: l.x, y: y1, w: l.w || 900, h: Math.max(40, y2 - y1) };
}
function laneOfNode(b, n) {
  const q = nodeRect(n), cx = q.x + q.w / 2, cy = q.y + (q.h || 150) / 2;
  return (b.lanes || []).find(l => {
    const r = laneRectFor(b, l);
    return cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h;
  }) || null;
}
/* 캠페인 탭 — 구글 시트 1.개인화DB 의 목록 그대로를 보여 준다.
   여정 지도에 붙었는지는 문서에서 캠페인코드로 찾아 표시한다. */
/* AARRR 구분은 코드 순서(A1 · A2 · R1 …)로 보여야 여정 단계 순서와 맞는다 */
function aarrrFilterOptions(cur) {
  const seen = {};
  SHEETS.camps.forEach(m => {
    const n = String(m.aarrrName || "").trim();
    if (n && !seen[n]) seen[n] = String(m.aarrrCode || "").trim().toUpperCase();
  });
  return '<option value="all">모든 AARRR 구분</option>' +
    Object.keys(seen).sort((a, b) => (seen[a] || "ZZ").localeCompare(seen[b] || "ZZ") || a.localeCompare(b, "ko"))
      .map(n => '<option value="' + esc(n) + '"' + (cur === n ? " selected" : "") + ">" +
        esc((seen[n] ? seen[n] + " · " : "") + n) + "</option>").join("");
}
function campColOptions(key, cur, allLabel) {
  const names = Array.from(new Set(SHEETS.camps.map(m => String(m[key] || "").trim()).filter(Boolean))).sort((a, b) => a.localeCompare(b, "ko"));
  return '<option value="all">' + esc(allLabel) + "</option>" +
    names.map(v => '<option value="' + esc(v) + '"' + (cur === v ? " selected" : "") + ">" + esc(v) + "</option>").join("");
}

  viewStale.camps = false;
  const wrap = $("#view-camps");
  if (!wrap) return;
  $(".syncbar", wrap).innerHTML = syncBarHtml();

  /* 채널 버튼은 시트에 지금 값이 있는 것만이 아니라 고를 수 있는 채널을 전부 보여 준다.
     해당 캠페인이 없는 채널은 흐리게 두되 눌러 볼 수는 있게 한다. */
  const chanCount = {};
  SHEETS.camps.forEach(m => {
    const c = String(m.chan || "").trim();
    if (c) chanCount[c] = (chanCount[c] || 0) + 1;
  });
  const chans = Object.keys(optsFrom("chan", CHAN_OPTS)).filter(Boolean)
    .sort((a, b) => (CHAN_OPTS.indexOf(a) < 0) - (CHAN_OPTS.indexOf(b) < 0) ||
      (CHAN_OPTS.indexOf(a) >= 0 ? CHAN_OPTS.indexOf(a) - CHAN_OPTS.indexOf(b) : a.localeCompare(b, "ko")));
  const seg = $("#campChanFilter");
  seg.innerHTML = '<button class="btn sm' + (campFilter.chan === "all" ? " on" : "") + '" data-ch="all">전체</button>' +
    chans.map(c => '<button class="btn sm' + (campFilter.chan === c ? " on" : "") + (chanCount[c] ? "" : " off") +
      '" data-ch="' + esc(c) + '" title="' + (chanCount[c] || 0) + '건">' + esc(c) + "</button>").join("");

  $("#campGoalFilter").innerHTML = campColOptions("goal", campFilter.goal, "모든 목표");
  $("#campSegFilter").innerHTML = campColOptions("title", campFilter.seg, "모든 캠페인구분");
  $("#campOwnerFilter").innerHTML = campColOptions("owner", campFilter.owner, "모든 담당자");

  const chk = $("#checkCount");
  chk.textContent = issues ? "점검 " + issues : "점검";
  $("#btnCampCheck").classList.toggle("warn", issues > 0);

  $("#campMeasureFilter").value = campFilter.measure;

    if (c.code) (placed[c.code] = placed[c.code] || []).push({ b, n });
  })));

  const rows = SHEETS.camps.filter(m =>
    (campFilter.chan === "all" || m.chan === campFilter.chan) &&
    (campFilter.goal === "all" || m.goal === campFilter.goal) &&
    (campFilter.seg === "all" || m.title === campFilter.seg) &&
    (campFilter.owner === "all" || m.owner === campFilter.owner) &&
    (campFilter.aarrr === "all" || m.aarrrName === campFilter.aarrr) &&
    (campFilter.status === "all" || m.status === campFilter.status) &&
    (campFilter.measure === "all" || String(m.measure || "").toUpperCase() === campFilter.measure) &&
    (campFilter.place === "all" || (campFilter.place === "on" ? !!placed[m.code] : !placed[m.code])) &&
    (!campFilter.q || (m.code + " " + m.goal + " " + m.title + " " + m.fullName + " " + m.owner + " " + m.trigger).toLowerCase().includes(campFilter.q)));

  $("#campStats").innerHTML =

     '<div class="stat" style="--c:var(--accent)"><span class="n">' + Object.keys(placed).length + '</span><span class="t">여정지도에 붙임</span></div>',
     '<div class="stat" style="--c:var(--ink-3)"><span class="n">' + rows.length + '</span><span class="t">지금 조건에 맞는 수</span></div>'].join("");

  /* 카드가 아니라 표로 — 칼럼끼리 세로로 맞아야 여러 캠페인을 한눈에 견준다 */

  const head = [
    ["캠페인코드", "시트 E열"], ["캠페인구분", "화면 표시명 · 시트 F열"], ["채널", "시트 I열"],
    ["AARRR · 목표", "시트 C열 · D열"], ["운영상태", "시트 M열 — 이 캠페인을 지금 돌리고 있는지 (진행 / 중단)"],
    ["작업 진행도", "시트 H열 — 세팅 작업이 어디까지 됐는지 (완료 등)"], ["담당자", "시트 P열"],
    ["캠페인명", "시트 G열 — 실제 세부 이름"], ["실적 기준", "시트 R열 · S열 + 실적 수식에서 자동으로 풀어 쓴 산식"],
    ["최신월 성과", "3.개인화RAW 의 가장 최근 달"], ["여정지도", ""], ["링크", "시트 T열 · U열"], ["", ""]];
  const body = rows.map(m => {
    const where = placed[m.code] || [];

    const noLink = [m.link1, m.link2].filter(Boolean).length - links.length;

      '<td class="nowrap mono">' + esc(m.code) + "</td>" +
      '<td class="capname"><span class="nm">' + esc(m.title || "-") + "</span>" +
        (m.aarrrName ? '<span class="sub">' + esc(m.aarrrName) + "</span>" : "") + "</td>" +
      '<td class="nowrap">' + chanChip(m.chanCode) + "</td>" +
      "<td>" + esc(m.goal || "-") + (m.aarrrName ? '<span class="sub">' + esc(m.aarrrName) + "</span>" : "") + "</td>" +
      '<td class="nowrap"><span class="chip" style="--c:' + CSTATUS_C[m.statusCode] + '">' + esc(m.status || "-") + "</span></td>" +
      '<td class="nowrap">' + (m.progress ? esc(m.progress) : '<span style="color:var(--ink-3)">-</span>') +
        (String(m.measure || "").toUpperCase() === "Y" ? '<span class="sub">성과측정 Y</span>' : "") + "</td>" +
      '<td class="nowrap">' + esc(m.owner || "-") + "</td>" +
      '<td class="capfull"><span class="mono" style="font-size:11px">' + esc(m.fullName || "-") + "</span>" +
        (m.path ? '<span class="sub">' + esc(m.path) + "</span>" : "") + "</td>" +
      "<td>" + basisHtml(m) + "</td>" +
      "<td>" + (perfBadge(m.code) || '<span style="color:var(--ink-3)">-</span>') + "</td>" +
      '<td><div class="wherecell">' + (where.length
        ? where.map(({ b, n }) => '<span class="pagechip" data-goto="' + n.id + '" data-bi="' + state.boards.indexOf(b) + '">' +
            ico("map", "xs") + " " + esc(n.name) + "</span>").join("")
        : '<span style="color:var(--ink-3)">미배치</span>') + "</div></td>" +
      '<td><div class="rowseg">' + links.map(l =>
        '<button class="btn sm" data-goto-url="' + esc(l.url) + '" type="button" title="' + esc(l.url) + '">' +
          ico("link", "xs") + esc(l.label.length > 8 ? l.label.slice(0, 8) + "…" : l.label) + "</button>").join("") +
        (noLink > 0 ? '<span class="chip" style="--c:var(--ink-3)" title="셀에 글자만 있고 주소가 걸려 있지 않습니다">주소 없음</span>' : "") + "</div></td>" +
      '<td>' + (canEdit() && isStaff()
        ? '<div class="rowacts"><button class="btn icon sm" data-sheet-edit="' + esc(m.code) + '" title="수정">' + ico("edit", "xs") + "</button></div>"
        : "") + "</td>" +
    "</tr>";
  }).join("");

  $("#campTable").innerHTML = rows.length
    ? "<thead><tr>" + head.map(h => '<th' + (h[1] ? ' title="' + esc(h[1]) + '"' : "") + ">" + esc(h[0]) + "</th>").join("") + "</tr></thead><tbody>" + body + "</tbody>"
    : '<tbody><tr><td><div class="empty">' + ico("mega") +
      "<div>" + (SHEETS.camps.length ? "조건에 맞는 캠페인이 없습니다" : "구글 시트에서 캠페인을 아직 불러오지 못했습니다") + "</div></div></td></tr></tbody>";
}

  $("#campChanFilter").addEventListener("click", e => {
    const b = e.target.closest("[data-ch]"); if (!b) return;
    campFilter.chan = b.dataset.ch; $$("#campChanFilter .btn").forEach(x => x.classList.toggle("on", x === b)); renderCampView(true);
  });
  $("#campAarrrFilter").addEventListener("change", e => { campFilter.aarrr = e.target.value; renderCampView(true); });
  $("#campMeasureFilter").addEventListener("change", e => { campFilter.measure = e.target.value; renderCampView(true); });
  $("#campGoalFilter").addEventListener("change", e => { campFilter.goal = e.target.value; renderCampView(true); });
  $("#campSegFilter").addEventListener("change", e => { campFilter.seg = e.target.value; renderCampView(true); });
  $("#campOwnerFilter").addEventListener("change", e => { campFilter.owner = e.target.value; renderCampView(true); });
  $("#campStatusFilter").addEventListener("change", e => { campFilter.status = e.target.value; renderCampView(true); });
  $("#campPlaceFilter").addEventListener("change", e => { campFilter.place = e.target.value; renderCampView(true); });
  $("#campSearch").addEventListener("input", e => { campFilter.q = e.target.value.toLowerCase().trim(); renderCampView(true); });
  $("#btnCampCheck").addEventListener("click", openCheckModal);
  $("#btnNewSheetCamp").addEventListener("click", () => editSheetCamp(null));
  $("#campTable").addEventListener("click", e => {
    const go = e.target.closest("[data-goto-url]");
    if (go) return openUrl(go.dataset.gotoUrl);
    const g = e.target.closest("[data-goto]");
    if (g && g.dataset.bi != null) jumpTo(+g.dataset.bi, g.dataset.goto);
  });
  /* 시트 컬럼을 그대로 내보낸다 — 어디에 붙였는지만 한 칸 덧붙인다 */
  $("#btnCampCsv").addEventListener("click", () => {
    const cols = SHEET_COLS.filter(c => !c.num);      // 전달~매출 같은 수치는 빼고 정보 칸만 내보낸다
    const head = cols.map(c => c.label).concat("링크1 주소", "링크2 주소", "여정지도 배치");
    const body = SHEETS.camps.map(m => csvLine(cols.map(c => m[c.key]).concat(m.link1Url || "", m.link2Url || "",
      placementsOf(m.code).map(({ b, n }) => b.name + " · " + n.name).join(" / "))));
    saveFile("crm-campaigns.csv", "﻿" + [csvLine(head)].concat(body).join("\r\n"), "text/csv");
  });
}


/* ========================================================================
   저장 위치 — 서버(Supabase) · JSON 파일
   이미지 호스팅(Cloudinary)을 연결하면 화면 이미지·이미지 레이어를
   Cloudinary에 올리고 JSON에는 URL만 남긴다. 이미 등록된 이미지도
   "일괄 URL 변환"으로 나중에 한꺼번에 바꿀 수 있다.
   ======================================================================== */

/* ---------------- 이미지 호스팅 (Cloudinary · Unsigned Upload Preset) ----------------
   API Key/Secret은 쓰지 않는다 — 브라우저 코드에 넣으면 이 화면에 접근하는
   누구나 개발자도구로 꺼내볼 수 있어 사실상 공개되기 때문. Cloudinary 콘솔에서
   Signing Mode를 Unsigned로 만든 업로드 프리셋 하나만 있으면 Cloud name과
   프리셋 이름만으로 안전하게 업로드할 수 있고 폴더·태그 지정도 그대로 된다.
   설정값은 문서(state.cloud)에 저장한다 — Supabase 연결 정보와 달리 문서를
   불러온 뒤에만 쓰이므로, 한 번 저장해 두면 다른 사람이 같은 문서를 열었을 때도
   그대로 적용된다(브라우저마다 따로 연결할 필요가 없다). */
function cloudCfg() { return state.cloud || null; }
function setCloudCfg(c) { state.cloud = c; markDirty(); }
function cloudFolder(boardName) {
  const d = new Date(), ym = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  const safe = String(boardName || "board").replace(/[\/\\]+/g, "-").trim() || "board";
  return "crm/" + ym + "/" + safe;
}
function cloudTags(pageName) { return String(pageName || "page").replace(/,/g, " ").trim() || "page"; }
/* Blob(파일이 아닌)을 FormData에 파일명 없이 append하면 브라우저가 문자 그대로
   "blob"을 파일명으로 보낸다 — Cloudinary가 그걸 원본 파일명으로 그대로
   돌려줘서 Cloudinary 미디어 라이브러리에 의미 없는 "blob"만 쌓인다. 항상
   뜻이 있는 이름을 지정해서 보낸다(페이지 이름 기반). */
function safeFilename(s) { return String(s || "image").replace(/["\r\n]/g, "").trim() || "image"; }
async function cloudUpload(blob, opts) {
  const cfg = cloudCfg();
  const fd = new FormData();
  fd.append("file", blob, safeFilename(opts && opts.filename));
  fd.append("upload_preset", cfg.preset);
  if (opts && opts.folder) fd.append("folder", opts.folder);
  if (opts && opts.tags) fd.append("tags", opts.tags);
  let res;
  try {
    res = await fetch("https://api.cloudinary.com/v1_1/" + cfg.cloudName + "/image/upload", { method: "POST", body: fd });
  } catch (err) {
    throw new Error("Cloudinary에 접속하지 못했습니다.");
  }
  const j = await res.json().catch(() => null);
  if (!res.ok) throw new Error((j && j.error && j.error.message) || ("업로드 실패 " + res.status));
  if (!j || !j.secure_url) throw new Error("응답에서 URL을 찾지 못했습니다");
  return { url: j.secure_url, publicId: j.public_id, filename: j.original_filename || "", uploadedAt: j.created_at || new Date().toISOString() };
}
async function hostUploadAll(snap) {
  const cfg = cloudCfg();
  if (!cfg || !cfg.cloudName || !cfg.preset) return;
  const done = [];
  for (const u of snap.uploads) {
    const meta = await cloudUpload(u.blob, { folder: cloudFolder(u.board && u.board.name), tags: cloudTags(u.node.name), filename: u.node.name });
    snap.data.boards.forEach(b => b.nodes.forEach(n => {
      if (n.id === u.node.id) n.shot = { url: meta.url, w: u.node.shotW, h: u.node.shotH, uploadedAt: meta.uploadedAt, filename: meta.filename, publicId: meta.publicId };
    }));
    const i = snap.used.indexOf(u.ref);
    if (i >= 0) snap.used.splice(i, 1);
    done.push(u.ref);
  }
  snap.uploads.length = 0;                     // 파일로는 올리지 않는다

  let layerDone = 0;                           // 이미지 레이어도 같은 호스팅으로 올린다(각각 독립적으로 시도)
  for (const b of snap.data.boards) {
    for (const n of b.nodes) {
      for (const l of (n.layers || [])) {
        if (l.kind !== "image" || !l.src || isCloudHosted(l.src)) continue;
        try {
          const blob = l.src.indexOf("data:") === 0 ? dataUrlToBlob(l.src) : await (await fetch(l.src)).blob();
          const meta = await cloudUpload(blob, { folder: cloudFolder(b.name), tags: cloudTags(n.name), filename: n.name + "-layer" });
          l.src = meta.url; l.uploadedAt = meta.uploadedAt; l.filename = meta.filename; l.publicId = meta.publicId;
          layerDone++;
        } catch (e) { /* 실패한 레이어는 인라인 그대로 남는다 */ }
      }
    }
  }
  if (done.length || layerDone) toast("이미지 " + (done.length + layerDone) + "개를 Cloudinary에 올렸습니다", "ok");
}
function openCloudModal() {
  const c = cloudCfg() || { cloudName: "", preset: "" };
  openForm({
    title: "이미지 호스팅 (Cloudinary)", icon: "up", okText: "저장",
    deleteText: cloudCfg() ? "설정 삭제" : null,
    note: "화면 이미지·이미지 레이어를 Cloudinary에 올리고 JSON에는 URL만 남깁니다.<br>" +
      "Cloudinary 콘솔 → <b>Settings → Upload → Upload presets → Add upload preset</b>에서 " +
      "Signing Mode를 <b>Unsigned</b>로 만든 프리셋 이름을 적으세요. API Key·Secret은 필요 없습니다 " +
      "(브라우저 코드에 넣으면 노출되므로 쓰지 않습니다).<br>" +
      "업로드 시 <span class=\"mono\">crm/연도-월/보드이름</span> 폴더에 담기고, 페이지 이름이 태그로 붙습니다.<br>" +
      "이 설정은 이 문서에 같이 저장되므로, <b>서버 저장을 한 번 눌러야</b> 다른 사람이 열었을 때도 그대로 적용됩니다.",
    fields: [
      { k: "cloudName", label: "Cloud name", mono: true, ph: "pspfcgbn" },
      { k: "preset", label: "Upload preset (Unsigned)", mono: true, ph: "예: jta-unsigned" }
    ],
    values: c,
    onSave: v => {
      if (!v.cloudName || !v.preset) { setCloudCfg(null); return toast("이미지 호스팅을 껐습니다. 저장해야 다른 사람에게도 반영됩니다."); }
      setCloudCfg({ cloudName: v.cloudName.trim(), preset: v.preset.trim() });
      toast("Cloudinary를 연결했습니다. 저장해야 다른 사람에게도 적용됩니다.", "ok");
    },
    onDelete: cloudCfg() ? () => { setCloudCfg(null); toast("설정을 지웠습니다. 저장해야 다른 사람에게도 반영됩니다."); } : null
  });
}

/* ---------------- 호스팅 제공업체 식별 ----------------
   "이미 지금 쓰는 이미지 호스팅에 올라간 URL인가?"를 판단하는 지점을
   한 곳에 모아 둔다. 판단 기준은 "이 URL이 Cloudinary인가"가 아니라
   "이 URL이 진짜 최종 목적지(우리가 쓰는 호스팅)인가"이므로, Supabase
   서명 URL·구버전 파일 참조·다른 업체 URL·data: 인라인 등 그게 무엇이든
   전부 "아직 우리 호스팅이 아님 → 변환 대상"으로 취급한다.

   ⚠️ 이미지 호스팅 업체를 Cloudinary에서 다른 곳으로 바꾸면, 여기와
   cloudUpload()(업로드 엔드포인트·응답 파싱)·cloudFolder()/cloudTags()
   (그 업체의 폴더·태그 규칙)·openCloudModal()(설정 입력 필드)까지
   같이 그 업체 사양에 맞춰 고쳐야 한다. */
function isCloudHosted(url) {
  return /^https?:\/\/res\.cloudinary\.com\//.test(String(url || ""));
}

/* ---------------- 이미지 일괄 URL 변환 ----------------
   이미 등록된 화면 이미지·이미지 레이어 중 지금 쓰는 호스팅(Cloudinary)에
   있지 않은 것들을 모아 한꺼번에 올린다. */
function unhostedTargets() {
  const targets = [];
  state.boards.forEach(b => b.nodes.forEach(n => {
    const src = shotSrc(n);
    if (src && !isCloudHosted(src)) targets.push({ kind: "shot", node: n, board: b, src });
    (n.layers || []).forEach(l => {
      if (l.kind === "image" && l.src && !isCloudHosted(l.src)) targets.push({ kind: "layer", node: n, layer: l, board: b, src: l.src });
    });
  }));
  return targets;
}
async function convertTargetsToUrl(targets, onProgress) {
  let done = 0, failed = 0;
  for (let i = 0; i < targets.length; i++) {
    const t = targets[i];
    try {
      const blob = t.src.indexOf("data:") === 0 ? dataUrlToBlob(t.src) : await (await fetch(t.src)).blob();
      const meta = await cloudUpload(blob, {
        folder: cloudFolder(t.board.name), tags: cloudTags(t.node.name),
        filename: t.kind === "shot" ? t.node.name : t.node.name + "-layer"
      });
      if (t.kind === "shot") {
        t.node.shot = { url: meta.url, w: t.node.shotW, h: t.node.shotH, uploadedAt: meta.uploadedAt, filename: meta.filename, publicId: meta.publicId };
        t.node.shotData = null; t.node.shotDirty = false;
      } else {
        t.layer.src = meta.url; t.layer.uploadedAt = meta.uploadedAt; t.layer.filename = meta.filename; t.layer.publicId = meta.publicId;
      }
      done++;
    } catch (e) { failed++; }
    if (onProgress) onProgress(i + 1, targets.length);
  }
  return { done, failed };
}
async function convertAllImagesToUrl() {
  const cfg = cloudCfg();

}

/* ========================================================================
   화면 이미지 등록 — 캔버스 드롭 · 노드에서 바로 올리기 · 일괄 등록
   ======================================================================== */
function pickFiles(cb) {
  const inp = $("#filesPick"); inp.value = "";
  inp.onchange = () => { const f = Array.prototype.slice.call(inp.files || []); if (f.length) cb(f); };
  inp.click();
}
function pickDir(cb) {
  const inp = $("#dirPick"); inp.value = "";
  inp.onchange = () => {
    const f = Array.prototype.slice.call(inp.files || []).filter(x => /^image\//.test(x.type));
    if (f.length) cb(f); else toast("폴더에 이미지가 없습니다", "bad");
  };
  inp.click();
}
function baseName(f) { return (f.name || "").replace(/\.[a-z0-9]+$/i, ""); }
function normName(s) {
  return String(s || "").toLowerCase()
    .replace(/\.[a-z0-9]+$/i, "")
    .replace(/^[\s._-]*\d+[\s._-]*/, "")      // 01_, 1-, 02 같은 앞 번호 제거
    .replace(/[\s._\-/:()\[\]{}·,]+/g, "");
}
/* 파일명 ↔ 페이지 이름·경로 자동 매칭 */
function guessNode(file) {
  const f = normName(file.name);
  if (!f) return null;
  let best = null, score = 0;
  B().nodes.forEach(n => {
    [n.name, n.path].forEach(cand => {
      const t = normName(cand);
      if (!t || t.length < 2) return;
      let sc = 0;
      if (t === f) sc = 100;
      else if (t.indexOf(f) === 0 || f.indexOf(t) === 0) sc = 80;      // 앞에서부터 일치
      else if (t.indexOf(f) >= 0 || f.indexOf(t) >= 0) sc = 66;        // 어딘가 포함
      if (sc > score || (sc === score && sc > 0 && best && shotSrc(best) && !shotSrc(n))) { score = sc; best = n; }
    });
  });
  return score >= 66 ? best : null;
}
/* 새 페이지 자리 — 기존 노드 아래쪽으로 줄맞춰 */
function freeSpot(i) {
  let maxY = 0, minX = 60;
  B().nodes.forEach(n => { maxY = Math.max(maxY, n.y + (NSZ[n.id] ? NSZ[n.id].h : 150)); minX = Math.min(minX, n.x); });
  return { x: minX + (i % 6) * 262, y: (B().nodes.length ? maxY + 60 : 90) + Math.floor(i / 6) * 236 };
}
function addNodeFor(name, at) {
  const p = at || freeSpot(0);
  const n = {
    id: uid("n"), kind: "page", name: name || "새 페이지", path: "", note: "",
    x: Math.round(p.x), y: Math.round(p.y), shot: null, shotData: null, thumb: null,
    shotW: DOC_W, shotH: DOC_H, hue: "none", size: "m", sharp: false, tags: [], camps: [], layers: []
  };
  B().nodes.push(n);
  return n;
}

/* ---------------- 일괄 등록 ---------------- */
function openBulkModal(files) {
  const rows = (files || []).map((f, i) => ({ file: f, target: (guessNode(f) || {}).id || "__new__", thumb: "", i }));
  const opt = (v, label, on) => '<option value="' + v + '"' + (on ? " selected" : "") + ">" + esc(label) + "</option>";
  const rowHtml = r =>
    '<div class="brow" data-row="' + r.i + '">' +
      '<img src="' + (r.thumb || "") + '" alt="" draggable="false">' +
      '<div class="fn">' + esc(r.file.name) + "<em>" + Math.round(r.file.size / 1024) + "KB</em></div>" +
      '<select class="field" data-target="' + r.i + '">' +
        opt("__new__", "+ 새 페이지로 추가", r.target === "__new__") +
        opt("__skip__", "건너뛰기", r.target === "__skip__") +
        B().nodes.map(n => opt(n.id, n.name, r.target === n.id)).join("") +
      "</select>" +
    "</div>";

  const body = rows.length
    ? '<p class="hint">파일 이름을 페이지 이름·경로와 맞춰 자동으로 짝지었습니다. 틀린 것만 바꾸세요. ' +
      '<span class="mono">01_홈.png</span>처럼 번호가 붙어 있어도 인식합니다.</p>' +
      '<div class="bulk" id="bulkList">' + rows.map(rowHtml).join("") + "</div>" +
      '<label class="bulkbar"><input type="checkbox" id="bulkChain"> 새로 만든 페이지를 파일 순서대로 연결하기</label>' +
      '<div class="bulkbar" id="bulkStatus"></div>'
    : '<div class="empty" style="border:2px dashed var(--stroke); border-radius:var(--r-md); padding:30px">' +
      ico("stack") + "<div>스크린샷 여러 장을 한 번에 등록합니다<br>여기에 파일을 끌어다 놓거나 아래에서 고르세요</div>" +
      '<div style="display:flex; gap:6px; margin-top:6px">' +
        '<button class="btn" data-more>' + ico("image", "xs") + "파일 고르기</button>" +
        '<button class="btn" data-dir>' + ico("folder", "xs") + "폴더에서 가져오기</button></div></div>";

  const root = modalHost();
  root.innerHTML =
    '<div class="scrim"><div class="modal glass" style="width:min(620px,100%)" role="dialog" aria-modal="true">' +
      '<div class="modal-head">' + ico("stack") + '<h3>화면 일괄 등록</h3><button class="btn icon sm" data-x>' + ico("close", "xs") + "</button></div>" +
      '<div class="modal-body" id="bulkBody">' + body + "</div>" +
      '<div class="modal-foot">' +
        (rows.length ? '<button class="btn" data-more>' + ico("plus", "xs") + "파일 더 담기</button>" : "") +
        '<div class="spacer"></div><button class="btn" data-x>취소</button>' +
        (rows.length ? '<button class="btn primary" data-run>' + rows.length + "장 등록</button>" : "") +
      "</div>" +
    "</div></div>";

  rows.forEach(async r => {                       // 미리보기는 뒤에서 채운다
    try {
      const t = await readImage(r.file, 90, 0.5, false);
      r.thumb = t.src;
      const el = $('[data-row="' + r.i + '"] img');
      if (el) el.src = t.src;
    } catch (e) {}
  });

  root.addEventListener("change", e => {
    const s = e.target.closest("[data-target]");
    if (s) rows[+s.dataset.target].target = s.value;
  });
  const modal = $(".modal", root);
  ["dragenter", "dragover"].forEach(t => modal.addEventListener(t, e => { e.preventDefault(); }));
  modal.addEventListener("drop", e => {
    e.preventDefault();
    const f = Array.prototype.slice.call(e.dataTransfer.files || []).filter(x => /^image\//.test(x.type));
    if (f.length) openBulkModal((files || []).concat(f));
  });
  root.addEventListener("click", async e => {
    if (e.target.closest("[data-x]") || e.target.classList.contains("scrim")) return closeModal();
    if (e.target.closest("[data-more]")) { closeModal(); return pickFiles(more => openBulkModal((files || []).concat(more))); }
    if (e.target.closest("[data-dir]")) { closeModal(); return pickDir(more => openBulkModal((files || []).concat(more))); }
    const run = e.target.closest("[data-run]");
    if (!run) return;
    run.disabled = true;
    const chain = $("#bulkChain").checked;
    const status = $("#bulkStatus");
    const made = [];
    let done = 0, failed = 0, seen = 0;
    for (const r of rows) {
      seen++;
      if (r.target === "__skip__") continue;
      status.textContent = "처리 중… " + seen + " / " + rows.length;
      const el = $('[data-row="' + r.i + '"]');
      try {
        const node = r.target === "__new__" ? addNodeFor(baseName(r.file), freeSpot(made.length)) : nodeById(r.target);
        if (!node) continue;
        if (r.target === "__new__") made.push(node);
        await setShot(r.file, node, true);
        done++;
      } catch (err) { failed++; }
      if (el) el.classList.add("done");
    }
    if (chain) {
      for (let i = 1; i < made.length; i++) {
        if (!B().edges.some(x => x.from === made[i - 1].id && x.to === made[i].id))
          B().edges.push({ id: uid("e"), from: made[i - 1].id, to: made[i].id, label: "", style: "solid", kind: "arrow",
            route: "curve", hue: "none", width: 2, a1: "auto", a2: "auto", points: [] });
      }
    }
    closeModal();
    markDirty(); renderFlow(); renderPanels();
    if (made.length) { selectNode(made[0].id); fitFlow(); } else renderStage();
    toast(done + "장 등록 완료" + (made.length ? " · 새 페이지 " + made.length + "개" : "") + (failed ? " · 실패 " + failed : ""), failed ? "bad" : "ok");
  });
}

/* ========================================================================
   관리자 모드 — 비밀번호를 아는 사람만 편집, 나머지는 보기 전용
   비밀번호 자체는 어디에도 저장하지 않는다. 저장되는 것은
   임의 salt + PBKDF2-SHA256 200,000회 해시뿐이라 파일을 열어봐도 원문이 없다.
   (다만 이 도구는 서버가 없으므로, 데이터 자체를 감추는 보안이 아니라
    "실수로 고치는 것"을 막는 편집 잠금이다. 아래 안내 문구로 명시한다.)
   ======================================================================== */
let admin = false;
const SESS_KEY = "jta:admin:" + location.pathname;
const PW_ITER = 200000;

function hasLock() { return !!(state.lock && state.lock.hash); }
function canEdit() {
  if (supaOn()) return isStaff();          // 서버 모드: 역할이 곧 권한 (서버에서 강제)
  return admin || !hasLock();
}
function subtleOK() { return !!(window.crypto && crypto.subtle && crypto.subtle.deriveBits); }

function b64(bytes) { let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s); }
function unb64(str) { const bin = atob(str), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
async function derive(pw, saltB64, iter) {
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: unb64(saltB64), iterations: iter || PW_ITER, hash: "SHA-256" }, key, 256);
  return b64(new Uint8Array(bits));
}
async function setPassword(pw) {
  const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
  state.lock = { salt, iter: PW_ITER, hash: await derive(pw, salt, PW_ITER), changedAt: Date.now() };
  admin = true;
  try { sessionStorage.setItem(SESS_KEY, state.lock.hash); } catch (e) {}
  markDirty(); applyMode();
}
async function verifyPassword(pw) {
  if (!hasLock()) return true;
  const h = await derive(pw, state.lock.salt, state.lock.iter);
  return h === state.lock.hash;
}
function pwAgeDays() { return state.lock && state.lock.changedAt ? Math.floor((Date.now() - state.lock.changedAt) / 86400000) : null; }

function applyMode() {
  const ro = !canEdit();
  document.body.classList.toggle("ro", ro);
  const b = $("#btnLock");
  $("use", b).setAttribute("href", ro ? "#i-lock" : "#i-unlock");
  $("#lockText").textContent = ro ? "보기 전용" : (hasLock() ? "관리자" : "잠금 없음");
  b.classList.toggle("on", !ro && hasLock());
  if (ro) { sel.layer = null; setTool("select"); }
  const age = pwAgeDays();
  b.title = hasLock()
    ? (ro ? "관리자 비밀번호를 입력하면 편집할 수 있습니다" : "관리자 모드 · 비밀번호 변경 " + (age === 0 ? "오늘" : age + "일 전"))
    : "아직 잠금이 없습니다 — 누구나 편집할 수 있어요";
  renderFlow(); renderStage(); renderPanels();
}

function initLock() {
  try {
    if (hasLock() && sessionStorage.getItem(SESS_KEY) === state.lock.hash) admin = true;
  } catch (e) {}
  $("#btnLock").addEventListener("click", openLockModal);
  $("#btnLock").style.display = supaOn() ? "none" : "";     // 서버 모드에서는 비밀번호 잠금 대신 로그인
  applyMode();
  const age = pwAgeDays();
  if (admin && age !== null && age >= 90)
    setTimeout(() => toast("관리자 비밀번호를 바꾼 지 " + age + "일 됐습니다. 변경을 권장합니다.", "bad", { label: "변경", fn: openLockModal }), 1200);
}

function lockNote() {
  return "이 도구는 서버 없이 브라우저에서만 도는 페이지라, 비밀번호는 <b>편집을 막는 잠금</b>입니다. " +
    "저장되는 값은 원문이 아니라 salt를 섞은 해시(PBKDF2 20만 회)라 파일을 열어봐도 비밀번호는 보이지 않지만, " +
    "보드 내용 자체를 숨기지는 못합니다. 외부에 공개하면 안 되는 내용은 올리지 마세요.";
}

function maskPw2() { setTimeout(maskPw, 0); }
function maskPw() { setTimeout(() => $$("#modalRoot [data-k]").forEach(el => el.type = "password"), 0); }
function openLockModal() {
  if (!subtleOK()) {
    toast("이 환경에서는 암호 기능을 쓸 수 없습니다(https 또는 로컬 파일에서 열어 주세요).", "bad");
    return;
  }
  /* 1) 아직 비밀번호가 없다 → 설정 */
  if (!hasLock()) {
    maskPw2();
    return openForm({
      title: "관리자 비밀번호 설정", icon: "lock", okText: "설정하고 잠그기",
      note: lockNote(),
      fields: [
        { k: "pw", label: "새 비밀번호", ph: "8자 이상 권장" },
        { k: "pw2", label: "한 번 더" }
      ],
      values: { pw: "", pw2: "" },
      onSave: async v => {
        if (!v.pw || v.pw.length < 4) return toast("비밀번호가 너무 짧습니다", "bad");
        if (v.pw !== v.pw2) return toast("두 입력이 다릅니다", "bad");
        await setPassword(v.pw);
        toast("잠갔습니다. 이제 이 비밀번호를 아는 사람만 편집할 수 있습니다. 저장까지 해야 다른 사람에게 반영됩니다.", "ok");
      }
    });
  }
  /* 2) 잠겨 있고 아직 관리자가 아니다 → 입력 */
  if (!admin) {
    maskPw2();
    return openForm({
      title: "관리자 모드로 전환", icon: "lock", okText: "확인",
      note: "비밀번호를 모르면 보기 전용으로 사용할 수 있습니다.",
      fields: [{ k: "pw", label: "관리자 비밀번호" }],
      values: { pw: "" },
      onSave: async v => {
        const ok = await verifyPassword(v.pw);
        if (!ok) { await new Promise(r => setTimeout(r, 600)); return toast("비밀번호가 맞지 않습니다", "bad"); }
        admin = true;
        try { sessionStorage.setItem(SESS_KEY, state.lock.hash); } catch (e) {}
        applyMode();
        toast("관리자 모드입니다. 편집할 수 있습니다.", "ok");
      }
    });
  }
  /* 3) 관리자 상태 → 변경 · 해제 · 잠그기 */
  const age = pwAgeDays();
  openForm({
    title: "관리자 모드", icon: "unlock", okText: "비밀번호 변경",
    deleteText: "잠금 해제(비밀번호 삭제)",
    note: "마지막 변경: " + (age === 0 ? "오늘" : age + "일 전") + (age >= 90 ? " — 변경을 권장합니다." : "") + "<br>" + lockNote(),
    fields: [
      { k: "cur", label: "현재 비밀번호" },
      { k: "pw", label: "새 비밀번호" },
      { k: "pw2", label: "새 비밀번호 확인" }
    ],
    values: { cur: "", pw: "", pw2: "" },
    onSave: async v => {
      if (!(await verifyPassword(v.cur))) return toast("현재 비밀번호가 맞지 않습니다", "bad");
      if (!v.pw || v.pw.length < 4) return toast("새 비밀번호가 너무 짧습니다", "bad");
      if (v.pw !== v.pw2) return toast("새 비밀번호 확인이 다릅니다", "bad");
      await setPassword(v.pw);
      toast("비밀번호를 바꿨습니다. 저장해야 다른 사람에게도 적용됩니다.", "ok");
    },
    onDelete: () => confirmDel("잠금을 없애면 링크를 가진 누구나 편집할 수 있습니다. 계속할까요?", () => {
      state.lock = null; admin = true;
      try { sessionStorage.removeItem(SESS_KEY); } catch (e) {}
      markDirty(); applyMode();
      toast("잠금을 해제했습니다.", "ok");
    })
  });
  maskPw();
}

/* ========================================================================
   여정 보드 — 여러 판을 만들고 전환·복제·삭제·템플릿으로 주고받기
   태그 목록과 캠페인 목록은 모든 보드를 한 번에 보여준다.
   ======================================================================== */
function newBoard(name) {
  return { id: uid("b"), name: name || "새 여정", nodes: [], edges: [], lanes: [], sel: null, view: { zoom: 1, panX: 40, panY: 30, fitted: true } };
}
function syncBoardName() {

}
function switchBoard(i) {
  if (i === state.bi || !state.boards[i]) return;
  B().sel = sel.node;
  state.bi = i;
  const b = B();
  sel = { node: b.sel && b.nodes.some(n => n.id === b.sel) ? b.sel : (b.nodes[0] || {}).id || null, edge: null, layer: null };
  mounted = { id: null, src: null, w: 0, h: 0 };
  Object.keys(EDGE_EL).forEach(k => { EDGE_EL[k].g.remove(); delete EDGE_EL[k]; });
  Object.keys(NSZ).forEach(k => delete NSZ[k]);
  $("#nodeLayer").innerHTML = "";
  historyOf(b); updateHistoryUI();
  syncBoardName(); applyTransform(); renderFlow(); renderStage(); renderPanels();
  markDirty();
}
function closeMenu() { $("#menuRoot").innerHTML = ""; }
function openMenu(html, anchorEl, onClick) {

  setTimeout(() => document.addEventListener("pointerdown", away), 0);
}
function openBoardMenu() {
  const list = state.boards.map((b, i) =>
    '<button class="mi' + (i === state.bi ? " on" : "") + '" data-go="' + i + '">' + ico("map", "xs") +

  const acts = canEdit() ? '<div class="sepline"></div>' +

/* ========================================================================
   추가 기능 모음 — 실행 취소 · 빠른 편집(복제/삭제) · 빠른 검색 · 미니맵 ·
   구간(스윔레인) 배경 · 보드 이미지/PDF 내보내기
   ======================================================================== */

/* ---------------- 실행 취소 / 다시 실행 ----------------
   보드별로 독립된 되돌리기 이력을 가진다(다른 보드를 오가며 편집해도 꼬이지
   않도록). markDirty() 호출이 짧게 이어지면(타이핑 등) 하나의 되돌리기
   단계로 묶는다. 화면 이미지 원본(shotData·thumb)은 용량이 커서 이력에
   담지 않는다 — 되돌리기는 배치·이름·태그·캠페인·레이어·연결선·구간 같은
   구조 변경에만 적용되고, 화면 이미지 등록/삭제나 보드 자체의 추가/삭제는
   대상이 아니다. */
const HISTORY_LIMIT = 50, HISTORY_COALESCE_MS = 600;
let history = {};             // boardId -> { base, undo:[], redo:[] }
let historyTimer = null;
let applyingHistory = false;

function boardSnapshot(b) {
  return JSON.stringify({
    nodes: b.nodes.map(n => { const c = Object.assign({}, n); delete c.shotData; delete c.thumb; return c; }),
    edges: b.edges, lanes: b.lanes || [], selNode: sel.node
  });
}
function historyOf(b) {
  if (!b) return null;
  let h = history[b.id];
  if (!h) h = history[b.id] = { base: boardSnapshot(b), undo: [], redo: [] };
  return h;
}
function updateHistoryUI() {
  const h = history[B().id];
  const u = $("#btnUndo"), r = $("#btnRedo");
  if (u) u.disabled = !h || !h.undo.length;
  if (r) r.disabled = !h || !h.redo.length;
}
function flushHistory() {
  clearTimeout(historyTimer); historyTimer = null;
  if (applyingHistory) return;
  const b = B(); if (!b) return;
  const h = historyOf(b);
  const cur = boardSnapshot(b);
  if (cur === h.base) return;
  h.undo.push(h.base);
  if (h.undo.length > HISTORY_LIMIT) h.undo.shift();
  h.redo = [];
  h.base = cur;
  updateHistoryUI();
}
function scheduleHistory() {
  if (applyingHistory) return;
  clearTimeout(historyTimer);
  historyTimer = setTimeout(flushHistory, HISTORY_COALESCE_MS);
}
function applyBoardSnapshot(b, json) {
  const snap = JSON.parse(json);
  applyingHistory = true;
  b.nodes = snap.nodes; b.edges = snap.edges; b.lanes = snap.lanes || [];
  if (b === B()) {
    sel = { node: snap.selNode && b.nodes.some(n => n.id === snap.selNode) ? snap.selNode : (b.nodes[0] || {}).id || null, edge: null, layer: null };
    mounted = { id: null, src: null, w: 0, h: 0 };
    Object.keys(EDGE_EL).forEach(k => { EDGE_EL[k].g.remove(); delete EDGE_EL[k]; });
    Object.keys(NSZ).forEach(k => delete NSZ[k]);
    $("#nodeLayer").innerHTML = "";
    renderFlow(); renderStage(); renderPanels();
  }
  applyingHistory = false;
  if (!dirty) { dirty = true; }
  setSaveChip("dirty", "저장 안 됨");
  invalidateViews();
  clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 900);
}
function undo() {
  if (!canEdit()) return;
  flushHistory();
  const b = B(), h = historyOf(b);
  if (!h.undo.length) { toast("되돌릴 내용이 없습니다"); return; }
  h.redo.push(h.base);
  h.base = h.undo.pop();
  applyBoardSnapshot(b, h.base);
  updateHistoryUI();
  toast("되돌렸습니다", "ok");
}
function redo() {
  if (!canEdit()) return;
  const b = B(), h = historyOf(b);
  if (!h.redo.length) { toast("다시 실행할 내용이 없습니다"); return; }
  h.undo.push(h.base);
  h.base = h.redo.pop();
  applyBoardSnapshot(b, h.base);
  updateHistoryUI();
  toast("다시 실행했습니다", "ok");
}
function seedHistoryForAllBoards() {
  history = {};
  state.boards.forEach(historyOf);
  updateHistoryUI();
}
function wireUndoRedoButtons() {
  $("#btnUndo").addEventListener("click", undo);
  $("#btnRedo").addEventListener("click", redo);
  updateHistoryUI();
}

/* ---------------- 빠른 편집: 복제 · 삭제 ---------------- */
function deleteNode(id) {
  B().nodes = B().nodes.filter(x => x.id !== id);
  B().edges = B().edges.filter(e => e.from !== id && e.to !== id);
  if (sel.node === id) sel.node = B().nodes.length ? B().nodes[0].id : null;
  markDirty(); renderFlow(); selectNode(sel.node);
}
function duplicateNode(id) {
  const n = nodeById(id); if (!n || !canEdit()) return;
  const copy = JSON.parse(JSON.stringify(n));
  copy.id = uid("n");
  copy.name = n.name + " 사본";
  copy.x = n.x + 32; copy.y = n.y + 32;
  copy.shotDirty = !!copy.shotData;
  copy.tags = copy.tags.map(t => Object.assign({}, t, { id: uid("t") }));
  copy.camps = copy.camps.map(c => Object.assign({}, c, { id: uid("c") }));
  /* 레이어의 캠페인 연결은 복제하지 않는다 — 같은 캠페인이 두 화면에 중복
     연결되면 캠페인 패널에서 어느 화면 기준인지 헷갈리기 때문. */
  copy.layers = (copy.layers || []).map(l => Object.assign({}, l, { id: uid("l"), campId: null }));
  B().nodes.push(copy);
  markDirty(); renderFlow(); selectNode(copy.id);
  toast('"' + n.name + '"을(를) 복제했습니다', "ok");
}

/* ---------------- 빠른 검색(Ctrl+F) — 페이지 · 태그 · 캠페인 ---------------- */
function globalSearchResults(q) {
  q = String(q || "").toLowerCase().trim();
  if (!q) return { nodes: [], tags: [], camps: [] };
  const nodes = [];
  state.boards.forEach(b => b.nodes.forEach(n => {
    if ((n.name + " " + (n.path || "")).toLowerCase().indexOf(q) >= 0) nodes.push({ n, b });
  }));
  const tags = allTags().filter(({ t, n }) => (tagEventEn(t) + " " + (t.eventKo || "") + " " + tagArea(t) + " " + n.name).toLowerCase().indexOf(q) >= 0);
  /* 여정 지도에 붙어 있는 캠페인은 시트에서 이름을 가져와 검색한다 */
  const camps = allCamps().map(({ c, n, b }) => ({ c: campView(c), n, b }))
    .filter(({ c, n }) => c && (c.name + " " + (c.code || "") + " " + n.name).toLowerCase().indexOf(q) >= 0);
  return { nodes: nodes.slice(0, 20), tags: tags.slice(0, 20), camps: camps.slice(0, 20) };
}
function qsRow(icoName, title, sub, bi, nodeId) {

    '<span class="qs-t">' + esc(title) + '</span><span class="qs-s">' + esc(sub) + "</span></button>";
}
function openQuickSearch() {

  root.innerHTML =
    '<div class="scrim"><div class="modal glass qsearch" role="dialog" aria-modal="true">' +
      '<div class="modal-head">' + ico("search") + "<h3>빠른 검색</h3><button class=\"btn icon sm\" data-x>" + ico("close", "xs") + "</button></div>" +
      '<div class="modal-body" style="gap:8px">' +
        '<input class="field" id="qsInput" placeholder="페이지 이름·경로·이벤트·캠페인 검색">' +

    if (!total) { out.innerHTML = '<div class="empty">' + ico("search") + "<div>일치하는 결과가 없습니다</div></div>"; return; }
    let html = "";

    if (r.tags.length) html += '<div class="qs-group">태그 · ' + r.tags.length + "개</div>" +
      r.tags.map(({ t, n, b }) => qsRow("tag", tagEventEn(t), b.name + " · " + n.name, state.boards.indexOf(b), n.id)).join("");
    if (r.camps.length) html += '<div class="qs-group">캠페인 · ' + r.camps.length + "개</div>" +
      r.camps.map(({ c, n, b }) => qsRow("mega", c.name, b.name + " · " + n.name, state.boards.indexOf(b), n.id)).join("");

  });

  });
  root.addEventListener("click", e => { if (e.target.closest("[data-x]") || e.target.classList.contains("scrim")) closeModal(); });
  render();
  setTimeout(() => inp.focus(), 0);

/* ---------------- 미니맵 ---------------- */
/* 흐름 캔버스의 크기 — 미니맵을 그릴 때마다 getBoundingClientRect()를 부르면
   그때마다 레이아웃을 강제로 다시 계산하게 된다(끌고 있는 동안엔 매 프레임).
   실제로 크기가 바뀔 때만 ResizeObserver로 받아 캐시해 둔다. */
let flowBox = { w: 0, h: 0 };
function watchFlowSize() {
  const surf = $("#flowSurface"); if (!surf) return;
  const read = () => { flowBox = { w: surf.clientWidth, h: surf.clientHeight }; };
  read();
  if (window.ResizeObserver) new ResizeObserver(() => { read(); updateMinimapView(); }).observe(surf);
  else addEventListener("resize", read);
}
function minimapHidden() { const m = $("#minimap"); return !m || m.style.display === "none"; }
/* 미니맵 좌표계(마지막 그리기 기준)로 지금 보이는 범위를 사각형으로 환산한다 */
function minimapViewRect() {
  const d = $("#minimapSvg").dataset, v = B().view;
  if (!d.s || !flowBox.w || !flowBox.h || !v.zoom) return null;
  const s = +d.s, x1 = +d.x1, y1 = +d.y1, ox = +d.ox, oy = +d.oy;
  const px = ox + (-v.panX / v.zoom - x1) * s, py = oy + (-v.panY / v.zoom - y1) * s;
  return { x: px, y: py, w: Math.max(0, flowBox.w / v.zoom * s), h: Math.max(0, flowBox.h / v.zoom * s) };
}
/* 지도를 끄는 동안 부르는 가벼운 갱신 — 노드 사각형은 그대로이므로 SVG를 다시
   만들지 않고(문자열 조립 + 파싱 없음) 보이는 범위 사각형 하나만 옮긴다 */
function updateMinimapView() {
  if (minimapHidden()) return;
  const el = $("#minimapSvg .mm-view");
  if (!el) { renderMinimap(); return; }
  const r = minimapViewRect(); if (!r) return;
  el.setAttribute("x", r.x.toFixed(1)); el.setAttribute("y", r.y.toFixed(1));
  el.setAttribute("width", r.w.toFixed(1)); el.setAttribute("height", r.h.toFixed(1));
}
function renderMinimap() {
  const svg = $("#minimapSvg"); if (!svg || minimapHidden()) return;
  const nodes = B().nodes;
  const mapW = 168, mapH = 112, pad = 10;
  if (!nodes.length) { svg.innerHTML = ""; return; }
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  nodes.forEach(n => { const q = nodeRect(n); x1 = Math.min(x1, q.x); y1 = Math.min(y1, q.y); x2 = Math.max(x2, q.x + q.w); y2 = Math.max(y2, q.y + q.h); });
  const bw = Math.max(1, x2 - x1), bh = Math.max(1, y2 - y1);
  const s = Math.min((mapW - pad * 2) / bw, (mapH - pad * 2) / bh);
  const ox = pad + (mapW - pad * 2 - bw * s) / 2, oy = pad + (mapH - pad * 2 - bh * s) / 2;
  let html = nodes.map(n => {
    const q = nodeRect(n), px = ox + (q.x - x1) * s, py = oy + (q.y - y1) * s;
    return '<rect x="' + px.toFixed(1) + '" y="' + py.toFixed(1) + '" width="' + Math.max(2, q.w * s).toFixed(1) + '" height="' + Math.max(2, q.h * s).toFixed(1) +
      '" rx="1.5" fill="' + (n.id === sel.node ? "var(--accent)" : hueOf(n.hue)) + '" opacity="' + (n.id === sel.node ? 1 : 0.7) + '"></rect>';
  }).join("");
  svg.dataset.x1 = x1; svg.dataset.y1 = y1; svg.dataset.s = s; svg.dataset.ox = ox; svg.dataset.oy = oy;

function initMinimap() {

/* ---------------- 구간(스윔레인) 배경 ----------------
   캔버스에 이름이 붙은 구간을 배경으로 그린다("유입 → 탐색 → 구매" 같은 퍼널
   단계, 또는 가로·세로를 섞은 임의 영역). 좌표를 입력하는 대신 캔버스에서
   직접 사각형으로 그려서 만들고, 라벨을 끌면 이동, 네 변을 끌면 그 방향으로만
   크기를 조절한다. */
const LANE_PALETTE = ["#4a63e7", "#7c4ddb", "#12a97a", "#e08a1e", "#e0483f", "#0f9a70", "#64748b"];

  nodes.forEach(n => { const q = nodeRect(n); y1 = Math.min(y1, q.y); y2 = Math.max(y2, q.y + q.h); });

    return '<div class="lane" data-lane="' + l.id + '" style="left:' + r.x + "px; top:" + r.y + "px; width:" + r.w + "px; height:" + r.h + "px; --lc:" + (l.color || "#4a63e7") + '">' +
      (editable ? '<div class="lane-edge l" data-edge="l"></div><div class="lane-edge r" data-edge="r"></div>' +

/* ---------------- 보드 이미지 / PDF 내보내기 ----------------
   화면(카드) 스타일을 그대로 캡처하는 대신, Canvas 2D로 정갈한 개요도를
   새로 그린다 — 외부 라이브러리 없이 동작하고, Cloudinary 같은 외부
   호스팅 이미지의 CORS 문제로 내보내기가 실패하는 상황을 피할 수 있다. */
function roundRectPath(ctx, x, y, w, h, r) {

  ctx.arcTo(x + w, y + h, x, y + h, r);

  ctx.arcTo(x, y, x + w, y, r);

}
function wrapText(ctx, text, x, y, maxW, lh, maxLines) {
  maxLines = maxLines || 2;
  const chars = String(text || "").split("");
  let line = "", lines = [];
  for (let i = 0; i < chars.length; i++) {
    const test = line + chars[i];
    if (ctx.measureText(test).width > maxW && line) {
      lines.push(line); line = chars[i];
      if (lines.length === maxLines) break;
    } else line = test;
  }
  if (lines.length < maxLines && line) lines.push(line);
  const consumed = lines.join("").length;
  if (consumed < chars.length && lines.length) lines[lines.length - 1] = lines[lines.length - 1].replace(/.$/, "…");

}
/* 썸네일을 CORS 허용 모드로 미리 불러온다 — crossOrigin을 지정하면 서버가
   CORS를 허용하지 않을 때 "오염된 채로 로드"되는 대신 아예 로드가 실패하므로
   (onerror), 캔버스를 더럽혀 내보내기 전체가 막히는 일 없이 그 카드만

   w/h는 CSS 논리 크기다 — PDF에 넣을 때 페이지 크기(w/h)와 이미지 해상도
   (canvas.width/height)를 다르게 써야 하므로 둘 다 갖고 있어야 한다. */
async function exportBoardCanvas() {
  const b = B(), nodes = b.nodes, edges = b.edges;
  if (!nodes.length) { toast("내보낼 페이지가 없습니다", "bad"); return null; }
  const thumbImgs = {};
  await Promise.all(nodes.map(async n => {
    const src = thumbSrc(n); if (!src) return;
    const img = await loadImageSafe(src);
    if (img) thumbImgs[n.id] = img;
  }));
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  nodes.forEach(n => { const q = nodeRect(n); x1 = Math.min(x1, q.x); y1 = Math.min(y1, q.y); x2 = Math.max(x2, q.x + q.w); y2 = Math.max(y2, q.y + q.h); });

  const dpr = 2;

  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = dark ? "#ededf0" : "#131a2c";
  ctx.font = "700 20px 'IBM Plex Sans KR', sans-serif";
  ctx.fillText(b.name, pad, 34);
  ctx.font = "12px 'IBM Plex Sans KR', sans-serif";
  ctx.fillStyle = dark ? "#a6a6ad" : "#7b849f";
  ctx.fillText("Customer Journey Atlas · " + new Date().toLocaleDateString("ko-KR"), pad, 52);

  const ox = pad - x1, oy = pad + titleH - y1;
  (b.lanes || []).forEach(l => {
    const lr = laneRect(l);
    const lx = lr.x + ox, ly = lr.y + oy;
    ctx.fillStyle = hexToRgba(l.color || "#4a63e7", 0.08);
    ctx.fillRect(lx, ly, lr.w, lr.h);
    ctx.strokeStyle = hexToRgba(l.color || "#4a63e7", 0.4);
    ctx.setLineDash([5, 4]);

    ctx.setLineDash([]);
    ctx.fillStyle = l.color || "#4a63e7";
    ctx.font = "700 11px 'IBM Plex Sans KR', sans-serif";
    ctx.fillText(l.name || "", lx + 8, ly + 16);
  });
  edges.forEach(e => {
    const d = pathFor(e); if (!d) return;
    try {
      const p = new Path2D(d);
      ctx.save(); ctx.translate(ox, oy);
      ctx.strokeStyle = e.hue && e.hue !== "none" ? hueOfHex(e.hue) : (dark ? "#74747c" : "#7b849f");

  });

    const q = nodeRect(n), x = q.x + ox, y = q.y + oy;
    const img = thumbImgs[n.id];
    const thumbH = img ? Math.round(Math.min(q.h * 0.52, 128)) : 0;
    ctx.save();
    roundRectPath(ctx, x, y, q.w, q.h, 12);
    ctx.fillStyle = dark ? "#202023" : "#ffffff";
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = n.hue && n.hue !== "none" ? hueOfHex(n.hue) : (dark ? "#3a3a40" : "#d7dcec");
    ctx.stroke();
    ctx.clip();
    if (img) {
      drawCover(ctx, img, x, y, q.w, thumbH);
      ctx.fillStyle = hexToRgba(dark ? "#000000" : "#ffffff", 0.02);
      ctx.fillRect(x, y + thumbH - 1, q.w, 1);
    }
    if (n.hue && n.hue !== "none") { ctx.fillStyle = hueOfHex(n.hue); ctx.fillRect(x, y, 4, q.h); }
    ctx.restore();
    const textTop = y + thumbH;
    ctx.fillStyle = dark ? "#ededf0" : "#131a2c";
    ctx.font = "600 13px 'IBM Plex Sans KR', sans-serif";
    wrapText(ctx, n.name, x + 14, textTop + 20, q.w - 24, 16);
    ctx.font = "10px 'IBM Plex Sans KR', sans-serif";
    ctx.fillStyle = dark ? "#a6a6ad" : "#495372";
    ctx.fillText((KIND[n.kind] || "페이지") + " · 태그 " + n.tags.length + " · 캠페인 " + n.camps.length, x + 14, textTop + 40);
    if (n.path) { ctx.font = "10px monospace"; ctx.fillStyle = dark ? "#74747c" : "#7b849f"; ctx.fillText(n.path, x + 14, y + q.h - 12); }

}

/* ---------------- 최소 PDF 생성기 ----------------

function bytesToBinaryString(bytes) {
  let s = ""; const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return s;
}
function buildPdfFromJpeg(jpegBytes, pxW, pxH, ptW, ptH) {
  let out = "%PDF-1.4\n";
  const objOffsets = [0];
  const addObj = body => { objOffsets.push(out.length); out += body; };
  addObj("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  addObj("2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n");
  addObj("3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + ptW + " " + ptH + "] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n");
  const jpegStr = bytesToBinaryString(jpegBytes);
  addObj("4 0 obj\n<< /Type /XObject /Subtype /Image /Width " + pxW + " /Height " + pxH +
    " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpegBytes.length + " >>\nstream\n" + jpegStr + "\nendstream\nendobj\n");
  const content = "q " + ptW + " 0 0 " + ptH + " 0 0 cm /Im0 Do Q";
  addObj("5 0 obj\n<< /Length " + content.length + " >>\nstream\n" + content + "\nendstream\nendobj\n");
  const xrefStart = out.length;
  out += "xref\n0 " + objOffsets.length + "\n0000000000 65535 f \n";
  for (let i = 1; i < objOffsets.length; i++) out += String(objOffsets[i]).padStart(10, "0") + " 00000 n \n";
  out += "trailer\n<< /Size " + objOffsets.length + " /Root 1 0 R >>\nstartxref\n" + xrefStart + "\n%%EOF";
  const bytes = new Uint8Array(out.length);
  for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xff;
  return bytes;
}
async function exportBoardPdf() {
  toast("PDF를 만드는 중…");
  const r = await exportBoardCanvas(); if (!r) return;
  try {
    const jpegUrl = r.canvas.toDataURL("image/jpeg", 0.92);
    const jpegBytes = dataUrlToBytes(jpegUrl);
    const pdfBytes = buildPdfFromJpeg(jpegBytes, r.canvas.width, r.canvas.height, r.w, r.h);
    downloadBinary(safeBoardFilename() + ".pdf", new Blob([pdfBytes], { type: "application/pdf" }));
  } catch (e) { toast("PDF를 만들지 못했습니다", "bad"); }
}

/* ========================================================================
   구글 시트 연동 — 캠페인 마스터(1.개인화DB) · 성과 이력(3.개인화RAW)

   시트가 원본이고 이 앱은 화면이다. 캠페인 목록을 앱 안에 따로 적재하지 않고,

   읽기 = 로그인한 회원 누구나 · 쓰기(추가·수정) = 운영자 이상 · 삭제는 없다.
