<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="고객 여정 도식화 · Amplitude/Braze/GA4 태깅 · CRM 캠페인 통합 보드">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Customer Journey Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
/* ============ tokens ============ */
:root{
  --bg:#e8ecf7; --bg-2:#dce4f5; --bg-3:#f3f5fb;
  --ink:#131a2c; --ink-2:#495372; --ink-3:#7b849f;
  --glass:rgba(255,255,255,.60); --glass-2:rgba(255,255,255,.40); --glass-3:rgba(255,255,255,.80);
  --stroke:rgba(19,26,44,.13); --stroke-2:rgba(19,26,44,.07);
  --shadow:0 18px 44px -24px rgba(20,28,58,.55); --shadow-sm:0 6px 18px -12px rgba(20,28,58,.55);
  --accent:#4a63e7; --accent-ink:#fff; --accent-soft:rgba(74,99,231,.13);
  --amp:#1f6feb; --braze:#f2622e; --ga4:#c9861b; --camp:#7c4ddb;
  --ok:#0f9a70; --warn:#c8830f; --bad:#d94559;
  --grid:rgba(19,26,44,.055);
  --aur-1:rgba(74,99,231,.24); --aur-2:rgba(124,77,219,.20); --aur-3:rgba(31,111,235,.16); --aur-4:rgba(242,98,46,.12);
  color-scheme:light;
  --r-lg:20px; --r-md:14px; --r-sm:10px; --r-xs:7px;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
/* 기본은 라이트. 다크는 사용자가 토글했을 때만 (data-theme="dark") */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0a0b; --bg-2:#121214; --bg-3:#18181b;
  --ink:#ededf0; --ink-2:#a6a6ad; --ink-3:#74747c;
  --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.03); --glass-3:rgba(32,32,35,.92);
  --stroke:rgba(255,255,255,.12); --stroke-2:rgba(255,255,255,.06);
  --shadow:0 22px 50px -26px rgba(0,0,0,.95); --shadow-sm:0 8px 20px -14px rgba(0,0,0,.9);
  --accent:#8494ff; --accent-ink:#0b0b0d; --accent-soft:rgba(132,148,255,.16);
  --amp:#5c9dff; --braze:#ff8256; --ga4:#e5ab48; --camp:#a983f5;
  --ok:#31c99a; --warn:#e0a83c; --bad:#ff6b7d;
  --grid:rgba(255,255,255,.055);
  --aur-1:rgba(255,255,255,.05); --aur-2:rgba(255,255,255,.035); --aur-3:rgba(255,255,255,.028); --aur-4:rgba(132,148,255,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--f-ui); color:var(--ink); background:var(--bg);
  font-size:14px; line-height:1.5; overflow:hidden; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(58% 45% at 12% 8%, var(--aur-1), transparent 70%),
    radial-gradient(48% 40% at 88% 4%, var(--aur-2), transparent 70%),
    radial-gradient(52% 48% at 72% 92%, var(--aur-3), transparent 72%),
    radial-gradient(40% 40% at 8% 88%, var(--aur-4), transparent 70%),
    linear-gradient(160deg,var(--bg) 0%,var(--bg-2) 100%);
}
button,input,select,textarea{font:inherit; color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink) 18%,transparent);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
body.ro .edit-only{display:none !important}
body.viewer .staff-only{display:none !important}
.avatar{width:22px; height:22px; border-radius:99px; flex:none; object-fit:cover; border:1px solid var(--stroke)}
.avatar.ph{display:grid; place-items:center; background:var(--glass-2); color:var(--ink-3)}
.rolechip{display:inline-flex; align-items:center; height:17px; padding:0 6px; border-radius:99px; margin-left:5px;
  font-size:10px; font-weight:700; background:color-mix(in srgb,var(--c) 18%,transparent);
  color:color-mix(in srgb,var(--c) 80%,var(--ink)); border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}
#btnAuth{max-width:230px}
#authName{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ============ glass primitives ============ */
.glass{
  background:var(--glass); border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(22px) saturate(150%); backdrop-filter:blur(22px) saturate(150%);
  box-shadow:var(--shadow);
}
/* 큰 판(상단바·지도·패널·목록)에서는 유리 blur를 뺀다.
   뒤에 있는 것은 움직이지 않는 그라데이션 한 장뿐이라 흐려도 눈에 띄는 차이가
   없는 반면, 그 안에서 스크롤하거나 지도를 끌 때마다 브라우저가 그 넓은 면적을
   매 프레임 다시 블러 합성해야 해서 프레임이 크게 떨어진다. blur는 내용 위에
   겹쳐 뜨는 작은 조각(미니맵·툴바·메뉴·팝오버·토스트)에만 남긴다. */
/* 모달도 같은 이유로 뺀다 — 안에서 목록이나 긴 입력 폼을 스크롤할 때마다
   브라우저가 모달 뒤 배경 전체를 다시 블러 합성해 눈에 띄게 버벅인다. */
.topbar.glass,.flow.glass,.pane.glass,.listwrap.glass,.modal.glass{-webkit-backdrop-filter:none; backdrop-filter:none}
.modal.glass{background:var(--bg-3)}
.btn{
  display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 11px;
  border-radius:var(--r-sm); border:1px solid var(--stroke); background:var(--glass-2);
  color:var(--ink-2); font-size:12.5px; font-weight:500; cursor:pointer; white-space:nowrap;
  transition:background .13s,color .13s,border-color .13s;
}
.btn:hover{background:var(--glass-3); color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.sm{height:26px; padding:0 8px; font-size:11.5px; border-radius:var(--r-xs)}
.btn.icon{width:32px; padding:0; justify-content:center}
.btn.icon.sm{width:26px}
.btn.on{background:var(--accent); border-color:transparent; color:var(--accent-ink)}
.btn.primary{background:var(--accent); border-color:transparent; color:var(--accent-ink); font-weight:600}
.btn.primary:hover{filter:brightness(1.08); color:var(--accent-ink)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 16%,transparent); color:var(--bad); border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn[disabled]{opacity:.4; pointer-events:none}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.xs{width:13px;height:13px}
.seg{display:inline-flex; padding:3px; gap:2px; border-radius:var(--r-md); background:var(--glass-2); border:1px solid var(--stroke-2)}
.seg.wrap{flex-wrap:wrap}
.seg .btn{border:0; background:transparent; box-shadow:none; height:26px}
.seg .btn.on{background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow-sm)}
.rowseg{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  display:inline-flex; align-items:center; gap:5px; height:21px; padding:0 8px; border-radius:99px;
  font-size:11px; font-weight:600; white-space:nowrap;
  background:color-mix(in srgb,var(--c,var(--ink-3)) 16%,transparent);
  color:color-mix(in srgb,var(--c,var(--ink-3)) 78%,var(--ink));
  border:1px solid color-mix(in srgb,var(--c,var(--ink-3)) 30%,transparent);
}
.dot{width:7px;height:7px;border-radius:99px;background:var(--c,var(--ink-3));flex:none}
.lbl{font-size:10.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
.field{width:100%; height:32px; padding:0 10px; border-radius:var(--r-sm); border:1px solid var(--stroke);
  background:var(--glass-2); color:var(--ink); font-size:13px}
textarea.field{height:auto; padding:8px 10px; resize:vertical; min-height:60px; line-height:1.5; font-family:var(--f-ui)}
select.field{cursor:pointer}
.field:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.hues{display:flex; gap:5px; flex-wrap:wrap}
.hue{width:22px; height:22px; border-radius:7px; cursor:pointer; padding:0;
  border:1px solid var(--stroke); background:color-mix(in srgb,var(--h) 80%,transparent)}
.hue.on{outline:2px solid var(--ink); outline-offset:1px}
.seg-check{display:flex; gap:5px; flex-wrap:wrap}
.chkbtn{display:inline-flex; align-items:center; gap:5px; height:27px; padding:0 10px; border-radius:var(--r-sm);
  border:1px solid var(--stroke-2); background:var(--glass-2); font-size:12px; cursor:pointer; user-select:none}
.chkbtn input{margin:0}
.chkbtn:has(input:checked){background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.fgroup{border:1px solid var(--stroke-2); border-radius:var(--r-md); background:var(--glass-2)}
.fgroup > summary{cursor:pointer; padding:9px 10px; font-size:11.5px; font-weight:600; color:var(--ink-2);
  list-style:none; display:flex; align-items:center; gap:6px}
.fgroup > summary::-webkit-details-marker{display:none}
.fgroup > summary::before{content:"▸"; font-size:10px; color:var(--ink-3); transition:transform .12s}
.fgroup[open] > summary::before{transform:rotate(90deg)}
.fgroup-body{display:flex; flex-direction:column; gap:10px; padding:0 10px 10px}
.proplist{display:flex; flex-direction:column; gap:6px}
.linklist{display:flex; flex-direction:column; gap:6px}
.linkrow{display:grid; grid-template-columns:1fr 1.4fr auto auto; gap:6px; align-items:center}
.linkrow input.field.mono{font-family:var(--f-mono); font-size:12px}
.empty{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  padding:26px 16px; color:var(--ink-3); font-size:12.5px; text-align:center}
.empty .ico{width:22px;height:22px;opacity:.55}

/* ============ shell ============ */
.app{height:100%; display:flex; flex-direction:column; gap:8px; padding:8px}
.topbar{display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:var(--r-lg); flex:none; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:9px}
.brandname{font-size:13.5px; font-weight:700; letter-spacing:-.025em; white-space:nowrap; color:var(--ink)}
.brandsep{width:1px; height:16px; background:var(--stroke); flex:none}
@media (max-width:1360px){ .brandname,.brandsep{display:none} }
.brand-mark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--camp) 70%,var(--accent)));
  color:#fff; box-shadow:var(--shadow-sm)}
.brand-mark .ico{width:16px;height:16px;stroke-width:1.9}
.spacer{flex:1}
.savechip{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-3); padding:0 4px; white-space:nowrap}
.savechip .dot{--c:var(--ok)}
.savechip[data-state="dirty"] .dot{--c:var(--warn)}
.savechip[data-state="off"] .dot{--c:var(--ink-3)}
.view{display:none; flex:1; min-height:0; position:relative}   /* 확장한 패널이 이 상자를 기준으로 세로 전체를 채운다 */
.view.on{display:flex; flex-direction:column; gap:8px}

/* 보드 드롭다운 · 공용 메뉴 */
.boardbtn{max-width:220px}
.boardbtn .bn{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.menu{position:fixed; z-index:130; width:290px; border-radius:var(--r-md); padding:6px; display:flex; flex-direction:column; gap:2px;
  max-height:70vh; overflow:auto}
.menu .mi{display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:var(--r-xs); cursor:pointer;
  font-size:12.5px; border:0; background:transparent; color:var(--ink-2); text-align:left; width:100%}
.menu .mi:hover{background:var(--glass-2); color:var(--ink)}
.menu .mi.on{background:var(--accent-soft); color:var(--ink); font-weight:600}
.menu .mi .cnt{margin-left:auto; font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3)}
.menu .sepline{height:1px; background:var(--stroke-2); margin:5px 2px}

/* ============ flow canvas ============ */
.flow{position:relative; border-radius:var(--r-lg); overflow:hidden; flex:none; min-height:130px}
.flow-grid{position:absolute; inset:0;
  background-image:radial-gradient(circle at 1px 1px,var(--grid) 1px,transparent 0);
  background-size:22px 22px; pointer-events:none}
#flowSurface{position:absolute; inset:0; cursor:grab; touch-action:none; user-select:none}
#flowSurface.panning{cursor:grabbing}
#flowSurface.linking{cursor:crosshair}
#flowWorld{position:absolute; top:0; left:0; transform-origin:0 0; width:0; height:0}
#edgeLayer{position:absolute; overflow:visible; left:0; top:0; width:1px; height:1px; pointer-events:none}
#edgeLayer .hit{stroke:transparent; stroke-width:18; fill:none; pointer-events:stroke; cursor:pointer}
#edgeLayer path.wire{fill:none; stroke-linecap:round; transition:stroke .12s}
#edgeLayer text{font:600 10.5px var(--f-ui); fill:var(--ink-2); paint-order:stroke;
  stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; pointer-events:none}
#edgeHandles circle{pointer-events:auto; cursor:grab}
#edgeHandles .wp{fill:var(--bg-3); stroke:var(--accent); stroke-width:2}
#edgeHandles .wpadd{fill:var(--accent); opacity:.32; stroke:var(--bg-3); stroke-width:1.5}
#edgeHandles .wpadd:hover{opacity:.95}
/* 높이 고정 점 — 건드리기 전엔 옅은 노란 힌트, 위·아래로 끌어 높이를 고정하면
   진한 노란 점으로 바뀐다(자동/고정 상태를 색으로 바로 구분) */
#edgeHandles .wpadd.hgt{fill:#f2c94c; opacity:.5; stroke:#8a6d1a; stroke-width:1.5; cursor:ns-resize}
#edgeHandles .wpadd.hgt:hover{opacity:.95}
#edgeHandles .wp.hgt{fill:#f2c94c; stroke:#8a6d1a; stroke-width:2; cursor:ns-resize}
#guideG .guide{stroke:var(--accent); stroke-width:1; stroke-dasharray:4 4; opacity:.85}
/* 끌고 있는 동안에는 그림자·전환 효과를 끈다 — 카드마다 그림자를 다시
   그리느라 이동이 끊기지 않도록. 그림자는 .node가 아니라 .node-frame에 있다 */
.flow.busy .node,.flow.busy .node-frame{transition:none}
.flow.busy .node-frame{box-shadow:none}

/* ============ 노드 카드 — "액자형" ============
   카드 자체는 배경·테두리 없는 투명한 그릇이고, 이름은 이미지 프레임 위,
   배지·목록은 그 아래에 온다. 이미지 프레임만 실제로 테두리·그림자를 가진
   "액자"처럼 보인다. 제목·목록 글자는 프레임 안에 갇혀 있지 않으므로 축소해도
   (약 60% 축소까지는 거의 그대로) 잘 읽히도록 여유 있게 보정한다 — 다만 카드가
   무한정 커지면 옆 카드와 겹치니 상한(min())은 계속 둔다. */
.node{
  position:absolute; width:max(190px,min(240px,calc(190px / max(var(--zoom,1),.79)))); cursor:grab;
  contain:layout style; user-select:none; border-radius:var(--r-md); padding:4px; transition:background .15s;
}
.node.size-s{width:max(150px,min(200px,calc(150px / max(var(--zoom,1),.75))))}
.node.size-m{width:max(190px,min(240px,calc(190px / max(var(--zoom,1),.79))))}
.node.size-l{width:max(240px,min(290px,calc(240px / max(var(--zoom,1),.83))))}
.node:hover,.node.dragging{background:var(--glass-2)}
.node.sel{background:var(--accent-soft)}
.node.dragging{cursor:grabbing; z-index:20}
.node.dim{opacity:.38}
.node.dim:hover,.node.dim.sel{opacity:.95}

/* 프레임 — 이름·이미지·배지를 하나의 테두리로 묶는다. 확대·축소해도 이
   덩어리가 통째로 같이 움직이므로 안쪽 글자가 넘칠 걱정이 없다. 태그·캠페인
   목록(.node-main)은 이 프레임 바깥 아래에 그대로 노출된다. 투박한 진한
   테두리 대신, 앱 전체에 쓰는 글라스 톤(반투명 배경 + 옅은 테두리 + 은은한
   그림자)으로 통일해 더 정돈돼 보이게 한다. */
.node-frame{position:relative; border-radius:var(--r-md); background:var(--glass-3); border:1px solid var(--stroke);
  box-shadow:var(--shadow-sm); overflow:hidden; transition:border-color .15s,box-shadow .15s}
.node.sharp .node-frame{border-radius:5px}
.node.hued .node-frame{border-color:color-mix(in srgb,var(--nc) 55%,var(--stroke))}
.node.sel .node-frame{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
/* 연결그리기 모드에서 클릭해 둔 출발 페이지 — 도착 페이지를 클릭하기 전까지
   계속 살아있는 표시라, 옅은 강조로는 놓치기 쉽다. 굵은 테두리 + 은은하게
   맥동하는 링 + 위쪽 라벨로 눈에 띄게 강조한다. */
.node.link-src .node-frame{border-color:var(--camp); border-width:2px;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--camp) 45%,transparent), var(--shadow);
  animation:linksrc-pulse 1.3s ease-in-out infinite}
@keyframes linksrc-pulse{
  0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--camp) 45%,transparent), var(--shadow)}
  50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--camp) 22%,transparent), var(--shadow)}
}
.node.link-src::after{
  content:"연결 시작점"; position:absolute; left:50%; top:-12px; transform:translateX(-50%);
  background:var(--camp); color:#fff; font-size:10.5px; font-weight:700; line-height:1;
  padding:4px 9px; border-radius:99px; white-space:nowrap; box-shadow:var(--shadow-sm); pointer-events:none; z-index:5}

.node-title{padding:8px 8px 7px; display:flex; flex-direction:column; align-items:center; gap:1px; text-align:center}
/* 항상 한 줄로만 — 확대·축소에 따라 폭 대비 글자 크기 비율이 달라져 2줄로
   접혔다 펴졌다 하면, 그때마다 카드 높이가 바뀌어 거기 붙은 연결선(화살표)까지
   흔들린다. 넘치는 이름은 말줄임표로 자르고 title 속성으로 전체를 보여준다. */
.node-name{font-size:max(14.5px,min(24px,calc(14.5px / max(var(--zoom,1),.6)))); font-weight:700; letter-spacing:-.02em; line-height:1.24; word-break:keep-all; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.node.size-s .node-name{font-size:max(13px,min(21px,calc(13px / max(var(--zoom,1),.6))))}
.node.size-l .node-name{font-size:max(16.5px,min(27px,calc(16.5px / max(var(--zoom,1),.6))))}
.node-path{font-family:var(--f-mono); font-size:max(14px,min(19px,calc(14px / max(var(--zoom,1),.6)))); color:var(--ink-3); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* 이미지 — 프레임에 이미 테두리·그림자가 있으니 여기서는 모서리만 잡는다 */
.node-pic{position:relative; height:129px; background:var(--glass-2); overflow:hidden; display:grid; place-items:center}
.node.size-s .node-pic{height:99px}
.node.size-l .node-pic{height:165px}
.node-pic img{width:100%; height:100%; object-fit:cover; object-position:top center; display:block}
.node-pic .ph{display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--ink-3); font-size:10.5px}
.node-pic .ph .ico{width:18px;height:18px;opacity:.5}
.node-warn{position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:99px; display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb,var(--warn) 20%,var(--glass-3)); border:1px solid color-mix(in srgb,var(--warn) 45%,transparent); color:var(--warn)}
.node-warn .ico{width:12px; height:12px; stroke-width:2.2}
.thumb-acts{position:absolute; left:6px; right:6px; bottom:6px; display:flex; gap:5px; justify-content:space-between;
  align-items:flex-end; pointer-events:none; opacity:0; transition:opacity .15s}
.node:hover .thumb-acts,.thumb-acts:focus-within{opacity:1}
.node-pic .pick{padding:0; border:0; background:transparent; cursor:pointer; pointer-events:auto; min-width:0}
.node-pic .pick span{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; color:var(--ink);
  background:var(--glass-3); border:1px solid var(--stroke); border-radius:99px; padding:6px 12px; box-shadow:var(--shadow-sm);
  white-space:nowrap; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.node-pic .pick span .ico{width:15px; height:15px}
.node-pic .pick:hover span{border-color:var(--accent); color:var(--accent)}
.node.size-s .node-pic .pick span{font-size:11.5px; padding:5px 10px}

/* 키워드형 — 화면 이미지 없이 이름만 다는 작은 알약(pill) 카드. 사진 영역이
   없는 만큼 카드 자체도 같은 3단계 크기에서 훨씬 작게 잡는다(NSIZE_KEYWORD). */
.node.kind-keyword.size-s{width:max(96px,min(130px,calc(96px / max(var(--zoom,1),.75))))}
.node.kind-keyword.size-m{width:max(124px,min(160px,calc(124px / max(var(--zoom,1),.79))))}
.node.kind-keyword.size-l{width:max(152px,min(190px,calc(152px / max(var(--zoom,1),.83))))}
.node.kind-keyword .node-frame{border-radius:999px; padding:8px 14px; display:flex; align-items:center; justify-content:center}
.kw-pill{display:flex; align-items:center; gap:6px; min-width:0}
.kw-name{font-size:max(12.5px,min(18px,calc(12.5px / max(var(--zoom,1),.6)))); font-weight:700; letter-spacing:-.02em;
  color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.node.kind-keyword.size-l .kw-name{font-size:max(14.5px,min(21px,calc(14.5px / max(var(--zoom,1),.6))))}
.kw-badges{padding:6px 4px 0}

.node-main{padding:8px 4px 2px; display:flex; flex-direction:column; gap:7px}
.node-badges{display:flex; flex-wrap:wrap; gap:4px; justify-content:center; padding:0 8px 9px}
.bdg{display:inline-flex; align-items:center; gap:4px; min-height:23px; padding:3px 7px; border-radius:7px;
  font-size:11px; font-weight:600; font-family:var(--f-mono);
  background:color-mix(in srgb,var(--c) 15%,transparent); color:color-mix(in srgb,var(--c) 78%,var(--ink));
  border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.bdg b{font-size:max(14px,min(19px,calc(14px / var(--zoom,1)))); font-weight:700; line-height:1.15; font-variant-numeric:tabular-nums}
.bdg .ico{width:12px;height:12px;stroke-width:2.1; flex:none}
.bdg.big{min-height:27px; padding:4px 10px; border-radius:8px}
.bdg.big b{font-size:max(17px,min(23px,calc(17px / var(--zoom,1))))}
.bdg.big .ico{width:14px;height:14px}
.node.size-s .bdg{min-height:21px} .node.size-s .bdg b{font-size:max(12.5px,min(17px,calc(12.5px / var(--zoom,1))))}
.node.size-l .bdg b{font-size:max(15.5px,min(21px,calc(15.5px / var(--zoom,1))))}

/* 목록 — 태그·캠페인이 여러 개면 그냥 아래로 계속 쌓인다(잘리지 않음) */
.node-list{display:flex; flex-direction:column; gap:6px; padding-top:6px; border-top:1px dashed var(--stroke-2)}
.g-row{display:flex; align-items:flex-start; gap:6px; font-size:max(16px,min(21px,calc(16px / max(var(--zoom,1),.65))))}
.g-dot{width:6px; height:6px; border-radius:99px; flex:none; margin-top:.5em}
.g-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px}
.g-name{color:var(--ink); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.g-name.mono{font-family:var(--f-mono)}
.g-row.simple .g-name{font-weight:500; color:var(--ink-2)}
.g-meta{font-size:.84em; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
/* 여정 지도 노드의 실적 한 줄 — 캠페인 이름과 같은 크기(1em)라 확대/축소에 함께 따라간다 */
.perfline{display:flex; align-items:center; gap:4px; font-family:var(--f-mono); font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px}
.perfline .mon{color:var(--ink-3); font-weight:500; font-size:.82em}
.perfline .ctr{color:#2f6fed} .perfline .cvr{color:#e0483f}
.perfline .sep{color:var(--ink-3); opacity:.6}
/* 표본을 감안해도 의미 있는 변화만 진하게 — 흐린 화살표는 노이즈일 수 있다는 뜻 */
.perfline i{font-style:normal; font-size:.72em; margin-left:1px; opacity:.4; font-weight:400}
.perfline i.sig{opacity:1; font-weight:700}
.perfline .mon{margin-left:auto}
.g-more{font-size:max(12px,min(15.5px,calc(12px / max(var(--zoom,1),.65)))); color:var(--ink-3); padding-left:12px}
.g-empty{font-size:max(11px,min(14px,calc(11px / max(var(--zoom,1),.65)))); color:var(--ink-3); text-align:center; padding-top:2px}
.g-miss{font-size:max(11px,min(14px,calc(11px / max(var(--zoom,1),.65)))); color:var(--warn); display:flex; align-items:center; gap:6px}
.g-miss .ico{width:12px; height:12px; flex:none}
.port{pointer-events:none; position:absolute; width:13px; height:13px; border-radius:99px; background:var(--bg-3);
  border:2px solid var(--accent); opacity:0; transition:opacity .15s,transform .15s; cursor:crosshair; z-index:5}
.node:hover .port,.node.sel .port{opacity:1; pointer-events:auto}
.port:hover{transform:scale(1.35)}
.port.e{right:-7px; top:50%; margin-top:-6.5px} .port.w{left:-7px; top:50%; margin-top:-6.5px}
.port.s{bottom:-7px; left:50%; margin-left:-6.5px} .port.n{top:-7px; left:50%; margin-left:-6.5px}
.flow-tools{position:absolute; top:10px; left:10px; display:flex; gap:6px; z-index:30; padding:5px;
  border-radius:var(--r-md); flex-wrap:wrap; max-width:calc(100% - 20px); align-items:center}
.flow-zoom{position:absolute; bottom:10px; right:10px; display:flex; gap:4px; z-index:30; padding:5px;
  border-radius:var(--r-md); align-items:center}
.minimap{position:absolute; top:10px; right:10px; z-index:29; width:168px; height:112px; border-radius:var(--r-md); overflow:hidden; cursor:crosshair}
.minimap svg{width:100%; height:100%; display:block; touch-action:none}
.minimap .mm-view{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5; vector-effect:non-scaling-stroke; pointer-events:none}
#laneLayer{position:absolute; left:0; top:0; pointer-events:none; z-index:0}
#flowSurface.lane-drawing{cursor:crosshair}
.lane{position:absolute; border-radius:10px; background:color-mix(in srgb,var(--lc) 7%,transparent);
  border:1.5px dashed color-mix(in srgb,var(--lc) 45%,transparent)}
.lane-preview{opacity:.85; box-shadow:inset 0 0 0 2px var(--lc)}
/* 라벨은 "누르면 뭔가 된다"는 느낌이 들도록 호버 시 살짝 떠오르고 진해진다 —
   드래그하면 이동, 그냥 클릭하면 이름·색 편집이 열린다는 두 가지 동작을 다
   암시해야 해서 move 커서 + 수정 아이콘을 같이 둔다. */
.lane-label{position:absolute; top:10px; left:10px; pointer-events:auto; cursor:move; display:inline-flex; align-items:center; gap:7px;
  padding:7px 15px; border-radius:99px; font-size:14px; font-weight:700; letter-spacing:-.01em;
  background:color-mix(in srgb,var(--lc) 26%,var(--bg-3)); color:color-mix(in srgb,var(--lc) 88%,var(--ink)); white-space:nowrap; box-shadow:var(--shadow-sm);
  transition:box-shadow .15s,transform .15s,background .15s}
.lane-label:hover{background:color-mix(in srgb,var(--lc) 42%,var(--bg-3)); box-shadow:var(--shadow); transform:translateY(-1px)}
.lane-label:active{transform:translateY(0)}
.lane-editcue{display:flex; flex:none; opacity:0; transition:opacity .15s}
.lane-label:hover .lane-editcue{opacity:.8}
.lane-editcue .ico{width:12px; height:12px; stroke-width:2.2}
.lane-edge{position:absolute; pointer-events:auto; z-index:1}
.lane-edge.l{left:-6px; top:0; bottom:0; width:12px; cursor:ew-resize}
.lane-edge.r{right:-6px; top:0; bottom:0; width:12px; cursor:ew-resize}
.lane-edge.t{top:-6px; left:0; right:0; height:12px; cursor:ns-resize}
.lane-edge.b{bottom:-6px; left:0; right:0; height:12px; cursor:ns-resize}
.lane-edge:hover{background:color-mix(in srgb,var(--lc) 22%,transparent)}
.zoomval{font-family:var(--f-mono); font-size:11px; color:var(--ink-2); min-width:38px; text-align:center}
.flow-seltools{position:absolute; bottom:54px; right:10px; z-index:30; padding:5px; border-radius:var(--r-md)}
.splitter-h{height:9px; flex:none; cursor:row-resize; display:grid; place-items:center; border-radius:99px; touch-action:none}
.splitter-h::after{content:""; width:54px; height:3px; border-radius:99px; background:var(--stroke); transition:background .16s,width .16s}
.splitter-h:hover::after{background:var(--accent); width:80px}
.splitter-v{width:9px; flex:none; cursor:col-resize; display:grid; place-items:center; touch-action:none}
.splitter-v::after{content:""; height:54px; width:3px; border-radius:99px; background:var(--stroke); transition:background .16s,height .16s}
.splitter-v:hover::after{background:var(--accent); height:80px}

/* ============ lower deck ============ */
.deck{flex:1; min-height:0; display:flex}
.pane{border-radius:var(--r-lg); overflow:hidden; display:flex; flex-direction:column; min-width:0}
.pane.side{flex:none}
.pane.center{flex:1}
/* 패널 확장 — 그 패널만 화면 옆면을 세로로 통째로 차지한다(지도 옆까지 올라간다).
   다른 UI는 하나도 사라지지 않는다: 지도·스테이지·반대편 패널은 비켜난 폭만큼만
   좁아진다(여백은 applySizes()가 인라인으로 넣는다).
   경계선도 같이 세로로 길어져서, 확장한 채로도 폭을 끌어 바꿀 수 있다 */
#view-map[data-expand="left"] #paneLeft,
#view-map[data-expand="right"] #paneRight{position:absolute; top:0; bottom:0; z-index:5}
#view-map[data-expand="left"] #paneLeft{left:0}
#view-map[data-expand="right"] #paneRight{right:0}
#view-map[data-expand="left"] #splitL,
#view-map[data-expand="right"] #splitR{position:absolute; top:0; bottom:0; z-index:6}
.pane-head{display:flex; align-items:center; gap:8px; padding:9px 11px; flex:none;
  border-bottom:1px solid var(--stroke-2); background:var(--glass-2)}
.pane-head h2{margin:0; font-size:12.5px; font-weight:600; letter-spacing:-.01em; display:flex; align-items:center; gap:7px}
.pane-head h2 .ico{width:14px;height:14px;color:var(--ink-3)}
.count{font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); background:var(--glass-2);
  border:1px solid var(--stroke-2); border-radius:6px; padding:1px 5px}
.pane-body{flex:1; min-height:0; overflow:auto; padding:10px; display:flex; flex-direction:column; gap:8px}
.pane-foot{flex:none; padding:8px 10px; border-top:1px solid var(--stroke-2); background:var(--glass-2)}
.pane-subhead{display:flex; gap:6px; padding:0 11px 9px; flex:none; background:var(--glass-2); border-bottom:1px solid var(--stroke-2)}
.pane-subhead .field{flex:1; min-width:0; height:28px; font-size:12px}
/* 태그 카드 접힘/펼침 — 요약(태그명·트리거)만 항상 보이고, 클릭하면 나머지가 펼쳐진다 */
.tagsummary{display:flex; align-items:center; gap:7px; width:100%; padding:2px 0; border:0; background:transparent;
  cursor:pointer; text-align:left; font:inherit; color:inherit}
.tagcaret{font-size:9px; color:var(--ink-3); transition:transform .12s; flex:none}
.tagcard.expanded .tagcaret{transform:rotate(90deg)}
.tagsummary .evt{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tagcard.flash{animation:tagflash 1.4s ease}
@keyframes tagflash{0%,100%{box-shadow:none}20%,60%{box-shadow:0 0 0 2px var(--accent)}}

/* cards in side panels */
.card{border-radius:var(--r-md); border:1px solid var(--stroke); background:var(--glass-2); padding:9px 10px;
  display:flex; flex-direction:column; gap:7px; position:relative; transition:border-color .16s,background .16s}
.card:hover{background:var(--glass-3); border-color:var(--stroke)}
.card.pinned{border-color:color-mix(in srgb,var(--camp) 45%,transparent)}
.card-top{display:flex; align-items:flex-start; gap:8px}
.card-title{font-size:12.5px; font-weight:600; line-height:1.3; flex:1; word-break:break-word; letter-spacing:-.01em}
.card-acts{display:flex; gap:3px; opacity:0; transition:opacity .16s}
.card:hover .card-acts,.card:focus-within .card-acts{opacity:1}
.meta{display:flex; flex-wrap:wrap; gap:5px 10px; font-size:11px; color:var(--ink-3)}
.meta b{font-weight:500; color:var(--ink-2)}
.meta.stack{flex-direction:column; flex-wrap:nowrap; align-items:flex-start; gap:4px}
.kv{display:flex; gap:6px; font-size:11px; font-family:var(--f-mono); color:var(--ink-2); flex-wrap:wrap}
.kv span{background:var(--glass-2); border:1px solid var(--stroke-2); border-radius:5px; padding:1px 5px}
.evt{font-family:var(--f-mono); font-size:11.5px; color:var(--ink); background:var(--glass-2);
  border:1px solid var(--stroke-2); border-radius:6px; padding:2px 6px; display:inline-block; word-break:break-all}
.linkline{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--camp); font-weight:500}

/* ============ stage ============ */
.stage-wrap{flex:1; min-height:0; position:relative; overflow:hidden; background:
  repeating-conic-gradient(var(--stroke-2) 0% 25%, transparent 0% 50%) 50%/18px 18px}
#stageScroll{position:absolute; inset:0; overflow:auto; display:grid; justify-items:center; align-items:center;
  justify-content:safe center; align-content:safe center; padding:18px}
#stageDoc{position:relative; transform-origin:center center; box-shadow:var(--shadow); border-radius:6px;
  background:var(--bg-3); flex:none}
#stageDoc img.shot{position:absolute; display:block; object-fit:contain; border-radius:6px; pointer-events:none; user-select:none}
#stageDoc .noshot{position:absolute; display:flex; align-items:center; justify-content:center; border-radius:6px; pointer-events:none; user-select:none}
#layerSvg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
#layerSvg .lyr{cursor:pointer}
#layerSvg .lyr.sel .shape{stroke-dasharray:none; filter:drop-shadow(0 0 0 transparent)}
#layerSvg .selbox{fill:none; stroke:var(--accent); stroke-width:1.5; stroke-dasharray:5 4; vector-effect:non-scaling-stroke}
#layerSvg .handle{fill:var(--bg-3); stroke:var(--accent); stroke-width:1.5; cursor:nwse-resize; vector-effect:non-scaling-stroke}
#layerSvg text.ltext{font-family:var(--f-ui); font-weight:600; dominant-baseline:hanging; white-space:pre}
#layerSvg .pin{cursor:pointer}
#layerSvg .pin circle{stroke:var(--bg-3); stroke-width:2}
#layerSvg .pin text{font:700 10px var(--f-mono); fill:#fff; text-anchor:middle; dominant-baseline:central; pointer-events:none}
#layerSvg .hit-area{fill:transparent; stroke:none; pointer-events:fill}
#layerSvg .hit-line{fill:none; stroke:transparent; stroke-width:16; pointer-events:stroke}
#layerSvg .lyr-editbtn{opacity:0; transition:opacity .12s; cursor:pointer}
#layerSvg .lyr:hover .lyr-editbtn{opacity:1}
#layerSvg .lyr-editbtn circle{fill:var(--glass-3); stroke:var(--stroke); stroke-width:1; vector-effect:non-scaling-stroke}
#layerSvg .lyr-editbtn svg{stroke:var(--ink); fill:none; stroke-width:2}
.stage-empty{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none}
.stage-tools{display:flex; align-items:center; gap:5px; flex-wrap:wrap}
.tool-sep{width:1px; height:20px; background:var(--stroke); margin:0 2px}
.swatches{display:flex; gap:3px; align-items:center; flex-wrap:wrap; max-width:200px}
.sw{width:17px; height:17px; border-radius:5px; border:2px solid transparent; cursor:pointer; padding:0;
  box-shadow:0 0 0 1px var(--stroke)}
.sw.on{border-color:var(--ink); box-shadow:0 0 0 1px var(--bg-3) inset}
.sw.sw-none{background-image:conic-gradient(#ccc 90deg,#fff 90deg 180deg,#ccc 180deg 270deg,#fff 270deg); background-size:8px 8px}
.stage-foot{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-3)}
.dropzone{position:absolute; inset:8px; border-radius:var(--r-md); border:2px dashed var(--accent);
  background:var(--accent-soft); display:none; place-items:center; font-weight:600; color:var(--accent); z-index:40}
.stage-wrap.dragover .dropzone{display:grid}

/* 일괄 등록 */
.bulk{display:flex; flex-direction:column; gap:6px; max-height:44vh; overflow:auto; padding-right:2px}
.brow{display:flex; align-items:center; gap:9px; padding:6px 8px; border:1px solid var(--stroke-2);
  border-radius:var(--r-sm); background:var(--glass-2)}
.brow .avatar{width:26px; height:26px}
.brow img{width:36px; height:50px; object-fit:cover; object-position:top center; border-radius:5px;
  border:1px solid var(--stroke-2); background:var(--bg-3); flex:none}
.brow .fn{flex:1; min-width:0; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.brow .fn em{display:block; font-style:normal; font-size:10.5px; color:var(--ink-3)}
.brow select{width:158px; height:28px; font-size:12px; flex:none}
.brow.done{opacity:.5}
.bulkbar{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-3)}

/* ============ list views ============ */
.listwrap{flex:1; min-height:0; border-radius:var(--r-lg); overflow:hidden; display:flex; flex-direction:column}
.toolrow{display:flex; align-items:center; gap:8px; padding:10px 12px; flex-wrap:wrap; border-bottom:1px solid var(--stroke-2); background:var(--glass-2)}
.toolrow .field{width:auto; min-width:120px}
.scroller{flex:1; min-height:0; overflow:auto; padding:2px 0 12px}
table.tbl{width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px}
/* 고정 머리글은 불투명색으로 — 반투명 + blur이면 수백 줄을 스크롤하는 내내
   머리글 뒤를 다시 블러 합성해야 해서 목록이 눈에 띄게 끊긴다 */
table.tbl th{position:sticky; top:0; z-index:2; text-align:left; padding:9px 12px; font-size:10.5px; font-weight:600;
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); background:var(--bg-3);
  border-bottom:1px solid var(--stroke); white-space:nowrap}
table.tbl td{padding:9px 12px; border-bottom:1px solid var(--stroke-2); vertical-align:top; overflow-wrap:anywhere}
table.tbl tr:hover td{background:var(--glass-2)}
table.tbl td.nowrap{white-space:nowrap}
/* 태그 목록: 칸마다 균등하게 나누지 않고, 왼쪽 칸들은 내용에 필요한 만큼의 상한선(max-width)까지만
   차지하게 하고(td1cap/td2cap), 너비를 지정하지 않은 "테스트샘플" 칸이 남는 공간을 전부 흡수한다.
   width:1%는 긴 값 하나가 있으면 그 단어 하나 너비까지 줄여버려 너무 좁아지므로 쓰지 않는다.
   칼럼 사이는 여백 없이 세로 선으로만 구분해 이미지처럼 바로 붙여 보이게 한다. */
#tagTable{table-layout:auto}
#tagTable th{white-space:normal; line-height:1.3}
#tagTable th:last-child,#tagTable td:last-child{width:34px}
#tagTable td{padding:9px 10px; border-right:1px solid var(--stroke-2)}
#tagTable td:last-child{border-right:0}
.td1cap{max-width:190px}
.td2cap{max-width:260px}
.tdsplit{margin-top:6px; padding-top:6px; border-top:1px dashed var(--stroke-2)}
.tagname-link{cursor:pointer; border-radius:6px; margin:-3px -5px; padding:3px 5px; transition:background .12s}
.tagname-link:hover{background:var(--glass-2)}
.tagname-link:hover .evt{text-decoration:underline}
.rowacts{display:flex; gap:4px; opacity:0; transition:opacity .16s}
tr:hover .rowacts{opacity:1}
.pagechip{font-size:10.5px; padding:2px 7px; border-radius:99px; background:var(--glass-2);
  border:1px solid var(--stroke-2); color:var(--ink-2); cursor:pointer}
.pagechip:hover{border-color:var(--accent); color:var(--accent)}
.pagechip.lanechip{cursor:default; border-color:color-mix(in srgb,var(--c,var(--accent)) 42%,var(--stroke-2)); color:color-mix(in srgb,var(--c,var(--accent)) 72%,var(--ink))}
.pagechip.lanechip:hover{border-color:color-mix(in srgb,var(--c,var(--accent)) 42%,var(--stroke-2)); color:color-mix(in srgb,var(--c,var(--accent)) 72%,var(--ink))}
.statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; padding:12px 12px 0}
.stat{border-radius:var(--r-md); border:1px solid var(--stroke); background:var(--glass-2); padding:10px 12px;
  display:flex; flex-direction:column; gap:2px}
.stat .n{font-family:var(--f-mono); font-size:20px; font-weight:600; letter-spacing:-.02em; color:var(--c,var(--ink))}
.stat .t{font-size:11px; color:var(--ink-3)}

/* ============ modal / popover / toast ============ */
.scrim{position:fixed; inset:0; z-index:100; background:color-mix(in srgb,var(--bg) 82%,transparent);
  display:grid; place-items:center; padding:20px}
.modal{width:min(560px,100%); max-height:88vh; border-radius:var(--r-lg); display:flex; flex-direction:column; overflow:hidden}
.modal-head{display:flex; align-items:center; gap:9px; padding:14px 16px; border-bottom:1px solid var(--stroke-2)}
.modal-head h3{margin:0; font-size:15px; font-weight:600; letter-spacing:-.015em; flex:1}
.modal-body{padding:16px; overflow:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:13px}
.modal-foot{padding:12px 16px; border-top:1px solid var(--stroke-2); display:flex; gap:8px; justify-content:flex-end;
  background:var(--glass-2)}
.frow{display:flex; flex-direction:column; gap:5px}
.frow.two{flex-direction:row; gap:10px} .frow.two>*{flex:1; min-width:0}
.hint{font-size:11px; color:var(--ink-3)}
.pbar{height:8px; border-radius:99px; background:var(--glass-2); overflow:hidden; margin-bottom:8px}
.pbar-fill{height:100%; background:var(--accent); transition:width .15s}
.proprow{display:grid; grid-template-columns:22px 1fr 1fr 96px 1fr auto auto; gap:6px; align-items:center}
.proprow:has([data-pf="common"]:checked){background:color-mix(in srgb,var(--camp) 8%,transparent); border-radius:var(--r-sm)}
.propchk{display:flex; align-items:center; justify-content:center; cursor:pointer}
.proprow input.field.mono,.proprow select.field{font-family:var(--f-mono); font-size:12px}
/* 속성 목록을 grid로 정렬한다 — .propline은 display:contents로 자기 자신은 사라지고
   5개 span이 부모 grid의 칼럼에 바로 편입돼, 값이 없는 칸도 자리를 지켜 줄마다 칼럼이 맞는다 */
.proplines{display:grid; grid-template-columns:max-content minmax(44px,120px) minmax(56px,160px) max-content minmax(40px,1fr);
  column-gap:8px; row-gap:4px; font-size:11.5px; color:var(--ink-2); line-height:1.4; align-items:baseline; min-width:0; max-width:100%; overflow-x:auto}
.propline{display:contents}
.propline .pko{font-weight:600; color:var(--ink); overflow-wrap:anywhere}
.propline .pen{font-family:var(--f-mono); font-size:10.5px; overflow-wrap:anywhere}
.propline .ptype{color:var(--ink-3); white-space:nowrap}
.propline .psample{font-family:var(--f-mono); font-size:10.5px; overflow-wrap:anywhere}
.propline .psample:not(:empty){background:var(--glass-2); border:1px solid var(--stroke-2); border-radius:5px; padding:1px 5px}
.tsamp{border-top:1px solid var(--stroke-2); margin-top:2px; padding-top:6px}
.tsamp > summary{cursor:pointer; font-size:11px; color:var(--ink-3); list-style:none; display:flex; align-items:center; gap:5px}
.tsamp > summary::-webkit-details-marker{display:none}
.tsamp > summary::before{content:"▸"; font-size:9px; transition:transform .12s}
.tsamp[open] > summary::before{transform:rotate(90deg)}
.tsamp-row{margin-top:6px}
.tsamp-k{font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); display:block; margin-bottom:2px}
.tsamp-row pre{margin:0; font-size:10.5px; white-space:pre-wrap; word-break:break-all; background:var(--glass-2);
  border:1px solid var(--stroke-2); border-radius:6px; padding:6px 8px; color:var(--ink-2)}
/* 태그 목록 표 안의 테스트 샘플 — 채널 4개가 항상 나란히 있되, 채널마다 따로 접고 펼 수 있다.
   값이 있는 채널은 평범하게, 없는 채널은 라벨을 빨간색으로 표시해 눈에 띄게 한다. */
.tsamp-chset{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start}
.tsamp-ch{flex:0 1 170px; min-width:130px}
.tsamp-ch.open{flex-basis:280px}
.tsamp-chhead{display:flex; align-items:center; gap:4px; border:0; background:transparent; cursor:pointer;
  font:inherit; padding:2px 0; color:var(--ink-2)}
.tsamp-caret{font-size:8px; color:var(--ink-3); transition:transform .12s; flex:none}
.tsamp-ch.open .tsamp-caret{transform:rotate(90deg)}
.tsamp-chlabel{font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2)}
.tsamp-ch.tsamp-empty .tsamp-chlabel{color:var(--bad)}
/* 펼친 샘플 하나는 카드처럼 크게 보여주고, 안에 복사 버튼을 오른쪽 아래에 붙인다 */
.tsamp-chbody{position:relative; margin-top:6px; min-height:74px; background:var(--glass-2);
  border:1px solid var(--stroke-2); border-radius:8px; padding:10px}
.tsamp-chbody pre{margin:0 0 30px; font-size:10.5px; white-space:pre-wrap; word-break:break-all; color:var(--ink-2)}
.tsamp-copy{position:absolute; right:8px; bottom:8px}
.popover{position:fixed; z-index:120; border-radius:var(--r-md); padding:10px; display:flex; flex-direction:column; gap:9px;
  width:250px; box-shadow:var(--shadow); max-height:88vh; overflow:auto}
.popover.wide{width:302px}
.qsearch{width:min(480px,100%)}
.qs-results{max-height:52vh; overflow:auto; display:flex; flex-direction:column; gap:2px}
.qs-group{font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); padding:8px 2px 3px}
.qs-row{display:flex; align-items:center; gap:8px; padding:8px 9px; border-radius:var(--r-xs); cursor:pointer;
  font-size:12.5px; border:0; background:transparent; color:var(--ink-2); text-align:left; width:100%}
.qs-row:hover{background:var(--glass-2); color:var(--ink)}
.qs-t{font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:44%}
.qs-s{color:var(--ink-3); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1}
.toast .btn{margin-left:6px; height:22px}
.lockrow{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-2)}
.lockrow .ico{color:var(--ink-3)}
.stale{color:var(--warn)}
#toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:200; display:flex;
  flex-direction:column; gap:6px; align-items:center; pointer-events:none}
.toast{border-radius:99px; padding:8px 16px; font-size:12.5px; font-weight:500; box-shadow:var(--shadow);
  background:var(--glass-3); border:1px solid var(--stroke); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  animation:pop .22s ease-out}
.toast.bad{color:var(--bad)} .toast.ok{color:var(--ok)}
@keyframes pop{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important}}
/* 모바일 레이아웃은 parts/17-mobile.html 에서 따로 관리한다 */

/* ============ 구글 시트 연동 · 성과 추이 ============ */
.syncchip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-3);
  border:1px solid var(--stroke-2); background:var(--glass-2); border-radius:99px; padding:4px 10px; white-space:nowrap}
.syncchip.bad{color:var(--bad); border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.modal.wide{width:min(880px,100%)}
.picklist{max-height:52vh; overflow:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:4px;
  border:1px solid var(--stroke-2); border-radius:var(--r-md); padding:6px; contain:paint}
/* 수백 줄짜리 목록에서 화면 밖 줄은 아예 레이아웃·페인트를 건너뛰게 한다 */
.picklist .pickrow,.perfside .pickrow{content-visibility:auto; contain-intrinsic-size:0 46px}
.pickrow{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--r-sm); cursor:pointer;
  border:1px solid transparent}
.pickrow:hover{background:var(--glass-2)}
.pickrow.on{background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.pickrow input{flex:none; width:15px; height:15px; accent-color:var(--accent)}
.pickmain{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.pickmain b{font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pickmain em{font-style:normal; font-size:11px; color:var(--ink-3)}
.pickfull{font-size:10.5px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fnote{font-size:11.5px; line-height:1.5; margin:-6px 0 0; padding-left:2px; color:var(--ink-3)}
.fnote.ok{color:var(--ok)} .fnote.bad{color:var(--bad); font-weight:500}
.field.invalid{border-color:var(--bad); box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 18%,transparent)}
.formwarn{font-size:12px; font-weight:500; color:var(--bad); line-height:1.6;
  border:1px solid color-mix(in srgb,var(--bad) 38%,transparent); border-radius:var(--r-sm);
  background:color-mix(in srgb,var(--bad) 8%,transparent); padding:9px 11px}
.frow .ro{font-size:12px; color:var(--ink-2); background:var(--glass-2); border:1px solid var(--stroke-2);
  border-radius:var(--r-sm); padding:8px 10px; line-height:1.5; word-break:break-word}

.periodbox{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:var(--ink-3)}
.periodbox .field{min-width:96px}
#campTableWrap{flex:1; min-height:0; overflow:auto; overscroll-behavior:contain}
#campTable{table-layout:auto}
#campTable td{padding:8px 10px; border-right:1px solid var(--stroke-2)}
#campTable td:last-child,#campTable th:last-child{border-right:0; width:40px}
#campTable .nm{font-weight:600; font-size:12.5px; letter-spacing:-.01em}
#campTable .sub{display:block; font-size:10.5px; color:var(--ink-3); margin-top:2px; overflow-wrap:anywhere}
#campTable .capname{max-width:210px}
#campTable .capfull{max-width:260px}
#campTable .wherecell{display:flex; flex-wrap:wrap; gap:3px; max-width:180px}

.perfbody{flex:1; min-height:0; display:flex; gap:0}
.perfside{width:308px; flex:none; border-right:1px solid var(--stroke-2); padding:8px}
/* 그래프는 위에 고정하고, 실적 기준·표만 아래에서 스크롤한다 */
.perfmain{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; padding:12px; gap:12px}
#perfChart{flex:none}
.perfscroll{flex:1; min-height:0; overflow:auto; overscroll-behavior:contain}
.perfgroup{font-size:11px; font-weight:700; color:var(--ink-2); padding:11px 8px 4px; letter-spacing:.02em;
  font-family:var(--f-mono)}
.perfgroup em{font-style:normal; font-family:var(--f-ui); font-weight:500; color:var(--ink-3); margin-left:4px}
/* 최신월에 데이터가 없는(한동안 돌리지 않은) 캠페인은 흐리게 — 목록 아래쪽에 모인다 */
.pickrow.stale .pickmain b{color:var(--ink-2)}
.pickrow.stale{opacity:.62}
.pickrow.stale.on{opacity:1}
.chartwrap{position:relative; border:1px solid var(--stroke-2); border-radius:var(--r-md); background:var(--glass-2); padding:6px}
.perfchart{width:100%; height:auto; display:block}
.perfchart .hit{fill:transparent; cursor:crosshair}
.perfchart .vline{stroke:var(--ink-3); stroke-width:1; stroke-dasharray:3 3; opacity:.5}
.perfchart .vlab{fill:var(--ink-2); font-size:8px; font-family:var(--f-mono); text-anchor:middle}
.chart-tip{position:absolute; z-index:5; pointer-events:none; background:var(--bg-3); border:1px solid var(--stroke);
  border-radius:var(--r-sm); box-shadow:var(--shadow-sm); padding:7px 9px; font-size:11px; line-height:1.6; white-space:nowrap; display:none}
.chart-tip b{font-family:var(--f-mono)}
.chart-tip .tr{display:flex; align-items:center; gap:6px}
.chart-tip .tr i{width:8px; height:8px; border-radius:2px; display:inline-block; flex:none}
.perfchart .gl{stroke:var(--grid); stroke-width:1}
.perfchart .ax{fill:var(--ink-3); font-size:8.5px; font-family:var(--f-mono)}
.perfchart .ax.l{text-anchor:end} .perfchart .ax.r{text-anchor:start} .perfchart .ax.c{text-anchor:middle}
.perfchart .ax.cap{font-size:9px; font-weight:600}
.perfchart .ln{fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.legend{display:flex; flex-wrap:wrap; gap:10px; padding:6px 4px 2px; justify-content:center}
.legend .lg{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:var(--ink-2)}
.legend .lg i{width:10px; height:10px; border-radius:3px; display:inline-block}
/* 실적 기준 — 라벨은 색 있는 세로 띠, 시트 문구는 굵게, 수식 역산은 아래 흐리게 */
.basis2{display:flex; flex-direction:column; gap:5px; max-width:280px}
.brow2{display:flex; gap:7px; align-items:flex-start; line-height:1.45}
.brow2 .bk{flex:none; font-family:var(--f-mono); font-size:9.5px; font-weight:700; letter-spacing:.04em;
  color:var(--c); border-left:2.5px solid var(--c); padding:1px 0 1px 5px; min-width:30px}
.brow2 .bv{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px}
.brow2 .bmain{font-size:11.5px; color:var(--ink); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.brow2 .bsub{font-size:10.5px; color:var(--ink-3); font-family:var(--f-mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.brow2.none .bv{font-size:11px; color:var(--ink-3); font-style:italic}
.basiscard{border:1px solid var(--stroke-2); border-radius:var(--r-md); padding:10px 12px; margin-bottom:12px; background:var(--glass-2)}
.basiscard h4{margin:0 0 7px; font-size:12.5px; font-weight:600}
.basiscard .basis2{max-width:none}
.basiscard .brow{display:flex; gap:8px; align-items:flex-start; font-size:11.5px; color:var(--ink-2); padding:3px 0}
.basiscard .brow .chip{flex:none}
.ptable{width:100%; border-collapse:collapse; margin-top:14px; font-size:11.5px}
.ptable th{position:sticky; top:0; background:var(--glass-3); text-align:left; font-weight:600; color:var(--ink-3);
  padding:7px 8px; border-bottom:1px solid var(--stroke); white-space:nowrap}
.ptable td{padding:6px 8px; border-bottom:1px solid var(--stroke-2); vertical-align:top}
.ptable .r{text-align:right; font-family:var(--f-mono)}
.ptable .b{font-weight:600}
.ptable td em{display:block; font-style:normal; font-size:10.5px; color:var(--ink-3)}

.perfbadge{display:inline-flex; gap:4px; align-items:center; flex-wrap:wrap}
.perfbadge .pb{font-family:var(--f-mono); font-size:11.5px; font-weight:600; border-radius:99px; padding:2px 7px;
  border:1px solid transparent; white-space:nowrap}
.perfbadge .pb.ctr{color:#2f6fed; background:rgba(47,111,237,.11); border-color:rgba(47,111,237,.28)}
.perfbadge .pb.cvr{color:#e0483f; background:rgba(224,72,63,.11); border-color:rgba(224,72,63,.28)}
.perfbadge .pb.mon{color:var(--ink-3); background:var(--glass-2); border-color:var(--stroke-2); font-weight:500}
.perfbadge .pb i{font-style:normal; margin-left:3px; font-size:9.5px; opacity:.4; font-weight:400}
.perfbadge .pb i.sig{opacity:1; font-weight:700}
.perfbadge.sm .pb{font-size:11px; padding:1px 6px}
.card > .perfbadge{margin:-2px 0 2px}
.ccard > .perfbadge{margin:2px 0}
.node .perfbadge .pb{font-size:11px; padding:1px 7px; line-height:1.5}

/* ============ AARRR 요약 · 점검 · 성과 히트맵 ============ */
.funnel{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:8px; padding:10px 12px 0}
.fcell{position:relative; overflow:hidden; border-radius:var(--r-md); border:1px solid var(--stroke);
  background:var(--glass-2); padding:9px 11px; display:flex; flex-direction:column; gap:2px}
.fcell::before{content:""; position:absolute; left:0; bottom:0; height:3px; width:var(--fill,0%); background:var(--ok)}
.fcell .fk{font-family:var(--f-mono); font-size:11px; font-weight:700; color:var(--ink-2)}
.fcell .fk em{font-style:normal; font-family:var(--f-ui); font-weight:500; color:var(--ink-3); margin-left:5px; font-size:10.5px}
.fcell .fv{display:flex; align-items:baseline; gap:5px}
.fcell .fv b{font-family:var(--f-mono); font-size:16px; letter-spacing:-.02em}
.fcell .fv span{font-size:10px; color:var(--ink-3)}
.fcell .fm{font-size:10.5px; color:var(--ink-3)}

.seg .btn.off{opacity:.42}
.seg .btn.off.on{opacity:1}
.btn.warn{color:var(--warn); border-color:color-mix(in srgb,var(--warn) 45%,transparent);
  background:color-mix(in srgb,var(--warn) 10%,transparent)}
.chkgroup{border-top:1px solid var(--stroke-2); padding-top:12px}
.chkgroup:first-child{border-top:0; padding-top:0}
.chkhead{display:flex; align-items:center; gap:6px; font-size:12.5px}
.chkhead.bad{color:var(--bad)} .chkhead.warn{color:var(--warn)} .chkhead.info{color:var(--ink-2)}
.chkhead .n{font-family:var(--f-mono); font-size:11px; background:var(--glass-2); border:1px solid var(--stroke-2);
  border-radius:99px; padding:1px 7px; color:var(--ink-3)}
.chklist{display:flex; flex-direction:column; gap:2px; max-height:230px; overflow:auto; overscroll-behavior:contain}
.chkrow{display:grid; grid-template-columns:96px 1fr auto; gap:9px; align-items:center; text-align:left;
  border:1px solid transparent; background:none; border-radius:var(--r-sm); padding:6px 8px; cursor:pointer;
  font:inherit; font-size:11.5px; color:var(--ink)}
.chkrow:hover{background:var(--glass-2); border-color:var(--stroke-2)}
.chkrow .mono{font-family:var(--f-mono); font-size:11px; color:var(--ink-3)}
.chkrow em{font-style:normal; font-size:10.5px; color:var(--ink-3); max-width:260px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}

/* 성과 위주 보기 — 매출이 큰 화면일수록 초록빛이 진해진다 */
.node.heat .node-frame{background:
  linear-gradient(0deg, color-mix(in srgb, var(--ok) calc(var(--heat,0) * 30%), transparent), transparent 72%),
  var(--glass-3)}
.node.heat .node-frame{border-color:color-mix(in srgb, var(--ok) calc(var(--heat,0) * 55%), var(--stroke))}
</style>
<style>
/* ============================================================================
   모바일 안내 화면 (≤860px)

   이 도구는 넓은 화면을 전제로 만들어졌다 — 여정 지도 옆에 캠페인·화면·태깅
   세 영역을 나란히 두고, 카드를 끌어 옮기며 편집한다. 폰 화면에서는 어느 쪽도
   제대로 되지 않으므로 좁은 화면에서는 본 화면을 감추고 안내만 보여 준다.

   짝이 되는 표시(주소 채우기)는 parts/17-mobile.js, 안내 문구의 마크업은
   parts/03-markup.html 의 #pcGate 에 있다.
   ========================================================================== */
.pcgate{display:none}

@media (max-width: 860px) {
  /* 본 화면은 통째로 감춘다 — 뒤에서 스크롤되거나 소리 없이 눌리지 않도록 */
  .app,#modalRoot,#popRoot,#menuRoot,#toast{display:none !important}

  html,body{height:100dvh; overflow:hidden}
  .pcgate{display:grid; place-items:center; position:fixed; inset:0; z-index:9999;
    padding:24px; padding-bottom:max(24px, env(safe-area-inset-bottom))}
  .pcgate-card{width:100%; max-width:420px; padding:30px 24px 26px; text-align:center;
    border-radius:var(--r-lg)}
  .pcgate-ico{width:38px; height:38px; margin-bottom:14px; color:var(--accent);
    fill:none; stroke:currentColor; stroke-width:1.6;
    stroke-linecap:round; stroke-linejoin:round}
  .pcgate h1{margin:0 0 10px; font-size:17px; font-weight:700; line-height:1.4;
    letter-spacing:-.01em; color:var(--ink)}
  .pcgate p{margin:0; font-size:13px; line-height:1.7; color:var(--ink-2)}
  .pcgate-url{margin-top:18px; padding:9px 12px; border-radius:var(--r-sm);
    border:1px solid var(--stroke-2); background:var(--glass-2);
    font-size:11.5px; color:var(--ink-3); word-break:break-all}
  .pcgate-url:empty{display:none}
}
</style>
</head>

function shotSrc(n) {
  if (!n) return null;
  if (n.shotData) return n.shotData;
  if (typeof n.shot === "string") return n.shot;          // 예전 인라인 형식

}

function dataUrlToBlob(u) {
  const i = u.indexOf(","), head = u.slice(0, i), b64 = u.slice(i + 1);
  const mime = (/:(.*?);/.exec(head) || [, "image/jpeg"])[1];
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
  return new Blob([arr], { type: mime });
}

/* ---------------- IndexedDB 임시 저장 ---------------- */
let dbPromise = null;
function idb() {
  if (!dbPromise) dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open("jta-db", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
async function idbSet(k, v) {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction("kv", "readwrite");
    t.objectStore("kv").put(v, k);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}
async function idbGet(k) {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction("kv", "readonly"), q = t.objectStore("kv").get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}

  $("#toast").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .3s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 320); }, action ? 6000 : 2600);
}

/* 저장용 스냅샷: 이미지를 파일(또는 호스팅 URL)로 분리하고 JSON에는 참조만 남긴다 */
function buildSnapshot() {
  const uploads = [], used = [];
  const boards = state.boards.map(b => {
    const nodes = b.nodes.map(n => {
      const c = Object.assign({}, n);
      delete c.shotData; delete c.shotDirty;
      const legacy = typeof n.shot === "string" ? n.shot : null;
      const raw = n.shotDirty && n.shotData ? n.shotData : legacy;
      if (raw) {
        const blob = dataUrlToBlob(raw);
        const ref = "img/" + n.id + "-" + Date.now().toString(36) + "." + extOf(blob.type);
        uploads.push({ ref, blob, node: n, board: b });
        c.shot = { ref, w: n.shotW, h: n.shotH };
      } else if (n.shot && n.shot.path) c.shot = { path: n.shot.path, w: n.shot.w, h: n.shot.h };  // 서버 저장소
      else if (n.shot && n.shot.url) c.shot = { url: n.shot.url, w: n.shot.w, h: n.shot.h };
      else if (n.shot && n.shot.ref) c.shot = { ref: n.shot.ref, w: n.shot.w, h: n.shot.h };
      else c.shot = null;
      if (c.shot && c.shot.ref) used.push(c.shot.ref);
      return c;
    });
    /* 모바일에서 맞춘 화면 위치가 아니라 PC 에서 쓰던 값을 저장한다 */
    return Object.assign({}, b, { nodes, view: viewForSave(b) });
  });
  const data = Object.assign({}, state, { boards, updatedAt: Date.now() });
  const removals = savedRefs.filter(r => used.indexOf(r) < 0);
  return {
    data, uploads, removals, used,
    commit() {
      state.boards.forEach((b, bi) => b.nodes.forEach((n, i) => { n.shot = boards[bi].nodes[i].shot; n.shotDirty = false; }));
      state.updatedAt = data.updatedAt;
      savedRefs = used;
    }
  };
}
function timeAgo(ts) {
  if (!ts) return "방금";
  const d = Math.floor((Date.now() - ts) / 1000);
  if (d < 60) return "방금";
  if (d < 3600) return Math.floor(d / 60) + "분 전";
  if (d < 86400) return Math.floor(d / 3600) + "시간 전";
  return new Date(ts).toLocaleDateString("ko-KR", { month: "numeric", day: "numeric" });
}
async function saveFile(filename, text, mime) {
  try {
    const blob = new Blob([text], { type: (mime || "application/octet-stream") + ";charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(filename + " 저장 완료", "ok");
    return;
  } catch (e) { /* 브라우저가 다운로드를 막은 드문 경우에만 아래 클립보드 폴백으로 온다 */ }
  try { await navigator.clipboard.writeText(text); toast("다운로드가 막혀 있어 클립보드에 복사했습니다.", "ok"); }
  catch (e) { toast("파일을 내보낼 수 없습니다.", "bad"); }
}

/* 속성(영문 key)로 테스트 샘플 JSON 안을 재귀 탐색해 값을 자동으로 채운다 */
function deepFindKey(obj, key) {
  if (obj && typeof obj === "object") {
    if (!Array.isArray(obj) && Object.prototype.hasOwnProperty.call(obj, key)) return obj[key];
    for (const k of Object.keys(obj)) {
      const r = deepFindKey(obj[k], key);
      if (r !== undefined) return r;
    }
  }
  return undefined;
}
/* samples: 원문 텍스트(JSON 또는 대충 쓴 key:value) 배열에서 key를 찾아 값을 돌려준다.
   저장 시 자동 채우기(반자동)와 폼 안의 "자동" 버튼이 이 함수를 함께 쓴다. */
function findValueInSamples(samples, key) {
  for (const raw of (samples || [])) {
    const s = raw && String(raw).trim();
    if (!s) continue;
    try {
      const v = deepFindKey(JSON.parse(s), key);
      if (v !== undefined) return typeof v === "object" ? JSON.stringify(v) : String(v);
    } catch (e) {
      const m = new RegExp('["\']?' + key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + '["\']?\\s*[:=]\\s*("(?:[^"\\\\]|\\\\.)*"|[^,\\n}]+)').exec(s);
      if (m) return m[1].trim().replace(/^"(.*)"$/, "$1");
    }
  }
  return undefined;
}

  return findValueInSamples(keys.map(k => { const el = $('[data-k="' + k + '"]', root); return el ? el.value : ""; }), key);
}

    rec.hit.setAttribute("d", d);
  }
  const L = rec.wire.getTotalLength();
  const size = (7 + (e.width || 2) * 1.5) * ((HEADSZ[e.head] || HEADSZ.m).m);
  rec.head.setAttribute("d", e.kind === "none" ? "" : headPath(rec, L, Math.max(0, L - 14), size));
  rec.tail.setAttribute("d", e.kind === "both" ? headPath(rec, 0, Math.min(L, 14), size) : "");
  if (e.label) {

/* 선택된 연결선의 경로 편집 손잡이 — 점이 하나도 없으면(=아직 자동 경로) 실제
   그려진 곡선의 중점에 노란 점을 놓아 "위·아래로 끌면 그 높이로 고정" 임을
   보여준다. 점을 만들고 나면(=높이를 고정하면) 같은 점을 계속 노란색으로 둔다. */
function drawEdgeHandles() {
  const box = $("#edgeHandles");
  const e = sel.edge ? edgeById(sel.edge) : null;
  if (!e || e.from === e.to || !canEdit()) { if (box.innerHTML) box.innerHTML = ""; return; }
  const g = edgeGeom(e); if (!g) { box.innerHTML = ""; return; }
  const pts = [g.p1].concat(g.wps, [g.p2]);
  const isHeightOnly = g.wps.length <= 1;                 // 점이 0개(자동) 또는 1개(높이 고정)일 때만 "높이 점"으로 다룬다
  let h = "";
  g.wps.forEach((p, i) => {
    h += '<circle class="wp' + (isHeightOnly ? " hgt" : "") + '" data-wp="' + i + '" cx="' + p.x + '" cy="' + p.y + '" r="' + (isHeightOnly ? 7 : 6) + '"><title>드래그해서 높이 조절</title></circle>';
  });
  for (let i = 0; i < pts.length - 1; i++) {
    let m;
    const heightAdd = pts.length === 2;                   // 아직 점이 없는 구간 — 실제 곡선 위의 중점을 쓴다(직선 중점이 아니라)
    if (heightAdd) {
      const rec = EDGE_EL[e.id], L = rec && rec.wire && rec.wire.getTotalLength();
      m = L ? rec.wire.getPointAtLength(L / 2) : { x: (pts[i].x + pts[i + 1].x) / 2, y: (pts[i].y + pts[i + 1].y) / 2 };
    } else {
      m = { x: (pts[i].x + pts[i + 1].x) / 2, y: (pts[i].y + pts[i + 1].y) / 2 };
    }
    h += '<circle class="wpadd' + (heightAdd ? " hgt" : "") + '" data-add="' + i + '"' +
      (heightAdd ? ' data-hgt="1" data-lockx="' + m.x + '"' : "") +
      ' cx="' + m.x + '" cy="' + m.y + '" r="' + (heightAdd ? 7 : 5) + '"><title>드래그해서 높이 고정</title></circle>';
  }
  box.innerHTML = h;
}

/* ---------------- 노드 ----------------

function renderNodes() {

/* 움직이는 동안에는 GPU 레이어로 부드럽게, 멈추면 레이어를 풀어

let settleTimer = 0, zoomVar = null;

  const v = B().view, w = $("#flowWorld");

  /* --zoom은 카드 폭·글자 크기 계산식(.node)에 들어간다. 즉 이 값을 써넣을 때마다
     캔버스 안 카드 전부의 스타일과 레이아웃이 다시 계산된다 — 끌거나 확대하는 매
     프레임마다 그러고 있었던 것이 끊김의 가장 큰 원인이었다. 움직이는 동안에는

       이걸 빼먹으면 다음에 화면을 다시 그리는 순간(예: 저장) 화살표가 튄다. */
    measureNodes(); drawEdges();

    settleTimer = setTimeout(settleTransform, 160);

  v.panX = cx - (cx - v.panX) * (z / old);

  const nodes = B().nodes;

  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  nodes.forEach(n => { const q = nodeRect(n); x1 = Math.min(x1, q.x); y1 = Math.min(y1, q.y); x2 = Math.max(x2, q.x + q.w + 90); y2 = Math.max(y2, q.y + q.h); });

    [r.x, r.x + r.w / 2, r.x + r.w].forEach(ov => mine.x.forEach(mv => {
      const d = Math.abs(mv - ov);
      if (d <= SNAP_T && (!bx || d < bx.d)) bx = { d, at: ov, shift: ov - mv, o: r };
    }));
    [r.y, r.y + r.h / 2, r.y + r.h].forEach(ov => mine.y.forEach(mv => {
      const d = Math.abs(mv - ov);
      if (d <= SNAP_T && (!by || d < by.d)) by = { d, at: ov, shift: ov - mv, o: r };
    }));
  });
  const nx = Math.round(bx ? x + bx.shift : Math.round(x / GRID) * GRID);
  const ny = Math.round(by ? y + by.shift : Math.round(y / GRID) * GRID);
  if (bx) guides.push({ v: true, at: bx.at, a: Math.min(ny, bx.o.y) - 26, b: Math.max(ny + sz.h, bx.o.y + bx.o.h) + 26 });
  if (by) guides.push({ v: false, at: by.at, a: Math.min(nx, by.o.x) - 26, b: Math.max(nx + sz.w, by.o.x + by.o.w) + 26 });
  return { x: nx, y: ny, guides };
}
function drawGuides(guides) {
  const g = $("#guideG");
  const html = (guides || []).map(q => q.v
    ? '<line class="guide" x1="' + q.at + '" y1="' + q.a + '" x2="' + q.at + '" y2="' + q.b + '"></line>'
    : '<line class="guide" x1="' + q.a + '" y1="' + q.at + '" x2="' + q.b + '" y2="' + q.at + '"></line>').join("");
  if (g.innerHTML !== html) g.innerHTML = html;
}

/* 배경(또는 보기 전용일 때 카드 위)을 끌어 화면을 민다 */
function startPan(e, surf) {
  const sx = e.clientX, sy = e.clientY, v = B().view, px = v.panX, py = v.panY;
  surf.classList.add("panning");
  $("#flowPane").classList.add("busy");
  const mv = ev => { v.panX = px + (ev.clientX - sx); v.panY = py + (ev.clientY - sy); applyTransformSoon(); };
  const up = () => {
    surf.removeEventListener("pointermove", mv); surf.removeEventListener("pointerup", up); surf.removeEventListener("pointercancel", up);
    surf.classList.remove("panning");
    $("#flowPane").classList.remove("busy");
    markDirty();
  };
  try { surf.setPointerCapture(e.pointerId); } catch (err) {}
  surf.addEventListener("pointermove", mv); surf.addEventListener("pointerup", up); surf.addEventListener("pointercancel", up);
}

/* ---------------- 상호작용 ---------------- */
function initFlow() {
  const surf = $("#flowSurface");
  const busy = on => $("#flowPane").classList.toggle("busy", on);
  const toWorld = (ev, r) => ({ x: (ev.clientX - r.left - B().view.panX) / B().view.zoom, y: (ev.clientY - r.top - B().view.panY) / B().view.zoom });

  surf.addEventListener("wheel", e => {
    e.preventDefault();
    const r = surf.getBoundingClientRect();
    zoomTo(B().view.zoom * (e.deltaY < 0 ? 1.12 : 0.893), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  surf.addEventListener("pointerdown", e => {
    if (e.target.closest("[data-nedit]")) return;   /* 카드 안 버튼 위에서는 드래그를 준비하지 않는다 */
    /* 손가락 조작은 전용 제스처로 — 한 손가락은 밀기, 두 손가락은 확대/축소.
       노드가 실수로 끌려 옮겨지지 않게 하려는 것이기도 하다. */
    if (mobileFlowPointer(e, surf)) return;
    if (laneMode && canEdit() && !e.target.closest(".lane-label") && !e.target.closest(".lane-edge")) { startLaneDraw(e, surf, surf.getBoundingClientRect()); return; }
    const r = surf.getBoundingClientRect();
    const wp = e.target.closest("[data-wp]"), add = e.target.closest("[data-add]");
    const port = e.target.closest("[data-port]");
    const nodeEl = e.target.closest("[data-node]");
    const edgeHit = e.target.closest("[data-edge]");
    const editable = canEdit();

    if (editable && (wp || add) && sel.edge) {           /* 경로 꺾임점 드래그 · 추가 */
      e.preventDefault(); e.stopPropagation();
      const ed = edgeById(sel.edge);
      let idx, lockX = null;
      /* 아직 손대지 않은 기본(자동) 경로의 노란 점 — 좌우로는 움직이지 않고
         높이(위·아래)만 고정한다. 점이 이미 하나 있으면 그 점도 계속 같은
         규칙을 따른다(점 하나짜리 경로 = "높이 고정" 용도로 취급). */
      if (wp) { idx = +wp.dataset.wp; if (ed.points.length === 1) lockX = ed.points[idx].x; }
      else {
        idx = +add.dataset.add;
        if (add.dataset.hgt) lockX = +add.dataset.lockx;
        const init = toWorld(e, r);
        ed.points.splice(idx, 0, lockX != null ? { x: lockX, y: Math.round(init.y) } : init);
      }
      const paint = onFrame(p => {
        ed.points[idx] = { x: lockX != null ? lockX : Math.round(p.x), y: Math.round(p.y) };
        geomEdge(ed, EDGE_EL[ed.id]); drawEdgeHandles();
      });
      const mv = ev => paint(toWorld(ev, r));
      const up = () => {
        surf.removeEventListener("pointermove", mv); surf.removeEventListener("pointerup", up); surf.removeEventListener("pointercancel", up);
        markDirty(); geomEdge(ed, EDGE_EL[ed.id]); drawEdgeHandles();
      };
      surf.setPointerCapture(e.pointerId);
      surf.addEventListener("pointermove", mv); surf.addEventListener("pointerup", up); surf.addEventListener("pointercancel", up);
      return;
    }

    if (editable && port) {                              /* 포트 드래그 → 연결 */
      e.preventDefault(); e.stopPropagation();
      const from = port.dataset.port, ghost = $("#ghostWire");
      const rf = nodeRect(nodeById(from));
      const c0 = { x: rf.x + rf.w / 2, y: rf.y + rf.h / 2 };
      ghost.style.display = "";
      const paint = onFrame(p => ghost.setAttribute("d", "M " + c0.x + " " + c0.y + " L " + p.x + " " + p.y));
      const mv = ev => paint(toWorld(ev, r));
      const up = ev => {
        surf.removeEventListener("pointermove", mv); surf.removeEventListener("pointerup", up); surf.removeEventListener("pointercancel", up);
        ghost.style.display = "none";
        if (ev.type !== "pointerup") return;              /* 취소된 경우 연결을 만들지 않는다 */
        const tgt = document.elementFromPoint(ev.clientX, ev.clientY);
        const tn = tgt && tgt.closest("[data-node]");
        if (tn) addEdge(from, tn.dataset.node);
      };
      surf.setPointerCapture(e.pointerId);
      surf.addEventListener("pointermove", mv); surf.addEventListener("pointerup", up); surf.addEventListener("pointercancel", up);
      return;
    }

    if (nodeEl) {                                        /* 노드 선택 · 이동 */
      const id = nodeEl.dataset.node;
      if (editable && flowMode === "link") {
        e.preventDefault();
        if (!linkFrom) { linkFrom = id; paintSelection(); toast("연결할 도착 페이지를 클릭하세요"); }
        else { addEdge(linkFrom, id); linkFrom = null; paintSelection(); }
        return;
      }
      if (sel.node !== id) selectNode(id);
      if (sel.edge) { sel.edge = null; drawEdges(); }
      if (!editable) { startPan(e, surf); return; }   /* 보기 전용 — 카드 위에서도 화면을 민다 */
      const n = nodeById(id), sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y;
      let moved = false;
      nodeEl.classList.add("dragging"); busy(true);
      const paint = onFrame(() => { nodeEl.style.left = n.x + "px"; nodeEl.style.top = n.y + "px"; moveEdgesOf(id); });
      const mv = ev => {
        const dx = (ev.clientX - sx) / B().view.zoom, dy = (ev.clientY - sy) / B().view.zoom;
        if (!moved && Math.abs(dx) + Math.abs(dy) < 3) return;
        moved = true;
        const s = snapPos(n, ox + dx, oy + dy);
        n.x = s.x; n.y = s.y;
        drawGuides(s.guides);
        paint();
      };
      const up = () => {
        surf.removeEventListener("pointermove", mv); surf.removeEventListener("pointerup", up); surf.removeEventListener("pointercancel", up);
        nodeEl.classList.remove("dragging"); busy(false); drawGuides([]);
        if (moved) { nodeEl.style.left = n.x + "px"; nodeEl.style.top = n.y + "px"; moveEdgesOf(id); markDirty(); }
      };
      surf.setPointerCapture(e.pointerId);
      surf.addEventListener("pointermove", mv); surf.addEventListener("pointerup", up); surf.addEventListener("pointercancel", up);
      return;
    }

    if (edgeHit && editable) { sel.edge = edgeHit.dataset.edge; drawEdges(); openEdgePop(sel.edge, e.clientX, e.clientY); return; }

    if (sel.edge) { sel.edge = null; drawEdges(); }       /* 배경 → 패닝 */
    startPan(e, surf);
  });

  surf.addEventListener("dblclick", e => {
    if (!canEdit()) return;
    const wp = e.target.closest("[data-wp]");
    if (wp && sel.edge) { edgeById(sel.edge).points.splice(+wp.dataset.wp, 1); markDirty(); drawEdges(); return; }
    const n = e.target.closest("[data-node]");
    if (n) editNode(n.dataset.node);
  });

  $("#flowMode").addEventListener("click", e => {
    const b = e.target.closest("[data-mode]"); if (!b) return;
    flowMode = b.dataset.mode; linkFrom = null;
    $$("#flowMode .btn").forEach(x => x.classList.toggle("on", x === b));
    surf.classList.toggle("linking", flowMode === "link");
    paintSelection();
  });
  $("#btnAddNode").addEventListener("click", () => addNode());
  $("#btnLanes").addEventListener("click", () => {
    laneMode = !laneMode;
    $("#btnLanes").classList.toggle("on", laneMode);
    surf.classList.toggle("lane-drawing", laneMode);
    if (laneMode) toast("캔버스를 가로로 드래그해서 구간을 그리세요", "ok");
  });
  $("#btnAutoLayout").addEventListener("click", () => {
    openMenu(
      '<button class="mi' + (autoLayoutDir === "v" ? " on" : "") + '" data-act="v">' + ico("grid", "xs") + '세로 정렬<span class="cnt">기본</span></button>' +
      '<button class="mi' + (autoLayoutDir === "h" ? " on" : "") + '" data-act="h">' + ico("grid", "xs") + "가로 정렬</button>",
      $("#btnAutoLayout"), it => autoLayout(it.dataset.act)
    );
  });
  $("#btnFocus").addEventListener("click", () => {
    const cur = state.ui.focus || "all";
    openMenu(Object.entries(FOCUS).map(([k, v]) =>
      '<button class="mi' + (k === cur ? " on" : "") + '" data-act="' + k + '">' + ico(v.ico, "xs") + v.name +
      (k === "all" ? '<span class="cnt">기본</span>' : "") + "</button>").join(""), $("#btnFocus"), it => {
        state.ui.focus = it.dataset.act;
        syncFocusBtn(); markDirty(); renderFlow();
      });
  });
  $("#nodeLayer").addEventListener("click", e => {
    const b = e.target.closest("[data-nedit]");
    if (b && canEdit()) { e.stopPropagation(); if (sel.node !== b.dataset.nedit) selectNode(b.dataset.nedit); editNode(b.dataset.nedit); }
  });
  $("#btnSnap").addEventListener("click", () => {
    state.ui.snap = !state.ui.snap;
    $("#btnSnap").classList.toggle("on", state.ui.snap);
    toast(state.ui.snap ? "자석 정렬 켜짐 — 다른 페이지의 가장자리·중심선에 달라붙습니다" : "자석 정렬 꺼짐");
    markDirty();
  });
  $("#zIn").addEventListener("click", () => zoomTo(B().view.zoom * 1.15));
  $("#zOut").addEventListener("click", () => zoomTo(B().view.zoom / 1.15));
  $("#zFit").addEventListener("click", fitFlow);
  $("#btnFlowEdit").addEventListener("click", () => {
    if (sel.edge) { const r = $("#btnFlowEdit").getBoundingClientRect(); openEdgePop(sel.edge, r.left, r.top); }
    else if (sel.node) editNode(sel.node);
  });
}
function syncFocusBtn() {
  const f = state.ui.focus || "all", meta = FOCUS[f] || FOCUS.all;
  $("#focusName").textContent = meta.name;
  $("#focusIco use").setAttribute("href", "#i-" + meta.ico);
  $("#btnFocus").classList.toggle("on", f !== "all" && f !== "simple");
  $("#btnSnap").classList.toggle("on", !!state.ui.snap);
}

function addEdge(from, to) {
  if (B().edges.some(e => e.from === from && e.to === to)) { toast("이미 연결되어 있습니다"); paintSelection(); return; }
  B().edges.push({
    id: uid("e"), from, to, label: "", style: "solid", kind: "arrow",
    route: "curve", hue: "none", width: 2, head: "l", a1: "auto", a2: "auto", points: []
  });
  markDirty(); renderFlow();
}

/* ---------------- 연결선 설정 ---------------- */
function openEdgePop(id, cx, cy) {
  const e = edgeById(id); if (!e) return;
  const seg = (key, opts, cur) => '<div class="seg wrap">' + Object.entries(opts).map(([k, v]) =>
    '<button class="btn sm' + (cur === k ? " on" : "") + '" data-' + key + '="' + k + '">' + esc(typeof v === "string" ? v : v.name) + "</button>").join("") + "</div>";
  const root = $("#popRoot");
  root.innerHTML =
    '<div class="popover glass wide">' +
      '<div class="frow"><span class="lbl">연결 라벨</span><input class="field" id="epLabel" value="' + esc(e.label) + '" placeholder="예: 장바구니 담기"></div>' +
      '<div class="frow"><span class="lbl">경로</span>' + seg("rt", ROUTE, e.route || "curve") + "</div>" +
      '<div class="frow"><span class="lbl">선 · 굵기</span><div class="rowseg">' + seg("st", { solid: "실선", dashed: "점선" }, e.style) +
        seg("wd", { 1: "가늘게", 2: "보통", 3: "굵게" }, String(e.width || 2)) + "</div></div>" +
      '<div class="frow"><span class="lbl">화살표</span>' + seg("kd", { arrow: "단방향", both: "양방향", none: "없음" }, e.kind) + "</div>" +
      '<div class="frow"><span class="lbl">화살촉 크기</span>' + seg("hd", HEADSZ, e.head || "m") + "</div>" +
      '<div class="frow"><span class="lbl">색</span><div class="hues">' +
        Object.entries(HUE).map(([k, h]) => '<button class="hue' + ((e.hue || "none") === k ? " on" : "") + '" data-hu="' + k + '" title="' + h.name + '" style="--h:' + h.c + '"></button>').join("") +
      "</div></div>" +
      '<div class="frow"><span class="lbl">연결점 — 출발</span>' + seg("a1", ANCHOR, e.a1 || "auto") + "</div>" +
      '<div class="frow"><span class="lbl">연결점 — 도착</span>' + seg("a2", ANCHOR, e.a2 || "auto") + "</div>" +
      '<p class="hint">선 위의 작은 점을 끌면 경로가 꺾입니다. 꺾임점을 더블클릭하면 지워집니다.</p>' +
      '<div class="rowseg">' +
        '<button class="btn sm" data-reset style="flex:1">' + ico("loop", "xs") + "경로 초기화</button>" +
        '<button class="btn sm danger" data-del style="flex:1">' + ico("trash", "xs") + "삭제</button>" +
        '<button class="btn sm primary" data-close style="flex:1">완료</button></div>' +
    "</div>";
  const pop = $(".popover", root);
  pop.style.left = clamp(cx - 150, 8, Math.max(8, innerWidth - 320)) + "px";
  pop.style.top = clamp(cy + 12, 8, Math.max(8, innerHeight - pop.offsetHeight - 12)) + "px";
  $("#epLabel", pop).addEventListener("input", ev => { e.label = ev.target.value; markDirty(); drawEdges(); });
  pop.addEventListener("click", ev => {
    const setSeg = (k, prop, num) => {
      const b = ev.target.closest("[data-" + k + "]"); if (!b) return;
      e[prop] = num ? +b.dataset[k] : b.dataset[k];
      $$("[data-" + k + "]", pop).forEach(x => x.classList.toggle("on", x === b));
    };
    if (ev.target.closest("[data-del]")) {
      B().edges = B().edges.filter(x => x.id !== id);
      root.innerHTML = ""; sel.edge = null; markDirty(); drawEdges(); return;
    }
    if (ev.target.closest("[data-reset]")) { e.points = []; e.a1 = "auto"; e.a2 = "auto"; markDirty(); drawEdges(); return; }
    if (ev.target.closest("[data-close]")) { root.innerHTML = ""; sel.edge = null; drawEdges(); return; }
    const hu = ev.target.closest("[data-hu]");
    if (hu) { e.hue = hu.dataset.hu; $$("[data-hu]", pop).forEach(x => x.classList.toggle("on", x === hu)); }
    setSeg("rt", "route"); setSeg("st", "style"); setSeg("kd", "kind"); setSeg("wd", "width", true); setSeg("hd", "head");
    setSeg("a1", "a1"); setSeg("a2", "a2");
    markDirty(); drawEdges();
  });
  const away = ev => {
    if (!ev.target.closest(".popover") && !ev.target.closest("[data-edge]") && !ev.target.closest("[data-wp]") && !ev.target.closest("[data-add]")) {
      root.innerHTML = ""; sel.edge = null; drawEdges();
      document.removeEventListener("pointerdown", away);
    }
  };
  setTimeout(() => document.addEventListener("pointerdown", away), 0);
}

/* ---------------- 노드 추가 · 편집 ---------------- */
function addNode() {
  const surf = $("#flowSurface").getBoundingClientRect(), v = B().view;
  const n = {
    id: uid("n"), kind: "page", name: "새 페이지", path: "", note: "",
    x: Math.round((surf.width / 2 - v.panX) / v.zoom - 95),
    y: Math.round((surf.height / 2 - v.panY) / v.zoom - 75),
    shot: null, shotData: null, thumb: null, shotW: DOC_W, shotH: DOC_H,
    hue: "none", size: "m", sharp: false, tags: [], camps: [], layers: []
  };
  B().nodes.push(n); markDirty(); renderFlow(); selectNode(n.id); editNode(n.id);
}
function editNode(id) {
  const n = nodeById(id); if (!n) return;
  openForm({
    title: "페이지 정보", icon: "map",
    fields: [
      { k: "name", label: "페이지 이름", ph: "예: 상품 상세" },
      { k: "kind", label: "유형", type: "select", opts: KIND },
      { k: "path", label: "경로 · 화면 ID", mono: true, ph: "/product/:id" },
      { k: "hue", label: "색", type: "swatch" },

      n.kind === "keyword" ? null : { k: "shot", label: "화면 이미지", type: "action", icon: "camera", actionLabel: shotSrc(n) ? "화면 교체·삭제" : "화면 올리기" },
