];
const COL_BY_KEY = SHEET_COLS.reduce((m, c, i) => (m[c.key] = i, m), {});
/* 3.개인화RAW 의 A~P */
const RAW_COLS = ["date", "code", "goal", "title", "fullName", "chan", "owner",
  "sent", "recv", "recvU", "open", "conv", "ctr", "cvr", "revenue", "note"];

/* 시트의 채널 표기를 앱의 채널 코드(아이콘·색)로 옮긴다 */
const CHAN_MATCH = [
  ["앱푸시", "push"], ["웹푸시", "push"], ["푸시", "push"], ["push", "push"],
  ["인앱", "inapp"], ["인웹", "inapp"], ["팝업", "inapp"],
  ["알림톡", "kakao"], ["카카오", "kakao"], ["친구톡", "kakao"],
  ["이메일", "email"], ["메일", "email"], ["email", "email"], ["edm", "email"],
  ["문자", "sms"], ["sms", "sms"], ["lms", "sms"], ["mms", "sms"],
  ["배너", "banner"], ["띠", "banner"]
];
function chanKey(s) {
  const t = String(s || "").toLowerCase();
  for (const [needle, key] of CHAN_MATCH) if (t.indexOf(needle) >= 0) return key;
  return "inapp";
}
/* 시트의 상태(진행·중단)를 앱의 상태 코드로 */
function statusKey(s) {
  const t = String(s || "").trim();
  if (t.indexOf("중단") >= 0 || t.indexOf("종료") >= 0) return "ended";
  if (t.indexOf("테스트") >= 0) return "test";
  if (!t) return "draft";
  return "live";
}
/* 화면 표시명 — 캠페인구분은 채널만 다른 같은 이름이 여럿이라 채널을 뒤에 붙인다 */
function campLabel(m) {
  if (!m) return "";
  const base = (m.title || m.fullName || m.code || "이름 없음").trim();
  const ch = String(m.chan || "").trim();
  return ch ? base + " [" + ch + "]" : base;
}

/* ---------------- 시트에서 읽어 둔 것 ---------------- */
const SHEETS = {
  camps: [],        // 캠페인 마스터 레코드
  byCode: {},
  perf: [],         // 성과 이력 레코드
  at: 0,            // 마지막으로 읽은 시각
  err: null,
  loading: false,
  loaded: false
};
const SHEET_CACHE = "sheets:v1";

const num = v => {
  if (typeof v === "number") return v;
  const n = parseFloat(String(v == null ? "" : v).replace(/[,\s%₩]/g, ""));
  return isFinite(n) ? n : null;
};
const colIndex = letters => {                     // "AB" → 27
  let n = 0;
  for (const ch of String(letters)) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
};

/* 수식을 컬럼명 문장으로 바꾼다 — "=AB2/Y2" → "예약/반응 ÷ 수신".
   다른 시트를 가리키는 참조( '3.개인화RAW'!AB2 )는 건드리지 않는다. */
function formulaToBasis(f) {
  if (typeof f !== "string" || f.charAt(0) !== "=") return "";
  /* 연산자를 먼저 바꾸고 그 다음에 컬럼명을 넣는다 — 순서를 뒤집으면
     "예약/반응" 같은 컬럼명 안의 슬래시까지 나눗셈으로 오인해 쪼개진다. */
  return f.slice(1)
    .replace(/\//g, " ÷ ").replace(/\*/g, " × ")
    .replace(/(!?)\$?([A-Z]{1,2})\$?\d+/g, (m, bang, col) => {
      if (bang) return m;
      const c = SHEET_COLS[colIndex(col)];
      return c ? c.label : m;
    })
    .replace(/\s{2,}/g, " ").trim();
}
/* 셀에 걸린 링크 주소를 찾는다.
   시트에는 글자가 "ALL" 이고 주소는 따로 붙어 있는 경우가 많아 세 군데를 차례로 본다. */
function linkUrlOf(meta, formula, text) {
  if (meta) return meta;
  const m = /^=\s*HYPERLINK\s*\(\s*"([^"]+)"/i.exec(String(formula || ""));
  if (m) return m[1];
  const t = String(text || "").trim();
  return /^(https?:\/\/|www\.)/i.test(t) ? t : "";
}
/* 실적 기준 — 시트에 적어 둔 기준 문구와, 수식에서 역산한 산식을 함께 보여준다 */
function basisOf(m, kind) {
  const written = kind === "ctr" ? m.ctrBasis : m.cvrBasis;
  const derived = kind === "ctr" ? m.ctrFormula : m.cvrFormula;
  const out = [];
  if (written) out.push(String(written).trim());
  if (derived && derived !== written) out.push(derived);
  return out;
}

/* 실적 기준 블록 — 시트에 적어 둔 기준 문구를 크게, 수식에서 역산한 산식을 그 아래 흐리게.
   둘 다 없으면 "미기입"으로 남겨 어느 캠페인이 정의가 비었는지 바로 보이게 한다. */
function basisHtml(m) {
  const row = (kind, label, color) => {
    const written = String((kind === "ctr" ? m.ctrBasis : m.cvrBasis) || "").trim();
    const derived = (kind === "ctr" ? m.ctrFormula : m.cvrFormula) || "";
    if (!written && !derived) return '<div class="brow2 none"><span class="bk" style="--c:' + color + '">' + label +
      '</span><span class="bv">미기입</span></div>';
    return '<div class="brow2"><span class="bk" style="--c:' + color + '">' + label + "</span>" +
      '<span class="bv">' + (written ? '<span class="bmain" title="' + esc(written) + '">' + esc(written) + "</span>" : "") +
        (derived && derived !== written ? '<span class="bsub" title="시트 수식에서 자동으로 풀어 쓴 산식">' + esc(derived) + "</span>" : "") +
      "</span></div>";
  };
  return '<div class="basis2">' + row("ctr", "CTR", "#2f6fed") + row("cvr", "CVR", "#e0483f") + "</div>";
}

/* ---------------- 정규화 ---------------- */
function normCampRows(payload) {
  const rows = (payload && payload.rows) || [], forms = (payload && payload.formulas) || [],
        links = (payload && payload.links) || [];
  const out = [];
  rows.forEach((r, i) => {
    if (!r || !String(r[COL_BY_KEY.code] || "").trim()) return;      // 캠페인코드 없는 줄은 건너뛴다
    const m = { _row: i + 2, _raw: r.slice() };
    SHEET_COLS.forEach((c, ci) => {
      const v = r[ci];
      m[c.key] = c.num ? num(v) : (v == null ? "" : String(v).trim());
    });
    const f = forms[i] || [], lk = links[i] || [];
    m.ctrFormula = formulaToBasis(f[COL_BY_KEY.ctr]);
    m.cvrFormula = formulaToBasis(f[COL_BY_KEY.cvr]);
    m.link1Url = linkUrlOf(lk[0], f[COL_BY_KEY.link1], m.link1);
    m.link2Url = linkUrlOf(lk[1], f[COL_BY_KEY.link2], m.link2);
    m.linkList = [{ label: m.link1 || "링크1", url: m.link1Url }, { label: m.link2 || "링크2", url: m.link2Url }]
      .filter(l => l.url);
    m.chanCode = chanKey(m.chan);
    m.statusCode = statusKey(m.status);
    m.label = campLabel(m);
    out.push(m);
  });
  return out;
}
/* 날짜 → "2026-07". 시트에서 문자열로 오든 일련번호로 오든 받아 준다 */
function ym(v) {
  if (v == null || v === "") return "";
  if (typeof v === "number") {
    const d = new Date(Date.UTC(1899, 11, 30) + v * 86400000);
    return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0");
  }
  const s = String(v).trim();
  const m = /^(\d{4})[-./년\s]*(\d{1,2})/.exec(s);
  return m ? m[1] + "-" + String(m[2]).padStart(2, "0") : "";
}
function normPerfRows(payload) {
  const rows = (payload && payload.rows) || [];
  const out = [];
  rows.forEach(r => {
    if (!r) return;
    const code = String(r[1] || "").trim();
    const month = ym(r[0]);
    if (!code || !month) return;
    const o = { month: month };
    RAW_COLS.forEach((k, i) => {
      const v = r[i];
      o[k] = i >= 7 && i <= 14 ? num(v) : (v == null ? "" : String(v).trim());
    });
    o.code = code;
    o.chanCode = chanKey(o.chan);
    /* CTR·CVR 은 시트에서 계산된 값을 그대로 쓴다. 0~1 로 오면 %로 맞춘다. */
    o.ctrPct = ratePct(o.ctr);
    o.cvrPct = ratePct(o.cvr);
    out.push(o);
  });
  out.sort((a, b) => a.month.localeCompare(b.month));
  return out;
}
function ratePct(v) {
  const n = num(v);
  if (n == null) return null;
  return Math.abs(n) <= 1 ? n * 100 : n;          // 0.056 → 5.6 · 5.6 → 5.6
}

/* ---------------- 불러오기 ---------------- */
async function sheetApi(path, opts) {
  const token = await ensureToken();
  if (!token) throw new Error("로그인이 필요합니다");
  const o = Object.assign({ headers: {} }, opts || {});
  o.headers = Object.assign({ Authorization: "Bearer " + token }, o.headers);
  const r = await fetch("/api/sheets" + path, o);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("시트를 읽지 못했습니다 (" + r.status + ")"));
  return j;
}

function applySheetPayload(j, at) {
  if (j.campaigns) SHEETS.camps = normCampRows(j.campaigns);
  if (j.perf) SHEETS.perf = normPerfRows(j.perf);
  /* 조회 키는 대문자로 통일한다 — 소문자로 친 코드도 같은 캠페인으로 찾아야
     중복 등록을 막고, 여정 지도에 붙은 코드도 대소문자 차이로 끊기지 않는다 */
  SHEETS.byCode = SHEETS.camps.reduce((m, c) => (m[String(c.code).toUpperCase()] = c, m), {});
  SHEETS.at = at || Date.now();
  SHEETS.loaded = true;
}

/* 접속할 때 한 번 읽고, 그 뒤에는 새로고침 버튼으로만 다시 읽는다.
   먼저 브라우저에 남은 마지막 응답으로 화면을 그려 두고 뒤에서 갱신한다. */
async function loadSheets(opt) {
  const o = opt || {};
  if (SHEETS.loading) return;
  if (!supaOn() || !me) { SHEETS.err = "로그인하면 캠페인 시트를 불러옵니다"; renderSyncBars(); return; }
  SHEETS.loading = true; SHEETS.err = null;
  renderSyncBars();
  try {
    const j = await sheetApi("?action=all" + (o.fresh ? "&fresh=1" : ""));
    applySheetPayload(j, Date.now());
    try { await idbSet(SHEET_CACHE, { campaigns: j.campaigns, perf: j.perf, at: SHEETS.at }); } catch (e) {}
    if (o.toast) toast("캠페인 " + SHEETS.camps.length + "건 · 성과 " + SHEETS.perf.length + "행을 시트에서 불러왔습니다", "ok");
  } catch (e) {
    SHEETS.err = (e && e.message) || "시트를 읽지 못했습니다";
    if (o.toast) toast(SHEETS.err, "bad");
  } finally {
    SHEETS.loading = false;
    renderSyncBars();
    invalidateViews();
    renderFlow(); renderPanels();
    renderCampView(true);
    if (typeof renderPerfView === "function") renderPerfView(true);
  }
}
/* 지난번 접속에서 받아 둔 내용 — 시트가 느리거나 막혀 있어도 화면은 비지 않는다 */
async function loadSheetCache() {
  let c = null;
  try { c = await idbGet(SHEET_CACHE); } catch (e) {}
  if (!c || !c.campaigns) return false;
  applySheetPayload(c, c.at);
  return true;
}

function syncAgo() {
  if (!SHEETS.at) return "아직 불러오지 않음";
  return timeAgo(SHEETS.at) + " 기준";
}
function syncBarHtml() {
  if (SHEETS.loading) return '<span class="syncchip">' + ico("loop", "xs") + "시트를 읽는 중…</span>";
  if (SHEETS.err) return '<span class="syncchip bad">' + ico("alert", "xs") + esc(SHEETS.err) +
    (SHEETS.at ? " · " + esc(syncAgo()) + " 자료로 표시 중" : "") + "</span>";
  return '<span class="syncchip">' + ico("check", "xs") + "캠페인 " + SHEETS.camps.length + "건 · " + esc(syncAgo()) + "</span>";
}
function renderSyncBars() {
  $$(".syncbar").forEach(el => { el.innerHTML = syncBarHtml(); });
  $$("[data-sheet-refresh]").forEach(b => { b.disabled = !!SHEETS.loading; });
}

/* ---------------- 마스터 조회 ---------------- */
const campByCode = code => SHEETS.byCode[String(code || "").trim().toUpperCase()] || null;

/* 노드에 붙어 있는 항목 하나를 화면에 그릴 형태로 편다.
   시트 연동 항목은 {id, code} 만 문서에 저장되고, 나머지는 여기서 시트로부터 채운다.
   예전 방식으로 직접 등록해 둔 캠페인은 그대로 통과시킨다(옛 문서 호환). */
function campView(c) {
  if (!c) return null;
  if (!c.code) return c;
  const m = campByCode(c.code);
  if (!m) {
    return {
      id: c.id, code: c.code, missing: true, name: c.code + " · 시트에서 삭제됨",
      chan: "inapp", status: "ended", segment: "", timing: "", extId: c.code,
      landing: "", note: "", links: []
    };
  }
  return {
    id: c.id, code: c.code, missing: false, master: m,
    name: m.label,
    chan: m.chanCode, chanText: m.chan,
    status: m.statusCode,
    segment: m.trigger, timing: m.index,
    extId: m.code, landing: m.path, note: "",     /* 메모는 카드에 띄우지 않는다 — 길고 내부 기록용이다 */
    links: m.linkList || []
  };
}
const campViews = n => (n && n.camps ? n.camps.map(campView).filter(Boolean) : []);
/* 어느 페이지에 붙어 있는지 — 캠페인코드로 전체 보드를 훑는다 */
function placementsOf(code) {
  const out = [];
  state.boards.forEach(b => b.nodes.forEach(n => {
    if ((n.camps || []).some(c => c.code === code)) out.push({ b, n });
  }));
  return out;
}

/* ---------------- 여정 지도에 붙이기 ---------------- */
let pickFilter = { q: "", goal: "all", chan: "all", owner: "all" };

function optionsOf(list, key, cur, allLabel) {
  const names = Array.from(new Set(list.map(x => String(x[key] || "").trim()).filter(Boolean))).sort((a, b) => a.localeCompare(b, "ko"));
  return '<option value="all">' + esc(allLabel) + "</option>" +
    names.map(v => '<option value="' + esc(v) + '"' + (cur === v ? " selected" : "") + ">" + esc(v) + "</option>").join("");
}
function pickRows(n) {
  const has = (n.camps || []).map(c => c.code).filter(Boolean);
  const q = pickFilter.q;
  return SHEETS.camps.filter(m =>
    (pickFilter.goal === "all" || m.goal === pickFilter.goal) &&
    (pickFilter.chan === "all" || m.chan === pickFilter.chan) &&
    (pickFilter.owner === "all" || m.owner === pickFilter.owner) &&
    (!q || (m.code + " " + m.goal + " " + m.title + " " + m.fullName + " " + m.owner).toLowerCase().indexOf(q) >= 0)
  ).map(m => ({ m, on: has.indexOf(m.code) >= 0 }));
}
function pickListHtml(n) {
  const rows = pickRows(n);
  if (!rows.length) return '<div class="empty">' + ico("mega") + "<div>조건에 맞는 캠페인이 없습니다</div></div>";
  return rows.map(({ m, on }) =>
    '<label class="pickrow' + (on ? " on" : "") + '">' +
      '<input type="checkbox" data-pick="' + esc(m.code) + '"' + (on ? " checked" : "") + ">" +
      '<span class="pickmain"><b>' + esc(m.label) + "</b>" +
        '<em>' + esc(m.code) + (m.goal ? " · " + esc(m.goal) : "") + (m.owner ? " · " + esc(m.owner) : "") + "</em>" +
        (m.fullName ? '<span class="pickfull mono">' + esc(m.fullName) + "</span>" : "") + "</span>" +
      '<span class="chip" style="--c:' + CSTATUS_C[m.statusCode] + '">' + esc(m.status || "-") + "</span>" +
    "</label>").join("");
}
function openCampPicker() {

      '<div class="modal-body">' +
        '<div class="toolrow">' +
          '<input class="field" id="pickQ" placeholder="캠페인코드 · 목표 · 캠페인명 · 담당자 검색" style="flex:1; min-width:180px" value="' + esc(pickFilter.q) + '">' +
          '<select class="field" id="pickGoal">' + optionsOf(SHEETS.camps, "goal", pickFilter.goal, "모든 목표") + "</select>" +
          '<select class="field" id="pickChan">' + optionsOf(SHEETS.camps, "chan", pickFilter.chan, "모든 채널") + "</select>" +
          '<select class="field" id="pickOwner">' + optionsOf(SHEETS.camps, "owner", pickFilter.owner, "모든 담당자") + "</select>" +
        "</div>" +
        '<div class="picklist" id="pickList"></div>' +
        '<p class="hint">체크한 캠페인이 이 페이지에 붙습니다. 목록은 구글 시트 <b>1.개인화DB</b> 에 있는 것만 나옵니다 — ' +
          '여기 없는 캠페인은 <b>새 캠페인 등록</b>으로 시트에 먼저 추가하세요.</p>' +

    "</div></div>";

  root.addEventListener("input", e => {

      (n.layers || []).forEach(l => { if (gone.indexOf(l.campId) >= 0) l.campId = null; });

    if (e.target.closest("[data-new]")) { closeModal(); editSheetCamp(null); }
  });
}

/* ---------------- 시트에 캠페인 추가 · 수정 ---------------- */
/* AARRR 구분코드 → 구분명 표는 시트에 이미 쌓인 값에서 뽑는다.
   코드에 박아 두면 시트에서 단계 이름을 바꿨을 때 앱만 옛 이름을 들고 있게 된다. */
function aarrrMap() {
  const tally = {};
  SHEETS.camps.forEach(c => {
    const k = String(c.aarrrCode || "").trim().toUpperCase(), n = String(c.aarrrName || "").trim();
    if (!k || !n) return;
    (tally[k] = tally[k] || {})[n] = (tally[k][n] || 0) + 1;
  });
  const out = {};
  Object.keys(tally).sort().forEach(k => {
    out[k] = Object.keys(tally[k]).sort((a, b) => tally[k][b] - tally[k][a])[0];
  });
  return out;
}
const aarrrLabel = code => {
  const n = aarrrMap()[String(code || "").trim().toUpperCase()];
  return n ? code + " · " + n : String(code || "");
};
/* 같은 구분코드에서 가장 큰 일련번호를 찾아 그 다음 번호를 제안한다.
   A1-002 · R1-101 처럼 세 자리를 쓰고, A2-001-01 같은 꼬리표는 무시한다. */
function nextCampCode(prefix) {
  const p = String(prefix || "").trim().toUpperCase();
  if (!p) return "";
  let max = 0, width = 3;
  SHEETS.camps.forEach(c => {
    const m = new RegExp("^" + p.replace(/[^A-Z0-9]/g, "") + "-(\\d+)").exec(String(c.code || "").trim().toUpperCase());
    if (!m) return;
    width = Math.max(width, m[1].length);
    max = Math.max(max, parseInt(m[1], 10));
  });
  return p + "-" + String(max + 1).padStart(width, "0");
}
/* 시트에 이미 쓰이고 있는 값을 모아 선택지로 만든다 (기본 목록 + 시트 실제 값) */
function optsFrom(key, base) {
  const seen = { "": "-" };
  (base || []).forEach(v => { seen[v] = v; });
  SHEETS.camps.forEach(c => {
    const v = String(c[key] || "").trim();
    if (v) seen[v] = v;
  });
  return seen;
}
const CHAN_OPTS = ["앱푸시", "LMS", "EDM", "인앱", "인웹", "인앱/웹", "알림톡"];
const PROGRESS_OPTS = ["기획", "제작", "검수", "완료", "보류"];
/* O열 API/DB 는 한 칸이라 "API" · "DB" · "API/DB" 로 적힌다. 폼에서는 두 칸으로 나눠 고른다. */
function apidbSplit(v) {
  const t = String(v || "").toUpperCase();
  return { _api: t.indexOf("API") >= 0 ? "Y" : "", _db: t.indexOf("DB") >= 0 ? "Y" : "" };
}
const apidbJoin = (api, db) => [api === "Y" ? "API" : "", db === "Y" ? "DB" : ""].filter(Boolean).join("/");

     지금까지 쌓인 성과 이력과 연결이 끊긴다. 바꿔야 하면 시트에서 직접 고친다. */

    ] },

      { k: "_api", label: "API 사용", type: "select", opts: YN },
      { k: "_db", label: "DB 사용", type: "select", opts: YN }
    ] },
    { type: "group", label: "링크 · 성과측정", fields: [
      { k: "link1", label: "링크1", mono: true, ph: "https://dashboard-05.braze.com/..." },
      { k: "link2", label: "링크2", mono: true, ph: "" },
      { k: "measure", label: "성과측정 여부", type: "select", opts: { "Y": "Y (측정함)", "N": "N (측정 안 함)", "": "미지정" } },
      { k: "measureNote", label: "비고 (성과측정 참고 메모)", type: "textarea" }
    ] },
    { k: "memo", label: "메모", type: "textarea" }
  ];

/* 앱에서 고칠 수 없는 열은 값만 보여 준다 */
function lockedFields(m) {
  if (!m) return [];
  return [{ type: "group", label: "실적 기준 · 수치 (시트에서만 수정)", open: true, fields: [
    { k: "_ctrBasis", label: "CTR 기준", type: "readonly" },
    { k: "_cvrBasis", label: "CVR 기준", type: "readonly" },
    { k: "_nums", label: "시트 집계", type: "readonly" }
  ] }];
}
/* 캠페인코드가 이미 있는지 · 구분코드와 앞자리가 맞는지 그 자리에서 알려 준다 */
function codeCheck(codeVal, prefix, editing) {
  const v = String(codeVal || "").trim().toUpperCase();
  if (!v) return { bad: true, msg: "캠페인코드는 반드시 필요합니다" };
  if (editing && v === String(editing).toUpperCase()) return { bad: false, msg: "" };
  const dup = campByCode(v);
  if (dup) return { bad: true, msg: "이미 있는 캠페인코드입니다 — " + (dup.title || dup.fullName || "") };
  if (prefix && v.indexOf(String(prefix).toUpperCase() + "-") !== 0)
    return { bad: true, msg: "AARRR구분코드가 " + prefix + " 이므로 " + prefix + "- 로 시작해야 합니다" };
  return { bad: false, msg: "쓸 수 있는 코드입니다" };
}

function editSheetCamp(code) {
  if (!isStaff()) return toast("캠페인 등록·수정은 운영자 이상만 할 수 있습니다", "bad");
  const m = code ? campByCode(code) : null;
  if (code && !m) return toast("시트에서 이 캠페인을 찾지 못했습니다. 새로고침해 보세요.", "bad");
  if (!m && !SHEETS.camps.length) return toast("캠페인 목록을 먼저 불러와야 코드를 제안할 수 있습니다", "bad");

  const map = aarrrMap();
  const values = {};
  SHEET_COLS.forEach(c => { values[c.key] = m ? (m[c.key] == null ? "" : m[c.key]) : ""; });
  Object.assign(values, apidbSplit(m ? m.apidb : ""));
  if (!m) {
    const first = Object.keys(map)[0] || "";
    values.status = "진행";
    values.aarrrCode = first;
    values.aarrrName = map[first] || "";
    values.code = nextCampCode(first);
    values.mkt = "개인화";
  }
  values._codeMsg = m
    ? "AARRR 구분과 캠페인코드는 성과 이력을 잇는 열쇠라 여기서 바꿀 수 없습니다. 시트에서 직접 고치세요."
    : "시트의 마지막 번호 다음으로 제안한 코드입니다. 바꿔도 됩니다.";
  if (m) {
    const ctr = basisOf(m, "ctr"), cvr = basisOf(m, "cvr");
    values._ctrBasis = ctr.length ? ctr.join("  ·  ") : "시트에 기준이 적혀 있지 않습니다";
    values._cvrBasis = cvr.length ? cvr.join("  ·  ") : "시트에 기준이 적혀 있지 않습니다";
    values._nums = SHEET_COLS.filter(c => c.num).map(c => {
      const v = m[c.key];
      return c.label + " " + (v == null ? "-" : c.rate ? (Math.abs(v) <= 1 ? v * 100 : v).toFixed(1) + "%" : v.toLocaleString("ko-KR"));
    }).join("  ·  ");
  }

  openForm({
    title: m ? "캠페인 수정 · " + m.code : "새 캠페인 등록",
    icon: "mega",
    okText: m ? "시트에 저장" : "시트에 등록",
    note: "<b>CTR기준·CVR기준과 전달~매출(X~AE)은 로직·수치라 앱에서 고칠 수 없습니다</b> — 시트에서 직접 수정하세요. " +
      "앱에서는 삭제할 수 없습니다. 그만 쓰는 캠페인은 상태를 <b>중단</b>으로 바꾸세요." +
      (m ? "" : "<br>새로 등록하면 실적 열의 수식은 바로 윗줄에서 복사됩니다. CTR기준·CVR기준은 시트에서 채워 주세요."),
    warn: "이 캠페인 항목은 구글 시트 데이터와 연동됩니다. 여기서 수정하면 <b>구글 시트의 데이터도 함께 변경</b>됩니다.",
    fields: sheetFormFields(!!m).concat(lockedFields(m)),
    values: values,
    /* 구분코드를 고르면 구분명과 캠페인코드를 따라 바꾸고, 코드는 칠 때마다 중복을 확인한다 */
    onChange: (k, v, root) => {
      if (m) return;                            /* 수정 중에는 코드·구분이 잠겨 있다 */
      const codeEl = $('[data-k="code"]', root);
      const prefEl = $('[data-k="aarrrCode"]', root);
      if (k === "aarrrCode") {
        const nameEl = $('[data-k="aarrrName"]', root);
        if (nameEl) nameEl.textContent = map[v] || "-";
        if (!m) codeEl.value = nextCampCode(v);
      }
      if (k === "aarrrCode" || k === "code") {
        const r = codeCheck(codeEl.value, prefEl ? prefEl.value : "", m ? m.code : null);
        const msg = $('[data-note="_codeMsg"]', root);
        if (msg) { msg.textContent = r.msg; msg.className = "fnote " + (r.bad ? "bad" : "ok"); }
        codeEl.classList.toggle("invalid", r.bad);
      }
    },
    onSave: async v => {
      const newCode = String(v.code || "").trim();
      const r = codeCheck(newCode, v.aarrrCode, m ? m.code : null);
      if (r.bad) return toast(r.msg, "bad");
      if (m && newCode.toUpperCase() !== String(m.code).toUpperCase())
        return toast("캠페인코드는 바꿀 수 없습니다. 시트에서 직접 고쳐 주세요.", "bad");
      v.code = m ? m.code : newCode;         /* 시트에는 친 그대로 적는다 */
      if (m) { v.aarrrCode = m.aarrrCode; v.aarrrName = m.aarrrName; }
      else v.aarrrName = map[v.aarrrCode] || v.aarrrName || "";
      v.apidb = apidbJoin(v._api, v._db);
      const row = [];
      SHEET_COLS.forEach((c, i) => { row[i] = c.edit ? (v[c.key] == null ? "" : String(v[c.key])) : ""; });
      toast(m ? "시트에 저장하는 중…" : "시트에 등록하는 중…");
      try {
        await sheetApi("", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "upsert", code: v.code, values: row })
        });
        await loadSheets({ fresh: true });
        toast(m ? "시트에 저장했습니다" : "시트에 등록했습니다 · " + v.code, "ok");
      } catch (e) {
        toast("시트에 쓰지 못했습니다: " + ((e && e.message) || "알 수 없는 오류"), "bad");
      }
    }
  });
}

/* ---------------- 초기화 ---------------- */
function initSheets() {
  document.addEventListener("click", e => {
    const r = e.target.closest("[data-sheet-refresh]");
    if (r) { if (!isStaff()) return toast("새로고침은 운영자 이상만 할 수 있습니다", "bad"); loadSheets({ fresh: true, toast: true }); }
    const ed = e.target.closest("[data-sheet-edit]");
    if (ed) editSheetCamp(ed.dataset.sheetEdit);
  });
}
/* 접속 직후 — 캐시로 먼저 그리고 시트를 다시 읽는다 */
async function bootSheets() {
  const had = await loadSheetCache();
  if (had) { renderSyncBars(); invalidateViews(); renderFlow(); renderPanels(); }
  await loadSheets({});
}

/* ========================================================================
   성과 추이 — 구글 시트 3.개인화RAW 를 월 단위로 집계해 보여 준다.

   가로축은 월, 세로축은 성과. CTR 은 곡선(왼쪽 축), CVR 은 세로 막대(오른쪽 축)로
   같은 차트에 겹쳐 그린다 — CVR 이 CTR 보다 훨씬 작아 축을 나누지 않으면 바닥에 붙는다.
   ======================================================================== */
const PERF_C = ["#2f6fed", "#e0483f", "#12a97a", "#8b5cf6", "#e08a1e", "#0ea5b7"];
const perfFilter = { q: "", goal: "all", chan: "all", owner: "all", seg: "all" };
let perfPicked = [];                          // 차트에 그릴 캠페인코드 (최대 6개)
const perfPeriod = { from: null, to: null };  // 집계 기간 — 직접 고른다
let perfShowLabels = true;                    // 각 점·막대에 값을 적을지

const pct1 = v => (v == null ? "-" : v.toFixed(1) + "%");
const kNum = v => (v == null ? "-" : Math.round(v).toLocaleString("ko-KR"));

/* ---------------- 집계 ---------------- */
/* 같은 캠페인·같은 달에 여러 줄이 있으면 횟수는 더하고, 비율은 수신 수로 가중평균한다 */
function perfByCampMonth() {
  const map = {};
  SHEETS.perf.forEach(r => {
    const k = r.code + "|" + r.month;
    const b = map[k] || (map[k] = {
      code: r.code, month: r.month, goal: r.goal, title: r.title, fullName: r.fullName,
      chan: r.chan, chanCode: r.chanCode, owner: r.owner,
      sent: 0, recv: 0, recvU: 0, open: 0, conv: 0, revenue: 0, _w: 0, _ctr: 0, _cvr: 0
    });
    ["sent", "recv", "recvU", "open", "conv", "revenue"].forEach(k2 => { b[k2] += r[k2] || 0; });
    const w = r.recv || r.sent || 1;
    b._w += w;
    if (r.ctrPct != null) b._ctr += r.ctrPct * w;
    if (r.cvrPct != null) b._cvr += r.cvrPct * w;
  });
  return Object.values(map).map(b => {
    b.ctr = b._w ? b._ctr / b._w : null;
    b.cvr = b._w ? b._cvr / b._w : null;
    return b;
  });
}
let perfCache = null;
function perfRows() {
  if (!perfCache || perfCache.at !== SHEETS.at) perfCache = { at: SHEETS.at, rows: perfByCampMonth() };
  return perfCache.rows;
}
const perfMonths = () => Array.from(new Set(perfRows().map(r => r.month))).sort();

/* 캠페인 하나의 월별 이력 (오래된 달 → 최근 달).
   여정 지도·점검처럼 캠페인 수만큼 반복해 부르는 곳이 있어 색인을 한 번만 만들어 둔다. */
let histCache = null;
function perfHistory(code) {
  if (!histCache || histCache.at !== SHEETS.at) {
    const by = {};
    perfRows().forEach(r => { (by[r.code] = by[r.code] || []).push(r); });
    Object.keys(by).forEach(k => by[k].sort((a, b) => a.month.localeCompare(b.month)));
    histCache = { at: SHEETS.at, by: by };
  }
  return histCache.by[code] || [];
}
/* 비율의 분모를 되돌려 구한다 — 캠페인마다 CTR·CVR 의 분모가 달라서
   시트가 준 비율과 분자로부터 역산하는 편이 정확하다. 안 되면 수신 수로 대신한다. */
function denomOf(count, pct, fallback) {
  if (count != null && pct) {
    const d = count / (pct / 100);
    if (isFinite(d) && d >= 1) return Math.round(d);
  }
  return fallback || null;
}
/* 두 달의 비율 차이가 표본 수를 감안해도 의미가 있는지 (이항 비율 z-검정).
   수신 5만 건의 0.4%p 와 수신 71건의 0.4%p 는 전혀 다른 이야기다. */
function ratioZ(p1, n1, p2, n2) {
  if (p1 == null || p2 == null || !n1 || !n2) return null;
  const a = p1 / 100, b = p2 / 100;
  const pool = (a * n1 + b * n2) / (n1 + n2);
  const se = Math.sqrt(pool * (1 - pool) * (1 / n1 + 1 / n2));
  if (!se || !isFinite(se)) return null;
  return (a - b) / se;
}
const SIG_Z = 1.96;                        // 95% 신뢰수준
function monthZ(cur, prev, kind) {
  if (!cur || !prev) return null;
  const k = kind === "ctr" ? "open" : "conv";
  return ratioZ(cur[kind], denomOf(cur[k], cur[kind], cur.recv),
                prev[kind], denomOf(prev[k], prev[kind], prev.recv));
}
/* 가장 최근 달과 그 직전 달 — 여정 지도 배지에 쓴다 */
function perfLatest(code) {
  const h = perfHistory(code);
  if (!h.length) return null;
  const cur = h[h.length - 1], prev = h[h.length - 2] || null;
  const zc = monthZ(cur, prev, "ctr"), zv = monthZ(cur, prev, "cvr");
  return {
    month: cur.month, ctr: cur.ctr, cvr: cur.cvr, prevMonth: prev ? prev.month : null,
    dCtr: prev && cur.ctr != null && prev.ctr != null ? cur.ctr - prev.ctr : null,
    dCvr: prev && cur.cvr != null && prev.cvr != null ? cur.cvr - prev.cvr : null,
    sigCtr: zc != null && Math.abs(zc) >= SIG_Z,
    sigCvr: zv != null && Math.abs(zv) >= SIG_Z
  };
}
/* 급락 감지 — 최신월이 직전 3개월 평균보다 30% 이상 낮고, 그 차이가 통계적으로도 유의할 때 */
const DROP_RATE = 0.3;
function perfAlerts() {
  const out = [];
  perfCampIndex().forEach(b => {
    const h = perfHistory(b.code);
    if (h.length < 2) return;                          // 비교할 직전 달이 최소 하나는 있어야 한다
    const cur = h[h.length - 1], base = h.slice(Math.max(0, h.length - 4), h.length - 1);
    ["ctr", "cvr"].forEach(kind => {
      const vals = base.map(r => r[kind]).filter(v => v != null);
      if (!vals.length || cur[kind] == null) return;
      const avg = vals.reduce((a, v) => a + v, 0) / vals.length;
      if (!avg || cur[kind] >= avg * (1 - DROP_RATE)) return;
      const z = monthZ(cur, base[base.length - 1], kind);
      if (z == null || Math.abs(z) < SIG_Z) return;      // 표본이 적어 흔들린 것은 거른다
      out.push({ code: b.code, label: b.label, kind: kind, month: cur.month,
        cur: cur[kind], base: avg, drop: (avg - cur[kind]) / avg });
    });
  });
  return out.sort((a, b) => b.drop - a.drop);
}
/* 캠페인 이름 옆에 붙는 최신월 실적 배지 — CTR 파랑 · CVR 빨강.
   mode "line" 은 여정 지도 노드 카드용으로, 라벨 없이 한 줄로 줄여 캠페인 이름과 같은 크기로 나온다.
   달마다 마지막 데이터가 있는 달이 다르므로 어느 달 실적인지 앞에 적는다. */
function perfBadge(code, mode) {
  const p = code ? perfLatest(code) : null;
  if (!p) return "";
  /* 화살표는 통계적으로 의미 있는 변화만 진하게 — 표본이 적어 흔들린 값은 흐리게 둔다 */
  const arrow = (d, sig) => (d == null || Math.abs(d) < 0.05 ? "" :
    '<i class="' + (d > 0 ? "up" : "dn") + (sig ? " sig" : "") + '">' + (d > 0 ? "▲" : "▼") + Math.abs(d).toFixed(1) + "</i>");
  const short = p.month.slice(2).replace("-", "");                 // 2026-07 → 2607
  const tip = p.month + " 실적 · 앞이 CTR, 뒤가 CVR" +
    (p.prevMonth ? " · " + p.prevMonth + " 대비 증감 (진한 화살표 = 표본을 감안해도 의미 있는 변화)" : "");
  if (mode === "line") {
    return '<span class="perfline" title="' + esc(tip) + '">' +
      '<span class="ctr">' + pct1(p.ctr) + arrow(p.dCtr, p.sigCtr) + "</span>" +
      '<span class="sep">/</span><span class="cvr">' + pct1(p.cvr) + arrow(p.dCvr, p.sigCvr) + "</span>" +
      '<span class="mon">(' + esc(short) + ")</span></span>";
  }
  return '<span class="perfbadge' + (mode === "sm" ? " sm" : "") + '" title="' + esc(tip) + '">' +
    '<span class="pb ctr">CTR ' + pct1(p.ctr) + arrow(p.dCtr, p.sigCtr) + "</span>" +
    '<span class="pb cvr">CVR ' + pct1(p.cvr) + arrow(p.dCvr, p.sigCvr) + "</span>" +
    '<span class="pb mon">' + esc(short) + "</span>" +
  "</span>";
}

/* ---------------- AARRR 단계 요약 ----------------
   목표별로 흩어져 있는 캠페인을 획득·활성화·유지·매출 같은 단계로 묶어
   "우리 CRM 이 어느 단계에 몰려 있고 어디가 비어 있는가"를 한 줄로 보여 준다. */
function perfFunnel(fromM, toM) {
  const bucket = {};
  perfRows().forEach(r => {
    if (fromM && r.month < fromM) return;
    if (toM && r.month > toM) return;
    const m = campByCode(r.code);
    const key = (m && String(m.aarrrCode || "").trim().toUpperCase()) || "기타";
    const b = bucket[key] || (bucket[key] = {
      code: key, name: (m && m.aarrrName) || "구분 없음",
      codes: {}, recv: 0, conv: 0, revenue: 0, _w: 0, _ctr: 0, _cvr: 0
    });
    b.codes[r.code] = 1;
    b.recv += r.recv || 0; b.conv += r.conv || 0; b.revenue += r.revenue || 0;
    const w = r.recv || r.sent || 0;
    if (w) { b._w += w; if (r.ctr != null) b._ctr += r.ctr * w; if (r.cvr != null) b._cvr += r.cvr * w; }
  });
  return Object.keys(bucket).sort().map(k => {
    const b = bucket[k];
    b.count = Object.keys(b.codes).length;
    b.ctr = b._w ? b._ctr / b._w : null;
    b.cvr = b._w ? b._cvr / b._w : null;
    return b;
  });
}
function perfFunnelHtml(fromM, toM) {
  const rows = perfFunnel(fromM, toM);
  if (!rows.length) return "";
  const maxRev = Math.max.apply(null, rows.map(r => r.revenue).concat(1));
  return '<div class="funnel">' + rows.map(r =>
    '<div class="fcell" style="--fill:' + Math.round((r.revenue / maxRev) * 100) + '%">' +
      '<div class="fk">' + esc(r.code) + '<em>' + esc(r.name) + "</em></div>" +
      '<div class="fv"><b>' + kNum(r.revenue) + "</b><span>매출</span></div>" +
      '<div class="fm">캠페인 ' + r.count + " · 수신 " + kNum(r.recv) + " · 전환 " + kNum(r.conv) + "</div>" +
      '<div class="fm"><span style="color:#2f6fed">CTR ' + pct1(r.ctr) + '</span> · <span style="color:#e0483f">CVR ' + pct1(r.cvr) + "</span></div>" +
    "</div>").join("") + "</div>";
}

/* ---------------- 차트 ---------------- */
/* 점들을 부드러운 곡선으로 잇는다 (Catmull-Rom → 3차 베지어).
   연결선용 smoothPath() 와 이름이 겹치면 안 된다 — 조각들이 한 스크립트로 합쳐지므로
   같은 이름이면 나중 것이 앞의 것을 덮어써 여정 지도의 곡선이 깨진다. */
function chartCurve(pts) {
  if (!pts.length) return "";
  if (pts.length < 3) return "M" + pts.map(p => p[0] + " " + p[1]).join(" L");
  let d = "M" + pts[0][0] + " " + pts[0][1];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += " C" + c1x + " " + c1y + " " + c2x + " " + c2y + " " + p2[0] + " " + p2[1];
  }
  return d;
}
/* 축 위쪽 끝을 실제 값에 맞춰 자동으로 잡는다 (1 · 2 · 2.5 · 5 · 10 단위) */
function niceMax(v) {
  if (!v || v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const s = v / mag;
  return (s <= 1 ? 1 : s <= 2 ? 2 : s <= 2.5 ? 2.5 : s <= 5 ? 5 : 10) * mag;
}
/* 그릴 달을 추린다.
   1) 고른 캠페인 모두 값이 없는 달은 뺀다
   2) 구간 앞뒤로 값이 0인 달도 뺀다 — 시작 전·종료 후 구간이 그래프를 납작하게 만든다 */
function trimMonths(series, months) {
  const has = i => series.some(s => s.ctr[i] != null || s.cvr[i] != null);
  const nonZero = i => series.some(s => (s.ctr[i] || 0) > 0 || (s.cvr[i] || 0) > 0);
  let a = 0, b = months.length - 1;
  while (a <= b && (!has(a) || !nonZero(a))) a++;
  while (b >= a && (!has(b) || !nonZero(b))) b--;
  const out = [];
  for (let i = a; i <= b; i++) if (has(i)) out.push(i);
  return out;
}
const GEO = { W: 880, H: 176, L: 46, R: 46, T: 22, B: 30 };
let chartCtx = null;                       // 마우스 오버 값 표시가 참조할 마지막 렌더 정보

function perfChartSvg(series, months) {
  const W = GEO.W, H = GEO.H, L = GEO.L, R = GEO.R, T = GEO.T;
  const iw = W - L - R, ih = H - T - GEO.B;
  chartCtx = null;
  if (!months.length || !series.length)
    return '<div class="empty">' + ico("chart") + "<div>왼쪽 목록에서 캠페인을 고르면 추이가 그려집니다</div></div>";

  const flat = k => series.reduce((a, s) => a.concat(s[k].filter(v => v != null)), []);
  const cv = flat("ctr"), vv = flat("cvr");
  /* CTR(곡선)은 값들이 0에서 멀면 축 아래쪽을 잘라 낸다 — 낮은 그래프에서 등락이 눌리지 않게.
     CVR(막대)은 길이가 곧 크기라서 언제나 0에서 시작한다. */
  const ctrHi = cv.length ? Math.max.apply(null, cv) : 1;
  const ctrLo = cv.length ? Math.min.apply(null, cv) : 0;
  const ctrMax = niceMax(ctrHi + (ctrHi - ctrLo) * 0.15 || ctrHi);
  const ctrMin = ctrLo > ctrMax * 0.45 ? Math.max(0, Math.floor((ctrLo - (ctrHi - ctrLo) * 0.3) * 10) / 10) : 0;
  const cvrMax = niceMax(vv.length ? Math.max.apply(null, vv) : 1);
  const step = iw / months.length;
  const cx = i => L + step * (i + 0.5);
  const yCtr = v => T + ih - ((v - ctrMin) / (ctrMax - ctrMin || 1)) * ih;
  const yCvr = v => T + ih - (v / cvrMax) * ih;
  const dec = m => (m < 5 ? 1 : 0);
  const showLabels = perfShowLabels && series.length <= 3;   // 넷 이상이면 겹쳐서 못 읽는다

  const grid = [0, 0.5, 1].map(f => {
    const y = T + ih - f * ih;
    return '<line class="gl" x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '"/>' +
      '<text class="ax l" x="' + (L - 6) + '" y="' + (y + 3) + '">' + (ctrMin + (ctrMax - ctrMin) * f).toFixed(dec(ctrMax)) + "%</text>" +
      '<text class="ax r" x="' + (W - R + 6) + '" y="' + (y + 3) + '">' + (cvrMax * f).toFixed(dec(cvrMax)) + "%</text>";
  }).join("");
  /* 달이 많으면 글자가 서로 겹치므로 몇 칸씩 건너뛴다.
     맨 마지막 달은 반드시 남기고 거기서부터 거꾸로 세어 나간다. */
  const every = Math.max(1, Math.ceil(30 / step));
  const xlab = months.map((m, i) =>
    ((months.length - 1 - i) % every === 0
      ? '<text class="ax c" x="' + cx(i) + '" y="' + (T + ih + 16) + '">' + esc(m.slice(2)) + "</text>"
      : "")).join("");

  /* CVR — 달마다 시리즈 수만큼 나란히 세운 막대 */
  const bw = Math.max(3, Math.min(13, (step * 0.5) / series.length));
  const bars = series.map((s, si) => s.cvr.map((v, i) => {
    if (v == null) return "";
    const x = cx(i) - (series.length * bw) / 2 + si * bw;
    const y = yCvr(v), h = Math.max(1, T + ih - y);
    return '<rect class="bar" x="' + x + '" y="' + y + '" width="' + (bw - 1.2) + '" height="' + h + '" fill="' + s.color + '" opacity=".32"/>' +
      (showLabels ? '<text class="vlab" x="' + (x + (bw - 1.2) / 2) + '" y="' + (y - 3) + '" fill="' + s.color + '">' + v.toFixed(1) + "</text>" : "");
  }).join("")).join("");

  /* CTR — 부드러운 곡선 */
  const lines = series.map(s => {
    const pts = [];
    s.ctr.forEach((v, i) => { if (v != null) pts.push([cx(i), yCtr(v), v]); });
    if (!pts.length) return "";
    return '<path class="ln" d="' + chartCurve(pts.map(p => [p[0], p[1]])) + '" stroke="' + s.color + '"/>' +
      pts.map(p => '<circle class="dot" cx="' + p[0] + '" cy="' + p[1] + '" r="2.6" fill="' + s.color + '"/>' +
        (showLabels ? '<text class="vlab" x="' + p[0] + '" y="' + (p[1] - 7) + '" fill="' + s.color + '">' + p[2].toFixed(1) + "%</text>" : "")).join("");
  }).join("");

  /* 달마다 투명한 판을 깔아 마우스를 올리면 그 달의 정확한 값을 띄운다 */
  const hits = months.map((m, i) =>
    '<rect class="hit" data-mi="' + i + '" x="' + (L + step * i) + '" y="' + T + '" width="' + step + '" height="' + ih + '"/>').join("");

  chartCtx = { series: series, months: months, W: W, L: L, step: step };

  return '<div class="chartwrap"><svg class="perfchart" id="perfSvg" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMid meet">' +
      grid + xlab + bars + lines +
      '<line class="vline" id="perfGuide" x1="0" y1="' + T + '" x2="0" y2="' + (T + ih) + '" style="display:none"/>' + hits +
      '<text class="ax cap l" x="' + L + '" y="' + (T - 7) + '">CTR 곡선 · 왼쪽 축' + (ctrMin > 0 ? " (0부터가 아님)" : "") + "</text>" +
      '<text class="ax cap r" x="' + (W - R) + '" y="' + (T - 7) + '">CVR 막대 · 오른쪽 축</text>' +
    "</svg>" +
    '<div class="chart-tip" id="perfTip"></div>' +
    '<div class="legend">' + series.map(s =>
      '<span class="lg"><i style="background:' + s.color + '"></i>' + esc(s.label) + "</span>").join("") + "</div></div>";
}

/* ---------------- 목록 ---------------- */
let perfIndexCache = null;
function perfCampIndex() {
  if (perfIndexCache && perfIndexCache.at === SHEETS.at) return perfIndexCache.list;
  const byCode = {};
  perfRows().forEach(r => {
    const m = campByCode(r.code);
    const b = byCode[r.code] || (byCode[r.code] = {
      code: r.code,
      label: m ? m.label : (r.title ? r.title + (r.chan ? " [" + r.chan + "]" : "") : r.code),
      fullName: m ? m.fullName : r.fullName,
      goal: (m && m.goal) || r.goal || "미분류",
      seg: (m && m.title) || r.title || "미분류",      // 캠페인구분 — 각 줄의 이름이 된다
      aarrrCode: (m && String(m.aarrrCode || "").trim().toUpperCase()) || "",
      aarrrName: (m && m.aarrrName) || "",
      chan: (m && m.chan) || r.chan || "",
      owner: (m && m.owner) || r.owner || "",
      months: 0, last: "", inSheet: !!m
    });
    b.months++;
    if (r.month > b.last) b.last = r.month;          // 마지막으로 성과가 쌓인 달
  });
  /* 목록은 AARRR 단계 순서(A1 · A2 · R1 …)로 묶고,
     같은 단계 안에서는 최근에 데이터가 쌓인 캠페인을 위로 올린다 —
     한동안 돌리지 않은 캠페인은 자연히 아래로 내려간다.
     구분코드가 없는 것(마스터에 없는 코드)은 맨 뒤로 보낸다. */
  const list = Object.values(byCode).sort((a, b) =>
    (a.aarrrCode || "ZZ").localeCompare(b.aarrrCode || "ZZ") ||
    b.last.localeCompare(a.last) ||
    a.code.localeCompare(b.code));
  perfIndexCache = { at: SHEETS.at, list: list };
  return list;
}
function perfCampList() {
  const q = perfFilter.q;
  return perfCampIndex().filter(b =>
    (perfFilter.goal === "all" || b.goal === perfFilter.goal) &&
    (perfFilter.chan === "all" || b.chan === perfFilter.chan) &&
    (perfFilter.owner === "all" || b.owner === perfFilter.owner) &&
    (perfFilter.seg === "all" || b.seg === perfFilter.seg) &&
    (!q || (b.code + " " + b.goal + " " + b.label + " " + b.fullName + " " + b.owner).toLowerCase().indexOf(q) >= 0)
  );
}
function perfSeriesFor(codes, months) {
  return codes.map((code, i) => {
    const h = perfHistory(code);
    const at = m => h.find(x => x.month === m) || null;
    const m0 = campByCode(code);
    return {
      code: code,
      label: m0 ? m0.label : ((h[0] && h[0].title) || code),
      color: PERF_C[i % PERF_C.length],
      rows: months.map(at),
      ctr: months.map(m => { const r = at(m); return r ? r.ctr : null; }),
      cvr: months.map(m => { const r = at(m); return r ? r.cvr : null; })
    };
  });
}
function monthOptions(all, cur) {
  return all.map(m => '<option value="' + esc(m) + '"' + (cur === m ? " selected" : "") + ">" + esc(m) + "</option>").join("");
}

/* ---------------- 뷰 ---------------- */
function renderPerfView(force) {
  if (!force && !viewStale.perf) return;
  viewStale.perf = false;
  const wrap = $("#view-perf");
  if (!wrap) return;
  $(".syncbar", wrap).innerHTML = syncBarHtml();

  const all = perfRows();
  const list = perfCampList();
  const codes = list.map(b => b.code);
  perfPicked = perfPicked.filter(c => codes.indexOf(c) >= 0);
  if (!perfPicked.length && codes.length) perfPicked = codes.slice(0, 1);

  const opts = (key, cur, label) => {
    const names = Array.from(new Set(perfCampIndex().map(x => String(x[key] || "").trim()).filter(Boolean)));
    return '<option value="all">' + esc(label) + "</option>" +
      names.sort((a, b) => a.localeCompare(b, "ko")).map(v => '<option value="' + esc(v) + '"' + (cur === v ? " selected" : "") + ">" + esc(v) + "</option>").join("");
  };
  $("#perfGoal").innerHTML = opts("goal", perfFilter.goal, "모든 목표");
  $("#perfChan").innerHTML = opts("chan", perfFilter.chan, "모든 채널");
  $("#perfOwner").innerHTML = opts("owner", perfFilter.owner, "모든 담당자");
  $("#perfSeg").innerHTML = opts("seg", perfFilter.seg, "모든 캠페인구분");

  /* 집계 기간 — 데이터가 있는 달 안에서 고른다 */
  const allMonths = perfMonths();
  if (allMonths.length) {
    if (!perfPeriod.from || allMonths.indexOf(perfPeriod.from) < 0) perfPeriod.from = allMonths[0];
    if (!perfPeriod.to || allMonths.indexOf(perfPeriod.to) < 0) perfPeriod.to = allMonths[allMonths.length - 1];
    if (perfPeriod.from > perfPeriod.to) perfPeriod.from = perfPeriod.to;
  }
  $("#perfFrom").innerHTML = monthOptions(allMonths, perfPeriod.from);
  $("#perfTo").innerHTML = monthOptions(allMonths, perfPeriod.to);
  $("#perfLabels").checked = perfShowLabels;

  const inRange = allMonths.filter(m => m >= perfPeriod.from && m <= perfPeriod.to);
  const last = inRange[inRange.length - 1];
  const lastRows = all.filter(r => r.month === last);
  const wAvg = key => {
    let w = 0, s = 0;
    lastRows.forEach(r => { const q = r.recv || r.sent || 0; if (r[key] != null && q) { w += q; s += r[key] * q; } });
    return w ? s / w : null;
  };
  $("#perfStats").innerHTML = [
    '<div class="stat" style="--c:var(--accent)"><span class="n">' + (inRange.length ? esc(inRange[0]) + " ~ " + esc(last) : "-") + '</span><span class="t">집계 기간</span></div>',
    '<div class="stat" style="--c:var(--camp)"><span class="n">' + codes.length + '</span><span class="t">캠페인</span></div>',
    '<div class="stat" style="--c:#2f6fed"><span class="n">' + pct1(wAvg("ctr")) + '</span><span class="t">' + esc(last || "-") + ' 평균 CTR</span></div>',
    '<div class="stat" style="--c:#e0483f"><span class="n">' + pct1(wAvg("cvr")) + '</span><span class="t">' + esc(last || "-") + ' 평균 CVR</span></div>'
  ].join("");

  /* AARRR 단계로 묶은 목록 — 성과 수치는 오른쪽 차트·표에서 본다 */
  let html = "", grp = null;
  const lastAll = perfMonths()[perfMonths().length - 1] || "";
  list.forEach(b => {
    const key = b.aarrrCode || "기타";
    if (key !== grp) {
      grp = key;
      html += '<div class="perfgroup">' + esc(key) +
        (b.aarrrName ? ' <em>' + esc(b.aarrrName) + "</em>" : "") + "</div>";
    }
    const on = perfPicked.indexOf(b.code) >= 0;
    const stale = lastAll && b.last && b.last < lastAll;
    html += '<label class="pickrow' + (on ? " on" : "") + (stale ? " stale" : "") + '">' +
      '<input type="checkbox" data-perf-pick="' + esc(b.code) + '"' + (on ? " checked" : "") + ">" +
      '<span class="pickmain"><b>' + esc(b.label) + "</b>" +
        "<em>" + esc(b.code) + " · " + esc(b.last) + "까지 " + b.months + "개월" +
        (b.owner ? " · " + esc(b.owner) : "") +
        (b.inSheet ? "" : ' · <span style="color:var(--warn)">마스터에 없음</span>') + "</em></span></label>";
  });
  $("#perfList").innerHTML = html || '<div class="empty">' + ico("mega") + "<div>조건에 맞는 캠페인이 없습니다</div></div>";

  /* 값이 없는 달과 앞뒤 0 구간을 걷어낸 뒤에 그린다 */
  const full = perfSeriesFor(perfPicked, inRange);
  const keep = trimMonths(full, inRange);
  const months = keep.map(i => inRange[i]);
  const series = full.map(s => Object.assign({}, s, {
    ctr: keep.map(i => s.ctr[i]), cvr: keep.map(i => s.cvr[i]), rows: keep.map(i => s.rows[i])
  }));
  $("#perfFunnel").innerHTML = perfFunnelHtml(perfPeriod.from, perfPeriod.to);
  $("#perfChart").innerHTML = perfChartSvg(series, months);

  /* 표에서도 값이 통째로 비었거나 전부 0인 달은 뺀다 — 그래프에서 걷어낸 것과 같은 기준 */
  const hasValue = r => ["sent", "recv", "recvU", "open", "conv", "revenue", "ctr", "cvr"]
    .some(k => r[k] != null && r[k] !== 0);
  const picked = perfPicked
    .map(c => ({ code: c, h: perfHistory(c).filter(r => r.month >= perfPeriod.from && r.month <= perfPeriod.to && hasValue(r)) }))
    .filter(x => x.h.length);
  $("#perfTable").innerHTML = picked.length
    ? '<table class="ptable"><thead><tr><th>캠페인</th><th>월</th><th class="r">전달</th><th class="r">수신</th>' +
      '<th class="r">오픈</th><th class="r">예약/반응</th><th class="r">CTR</th><th class="r">CVR</th><th class="r">매출</th></tr></thead><tbody>' +
      picked.map(p => {
        const m0 = campByCode(p.code);
        return p.h.slice().reverse().map((r, i) =>
          "<tr>" + (i === 0 ? '<td rowspan="' + p.h.length + '">' + esc(m0 ? m0.label : p.code) + '<em class="mono">' + esc(p.code) + "</em></td>" : "") +
            "<td>" + esc(r.month) + '</td><td class="r">' + kNum(r.sent) + '</td><td class="r">' + kNum(r.recv) +
            '</td><td class="r">' + kNum(r.open) + '</td><td class="r">' + kNum(r.conv) +
            '</td><td class="r b" style="color:#2f6fed">' + pct1(r.ctr) + '</td><td class="r b" style="color:#e0483f">' + pct1(r.cvr) +
            '</td><td class="r">' + kNum(r.revenue) + "</td></tr>").join("");
      }).join("") + "</tbody></table>"
    : "";

  /* 실적 기준 — 이 캠페인의 CTR·CVR 이 무엇을 무엇으로 나눈 값인지 */
  $("#perfBasis").innerHTML = perfPicked.map((code, i) => {
    const m = campByCode(code);
    if (!m) return "";
    return '<div class="basiscard" style="border-left:3px solid ' + PERF_C[i % PERF_C.length] + '">' +
      "<h4>" + esc(m.label) + "</h4>" + basisHtml(m) + "</div>";
  }).join("");
}

/* ---------------- 마우스를 올리면 그 달의 정확한 값 ---------------- */
function perfTipMove(e) {
  const svg = $("#perfSvg"), tip = $("#perfTip"), guide = $("#perfGuide");
  if (!svg || !tip || !chartCtx) return;
  const r = svg.getBoundingClientRect();
  if (!r.width) return;
  const x = ((e.clientX - r.left) / r.width) * chartCtx.W;
  const i = Math.floor((x - chartCtx.L) / chartCtx.step);
  if (i < 0 || i >= chartCtx.months.length) return perfTipOut();
  const gx = chartCtx.L + chartCtx.step * (i + 0.5);
  guide.setAttribute("x1", gx); guide.setAttribute("x2", gx); guide.style.display = "";
  tip.innerHTML = "<b>" + esc(chartCtx.months[i]) + "</b>" +
    chartCtx.series.map(s => {
      const row = s.rows[i];
      return '<div class="tr"><i style="background:' + s.color + '"></i><span>' + esc(s.label) + "</span></div>" +
        '<div class="tr" style="padding-left:14px; color:var(--ink-3)">CTR <b style="color:#2f6fed">' + pct1(s.ctr[i]) +
          '</b> · CVR <b style="color:#e0483f">' + pct1(s.cvr[i]) + "</b>" +
          (row ? " · 수신 <b>" + kNum(row.recv) + "</b>" : "") + "</div>";
    }).join("");
  const box = svg.parentNode.getBoundingClientRect();
  tip.style.display = "block";
  const px = e.clientX - box.left, py = e.clientY - box.top;
  tip.style.left = Math.max(4, Math.min(px + 14, box.width - tip.offsetWidth - 8)) + "px";
  tip.style.top = Math.max(4, py - tip.offsetHeight - 10) + "px";
}
function perfTipOut() {
  const tip = $("#perfTip"), guide = $("#perfGuide");
  if (tip) tip.style.display = "none";
  if (guide) guide.style.display = "none";
}

function initPerfView() {
  const wrap = $("#view-perf");
  if (!wrap) return;
  ["perfGoal", "perfChan", "perfOwner", "perfSeg"].forEach(id => {

  $("#perfLabels").addEventListener("change", e => { perfShowLabels = e.target.checked; renderPerfView(true); });

  $("#perfList").addEventListener("change", e => {
    const cb = e.target.closest("[data-perf-pick]");

  chart.addEventListener("mousemove", perfTipMove);
  chart.addEventListener("mouseleave", perfTipOut);

/* ---------------- 점검 — 급락 주의 · 데이터 누락 ----------------

      rows: perfAlerts().map(a => ({

        .map(m => ({ code: m.code, name: m.label, detail: m.owner || "담당자 미지정" })) },
    { key: "unplaced", icon: "map", tone: "warn", title: "진행중인데 여정지도에 안 붙음",
      hint: "운영상태가 진행인데 어느 페이지에도 배치되지 않았습니다. 어느 화면에서 나가는 캠페인인지 알 수 없습니다.",
      rows: live.filter(m => !placedCodes[m.code])

      rows: live.filter(m => !String(m.ctrBasis || "").trim() && !m.ctrFormula &&
                             !String(m.cvrBasis || "").trim() && !m.cvrFormula)
        .map(m => ({ code: m.code, name: m.label, detail: m.owner || "담당자 미지정" })) },
    { key: "orphan", icon: "alert", tone: "warn", title: "성과는 있는데 마스터에 없는 코드",
      hint: "3.개인화RAW 에는 있지만 1.개인화DB 에 같은 캠페인코드가 없습니다. 코드 오타이거나 마스터 등록이 빠졌습니다.",
      rows: Object.keys(withPerf).filter(c => !campByCode(c)).map(c => {

        return { code: c, name: r.title || r.fullName || "-", detail: r.month || "" };
      }) },
    { key: "nolink", icon: "link", tone: "info", title: "링크 글자만 있고 주소가 없음",
      hint: "시트 T·U열에 글자는 있는데 하이퍼링크가 걸려 있지 않습니다. 셀에서 Ctrl+K 로 주소를 걸어 주세요.",
      rows: SHEETS.camps.filter(m => (m.link1 && !m.link1Url) || (m.link2 && !m.link2Url))
        .map(m => ({ code: m.code, name: m.label, detail: [m.link1, m.link2].filter(Boolean).join(" · ") })) }

let hygCache = null;
function hygieneCached() {

/* ========================================================================
   좁은 화면 안내 · 터치 제스처

   이 도구는 넓은 화면 전용이다. 폰 크기(≤860px)에서는 본 화면 대신 안내만
   보여 준다 — 화면을 감추는 일은 CSS 가 하고(parts/17-mobile.html), 여기서는
   안내에 지금 주소를 채워 PC 에서 열 수 있게만 해 준다.

   태블릿·터치 노트북처럼 화면은 넓은데 마우스가 없는 기기는 그대로 쓴다.
   다만 휠 이벤트만으로는 배율을 바꿀 수 없고, 스치듯 밀다 카드가 딸려 옮겨지므로
   손가락 조작을 따로 처리한다 — 한 손가락은 화면 밀기(탭은 선택), 두 손가락은
   확대/축소, 카드를 옮기려면 0.45초 길게 누른 뒤 끈다.

const MOBILE_MAX = 860;

/* 안내 화면이 뜨는 폭 — 여기서는 본 화면이 감춰져 있다(레이아웃 계산을 건너뛴다) */

   두 손가락 = 확대/축소 + 밀기. 두 손가락 사이 가운데 점이 제자리에 머문다. */
const touchPts = new Map();
let gest = null;

const gestMid = () => {
  let x = 0, y = 0;
  touchPts.forEach(p => { x += p.x; y += p.y; });
  return { x: x / touchPts.size, y: y / touchPts.size };
};
const gestSpan = () => {
  const a = Array.from(touchPts.values());
  return a.length < 2 ? 0 : Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
};

/* 05-flow.js 의 pointerdown 맨 앞에서 부른다. true 를 돌려주면 그쪽 처리는 건너뛴다. */
function mobileFlowPointer(e, surf) {
  if (!isTouchFlow() || e.pointerType !== "touch") return false;
  const rect = surf.getBoundingClientRect();
  touchPts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { surf.setPointerCapture(e.pointerId); } catch (err) {}

  if (!gest) {
    const nodeEl = e.target.closest("[data-node]");
    gest = {
      surf: surf, rect: rect, moved: 0, mode: "pan",
      sx: e.clientX, sy: e.clientY,
      node: nodeEl ? nodeEl.dataset.node : null,
      el: nodeEl || null,
      base: anchorNow()
    };
    surf.addEventListener("pointermove", onTouchMove);
    surf.addEventListener("pointerup", onTouchEnd);
    surf.addEventListener("pointercancel", onTouchEnd);
    $("#flowPane").classList.add("busy");
    /* 길게 누르면 그 카드를 집어 옮긴다 — 스치듯 밀다가 지도가 흐트러지는 일이 없도록
       일부러 한 박자 기다린다. 편집 권한이 있을 때만. */
    if (gest.node && canEdit() && flowMode !== "link") {
      gest.hold = setTimeout(beginTouchNodeDrag, 450);
    }
  } else {
    clearTimeout(gest.hold);
    gest.node = null;                       // 손가락이 늘면 탭도, 카드 옮기기도 아니다
    if (gest.mode === "node") endTouchNodeDrag();
    gest.mode = "pan";
    gest.base = anchorNow();
  }
  return true;
}
function beginTouchNodeDrag() {
  if (!gest || gest.moved > 8 || !gest.node) return;
  const n = nodeById(gest.node);
  if (!n) return;
  gest.mode = "node";
  gest.ox = n.x; gest.oy = n.y;
  if (gest.el) gest.el.classList.add("dragging");
  if (navigator.vibrate) navigator.vibrate(12);          // 집혔다는 것을 손에 알린다
  toast("카드를 끌어 옮기세요");
}
function endTouchNodeDrag() {
  if (gest && gest.el) gest.el.classList.remove("dragging");
}
/* 지금 손가락 위치를 기준점으로 다시 잡는다 — 손가락이 늘거나 줄어도 화면이 튀지 않는다 */
function anchorNow() {
  const v = B().view, m = gestMid();
  return { zoom: v.zoom, panX: v.panX, panY: v.panY, mx: m.x, my: m.y, span: gestSpan() };
}
function onTouchMove(e) {
  if (!gest || !touchPts.has(e.pointerId)) return;
  e.preventDefault();
  touchPts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  gest.moved = Math.max(gest.moved, Math.abs(e.clientX - gest.sx) + Math.abs(e.clientY - gest.sy));
  if (gest.moved > 8) clearTimeout(gest.hold);          // 밀기 시작했으면 길게 누르기는 취소

  if (gest.mode === "node") {                            /* 집어 든 카드 옮기기 */
    const n = nodeById(gest.node), z = B().view.zoom;
    if (!n) return;
    n.x = Math.round(gest.ox + (e.clientX - gest.sx) / z);
    n.y = Math.round(gest.oy + (e.clientY - gest.sy) / z);
    if (gest.el) { gest.el.style.left = n.x + "px"; gest.el.style.top = n.y + "px"; }
    moveEdgesOf(gest.node);
    return;
  }

  const v = B().view, b = gest.base, m = gestMid(), r = gest.rect;
  let z = b.zoom;
  if (touchPts.size >= 2 && b.span > 0) z = clamp(b.zoom * (gestSpan() / b.span), 0.15, 2.5);
  /* 처음 손가락이 있던 자리의 지도 좌표가 지금 손가락 자리에 그대로 오도록 민다 */
  const wx = (b.mx - r.left - b.panX) / b.zoom, wy = (b.my - r.top - b.panY) / b.zoom;
  v.zoom = z;
  v.panX = m.x - r.left - wx * z;
  v.panY = m.y - r.top - wy * z;
  applyTransformSoon();
}
function onTouchEnd(e) {
  touchPts.delete(e.pointerId);
  if (!gest) return;
  if (touchPts.size > 0) { gest.base = anchorNow(); return; }   // 아직 손가락이 남아 있다
  clearTimeout(gest.hold);
  endTouchNodeDrag();
  const g = gest;
  gest = null;
  g.surf.removeEventListener("pointermove", onTouchMove);
  g.surf.removeEventListener("pointerup", onTouchEnd);
  g.surf.removeEventListener("pointercancel", onTouchEnd);
  $("#flowPane").classList.remove("busy");
  if (g.moved < 8 && g.node) selectNode(g.node);               // 거의 안 움직였으면 탭 = 선택
  applyTransform();
  markDirty();
}

function saveSession(s) {
  session = s;
  try { s ? localStorage.setItem(SESS, JSON.stringify(s)) : localStorage.removeItem(SESS); } catch (e) {}
}
function loadSession() {
  try { session = JSON.parse(localStorage.getItem(SESS) || "null"); } catch (e) { session = null; }
  return session;
}
function here() { return location.origin + location.pathname + location.search; }
function readCallback() {                        // 로그인 후 되돌아온 주소의 #토큰
  const h = location.hash || "";
  if (h.indexOf("access_token=") < 0) return false;
  const q = new URLSearchParams(h.slice(1));
  saveSession({
    access_token: q.get("access_token"),
    refresh_token: q.get("refresh_token"),
    expires_at: Date.now() + (Number(q.get("expires_in")) || 3600) * 1000
  });
  history.replaceState(null, "", location.pathname + location.search);

  /* Supabase 는 Redirect URLs 허용 목록에 없는 주소를 무시하고 Site URL 로 보낸다.
     토큰은 이미 이 브라우저에 저장했으니, 같은 사이트라면 원래 있던 페이지로 되돌린다. */
  let back = null;
  try { back = localStorage.getItem(BACK); localStorage.removeItem(BACK); } catch (e) {}
  if (back && back.indexOf(location.origin) === 0 && back !== here()) {
    location.replace(back);
    return "redirect";
  }
  return true;
}
async function ensureToken() {
  if (!session) return null;
  if (session.expires_at - Date.now() > 60000) return session.access_token;
  const c = supaCfg();
  let r;
  try {
    r = await fetch(c.url + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      headers: { apikey: c.anon, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    });
  } catch (e) {
    return session.access_token;          // 네트워크 문제 — 세션은 그대로 두고 재시도에 맡긴다
  }
  if (!r.ok) {                            // 서버가 거절한 경우에만 로그아웃
    if (r.status === 400 || r.status === 401 || r.status === 403) { saveSession(null); me = null; }
    return null;
  }
  const j = await r.json();
  saveSession({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000 });
  return session.access_token;
}
async function sapi(path, opts) {
  const c = supaCfg(), token = await ensureToken();
  const o = Object.assign({ headers: {} }, opts || {});
  o.headers = Object.assign({ apikey: c.anon, Authorization: "Bearer " + (token || c.anon) }, o.headers);
  const r = await fetch(c.url + path, o);
  if (!r.ok) {
    const txt = await r.text().catch(() => "");
    const err = new Error(txt || r.status);
    err.status = r.status;
    throw err;
  }
  return r.status === 204 ? null : r.json().catch(() => null);
}

async function signImages(data) {                 // 비공개 버킷 → 7일짜리 서명 주소
  const c = supaCfg();
  const paths = [];
  data.boards.forEach(b => b.nodes.forEach(n => { if (n.shot && n.shot.path) paths.push(n.shot.path); }));
  if (!paths.length) return;
  try {
    const res = await sapi("/storage/v1/object/sign/" + c.bucket, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ expiresIn: 604800, paths })
    });
    const map = {};
    (res || []).forEach(r => { if (r.signedURL) map[r.path || r.signedURL] = c.url + "/storage/v1" + r.signedURL; });
    data.boards.forEach(b => b.nodes.forEach(n => {
      if (n.shot && n.shot.path && map[n.shot.path]) n.shot.url = map[n.shot.path];
    }));
  } catch (e) { /* 서명 실패 시 썸네일만 보인다 */ }
}
async function serverSave() {
  if (!me) { toast("먼저 구글 계정으로 로그인하세요", "bad"); return; }
  if (!isStaff()) { toast("편집 권한이 없습니다. 서버관리자에게 운영자 권한을 요청하세요.", "bad"); return; }
  const c = supaCfg();
  if (cloudCfg()) {                              // Cloudinary가 연결돼 있으면 URL 없는 이미지부터 변환
    const targets = unhostedTargets();
    if (targets.length) {
      const prog = openProgressModal("이미지 " + targets.length + "개를 URL로 변환하는 중");
      const r = await convertTargetsToUrl(targets, (d, t) => prog.update(d, t));
      prog.close();
      if (r.failed) toast(r.failed + "개 이미지는 변환에 실패해 원본 그대로 저장합니다", "bad");
    }
  }
  setSaveChip("dirty", "저장 중…");
  const snap = buildSnapshot();
  try {
    for (const u of snap.uploads) {              // 이미지 → Storage
      const path = u.ref.slice(4);
      await sapi("/storage/v1/object/" + c.bucket + "/" + path, {
        method: "POST",
        headers: { "Content-Type": u.blob.type, "x-upsert": "true" },
        body: u.blob
      });
      snap.data.boards.forEach(b => b.nodes.forEach(n => {
        if (n.id === u.node.id) n.shot = { path, w: u.node.shotW, h: u.node.shotH };
      }));
    }
    snap.uploads.length = 0;
    const body = { id: c.docId, title: state.title, data: snap.data, updated_at: new Date().toISOString(), updated_by: me.id };
    let res;
    if (docStamp) {                               // 내가 불러온 판본 위에만 덮어쓴다
      res = await sapi("/rest/v1/jta_docs?id=eq." + encodeURIComponent(c.docId) +
        "&updated_at=eq." + encodeURIComponent(docStamp), {
        method: "PATCH",
        headers: { "Content-Type": "application/json", Prefer: "return=representation" },
        body: JSON.stringify(body)
      });
      if (!res || !res.length) {                  // 아무 행도 안 바뀜 = 그 사이 누가 저장함
        setSaveChip("dirty", "저장 안 됨");
        return toast("다른 사람이 먼저 저장했습니다. 새로고침해 최신본을 받은 뒤 다시 저장하세요.", "bad");
      }
    } else {                                      // 문서가 아직 없다 → 새로 만든다
      res = await sapi("/rest/v1/jta_docs", {
        method: "POST",
        headers: { "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=representation" },
        body: JSON.stringify(body)
      });
      if (!res || !res.length) throw new Error("문서를 만들지 못했습니다");
    }
    docStamp = res[0].updated_at;
    snap.commit();
    await signImages(state);
    dirty = false;
    mounted = { id: null, src: null, w: 0, h: 0 };
    renderFlow(); renderStage();
    setSaveChip("ok", "서버 저장됨 · 방금");
    toast("서버에 저장했습니다. 다른 사람도 새로고침하면 보입니다.", "ok");
  } catch (e) {
    setSaveChip("dirty", "저장 안 됨");
    toast("저장 실패: " + String(e.message || e).slice(0, 120), "bad");
  }
}

}

/* ========================================================================
   셸 — 영역 크기 조절 · 뷰 전환 · 파일 입출력 · 부팅
   ======================================================================== */
function applySizes() {
  const u = state.ui;
  /* 좁은 화면에서는 본 화면 대신 "PC로 접속" 안내만 보인다(parts/17-mobile.html).
     보이지도 않는 레이아웃을 좁은 화면 기준으로 줄여 문서에 써 넣지 않는다. */
  if (typeof isMobileLayout === "function" && isMobileLayout()) return;
  u.flowH = clamp(u.flowH, 130, Math.max(180, innerHeight - 260));
  u.leftW = clamp(u.leftW, 190, 520);
  u.rightW = clamp(u.rightW, 190, 560);
  $("#flowPane").style.height = u.flowH + "px";
  $("#paneLeft").style.width = u.leftW + "px";
  $("#paneRight").style.width = u.rightW + "px";

  /* 확장한 패널은 화면 옆면을 세로로 통째로 쓴다(CSS에서 position:absolute).
     나머지는 그대로 두고, 그 패널이 차지한 폭(+경계선 9px)만큼 여정 지도·가로
     경계선·아래 덱에 여백만 준다 — 무엇도 숨기지 않는다.
     좁은 화면(860px 이하)에선 영역이 아래위로 쌓이므로 확장 배치를 쓰지 않는다 */
  const side = innerWidth > 860 ? paneExpand : "";
  const off = side === "left" ? u.leftW + SPLIT_W : side === "right" ? u.rightW + SPLIT_W : 0;
  const px = v => (v ? v + "px" : "");
  [$("#flowPane"), $("#splitH"), $("#deck")].forEach((el, i) => {
    const prop = i === 2 ? "padding" : "margin";
    el.style[prop + "Left"] = px(side === "left" ? off : 0);
    el.style[prop + "Right"] = px(side === "right" ? off : 0);
  });
  $("#splitL").style.left = px(side === "left" ? u.leftW : 0);
  $("#splitR").style.right = px(side === "right" ? u.rightW : 0);
}
function initSplitters() {
  const drag = (el, onMove) => {
    el.addEventListener("pointerdown", e => {
      e.preventDefault(); el.setPointerCapture(e.pointerId);
      const start = { x: e.clientX, y: e.clientY, u: Object.assign({}, state.ui) };
      const mv = ev => { onMove(ev.clientX - start.x, ev.clientY - start.y, start.u); applySizes(); };
      const up = () => { el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up); markDirty(); if (!stageZoom) renderStage(); };
      el.addEventListener("pointermove", mv); el.addEventListener("pointerup", up);
    });
    el.addEventListener("keydown", e => {
      const step = e.shiftKey ? 40 : 12;
      const k = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
      if (!k) return;
      e.preventDefault(); onMove(k[0], k[1], Object.assign({}, state.ui)); applySizes(); markDirty(); if (!stageZoom) renderStage();
    });
  };
  drag($("#splitH"), (dx, dy, u) => { state.ui.flowH = u.flowH + dy; });
  drag($("#splitL"), (dx, dy, u) => { state.ui.leftW = u.leftW + dx; });
  drag($("#splitR"), (dx, dy, u) => { state.ui.rightW = u.rightW - dx; });
  addEventListener("resize", () => { applySizes(); if (!stageZoom) renderStage(); });
}

/* 영역 확장/축소 — 그 패널이 화면 옆면을 세로로 통째로 차지한다. 여정 지도 옆까지
   올라가므로 경계선을 끄는 것과 달리 판 자체가 바뀌지만, 지도·스테이지·반대편
   패널 어느 것도 사라지지 않는다(그만큼 좁아질 뿐).
   좌·우 중 하나만 확장한다 — 둘 다 세로 한 칸씩 가져가면 가운데가 눌린다.
   개인 화면 설정이라 문서가 아닌 이 브라우저에만 남긴다 */
const PANE_EXP_KEY = "jta:paneExpand";
const SPLIT_W = 9;               /* .splitter-v 폭 — 확장한 패널과 나머지 사이 간격 */
let paneExpand = "";
function paneExpandOn() { return paneExpand === "left" || paneExpand === "right"; }
function applyPaneExpand() {
  const on = paneExpandOn();
  if (on) $("#view-map").setAttribute("data-expand", paneExpand);
  else $("#view-map").removeAttribute("data-expand");
  $("#expLeftLabel").textContent = paneExpand === "left" ? "축소" : "확장";
  $("#expRightLabel").textContent = paneExpand === "right" ? "축소" : "확장";
  $("#btnExpLeft").classList.toggle("on", paneExpand === "left");
  $("#btnExpRight").classList.toggle("on", paneExpand === "right");
}
function initPaneExpand() {
  /* 예전 판(좌우 각각 켜던 시절)의 값이 남아 있으면 그냥 접힌 상태로 시작한다 */
  let v = ""; try { v = localStorage.getItem(PANE_EXP_KEY) || ""; } catch (e) {}
  paneExpand = v === "left" || v === "right" ? v : "";
  applyPaneExpand();
  const toggle = side => {
    paneExpand = paneExpand === side ? "" : side;
    applyPaneExpand();
    try { localStorage.setItem(PANE_EXP_KEY, paneExpand); } catch (e) {}
    applySizes(); renderFlow(); if (!stageZoom) renderStage();
  };
  $("#btnExpLeft").addEventListener("click", () => toggle("left"));
  $("#btnExpRight").addEventListener("click", () => toggle("right"));
}

/* 테마 — 기본은 라이트. 사용자가 고르면 그 선택을 기억한다(OS 설정보다 우선) */

/* 목록 뷰는 열 때만 그린다 — 탭 전환이 즉시 반응하도록 */

function initShell() {
  $("#viewTabs").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (b) switchView(b.dataset.view); });
  $("#btnShare").addEventListener("click", () => serverSave());
  $("#btnTheme").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme") || "light";
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    drawEdges();
  });
  $("#btnStorage").addEventListener("click", openStorageModal);
  $("#btnExport").addEventListener("click", exportJson);
  $("#btnImport").addEventListener("click", importJson);
  $("#btnQuickSearch").addEventListener("click", openQuickSearch);

  document.addEventListener("keydown", e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); if (canEdit()) serverSave(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f") { e.preventDefault(); openQuickSearch(); return; }
    if (typing) return;
    if (e.key === "Escape") {
      closeModal(); $("#popRoot").innerHTML = ""; closeMenu();
      sel.layer = null; sel.edge = null; setTool("select");
      renderStage(); renderPanels(); drawEdges();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && canEdit()) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y" && canEdit()) { e.preventDefault(); redo(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "d" && canEdit() && sel.node && !sel.layer) { e.preventDefault(); duplicateNode(sel.node); return; }
    if ((e.key === "Delete" || e.key === "Backspace") && canEdit()) {
      const n = curNode();
      if (sel.layer && n) { n.layers = n.layers.filter(l => l.id !== sel.layer); sel.layer = null; markDirty(); renderFlow(); renderStage(); renderPanels(); e.preventDefault(); }
      else if (sel.edge) { B().edges = B().edges.filter(x => x.id !== sel.edge); sel.edge = null; markDirty(); renderFlow(); e.preventDefault(); }
      else if (sel.node && n) { e.preventDefault(); confirmDel('"' + n.name + '" 페이지를 삭제할까요?', () => deleteNode(n.id)); }
    }
    if (/^Arrow(Up|Down|Left|Right)$/.test(e.key) && canEdit() && sel.node && !sel.layer && !sel.edge) {
      const n = curNode(); if (!n) return;
      e.preventDefault();
      const step = e.shiftKey ? GRID : 1;
      if (e.key === "ArrowUp") n.y -= step;
      else if (e.key === "ArrowDown") n.y += step;
      else if (e.key === "ArrowLeft") n.x -= step;
      else n.x += step;
      const el = $('[data-node="' + n.id + '"]');
      if (el) { el.style.left = n.x + "px"; el.style.top = n.y + "px"; moveEdgesOf(n.id); }
      markDirty();
    }
  });
  addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
}

/* ---------------- 파일로 주고받기 ---------------- */
function inlineBoards() {                     // 이미지를 data URL로 담아 파일 하나로 완결시킨다
  return state.boards.map(b => Object.assign({}, b, {
    nodes: b.nodes.map(n => {
      const c = Object.assign({}, n);
      const s = shotSrc(n);
      delete c.shotDirty; delete c.shotData;
      c.shot = s && s.indexOf("data:") === 0 ? s : n.shot;
      return c;
    })
  }));
}
function exportJson() {
  const name = (state.title || "journey").replace(/[\\/:*?"<>|]/g, "") + ".json";
  saveFile(name, JSON.stringify(Object.assign({}, state, { boards: inlineBoards() }), null, 2), "application/json");
}
function importJson() {
  if (!canEdit()) return;
  const inp = $("#jsonPick"); inp.value = "";
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const fr = new FileReader();

      try {

        state = data;
        savedRefs = [];
        state.boards.forEach(b => b.nodes.forEach(n => {
          if (typeof n.shot === "string") { n.shotData = n.shot; n.shot = null; n.shotDirty = true; }
        }));

        mounted = { id: null, src: null, w: 0, h: 0 };

        Object.keys(EDGE_EL).forEach(k => { EDGE_EL[k].g.remove(); delete EDGE_EL[k]; });

      } catch (err) { toast("JSON을 읽지 못했습니다", "bad"); }
    };

  };

}

/* ---------------- 데이터 정규화 ----------------
   태그 스키마 개편(2026-08) 이전 문서를 열어도 깨지지 않도록, 예전 필드
   (event/selector, props의 k/v)를 신규 필드로 옮겨 채운다. */
function normalizeTag(t) {
  t = t || {};
  const out = Object.assign({
    platforms: [], screenKo: "", path: "", eventKo: "", eventEn: "", area: "", trigger: "click",
    channels: [], action: "", props: [], status: "todo", note: "",
    testSampleWebPc: "", testSampleWebMo: "", testSampleAppAos: "", testSampleAppIos: ""
  }, t);
  if (!out.eventEn && t.event) out.eventEn = t.event;
  if (!out.area && t.selector) out.area = t.selector;
  if (!out.platforms.length && t.platform) out.platforms = [t.platform];   // 플랫폼 단일선택 → 다중선택 개편(2026-08) 이전 문서 호환
  out.props = (out.props || []).map(p => (p && (p.en != null || p.ko != null || p.sample != null))
    ? { ko: p.ko || "", en: p.en || "", type: p.type || "string", sample: p.sample || "" }
    : { ko: "", en: (p && p.k) || "", type: "string", sample: (p && p.v) || "" });
  return out;
}
function normalizeBoard(b) {
  b = b || {};
  b.id = b.id || uid("b");
  b.name = b.name || "여정";
  b.lanes = b.lanes || [];
  b.nodes = (b.nodes || []).map(n => Object.assign({
    kind: "page", path: "", note: "", shot: null, shotData: null, thumb: null,
    shotW: DOC_W, shotH: DOC_H, hue: "none", size: "m", sharp: false, tags: [], camps: [], layers: []
  }, n));
  b.nodes.forEach(n => { n.tags = (n.tags || []).map(normalizeTag); });
  b.edges = (b.edges || []).map(e => Object.assign({
    label: "", style: "solid", kind: "arrow", route: "curve", hue: "none", width: 2, head: "l", a1: "auto", a2: "auto", points: []
  }, e));
  b.edges.forEach(e => { if (e.kind === "loop") e.kind = "arrow"; });   // 루프 화살표는 더 이상 쓰지 않는다
  b.view = Object.assign({ zoom: 0.8, panX: 24, panY: 12, fitted: true }, b.view || {});
  return b;
}
function normalize(s) {
  s = s || {};
  if (!s.boards) {                                   // v1(단일 판) → v2(보드 여러 개)
    const u = s.ui || {};
    s.boards = [{
      id: "b1", name: "메인 여정", nodes: s.nodes || [], edges: s.edges || [], sel: u.sel,
      view: { zoom: u.zoom || 0.8, panX: u.panX || 24, panY: u.panY || 12, fitted: true }
    }];
    delete s.nodes; delete s.edges;
  }
  s.boards = s.boards.map(normalizeBoard);
  if (!s.boards.length) s.boards = [newBoard("메인 여정")];
  s.bi = clamp(s.bi || 0, 0, s.boards.length - 1);
  s.ui = Object.assign({ flowH: 372, leftW: 274, rightW: 300, focus: "all", snap: true }, s.ui || {});
  if (s.ui.density) { s.ui.focus = s.ui.density === "simple" ? "simple" : "all"; delete s.ui.density; }
  if (!FOCUS[s.ui.focus]) s.ui.focus = "all";
  ["zoom", "panX", "panY", "sel", "fitted"].forEach(k => delete s.ui[k]);
  s.title = s.title || "고객 여정 태그 맵";
  s.updatedAt = s.updatedAt || 0;
  s.cloud = s.cloud || null;          // 이미지 호스팅(Cloudinary) 설정 — 문서에 같이 저장돼 모두에게 적용된다
  s.commonProps = (s.commonProps || []).map(p => ({ ko: p.ko || "", en: p.en || "", type: p.type || "string", sample: p.sample || "" }));
  s.v = 2;
  return s;
}
function renderAll() {
  syncBoardName(); syncFocusBtn();
  applySizes(); applyTransform(); renderFlow();
  if (!B().nodes.some(n => n.id === sel.node)) sel.node = (B().nodes[0] || {}).id || null;
  renderStage(); renderPanels(); invalidateViews();
  seedHistoryForAllBoards();
}

async function boot() {
  initFlow(); initStage(); initPanels(); initTagView(); initCampView(); initPerfView(); initSheets(); initShell(); initMobile(); initSplitters(); initPaneExpand(); initImport(); initBoards(); initAuth();
  initMinimap(); wireUndoRedoButtons(); initLaneInteractions();

  /* 0) 서버(Supabase) 모드 — 구글 로그인 + 역할 권한 */
  if (supaOn()) {
    if (readCallback() === "redirect") return;   // 로그인 시작 지점으로 되돌아가는 중
    loadSession();
    await fetchMe();
    applyRoleUI();
    let ok = false;
    if (me) { try { ok = await serverLoad(); } catch (e) { toast("서버에서 불러오지 못했습니다", "bad"); } }
    if (!me) { setSaveChip("off", "로그인이 필요합니다"); renderAll(); }
    else if (!ok) { setSaveChip("dirty", "서버에 문서가 없습니다 — 저장하면 만들어집니다"); renderAll(); }
    $("#btnShare").innerHTML = ico("share") + "<span>서버 저장</span>";
    updateStorageUI(); initLock();
    bootSheets();                                 // 캠페인·성과는 구글 시트에서 받아 온다
    return;
  }

  /* 1) 서버가 연결되지 않은 화면(로컬 파일로 직접 연 경우)은 브라우저 임시 보관만 된다 */
  let draft = null;
  try { draft = await idbGet(DRAFT_KEY); } catch (e) {}
  if (draft && draft.data) {
    state = normalize(draft.data);
    savedRefs = draft.refs || collectRefs();
    dirty = true; setSaveChip("dirty", "저장 안 된 변경 있음");
  } else {
    setSaveChip("off", "로컬 전용 — 저장하려면 배포한 주소에서 여세요");
  }

  const b = B();
  sel.node = b.sel && b.nodes.some(n => n.id === b.sel) ? b.sel : (b.nodes[0] || {}).id || null;

  renderAll();
  updateStorageUI();
  initLock();
  SHEETS.err = "배포한 주소에서 구글 로그인해야 캠페인 시트를 불러옵니다";
  renderSyncBars();
  if (!B().view.fitted) { fitFlow(); B().view.fitted = true; }
}
function collectRefs() {
  return state.boards.reduce((a, b) => a.concat(b.nodes.filter(n => n.shot && n.shot.ref).map(n => n.shot.ref)), []);
}
boot();
</script>
</body>
</html>
