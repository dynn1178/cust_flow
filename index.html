/* ---------------- 앨범 뷰 — 문서에 등록된 Cloudinary 이미지 모아보기 ----------------
   Cloudinary Admin API(계정 전체 조회)는 API Secret이 필요해 쓰지 않는다. 대신
   이 문서의 노드·레이어에 이미 걸려 있는 Cloudinary URL만 모아 보여준다 —
   업로드 태그(=페이지 이름)로 자동 분류되고, 문서에서 지운 이미지는 당연히 빠진다. */
function fallbackName(url) { try { return decodeURIComponent(String(url).split("/").pop() || "image"); } catch (e) { return "image"; } }
/* Blob을 파일명 없이 올렸던 예전 업로드는 Cloudinary가 문자 그대로 "blob"을
   원본 파일명으로 돌려준다 — 뜻이 없으니 화면에는 페이지 이름으로 대신 보여준다.
   새로 올리는 이미지는 cloudUpload()가 항상 페이지 이름 기반 파일명을 보내므로
   이 문제가 생기지 않는다. */
function displayFilename(rawName, url, pageName) {
  if (rawName && rawName !== "blob") return rawName;
  return pageName || fallbackName(url);
}
function allCloudImages() {
  const out = [];
  state.boards.forEach(b => b.nodes.forEach(n => {
    if (n.shot && n.shot.url) out.push({
      kind: "shot", url: n.shot.url, tag: n.name, node: n, board: b,
      uploadedAt: n.shot.uploadedAt || null, filename: displayFilename(n.shot.filename, n.shot.url, n.name)
    });
    (n.layers || []).forEach(l => {
      if (l.kind === "image" && l.src && /^https?:/.test(l.src)) out.push({
        kind: "layer", url: l.src, tag: n.name, node: n, board: b, layer: l,
        uploadedAt: l.uploadedAt || null, filename: displayFilename(l.filename, l.src, n.name)
      });
    });
  }));
  return out;
}
const albumFilter = { board: "all", tag: "all", q: "", sort: "new", group: true };
function albumTagOptions(all, cur) {
  const names = Array.from(new Set(all.map(x => x.tag))).sort((a, b) => a.localeCompare(b, "ko"));

}
function albumCard(x) {
  return '<div class="acard" data-goto="' + x.node.id + '" data-bi="' + state.boards.indexOf(x.board) + '">' +
    '<img src="' + esc(x.url) + '" alt="" loading="lazy" draggable="false">' +
    '<div class="a-meta">' +
      '<div class="a-name">' + esc(x.filename) + "</div>" +
      '<div class="a-sub">' + esc(x.board.name) + " · " + esc(x.tag) + (x.uploadedAt ? " · " + timeAgo(new Date(x.uploadedAt).getTime()) : "") + "</div>" +
    "</div></div>";
}
function renderAlbumView(force) {

    (!albumFilter.q || (x.filename + " " + x.tag + " " + x.board.name).toLowerCase().includes(albumFilter.q))
  );
  const byDate = (a, b) => (a.uploadedAt ? new Date(a.uploadedAt).getTime() : 0) - (b.uploadedAt ? new Date(b.uploadedAt).getTime() : 0);
  if (albumFilter.sort === "new") rows.sort((a, b) => byDate(b, a));
  else if (albumFilter.sort === "old") rows.sort(byDate);
  else rows.sort((a, b) => a.filename.localeCompare(b.filename, "ko"));

  $("#albumStats").innerHTML =
    ['<div class="stat" style="--c:var(--accent)"><span class="n">' + all.length + '</span><span class="t">전체 이미지</span></div>',
     '<div class="stat" style="--c:var(--camp)"><span class="n">' + new Set(all.map(x => x.tag)).size + '</span><span class="t">태그(페이지) 수</span></div>',
     '<div class="stat" style="--c:var(--ok)"><span class="n">' + rows.length + '</span><span class="t">현재 조건에 맞는 이미지</span></div>'].join("");

  const body = $("#albumBody");
  if (!rows.length) { body.innerHTML = '<div class="empty">' + ico("image") + "<div>조건에 맞는 이미지가 없습니다<br>Cloudinary로 변환된 이미지만 여기 모입니다</div></div>"; return; }
  if (albumFilter.group) {

    ).join("");
  } else {

  }
}

/* ========================================================================
   저장 위치 — Artifact 공유본 · 서버(Supabase) · JSON 파일
   이미지 호스팅(Cloudinary)을 연결하면 화면 이미지·이미지 레이어를
   Cloudinary에 올리고 JSON에는 URL만 남긴다. 이미 등록된 이미지도
   "일괄 URL 변환"으로 나중에 한꺼번에 바꿀 수 있다.
   ======================================================================== */

/* ---------------- 이미지 호스팅 (Cloudinary · Unsigned Upload Preset) ----------------
   API Key/Secret은 쓰지 않는다 — 브라우저 코드에 넣으면 이 화면에 접근하는
   누구나 개발자도구로 꺼내볼 수 있어 사실상 공개되기 때문. Cloudinary 콘솔에서
   Signing Mode를 Unsigned로 만든 업로드 프리셋 하나만 있으면 Cloud name과
   프리셋 이름만으로 안전하게 업로드할 수 있고 폴더·태그 지정도 그대로 된다.
   설정값은 문서(state.cloud)에 저장한다 — Supabase 연결 정보와 달리 문서를
   불러온 뒤에만 쓰이므로, 한 번 저장해 두면 다른 사람이 같은 문서를 열었을 때도
   그대로 적용된다(브라우저마다 따로 연결할 필요가 없다). */
function cloudCfg() { return state.cloud || null; }
function setCloudCfg(c) { state.cloud = c; markDirty(); }
function cloudFolder(boardName) {
  const d = new Date(), ym = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  const safe = String(boardName || "board").replace(/[\/\\]+/g, "-").trim() || "board";
  return "crm/" + ym + "/" + safe;
}
function cloudTags(pageName) { return String(pageName || "page").replace(/,/g, " ").trim() || "page"; }
/* Blob(파일이 아닌)을 FormData에 파일명 없이 append하면 브라우저가 문자 그대로
   "blob"을 파일명으로 보낸다 — Cloudinary가 그걸 원본 파일명으로 그대로
   돌려줘서 앨범에 의미 없는 "blob"이 뜨는 원인이었다. 항상 뜻이 있는 이름을
   지정해서 보낸다(페이지 이름 기반). */
function safeFilename(s) { return String(s || "image").replace(/["\r\n]/g, "").trim() || "image"; }
async function cloudUpload(blob, opts) {
  const cfg = cloudCfg();
  const fd = new FormData();
  fd.append("file", blob, safeFilename(opts && opts.filename));
  fd.append("upload_preset", cfg.preset);
  if (opts && opts.folder) fd.append("folder", opts.folder);
  if (opts && opts.tags) fd.append("tags", opts.tags);
  let res;
  try {
    res = await fetch("https://api.cloudinary.com/v1_1/" + cfg.cloudName + "/image/upload", { method: "POST", body: fd });
  } catch (err) {
    throw new Error("Cloudinary에 접속하지 못했습니다. (Artifact 화면 안에서는 외부 업로드가 차단됩니다)");
  }
  const j = await res.json().catch(() => null);
  if (!res.ok) throw new Error((j && j.error && j.error.message) || ("업로드 실패 " + res.status));
  if (!j || !j.secure_url) throw new Error("응답에서 URL을 찾지 못했습니다");
  return { url: j.secure_url, publicId: j.public_id, filename: j.original_filename || "", uploadedAt: j.created_at || new Date().toISOString() };
}
async function hostUploadAll(snap) {
  const cfg = cloudCfg();
  if (!cfg || !cfg.cloudName || !cfg.preset) return;
  const done = [];
  for (const u of snap.uploads) {
    const meta = await cloudUpload(u.blob, { folder: cloudFolder(u.board && u.board.name), tags: cloudTags(u.node.name), filename: u.node.name });
    snap.data.boards.forEach(b => b.nodes.forEach(n => {
      if (n.id === u.node.id) n.shot = { url: meta.url, w: u.node.shotW, h: u.node.shotH, uploadedAt: meta.uploadedAt, filename: meta.filename, publicId: meta.publicId };
    }));
    const i = snap.used.indexOf(u.ref);
    if (i >= 0) snap.used.splice(i, 1);
    done.push(u.ref);
  }
  snap.uploads.length = 0;                     // 파일로는 올리지 않는다

  let layerDone = 0;                           // 이미지 레이어도 같은 호스팅으로 올린다(각각 독립적으로 시도)
  for (const b of snap.data.boards) {
    for (const n of b.nodes) {
      for (const l of (n.layers || [])) {
        if (l.kind !== "image" || !l.src || isCloudHosted(l.src)) continue;
        try {
          const blob = l.src.indexOf("data:") === 0 ? dataUrlToBlob(l.src) : await (await fetch(l.src)).blob();
          const meta = await cloudUpload(blob, { folder: cloudFolder(b.name), tags: cloudTags(n.name), filename: n.name + "-layer" });
          l.src = meta.url; l.uploadedAt = meta.uploadedAt; l.filename = meta.filename; l.publicId = meta.publicId;
          layerDone++;
        } catch (e) { /* 실패한 레이어는 인라인 그대로 남는다 */ }
      }
    }
  }
  if (done.length || layerDone) toast("이미지 " + (done.length + layerDone) + "개를 Cloudinary에 올렸습니다", "ok");
}
function openCloudModal() {
  const c = cloudCfg() || { cloudName: "", preset: "" };
  openForm({
    title: "이미지 호스팅 (Cloudinary)", icon: "up", okText: "저장",
    deleteText: cloudCfg() ? "설정 삭제" : null,
    note: "화면 이미지·이미지 레이어를 Cloudinary에 올리고 JSON에는 URL만 남깁니다.<br>" +
      "Cloudinary 콘솔 → <b>Settings → Upload → Upload presets → Add upload preset</b>에서 " +
      "Signing Mode를 <b>Unsigned</b>로 만든 프리셋 이름을 적으세요. API Key·Secret은 필요 없습니다 " +
      "(브라우저 코드에 넣으면 노출되므로 쓰지 않습니다).<br>" +
      "업로드 시 <span class=\"mono\">crm/연도-월/보드이름</span> 폴더에 담기고, 페이지 이름이 태그로 붙습니다.<br>" +
      "이 설정은 이 문서에 같이 저장되므로, <b>공유 저장/서버 저장을 한 번 눌러야</b> 다른 사람이 열었을 때도 그대로 적용됩니다.",
    fields: [
      { k: "cloudName", label: "Cloud name", mono: true, ph: "pspfcgbn" },
      { k: "preset", label: "Upload preset (Unsigned)", mono: true, ph: "예: jta-unsigned" }
    ],
    values: c,
    onSave: v => {
      if (!v.cloudName || !v.preset) { setCloudCfg(null); return toast("이미지 호스팅을 껐습니다. 저장해야 다른 사람에게도 반영됩니다."); }
      setCloudCfg({ cloudName: v.cloudName.trim(), preset: v.preset.trim() });
      toast("Cloudinary를 연결했습니다. 저장해야 다른 사람에게도 적용됩니다.", "ok");
    },
    onDelete: cloudCfg() ? () => { setCloudCfg(null); toast("설정을 지웠습니다. 저장해야 다른 사람에게도 반영됩니다."); } : null
  });
}

/* ---------------- 호스팅 제공업체 식별 ----------------
   "이미 지금 쓰는 이미지 호스팅에 올라간 URL인가?"를 판단하는 지점을
   한 곳에 모아 둔다. 판단 기준은 "이 URL이 Cloudinary인가"가 아니라
   "이 URL이 진짜 최종 목적지(우리가 쓰는 호스팅)인가"이므로, Supabase
   서명 URL·구버전 파일 참조·다른 업체 URL·data: 인라인 등 그게 무엇이든
   전부 "아직 우리 호스팅이 아님 → 변환 대상"으로 취급한다.

   ⚠️ 이미지 호스팅 업체를 Cloudinary에서 다른 곳으로 바꾸면, 여기와
   cloudUpload()(업로드 엔드포인트·응답 파싱)·cloudFolder()/cloudTags()
   (그 업체의 폴더·태그 규칙)·openCloudModal()(설정 입력 필드)까지
   같이 그 업체 사양에 맞춰 고쳐야 한다. */
function isCloudHosted(url) {
  return /^https?:\/\/res\.cloudinary\.com\//.test(String(url || ""));
}

/* ---------------- 이미지 일괄 URL 변환 ----------------
   이미 등록된 화면 이미지·이미지 레이어 중 지금 쓰는 호스팅(Cloudinary)에
   있지 않은 것들을 모아 한꺼번에 올린다. */
function unhostedTargets() {
  const targets = [];
  state.boards.forEach(b => b.nodes.forEach(n => {
    const src = shotSrc(n);
    if (src && !isCloudHosted(src)) targets.push({ kind: "shot", node: n, board: b, src });
    (n.layers || []).forEach(l => {
      if (l.kind === "image" && l.src && !isCloudHosted(l.src)) targets.push({ kind: "layer", node: n, layer: l, board: b, src: l.src });
    });
  }));
  return targets;
}
async function convertTargetsToUrl(targets, onProgress) {
  let done = 0, failed = 0;
  for (let i = 0; i < targets.length; i++) {
    const t = targets[i];
    try {
      const blob = t.src.indexOf("data:") === 0 ? dataUrlToBlob(t.src) : await (await fetch(t.src)).blob();
      const meta = await cloudUpload(blob, {
        folder: cloudFolder(t.board.name), tags: cloudTags(t.node.name),
        filename: t.kind === "shot" ? t.node.name : t.node.name + "-layer"
      });
      if (t.kind === "shot") {
        t.node.shot = { url: meta.url, w: t.node.shotW, h: t.node.shotH, uploadedAt: meta.uploadedAt, filename: meta.filename, publicId: meta.publicId };
        t.node.shotData = null; t.node.shotDirty = false;
      } else {
        t.layer.src = meta.url; t.layer.uploadedAt = meta.uploadedAt; t.layer.filename = meta.filename; t.layer.publicId = meta.publicId;
      }
      done++;
    } catch (e) { failed++; }
    if (onProgress) onProgress(i + 1, targets.length);
  }
  return { done, failed };
}
async function convertAllImagesToUrl() {
  const cfg = cloudCfg();
  if (!cfg || !cfg.cloudName || !cfg.preset) { toast("먼저 이미지 호스팅(Cloudinary)을 설정하세요", "bad"); openCloudModal(); return; }
  const targets = unhostedTargets();
  if (!targets.length) { toast("URL로 바꿀 이미지가 없습니다 — 이미 모두 URL 형식입니다", "ok"); return; }
  const prog = openProgressModal("이미지 " + targets.length + "개를 URL로 변환하는 중");
  const r = await convertTargetsToUrl(targets, (d, t) => prog.update(d, t));
  prog.close();
  markDirty(); renderFlow(); renderStage(); renderPanels();
  toast(r.done + "개를 URL로 바꿨습니다" + (r.failed ? " · 실패 " + r.failed : "") + " — 저장해야 다른 사람에게도 반영됩니다.", r.failed ? "bad" : "ok");
}

/* ========================================================================
   화면 이미지 등록 — 캔버스 드롭 · 노드에서 바로 올리기 · 일괄 등록
   ======================================================================== */
function pickFiles(cb) {
  const inp = $("#filesPick"); inp.value = "";
  inp.onchange = () => { const f = Array.prototype.slice.call(inp.files || []); if (f.length) cb(f); };
  inp.click();
}
function pickDir(cb) {
  const inp = $("#dirPick"); inp.value = "";
  inp.onchange = () => {
    const f = Array.prototype.slice.call(inp.files || []).filter(x => /^image\//.test(x.type));
    if (f.length) cb(f); else toast("폴더에 이미지가 없습니다", "bad");
  };
  inp.click();
}
function baseName(f) { return (f.name || "").replace(/\.[a-z0-9]+$/i, ""); }
function normName(s) {
  return String(s || "").toLowerCase()
    .replace(/\.[a-z0-9]+$/i, "")
    .replace(/^[\s._-]*\d+[\s._-]*/, "")      // 01_, 1-, 02 같은 앞 번호 제거
    .replace(/[\s._\-/:()\[\]{}·,]+/g, "");
}
/* 파일명 ↔ 페이지 이름·경로 자동 매칭 */
function guessNode(file) {
  const f = normName(file.name);
  if (!f) return null;
  let best = null, score = 0;
  B().nodes.forEach(n => {
    [n.name, n.path].forEach(cand => {
      const t = normName(cand);
      if (!t || t.length < 2) return;
      let sc = 0;
      if (t === f) sc = 100;
      else if (t.indexOf(f) === 0 || f.indexOf(t) === 0) sc = 80;      // 앞에서부터 일치
      else if (t.indexOf(f) >= 0 || f.indexOf(t) >= 0) sc = 66;        // 어딘가 포함
      if (sc > score || (sc === score && sc > 0 && best && shotSrc(best) && !shotSrc(n))) { score = sc; best = n; }
    });
  });
  return score >= 66 ? best : null;
}
/* 새 페이지 자리 — 기존 노드 아래쪽으로 줄맞춰 */
function freeSpot(i) {
  let maxY = 0, minX = 60;
  B().nodes.forEach(n => { maxY = Math.max(maxY, n.y + (NSZ[n.id] ? NSZ[n.id].h : 150)); minX = Math.min(minX, n.x); });
  return { x: minX + (i % 6) * 262, y: (B().nodes.length ? maxY + 60 : 90) + Math.floor(i / 6) * 236 };
}
function addNodeFor(name, at) {
  const p = at || freeSpot(0);
  const n = {
    id: uid("n"), kind: "page", name: name || "새 페이지", path: "", note: "",
    x: Math.round(p.x), y: Math.round(p.y), shot: null, shotData: null, thumb: null,
    shotW: DOC_W, shotH: DOC_H, hue: "none", size: "m", sharp: false, tags: [], camps: [], layers: []
  };
  B().nodes.push(n);
  return n;
}

      ico("stack") + "<div>스크린샷 여러 장을 한 번에 등록합니다<br>여기에 파일을 끌어다 놓거나 아래에서 고르세요</div>" +
      '<div style="display:flex; gap:6px; margin-top:6px">' +
        '<button class="btn" data-more>' + ico("image", "xs") + "파일 고르기</button>" +
        '<button class="btn" data-dir>' + ico("folder", "xs") + "폴더에서 가져오기</button></div></div>";

  const root = modalHost();
  root.innerHTML =
    '<div class="scrim"><div class="modal glass" style="width:min(620px,100%)" role="dialog" aria-modal="true">' +
      '<div class="modal-head">' + ico("stack") + '<h3>화면 일괄 등록</h3><button class="btn icon sm" data-x>' + ico("close", "xs") + "</button></div>" +
      '<div class="modal-body" id="bulkBody">' + body + "</div>" +
      '<div class="modal-foot">' +
        (rows.length ? '<button class="btn" data-more>' + ico("plus", "xs") + "파일 더 담기</button>" : "") +
        '<div class="spacer"></div><button class="btn" data-x>취소</button>' +
        (rows.length ? '<button class="btn primary" data-run>' + rows.length + "장 등록</button>" : "") +
      "</div>" +
    "</div></div>";

  rows.forEach(async r => {                       // 미리보기는 뒤에서 채운다
    try {
      const t = await readImage(r.file, 90, 0.5, false);
      r.thumb = t.src;
      const el = $('[data-row="' + r.i + '"] img');
      if (el) el.src = t.src;
    } catch (e) {}
  });

  root.addEventListener("change", e => {
    const s = e.target.closest("[data-target]");
    if (s) rows[+s.dataset.target].target = s.value;
  });
  const modal = $(".modal", root);
  ["dragenter", "dragover"].forEach(t => modal.addEventListener(t, e => { e.preventDefault(); }));
  modal.addEventListener("drop", e => {
    e.preventDefault();
    const f = Array.prototype.slice.call(e.dataTransfer.files || []).filter(x => /^image\//.test(x.type));
    if (f.length) openBulkModal((files || []).concat(f));
  });
  root.addEventListener("click", async e => {
    if (e.target.closest("[data-x]") || e.target.classList.contains("scrim")) return closeModal();
    if (e.target.closest("[data-more]")) { closeModal(); return pickFiles(more => openBulkModal((files || []).concat(more))); }
    if (e.target.closest("[data-dir]")) { closeModal(); return pickDir(more => openBulkModal((files || []).concat(more))); }
    const run = e.target.closest("[data-run]");
    if (!run) return;
    run.disabled = true;
    const chain = $("#bulkChain").checked;
    const status = $("#bulkStatus");

    for (const r of rows) {
      seen++;

      const el = $('[data-row="' + r.i + '"]');
      try {
        const node = r.target === "__new__" ? addNodeFor(baseName(r.file), freeSpot(made.length)) : nodeById(r.target);
        if (!node) continue;
        if (r.target === "__new__") made.push(node);

      } catch (err) { failed++; }
      if (el) el.classList.add("done");
    }
    if (chain) {
      for (let i = 1; i < made.length; i++) {
        if (!B().edges.some(x => x.from === made[i - 1].id && x.to === made[i].id))
          B().edges.push({ id: uid("e"), from: made[i - 1].id, to: made[i].id, label: "", style: "solid", kind: "arrow",
            route: "curve", hue: "none", width: 2, a1: "auto", a2: "auto", points: [] });
      }
    }
    closeModal();
    markDirty(); renderFlow(); renderPanels();
    if (made.length) { selectNode(made[0].id); fitFlow(); } else renderStage();
    toast(done + "장 등록 완료" + (made.length ? " · 새 페이지 " + made.length + "개" : "") + (failed ? " · 실패 " + failed : ""), failed ? "bad" : "ok");
  });
}

/* ---------------- 노드 버튼 ----------------
   캔버스에 파일을 끌어다 놓는 등록은 없앴다 — 노드 이동(포인터 드래그)과

   "설정" 버튼(화면 이미지) · 화면 일괄 등록 · Ctrl+V · 스테이지 드롭으로 한다. */
function initImport() {

/* ========================================================================
   관리자 모드 — 비밀번호를 아는 사람만 편집, 나머지는 보기 전용
   비밀번호 자체는 어디에도 저장하지 않는다. 저장되는 것은
   임의 salt + PBKDF2-SHA256 200,000회 해시뿐이라 파일을 열어봐도 원문이 없다.
   (다만 이 도구는 서버가 없으므로, 데이터 자체를 감추는 보안이 아니라
    "실수로 고치는 것"을 막는 편집 잠금이다. 아래 안내 문구로 명시한다.)
   ======================================================================== */
let admin = false;
const SESS_KEY = "jta:admin:" + location.pathname;
const PW_ITER = 200000;

function hasLock() { return !!(state.lock && state.lock.hash); }
function canEdit() {
  if (supaOn()) return isStaff();          // 서버 모드: 역할이 곧 권한 (서버에서 강제)
  return admin || !hasLock();
}
function subtleOK() { return !!(window.crypto && crypto.subtle && crypto.subtle.deriveBits); }

function b64(bytes) { let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s); }
function unb64(str) { const bin = atob(str), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
async function derive(pw, saltB64, iter) {
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: unb64(saltB64), iterations: iter || PW_ITER, hash: "SHA-256" }, key, 256);
  return b64(new Uint8Array(bits));
}
async function setPassword(pw) {
  const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
  state.lock = { salt, iter: PW_ITER, hash: await derive(pw, salt, PW_ITER), changedAt: Date.now() };
  admin = true;
  try { sessionStorage.setItem(SESS_KEY, state.lock.hash); } catch (e) {}
  markDirty(); applyMode();
}
async function verifyPassword(pw) {
  if (!hasLock()) return true;
  const h = await derive(pw, state.lock.salt, state.lock.iter);
  return h === state.lock.hash;
}
function pwAgeDays() { return state.lock && state.lock.changedAt ? Math.floor((Date.now() - state.lock.changedAt) / 86400000) : null; }

function applyMode() {
  const ro = !canEdit();
  document.body.classList.toggle("ro", ro);
  const b = $("#btnLock");
  $("use", b).setAttribute("href", ro ? "#i-lock" : "#i-unlock");
  $("#lockText").textContent = ro ? "보기 전용" : (hasLock() ? "관리자" : "잠금 없음");
  b.classList.toggle("on", !ro && hasLock());
  if (ro) { sel.layer = null; setTool("select"); }
  const age = pwAgeDays();
  b.title = hasLock()
    ? (ro ? "관리자 비밀번호를 입력하면 편집할 수 있습니다" : "관리자 모드 · 비밀번호 변경 " + (age === 0 ? "오늘" : age + "일 전"))
    : "아직 잠금이 없습니다 — 누구나 편집할 수 있어요";

function newBoard(name) {

  historyOf(b); updateHistoryUI();

/* ========================================================================
   추가 기능 모음 — 실행 취소 · 빠른 편집(복제/삭제) · 빠른 검색 · 미니맵 ·
   구간(스윔레인) 배경 · 보드 이미지/PDF 내보내기
   ======================================================================== */

/* ---------------- 실행 취소 / 다시 실행 ----------------
   보드별로 독립된 되돌리기 이력을 가진다(다른 보드를 오가며 편집해도 꼬이지
   않도록). markDirty() 호출이 짧게 이어지면(타이핑 등) 하나의 되돌리기
   단계로 묶는다. 화면 이미지 원본(shotData·thumb)은 용량이 커서 이력에
   담지 않는다 — 되돌리기는 배치·이름·태그·캠페인·레이어·연결선·구간 같은
   구조 변경에만 적용되고, 화면 이미지 등록/삭제나 보드 자체의 추가/삭제는
   대상이 아니다. */
const HISTORY_LIMIT = 50, HISTORY_COALESCE_MS = 600;
let history = {};             // boardId -> { base, undo:[], redo:[] }
let historyTimer = null;
let applyingHistory = false;

function boardSnapshot(b) {
  return JSON.stringify({
    nodes: b.nodes.map(n => { const c = Object.assign({}, n); delete c.shotData; delete c.thumb; return c; }),
    edges: b.edges, lanes: b.lanes || [], selNode: sel.node
  });
}
function historyOf(b) {
  if (!b) return null;
  let h = history[b.id];
  if (!h) h = history[b.id] = { base: boardSnapshot(b), undo: [], redo: [] };
  return h;
}
function updateHistoryUI() {
  const h = history[B().id];
  const u = $("#btnUndo"), r = $("#btnRedo");
  if (u) u.disabled = !h || !h.undo.length;
  if (r) r.disabled = !h || !h.redo.length;
}
function flushHistory() {
  clearTimeout(historyTimer); historyTimer = null;
  if (applyingHistory) return;
  const b = B(); if (!b) return;
  const h = historyOf(b);
  const cur = boardSnapshot(b);
  if (cur === h.base) return;
  h.undo.push(h.base);
  if (h.undo.length > HISTORY_LIMIT) h.undo.shift();
  h.redo = [];
  h.base = cur;
  updateHistoryUI();
}
function scheduleHistory() {
  if (applyingHistory) return;
  clearTimeout(historyTimer);
  historyTimer = setTimeout(flushHistory, HISTORY_COALESCE_MS);
}
function applyBoardSnapshot(b, json) {
  const snap = JSON.parse(json);
  applyingHistory = true;
  b.nodes = snap.nodes; b.edges = snap.edges; b.lanes = snap.lanes || [];
  if (b === B()) {
    sel = { node: snap.selNode && b.nodes.some(n => n.id === snap.selNode) ? snap.selNode : (b.nodes[0] || {}).id || null, edge: null, layer: null };
    mounted = { id: null, src: null, w: 0, h: 0 };
    Object.keys(EDGE_EL).forEach(k => { EDGE_EL[k].g.remove(); delete EDGE_EL[k]; });
    Object.keys(NSZ).forEach(k => delete NSZ[k]);
    $("#nodeLayer").innerHTML = "";
    renderFlow(); renderStage(); renderPanels();
  }
  applyingHistory = false;
  if (!dirty) { dirty = true; }
  setSaveChip("dirty", "저장 안 됨");
  invalidateViews();
  clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 900);
}
function undo() {
  if (!canEdit()) return;
  flushHistory();
  const b = B(), h = historyOf(b);
  if (!h.undo.length) { toast("되돌릴 내용이 없습니다"); return; }
  h.redo.push(h.base);
  h.base = h.undo.pop();
  applyBoardSnapshot(b, h.base);
  updateHistoryUI();
  toast("되돌렸습니다", "ok");
}
function redo() {
  if (!canEdit()) return;
  const b = B(), h = historyOf(b);
  if (!h.redo.length) { toast("다시 실행할 내용이 없습니다"); return; }
  h.undo.push(h.base);
  h.base = h.redo.pop();
  applyBoardSnapshot(b, h.base);
  updateHistoryUI();
  toast("다시 실행했습니다", "ok");
}
function seedHistoryForAllBoards() {
  history = {};
  state.boards.forEach(historyOf);
  updateHistoryUI();
}
function wireUndoRedoButtons() {
  $("#btnUndo").addEventListener("click", undo);
  $("#btnRedo").addEventListener("click", redo);
  updateHistoryUI();
}

/* ---------------- 빠른 편집: 복제 · 삭제 ---------------- */
function deleteNode(id) {
  B().nodes = B().nodes.filter(x => x.id !== id);
  B().edges = B().edges.filter(e => e.from !== id && e.to !== id);
  if (sel.node === id) sel.node = B().nodes.length ? B().nodes[0].id : null;
  markDirty(); renderFlow(); selectNode(sel.node);
}
function duplicateNode(id) {
  const n = nodeById(id); if (!n || !canEdit()) return;
  const copy = JSON.parse(JSON.stringify(n));
  copy.id = uid("n");
  copy.name = n.name + " 사본";
  copy.x = n.x + 32; copy.y = n.y + 32;
  copy.shotDirty = !!copy.shotData;
  copy.tags = copy.tags.map(t => Object.assign({}, t, { id: uid("t") }));
  copy.camps = copy.camps.map(c => Object.assign({}, c, { id: uid("c") }));
  /* 레이어의 캠페인 연결은 복제하지 않는다 — 같은 캠페인이 두 화면에 중복
     연결되면 캠페인 패널에서 어느 화면 기준인지 헷갈리기 때문. */
  copy.layers = (copy.layers || []).map(l => Object.assign({}, l, { id: uid("l"), campId: null }));
  B().nodes.push(copy);
  markDirty(); renderFlow(); selectNode(copy.id);
  toast('"' + n.name + '"을(를) 복제했습니다', "ok");
}

/* ---------------- 빠른 검색(Ctrl+F) — 페이지 · 태그 · 캠페인 ---------------- */
function globalSearchResults(q) {
  q = String(q || "").toLowerCase().trim();
  if (!q) return { nodes: [], tags: [], camps: [] };
  const nodes = [];
  state.boards.forEach(b => b.nodes.forEach(n => {
    if ((n.name + " " + (n.path || "")).toLowerCase().indexOf(q) >= 0) nodes.push({ n, b });
  }));
  const tags = allTags().filter(({ t, n }) => (t.event + " " + (t.selector || "") + " " + n.name).toLowerCase().indexOf(q) >= 0);
  const camps = allCamps().filter(({ c, n }) => (c.name + " " + n.name).toLowerCase().indexOf(q) >= 0);
  return { nodes: nodes.slice(0, 20), tags: tags.slice(0, 20), camps: camps.slice(0, 20) };
}
function qsRow(icoName, title, sub, bi, nodeId) {
  return '<button class="qs-row" type="button" data-bi="' + bi + '" data-node="' + nodeId + '">' + ico(icoName, "xs") +
    '<span class="qs-t">' + esc(title) + '</span><span class="qs-s">' + esc(sub) + "</span></button>";
}
function openQuickSearch() {
  const root = modalHost();
  root.innerHTML =
    '<div class="scrim"><div class="modal glass qsearch" role="dialog" aria-modal="true">' +
      '<div class="modal-head">' + ico("search") + "<h3>빠른 검색</h3><button class=\"btn icon sm\" data-x>" + ico("close", "xs") + "</button></div>" +
      '<div class="modal-body" style="gap:8px">' +
        '<input class="field" id="qsInput" placeholder="페이지 이름·경로·이벤트·캠페인 검색">' +
        '<div id="qsResults" class="qs-results"></div>' +
      "</div>" +
    "</div></div>";
  const inp = $("#qsInput"), out = $("#qsResults");
  const render = () => {
    const r = globalSearchResults(inp.value);
    const total = r.nodes.length + r.tags.length + r.camps.length;
    if (!inp.value.trim()) { out.innerHTML = '<p class="hint" style="padding:2px">페이지 이름, 경로, 이벤트명, 캠페인명으로 찾을 수 있습니다.</p>'; return; }
    if (!total) { out.innerHTML = '<div class="empty">' + ico("search") + "<div>일치하는 결과가 없습니다</div></div>"; return; }
    let html = "";
    if (r.nodes.length) html += '<div class="qs-group">페이지 · ' + r.nodes.length + "개</div>" +
      r.nodes.map(({ n, b }) => qsRow("map", n.name, b.name + (n.path ? " · " + n.path : ""), state.boards.indexOf(b), n.id)).join("");
    if (r.tags.length) html += '<div class="qs-group">태그 · ' + r.tags.length + "개</div>" +
      r.tags.map(({ t, n, b }) => qsRow("tag", t.event, b.name + " · " + n.name, state.boards.indexOf(b), n.id)).join("");
    if (r.camps.length) html += '<div class="qs-group">캠페인 · ' + r.camps.length + "개</div>" +
      r.camps.map(({ c, n, b }) => qsRow("mega", c.name, b.name + " · " + n.name, state.boards.indexOf(b), n.id)).join("");
    out.innerHTML = html;
  };
  inp.addEventListener("input", render);
  out.addEventListener("click", e => {
    const row = e.target.closest("[data-node]"); if (!row) return;
    closeModal(); jumpTo(+row.dataset.bi, row.dataset.node);
  });
  root.addEventListener("keydown", e => {
    if (e.key === "Escape") { e.stopPropagation(); closeModal(); }
    if (e.key === "Enter") { const first = $(".qs-row", out); if (first) first.click(); }
  });
  root.addEventListener("click", e => { if (e.target.closest("[data-x]") || e.target.classList.contains("scrim")) closeModal(); });
  render();
  setTimeout(() => inp.focus(), 0);
}

/* ---------------- 미니맵 ---------------- */
function renderMinimap() {
  const svg = $("#minimapSvg"); if (!svg) return;
  const nodes = B().nodes;
  const mapW = 168, mapH = 112, pad = 10;
  if (!nodes.length) { svg.innerHTML = ""; return; }
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  nodes.forEach(n => { const q = nodeRect(n); x1 = Math.min(x1, q.x); y1 = Math.min(y1, q.y); x2 = Math.max(x2, q.x + q.w); y2 = Math.max(y2, q.y + q.h); });
  const bw = Math.max(1, x2 - x1), bh = Math.max(1, y2 - y1);
  const s = Math.min((mapW - pad * 2) / bw, (mapH - pad * 2) / bh);
  const ox = pad + (mapW - pad * 2 - bw * s) / 2, oy = pad + (mapH - pad * 2 - bh * s) / 2;
  const toMap = (x, y) => ({ x: ox + (x - x1) * s, y: oy + (y - y1) * s });
  let html = nodes.map(n => {
    const q = nodeRect(n), p = toMap(q.x, q.y);
    return '<rect x="' + p.x.toFixed(1) + '" y="' + p.y.toFixed(1) + '" width="' + Math.max(2, q.w * s).toFixed(1) + '" height="' + Math.max(2, q.h * s).toFixed(1) +
      '" rx="1.5" fill="' + (n.id === sel.node ? "var(--accent)" : hueOf(n.hue)) + '" opacity="' + (n.id === sel.node ? 1 : 0.7) + '"></rect>';

        '" height="' + Math.max(0, vp2.y - vp1.y).toFixed(1) + '"></rect>';

function initMinimap() {

/* ---------------- 구간(스윔레인) 배경 ----------------

   퍼널 단계). 좌표를 입력하는 대신 캔버스에서 직접 그려서 만들고, 라벨을

/* ---------------- 보드 이미지 / PDF 내보내기 ----------------
   화면(카드) 스타일을 그대로 캡처하는 대신, Canvas 2D로 정갈한 개요도를
   새로 그린다 — 외부 라이브러리 없이 동작하고, Cloudinary 같은 외부
   호스팅 이미지의 CORS 문제로 내보내기가 실패하는 상황을 피할 수 있다. */

  const consumed = lines.join("").length;
  if (consumed < chars.length && lines.length) lines[lines.length - 1] = lines[lines.length - 1].replace(/.$/, "…");

}

/* 썸네일을 CORS 허용 모드로 미리 불러온다 — crossOrigin을 지정하면 서버가
   CORS를 허용하지 않을 때 "오염된 채로 로드"되는 대신 아예 로드가 실패하므로
   (onerror), 캔버스를 더럽혀 내보내기 전체가 막히는 일 없이 그 카드만

/* 반환값의 canvas.width/height는 선명도를 위해 dpr배 확대된 실제 픽셀 크기이고,

   (canvas.width/height)를 다르게 써야 하므로 둘 다 갖고 있어야 한다. */
async function exportBoardCanvas() {
  const b = B(), nodes = b.nodes, edges = b.edges;
  if (!nodes.length) { toast("내보낼 페이지가 없습니다", "bad"); return null; }
  const thumbImgs = {};
  await Promise.all(nodes.map(async n => {
    const src = thumbSrc(n); if (!src) return;
    const img = await loadImageSafe(src);
    if (img) thumbImgs[n.id] = img;
  }));
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  nodes.forEach(n => { const q = nodeRect(n); x1 = Math.min(x1, q.x); y1 = Math.min(y1, q.y); x2 = Math.max(x2, q.x + q.w); y2 = Math.max(y2, q.y + q.h); });

  ctx.font = "700 20px 'IBM Plex Sans KR', sans-serif";
  ctx.fillText(b.name, pad, 34);
  ctx.font = "12px 'IBM Plex Sans KR', sans-serif";
  ctx.fillStyle = dark ? "#a6a6ad" : "#7b849f";
  ctx.fillText("Customer Journey Atlas · " + new Date().toLocaleDateString("ko-KR"), pad, 52);

  const ox = pad - x1, oy = pad + titleH - y1;
  (b.lanes || []).forEach(l => {
    const lx = l.x + ox, lw = l.w || 900;
    ctx.fillStyle = hexToRgba(l.color || "#4a63e7", 0.08);
    ctx.fillRect(lx, oy + y1 - 20, lw, (y2 - y1) + 40);
    ctx.fillStyle = l.color || "#4a63e7";
    ctx.font = "700 11px 'IBM Plex Sans KR', sans-serif";
    ctx.fillText(l.name || "", lx + 8, oy + y1 - 6);
  });
  edges.forEach(e => {
    const d = pathFor(e); if (!d) return;
    try {

      ctx.save(); ctx.translate(ox, oy);
      ctx.strokeStyle = e.hue && e.hue !== "none" ? hueOfHex(e.hue) : (dark ? "#74747c" : "#7b849f");
      ctx.lineWidth = e.width || 2;

    ctx.restore();
    const textTop = y + thumbH;
    ctx.fillStyle = dark ? "#ededf0" : "#131a2c";
    ctx.font = "600 13px 'IBM Plex Sans KR', sans-serif";
    wrapText(ctx, n.name, x + 14, textTop + 20, q.w - 24, 16);
    ctx.font = "10px 'IBM Plex Sans KR', sans-serif";
    ctx.fillStyle = dark ? "#a6a6ad" : "#495372";
    ctx.fillText((KIND[n.kind] || "페이지") + " · 태그 " + n.tags.length + " · 캠페인 " + n.camps.length, x + 14, textTop + 40);
    if (n.path) { ctx.font = "10px monospace"; ctx.fillStyle = dark ? "#74747c" : "#7b849f"; ctx.fillText(n.path, x + 14, y + q.h - 12); }

/* ---------------- 최소 PDF 생성기 ----------------

  let out = "%PDF-1.4\n";
  const objOffsets = [0];
  const addObj = body => { objOffsets.push(out.length); out += body; };
  addObj("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  addObj("2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n");
  addObj("3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + ptW + " " + ptH + "] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n");
  const jpegStr = bytesToBinaryString(jpegBytes);
  addObj("4 0 obj\n<< /Type /XObject /Subtype /Image /Width " + pxW + " /Height " + pxH +
    " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpegBytes.length + " >>\nstream\n" + jpegStr + "\nendstream\nendobj\n");
  const content = "q " + ptW + " 0 0 " + ptH + " 0 0 cm /Im0 Do Q";
  addObj("5 0 obj\n<< /Length " + content.length + " >>\nstream\n" + content + "\nendstream\nendobj\n");
  const xrefStart = out.length;
  out += "xref\n0 " + objOffsets.length + "\n0000000000 65535 f \n";
  for (let i = 1; i < objOffsets.length; i++) out += String(objOffsets[i]).padStart(10, "0") + " 00000 n \n";
  out += "trailer\n<< /Size " + objOffsets.length + " /Root 1 0 R >>\nstartxref\n" + xrefStart + "\n%%EOF";
  const bytes = new Uint8Array(out.length);
  for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xff;
  return bytes;
}

function saveSession(s) {

}

function here() { return location.origin + location.pathname + location.search; }
function readCallback() {                        // 로그인 후 되돌아온 주소의 #토큰
  const h = location.hash || "";
  if (h.indexOf("access_token=") < 0) return false;
  const q = new URLSearchParams(h.slice(1));
  saveSession({
    access_token: q.get("access_token"),
    refresh_token: q.get("refresh_token"),
    expires_at: Date.now() + (Number(q.get("expires_in")) || 3600) * 1000
  });
  history.replaceState(null, "", location.pathname + location.search);

  /* Supabase 는 Redirect URLs 허용 목록에 없는 주소를 무시하고 Site URL 로 보낸다.
     토큰은 이미 이 브라우저에 저장했으니, 같은 사이트라면 원래 있던 페이지로 되돌린다. */
  let back = null;
  try { back = localStorage.getItem(BACK); localStorage.removeItem(BACK); } catch (e) {}
  if (back && back.indexOf(location.origin) === 0 && back !== here()) {
    location.replace(back);
    return "redirect";
  }
  return true;
}
async function ensureToken() {
  if (!session) return null;
  if (session.expires_at - Date.now() > 60000) return session.access_token;
  const c = supaCfg();
  let r;
  try {
    r = await fetch(c.url + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      headers: { apikey: c.anon, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    });
  } catch (e) {
    return session.access_token;          // 네트워크 문제 — 세션은 그대로 두고 재시도에 맡긴다
  }
  if (!r.ok) {                            // 서버가 거절한 경우에만 로그아웃
    if (r.status === 400 || r.status === 401 || r.status === 403) { saveSession(null); me = null; }
    return null;
  }
  const j = await r.json();
  saveSession({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000 });
  return session.access_token;
}
async function sapi(path, opts) {
  const c = supaCfg(), token = await ensureToken();
  const o = Object.assign({ headers: {} }, opts || {});
  o.headers = Object.assign({ apikey: c.anon, Authorization: "Bearer " + (token || c.anon) }, o.headers);
  const r = await fetch(c.url + path, o);
  if (!r.ok) {
    const txt = await r.text().catch(() => "");
    const err = new Error(txt || r.status);
    err.status = r.status;
    throw err;
  }
  return r.status === 204 ? null : r.json().catch(() => null);
}

async function signImages(data) {                 // 비공개 버킷 → 7일짜리 서명 주소
  const c = supaCfg();
  const paths = [];
  data.boards.forEach(b => b.nodes.forEach(n => { if (n.shot && n.shot.path) paths.push(n.shot.path); }));
  if (!paths.length) return;
  try {
    const res = await sapi("/storage/v1/object/sign/" + c.bucket, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ expiresIn: 604800, paths })
    });
    const map = {};
    (res || []).forEach(r => { if (r.signedURL) map[r.path || r.signedURL] = c.url + "/storage/v1" + r.signedURL; });
    data.boards.forEach(b => b.nodes.forEach(n => {
      if (n.shot && n.shot.path && map[n.shot.path]) n.shot.url = map[n.shot.path];
    }));
  } catch (e) { /* 서명 실패 시 썸네일만 보인다 */ }
}
async function serverSave() {
  if (!me) { toast("먼저 구글 계정으로 로그인하세요", "bad"); return; }
  if (!isStaff()) { toast("편집 권한이 없습니다. 서버관리자에게 운영자 권한을 요청하세요.", "bad"); return; }
  const c = supaCfg();
  if (cloudCfg()) {                              // Cloudinary가 연결돼 있으면 URL 없는 이미지부터 변환
    const targets = unhostedTargets();
    if (targets.length) {
      const prog = openProgressModal("이미지 " + targets.length + "개를 URL로 변환하는 중");
      const r = await convertTargetsToUrl(targets, (d, t) => prog.update(d, t));
      prog.close();
      if (r.failed) toast(r.failed + "개 이미지는 변환에 실패해 원본 그대로 저장합니다", "bad");
    }
  }
  setSaveChip("dirty", "저장 중…");
  const snap = buildSnapshot();
  try {
    for (const u of snap.uploads) {              // 이미지 → Storage
      const path = u.ref.slice(4);
      await sapi("/storage/v1/object/" + c.bucket + "/" + path, {
        method: "POST",
        headers: { "Content-Type": u.blob.type, "x-upsert": "true" },
        body: u.blob
      });
      snap.data.boards.forEach(b => b.nodes.forEach(n => {
        if (n.id === u.node.id) n.shot = { path, w: u.node.shotW, h: u.node.shotH };
      }));
    }
    snap.uploads.length = 0;
    const body = { id: c.docId, title: state.title, data: snap.data, updated_at: new Date().toISOString(), updated_by: me.id };
    let res;
    if (docStamp) {                               // 내가 불러온 판본 위에만 덮어쓴다
      res = await sapi("/rest/v1/jta_docs?id=eq." + encodeURIComponent(c.docId) +
        "&updated_at=eq." + encodeURIComponent(docStamp), {
        method: "PATCH",
        headers: { "Content-Type": "application/json", Prefer: "return=representation" },
        body: JSON.stringify(body)
      });
      if (!res || !res.length) {                  // 아무 행도 안 바뀜 = 그 사이 누가 저장함
        setSaveChip("dirty", "저장 안 됨");
        return toast("다른 사람이 먼저 저장했습니다. 새로고침해 최신본을 받은 뒤 다시 저장하세요.", "bad");
      }
    } else {                                      // 문서가 아직 없다 → 새로 만든다
      res = await sapi("/rest/v1/jta_docs", {
        method: "POST",
        headers: { "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=representation" },
        body: JSON.stringify(body)
      });
      if (!res || !res.length) throw new Error("문서를 만들지 못했습니다");
    }
    docStamp = res[0].updated_at;
    snap.commit();
    await signImages(state);
    dirty = false;
    mounted = { id: null, src: null, w: 0, h: 0 };
    renderFlow(); renderStage();
    setSaveChip("ok", "서버 저장됨 · 방금");
    toast("서버에 저장했습니다. 다른 사람도 새로고침하면 보입니다.", "ok");
  } catch (e) {
    setSaveChip("dirty", "저장 안 됨");
    toast("저장 실패: " + String(e.message || e).slice(0, 120), "bad");
  }
}

    '<div class="sepline"></div>' +
    '<button class="mi" data-act="out">' + ico("close", "xs") + "로그아웃</button>",
    $("#btnAuth"), it => {
      if (it.dataset.act === "members") openMembersModal();
      if (it.dataset.act === "out") signOut();
    });
}
function openServerModal() {
  const c = supaCfg();
  openForm({
    title: "서버 연결 (Supabase)", icon: "share", okText: "저장하고 새로고침",
    deleteText: c.url ? "연결 해제" : null,
    note: "Supabase 프로젝트의 <b>Project URL</b>과 <b>anon public key</b>를 넣으면 구글 로그인·회원 권한·서버 저장이 켜집니다. " +
      "anon key는 공개되어도 되는 값이고, 실제 권한은 서버의 RLS 정책이 판단합니다.<br>" +
      "먼저 <span class=\"mono\">supabase/schema.sql</span>을 SQL Editor에서 한 번 실행하고, Authentication → Providers에서 Google을 켜 주세요. " +
      "이 설정은 배포된 사이트에서만 동작합니다(Artifact 화면 안에서는 외부 접속이 차단됩니다).",
    fields: [
      { k: "url", label: "Project URL", mono: true, ph: "https://xxxx.supabase.co" },
      { k: "anon", label: "anon public key", mono: true, ph: "eyJhbGciOi..." },
      { k: "bucket", label: "이미지 버킷", mono: true, ph: "jta-images" },
      { k: "docId", label: "문서 ID", mono: true, ph: "main" }
    ],
    values: c,
    onSave: v => {
      if (!v.url || !v.anon) { toast("URL과 anon key가 모두 필요합니다", "bad"); return; }
      try { localStorage.setItem(SUPA_KEY, JSON.stringify({ url: v.url.replace(/\/+$/, ""), anon: v.anon, bucket: v.bucket || "jta-images", docId: v.docId || "main" })); } catch (e) {}
      location.reload();
    },
    onDelete: c.url ? () => { try { localStorage.removeItem(SUPA_KEY); localStorage.removeItem(SESS); } catch (e) {} location.reload(); } : null
  });
}
function initAuth() {
  $("#btnAuth").addEventListener("click", openAuthMenu);
  applyRoleUI();
}

/* ========================================================================
   셸 — 영역 크기 조절 · 뷰 전환 · 파일 입출력 · 부팅
   ======================================================================== */
function applySizes() {
  const u = state.ui;
  u.flowH = clamp(u.flowH, 130, Math.max(180, innerHeight - 260));
  u.leftW = clamp(u.leftW, 190, 520);
  u.rightW = clamp(u.rightW, 190, 560);
  $("#flowPane").style.height = u.flowH + "px";
  $("#paneLeft").style.width = u.leftW + "px";
  $("#paneRight").style.width = u.rightW + "px";
}
function initSplitters() {
  const drag = (el, onMove) => {
    el.addEventListener("pointerdown", e => {
      e.preventDefault(); el.setPointerCapture(e.pointerId);
      const start = { x: e.clientX, y: e.clientY, u: Object.assign({}, state.ui) };
      const mv = ev => { onMove(ev.clientX - start.x, ev.clientY - start.y, start.u); applySizes(); };
      const up = () => { el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up); markDirty(); if (!stageZoom) renderStage(); };
      el.addEventListener("pointermove", mv); el.addEventListener("pointerup", up);
    });
    el.addEventListener("keydown", e => {
      const step = e.shiftKey ? 40 : 12;
      const k = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
      if (!k) return;
      e.preventDefault(); onMove(k[0], k[1], Object.assign({}, state.ui)); applySizes(); markDirty(); if (!stageZoom) renderStage();
    });
  };
  drag($("#splitH"), (dx, dy, u) => { state.ui.flowH = u.flowH + dy; });
  drag($("#splitL"), (dx, dy, u) => { state.ui.leftW = u.leftW + dx; });
  drag($("#splitR"), (dx, dy, u) => { state.ui.rightW = u.rightW - dx; });
  addEventListener("resize", () => { applySizes(); if (!stageZoom) renderStage(); });
}

/* 테마 — 기본은 라이트. 사용자가 고르면 그 선택을 기억한다(OS 설정보다 우선) */
const THEME_KEY = "jta:theme";
function initTheme() {
  let t = null;
  try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
  document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
}
initTheme();

/* 목록 뷰는 열 때만 그린다 — 탭 전환이 즉시 반응하도록 */
function switchView(v) {
  $$(".view").forEach(s => s.classList.toggle("on", s.id === "view-" + v));
  $$("#viewTabs .btn").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  if (v === "tags") renderTagView();
  if (v === "camps") renderCampView();
  if (v === "album") renderAlbumView();
  if (v === "map") { applySizes(); applyTransform(); if (!stageZoom) renderStage(); }
}

function initShell() {
  $("#viewTabs").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (b) switchView(b.dataset.view); });
  $("#btnShare").addEventListener("click", () => (supaOn() ? serverSave() : shareSave()));
  $("#btnTheme").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme") || "light";
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    drawEdges();
  });
  $("#btnStorage").addEventListener("click", openStorageModal);
  $("#btnExport").addEventListener("click", exportJson);
  $("#btnImport").addEventListener("click", importJson);
  $("#btnQuickSearch").addEventListener("click", openQuickSearch);

  document.addEventListener("keydown", e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); if (canEdit()) (supaOn() ? serverSave() : shareSave()); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f") { e.preventDefault(); openQuickSearch(); return; }
    if (typing) return;
    if (e.key === "Escape") {
      closeModal(); $("#popRoot").innerHTML = ""; closeMenu();
      sel.layer = null; sel.edge = null; setTool("select");
      renderStage(); renderPanels(); drawEdges();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && canEdit()) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y" && canEdit()) { e.preventDefault(); redo(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "d" && canEdit() && sel.node && !sel.layer) { e.preventDefault(); duplicateNode(sel.node); return; }
    if ((e.key === "Delete" || e.key === "Backspace") && canEdit()) {
      const n = curNode();
      if (sel.layer && n) { n.layers = n.layers.filter(l => l.id !== sel.layer); sel.layer = null; markDirty(); renderFlow(); renderStage(); renderPanels(); e.preventDefault(); }
      else if (sel.edge) { B().edges = B().edges.filter(x => x.id !== sel.edge); sel.edge = null; markDirty(); renderFlow(); e.preventDefault(); }
      else if (sel.node && n) { e.preventDefault(); confirmDel('"' + n.name + '" 페이지를 삭제할까요?', () => deleteNode(n.id)); }
    }
    if (/^Arrow(Up|Down|Left|Right)$/.test(e.key) && canEdit() && sel.node && !sel.layer && !sel.edge) {
      const n = curNode(); if (!n) return;
      e.preventDefault();
      const step = e.shiftKey ? GRID : 1;
      if (e.key === "ArrowUp") n.y -= step;
      else if (e.key === "ArrowDown") n.y += step;
      else if (e.key === "ArrowLeft") n.x -= step;
      else n.x += step;
      const el = $('[data-node="' + n.id + '"]');
      if (el) { el.style.left = n.x + "px"; el.style.top = n.y + "px"; moveEdgesOf(n.id); }
      markDirty();
    }
  });
  addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
}

/* ---------------- 파일로 주고받기 ---------------- */
function inlineBoards() {                     // 이미지를 data URL로 담아 파일 하나로 완결시킨다
  return state.boards.map(b => Object.assign({}, b, {
    nodes: b.nodes.map(n => {
      const c = Object.assign({}, n);
      const s = shotSrc(n);
      delete c.shotDirty; delete c.shotData;
      c.shot = s && s.indexOf("data:") === 0 ? s : n.shot;
      return c;
    })
  }));
}
function exportJson() {
  const name = (state.title || "journey").replace(/[\\/:*?"<>|]/g, "") + ".json";
  saveFile(name, JSON.stringify(Object.assign({}, state, { boards: inlineBoards() }), null, 2), "application/json");
}
function importJson() {
  if (!canEdit()) return;
  const inp = $("#jsonPick"); inp.value = "";
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const data = normalize(JSON.parse(fr.result));
        state = data;
        savedRefs = [];
        state.boards.forEach(b => b.nodes.forEach(n => {
          if (typeof n.shot === "string") { n.shotData = n.shot; n.shot = null; n.shotDirty = true; }
        }));
        sel = { node: (B().nodes[0] || {}).id || null, edge: null, layer: null };
        mounted = { id: null, src: null, w: 0, h: 0 };
        $("#nodeLayer").innerHTML = "";
        Object.keys(EDGE_EL).forEach(k => { EDGE_EL[k].g.remove(); delete EDGE_EL[k]; });
        markDirty(); renderAll(); applyMode();
        toast("불러왔습니다. 공유하려면 저장하세요.", "ok");
      } catch (err) { toast("JSON을 읽지 못했습니다", "bad"); }
    };
    fr.readAsText(f);
  };
  inp.click();
}

/* ---------------- 데이터 정규화 ---------------- */
function normalizeBoard(b) {
  b = b || {};
  b.id = b.id || uid("b");
  b.name = b.name || "여정";
  b.lanes = b.lanes || [];
  b.nodes = (b.nodes || []).map(n => Object.assign({
    kind: "page", path: "", note: "", shot: null, shotData: null, thumb: null,
    shotW: DOC_W, shotH: DOC_H, hue: "none", size: "m", sharp: false, tags: [], camps: [], layers: []
  }, n));
  b.edges = (b.edges || []).map(e => Object.assign({
    label: "", style: "solid", kind: "arrow", route: "curve", hue: "none", width: 2, head: "m", a1: "auto", a2: "auto", points: []
  }, e));
  b.edges.forEach(e => { if (e.kind === "loop") e.kind = "arrow"; });   // 루프 화살표는 더 이상 쓰지 않는다
  b.view = Object.assign({ zoom: 0.8, panX: 24, panY: 12, fitted: true }, b.view || {});
  return b;
}
function normalize(s) {
  s = s || {};
  if (!s.boards) {                                   // v1(단일 판) → v2(보드 여러 개)
    const u = s.ui || {};
    s.boards = [{
      id: "b1", name: "메인 여정", nodes: s.nodes || [], edges: s.edges || [], sel: u.sel,
      view: { zoom: u.zoom || 0.8, panX: u.panX || 24, panY: u.panY || 12, fitted: true }
    }];
    delete s.nodes; delete s.edges;
  }
  s.boards = s.boards.map(normalizeBoard);
  if (!s.boards.length) s.boards = [newBoard("메인 여정")];
  s.bi = clamp(s.bi || 0, 0, s.boards.length - 1);
  s.ui = Object.assign({ flowH: 372, leftW: 274, rightW: 300, focus: "all", snap: true }, s.ui || {});
  if (s.ui.density) { s.ui.focus = s.ui.density === "simple" ? "simple" : "all"; delete s.ui.density; }
  if (!FOCUS[s.ui.focus]) s.ui.focus = "all";
  ["zoom", "panX", "panY", "sel", "fitted"].forEach(k => delete s.ui[k]);
  s.title = s.title || "고객 여정 태그 맵";
  s.updatedAt = s.updatedAt || 0;
  s.cloud = s.cloud || null;          // 이미지 호스팅(Cloudinary) 설정 — 문서에 같이 저장돼 모두에게 적용된다
  s.v = 2;
  return s;
}
function renderAll() {
  syncBoardName(); syncFocusBtn();
  applySizes(); applyTransform(); renderFlow();
  if (!B().nodes.some(n => n.id === sel.node)) sel.node = (B().nodes[0] || {}).id || null;
  renderStage(); renderPanels(); invalidateViews();
  seedHistoryForAllBoards();
}

async function boot() {
  initFlow(); initStage(); initPanels(); initTagView(); initCampView(); initAlbumView(); initShell(); initSplitters(); initImport(); initBoards(); initAuth();
  initMinimap(); wireUndoRedoButtons(); initLaneInteractions();

  /* 0) 서버(Supabase) 모드 — 구글 로그인 + 역할 권한 */
  if (supaOn()) {
    if (readCallback() === "redirect") return;   // 로그인 시작 지점으로 되돌아가는 중
    loadSession();
    await fetchMe();
    applyRoleUI();
    let ok = false;
    if (me) { try { ok = await serverLoad(); } catch (e) { toast("서버에서 불러오지 못했습니다", "bad"); } }
    if (!me) { setSaveChip("off", "로그인이 필요합니다"); renderAll(); }
    else if (!ok) { setSaveChip("dirty", "서버에 문서가 없습니다 — 저장하면 만들어집니다"); renderAll(); }
    $("#btnShare").innerHTML = ico("share") + "<span>서버 저장</span>";
    updateStorageUI(); initLock();
    return;
  }

  const api = await claudeApi();
  saveAvail = !!api;

  let remote = null;                                  // 1) Artifact 공유본
  if (location.protocol !== "file:" && window.claude) {   // 자체 호스팅에서는 없는 파일이라 요청하지 않는다
    try {
      const r = await fetch("data/journey.json", { cache: "no-store" });
      if (r.ok) remote = normalize(await r.json());
    } catch (e) { /* 아직 저장 전 */ }
  }
  let draft = null;                                   // 2) 저장 안 된 로컬 초안
  try { draft = await idbGet(DRAFT_KEY); } catch (e) {}

  if (remote) {
    state = remote;
    savedRefs = collectRefs();
    setSaveChip("ok", "공유본 · " + timeAgo(remote.updatedAt));
  }
  if (draft && draft.data) {
    const newer = !remote || (draft.base === remote.updatedAt && draft.savedAt > (remote.updatedAt || 0));
    if (newer) {
      state = normalize(draft.data);
      savedRefs = draft.refs || collectRefs();
      dirty = true; setSaveChip("dirty", "저장 안 된 변경 있음");
    }
  }
  if (!remote && !draft) setSaveChip("dirty", "샘플 데이터");

  const b = B();
  sel.node = b.sel && b.nodes.some(n => n.id === b.sel) ? b.sel : (b.nodes[0] || {}).id || null;
  if (!api && !dirty) setSaveChip("off", "로컬 전용");

  renderAll();
  updateStorageUI();
  initLock();
  if (!B().view.fitted) { fitFlow(); B().view.fitted = true; setSaveChip("dirty", saveAvail ? "샘플 데이터 · 저장 전" : "샘플 데이터"); }
}
function collectRefs() {
  return state.boards.reduce((a, b) => a.concat(b.nodes.filter(n => n.shot && n.shot.ref).map(n => n.shot.ref)), []);
}
boot();
</script>
