<style>
/* ============================================================================
   모바일 전용 레이아웃 (≤860px)

   이 파일만 고치면 모바일 화면이 바뀐다 — PC 레이아웃(01-head·02-css)은 건드리지
   않는다. build.sh 에서 맨 마지막에 붙으므로 여기 규칙이 항상 이긴다.

   핵심 원칙
     1) 여정 지도는 PC 와 "똑같이" 보여야 한다. 카드 폭·글자 크기를 배율에 맞춰
        키우던 보정(--zoom)을 모바일에서는 끈다(17-mobile.js). 그래서 지도는
        PC 100% 화면을 그대로 축소한 모습이 되고, 노드 위치·줄바꿈이 달라지지 않는다.
     2) 좁은 화면에 세 패널을 쌓지 않는다. 지도 아래는 한 번에 하나만 보여주고
        캠페인 · 화면 · 태깅을 탭으로 오간다.
     3) 손가락으로 하는 조작을 우선한다 — 한 손가락은 항상 화면 밀기,
        두 손가락은 확대/축소. 실수로 노드가 끌려 옮겨지지 않는다.
   ========================================================================== */
@media (max-width: 860px) {

  /* ── 화면 높이 ───────────────────────────────────────────────
     모바일 브라우저는 주소창·하단 바가 접혔다 펴져 100% 높이가 실제로 보이는
     높이보다 큰 경우가 많다. 그러면 아래쪽 내용이 화면 밖으로 밀려나는데,
     본문 스크롤은 막혀 있어 닿을 방법이 없었다(캠페인 목록이 안 보이던 원인).
     지금 실제로 보이는 높이(dvh)를 쓰고, 각 영역은 자기 안에서 스크롤한다. */
  html,body{height:100dvh}
  .app{height:100dvh; padding:6px; gap:6px}
  .view.on{gap:6px}

  /* ── 상단 바 ─────────────────────────────────────────────── */
  .topbar{flex-wrap:wrap; gap:5px; padding:6px 8px; row-gap:5px}
  .brand{display:none}                            /* 보드 이름이 어느 문서인지 알려 준다 */
  .topbar .btn{height:34px}                       /* 손가락으로 누를 최소 크기 */
  .topbar .btn.icon{width:34px; padding:0}
  #viewTabs{order:10; width:100%; overflow-x:auto; overflow-y:hidden; flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch; scrollbar-width:none}
  #viewTabs::-webkit-scrollbar{display:none}
  #viewTabs .btn{flex:none; white-space:nowrap}
  #btnBoards{max-width:42vw}
  #btnBoards .bn{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #authName{max-width:0; overflow:hidden}         /* 이름 대신 아이콘만 */
  #btnShare span,#lockText{display:none}
  .savechip{font-size:10.5px; padding:3px 8px}

  /* ── 여정 지도 ───────────────────────────────────────────── */
  /* PC 에서 드래그해 저장해 둔 높이·폭은 모바일에서 쓰지 않는다(인라인 값을 덮어쓴다) */
  #flowPane{height:44dvh !important; min-height:200px; margin:0 !important}
  #splitH{display:none}
  .deck{flex-direction:column; overflow:hidden; padding:0 !important; gap:0}
  .pane.side,.pane.center{width:auto !important; flex:1; min-height:0; height:auto}
  .splitter-v{display:none}
  #view-map[data-expand] #paneLeft,
  #view-map[data-expand] #paneRight,
  #view-map[data-expand] #splitL,
  #view-map[data-expand] #splitR{position:static}

  /* 확대/축소·도구 막대는 손가락에 맞춰 키우고, 겹치지 않게 자리를 나눈다 */
  .flow-tools{left:8px; right:8px; bottom:8px; overflow-x:auto; flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:5px 7px}
  .flow-tools::-webkit-scrollbar{display:none}
  .flow-tools .btn{flex:none; height:32px}
  .flow-zoom{top:8px; right:8px; bottom:auto}
  .flow-zoom .btn.icon{width:34px; height:34px}
  .minimap{display:none}                          /* 좁은 화면에서는 자리만 차지한다 */
  .flow-seltools{bottom:56px}

  /* ── 지도 아래: 한 번에 한 패널 ─────────────────────────── */
  .mtabs{display:flex; gap:5px; padding:6px 8px; flex:none;
    border-bottom:1px solid var(--stroke-2); background:var(--glass-2); overflow-x:auto;
    -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .mtabs::-webkit-scrollbar{display:none}
  .mtabs .btn{flex:1; min-width:88px; height:34px; justify-content:center}
  #deck[data-mpane="camp"] #paneStage,
  #deck[data-mpane="camp"] #paneRight,
  #deck[data-mpane="stage"] #paneLeft,
  #deck[data-mpane="stage"] #paneRight,
  #deck[data-mpane="tag"] #paneLeft,
  #deck[data-mpane="tag"] #paneStage{display:none}
  .pane-head{padding:8px 10px}
  .pane.side .pane-body,.pane.center{min-height:0}
  .pane-head h2{font-size:12.5px}
  #btnExpLeft,#btnExpRight{display:none}          /* 옆면 확장은 넓은 화면 전용 */

  /* ── 목록·표 ─────────────────────────────────────────────── */
  .toolrow{padding:8px 9px; gap:6px}
  .toolrow .field{min-width:0; flex:1 1 132px; height:34px}
  .toolrow .btn{height:34px}
  .seg{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; max-width:100%}
  .seg::-webkit-scrollbar{display:none}
  .seg .btn{flex:none}
  .statgrid{grid-template-columns:repeat(2,1fr); padding:9px 9px 0}
  .stat .n{font-size:16px}
  #campTableWrap{-webkit-overflow-scrolling:touch}
  #campTable td,#campTable th{padding:7px 8px}
  #campTable .capname{max-width:150px}
  #campTable .capfull{max-width:180px}
  .basis2{max-width:200px}

  /* ── 성과 추이 ───────────────────────────────────────────── */
  .perfbody{flex-direction:column}
  .perfside{width:auto; height:34dvh; min-height:150px; border-right:0;
    border-bottom:1px solid var(--stroke-2)}
  .perfmain{padding:9px; gap:9px}
  .funnel{grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); padding:9px 9px 0}
  .periodbox{flex:1 1 100%}
  .periodbox .field{flex:1; min-width:0}
  .chart-tip{font-size:10.5px}

  /* ── 창(모달) ────────────────────────────────────────────── */
  .scrim{padding:0; place-items:end center}
  .modal,.modal.wide{width:100%; max-width:100%; max-height:92dvh;
    border-radius:var(--r-lg) var(--r-lg) 0 0}
  .modal-body{padding:13px; gap:11px}
  .modal-foot{padding:10px 13px; padding-bottom:max(10px, env(safe-area-inset-bottom))}
  .modal-foot .btn{height:38px}
  .frow .field{height:36px}
  .picklist{max-height:46dvh}
  .chklist{max-height:none}
  .chkrow{grid-template-columns:78px 1fr; row-gap:2px}
  .chkrow em{grid-column:1/-1; max-width:none}
  .qs-results{max-height:50dvh}

  /* 화면 아래쪽 안전 영역(홈 바) 만큼 띄운다 */
  #toast{bottom:max(22px, calc(env(safe-area-inset-bottom) + 12px))}
}

/* 아주 좁은 화면 — 표는 가로로 밀어 보는 것을 전제로 한다 */
@media (max-width: 520px) {
  .statgrid{grid-template-columns:1fr 1fr}
  .funnel{grid-template-columns:1fr}
  .topbar .btn span{display:none}
  .topbar #btnBoards .bn{display:inline}
  #viewTabs .btn span{display:inline}
}

/* 마우스가 아예 없는 기기 — 마우스오버로만 나타나던 것을 항상 보이게 한다.
   터치에는 hover 가 없어서, 숨겨 두면 아예 누를 방법이 없다.
   (hover:none 까지 걸어 터치 지원 노트북은 지금 동작 그대로 둔다) */
@media (pointer: coarse) and (hover: none) {
  .card-acts,.rowacts,.thumb-acts{opacity:1 !important}
  .node .port{opacity:.55}
}
</style>
