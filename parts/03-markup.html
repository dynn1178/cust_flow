<div class="app">
  <header class="topbar glass">
    <div class="brand">
      <div class="brand-mark" title="Customer Journey Atlas"><svg class="ico"><use href="#i-route"/></svg></div>
      <span class="brandname">Customer Journey Atlas</span>
    </div>
    <button class="btn boardbtn" id="btnBoards" title="여정 보드 전환·추가·삭제">
      <svg class="ico"><use href="#i-map"/></svg><span class="bn" id="boardName">보드</span><svg class="ico xs"><use href="#i-chev"/></svg>
    </button>
    <div class="seg" id="viewTabs">
      <button class="btn on" data-view="map"><svg class="ico xs"><use href="#i-map"/></svg>여정 지도</button>
      <button class="btn" data-view="tags"><svg class="ico xs"><use href="#i-tag"/></svg>태그 목록</button>
      <button class="btn" data-view="camps"><svg class="ico xs"><use href="#i-mega"/></svg>캠페인</button>
      <button class="btn" data-view="album"><svg class="ico xs"><use href="#i-image"/></svg>앨범</button>
    </div>
    <div class="spacer"></div>
    <button class="btn icon" id="btnQuickSearch" title="빠른 검색 (Ctrl+F)"><svg class="ico"><use href="#i-search"/></svg></button>
    <div class="savechip" id="saveChip" data-state="ok"><span class="dot"></span><span id="saveText">불러오는 중</span></div>
    <button class="btn" id="btnAuth" style="display:none" title="구글 계정"><svg class="ico"><use href="#i-lock"/></svg><span id="authName">구글로 로그인</span></button>
    <button class="btn" id="btnLock" title="관리자 모드"><svg class="ico"><use href="#i-lock"/></svg><span id="lockText">보기 전용</span></button>
    <button class="btn primary edit-only" id="btnShare"><svg class="ico"><use href="#i-share"/></svg><span>공유 저장</span></button>
    <button class="btn icon" id="btnStorage" title="저장 위치"><svg class="ico"><use href="#i-folder"/></svg></button>
    <button class="btn icon staff-only" id="btnExport" title="JSON 내보내기"><svg class="ico"><use href="#i-down"/></svg></button>
    <button class="btn icon edit-only staff-only" id="btnImport" title="JSON 불러오기"><svg class="ico"><use href="#i-up"/></svg></button>
    <button class="btn icon" id="btnTheme" title="라이트 / 다크"><svg class="ico"><use href="#i-theme"/></svg></button>
  </header>

  <!-- ============== MAP VIEW ============== -->
  <section class="view on" id="view-map">
    <div class="flow glass" id="flowPane">
      <div class="flow-grid"></div>
      <div id="flowSurface">
        <div id="flowWorld">
          <div id="laneLayer"></div>
          <svg id="edgeLayer">
            <g id="edgeG"></g>
            <g id="guideG"></g>
            <g id="edgeHandles"></g>
            <path id="ghostWire" fill="none" stroke="var(--camp)" stroke-width="2" stroke-dasharray="5 5" style="display:none"></path>
          </svg>
          <div id="nodeLayer"></div>
        </div>
      </div>
      <div class="flow-tools glass">
        <button class="btn sm edit-only" id="btnAddNode"><svg class="ico xs"><use href="#i-plus"/></svg>페이지 추가</button>
        <div class="seg edit-only" id="flowMode">
          <button class="btn sm on" data-mode="select" title="선택 / 이동"><svg class="ico xs"><use href="#i-cursor"/></svg></button>
          <button class="btn sm" data-mode="link" title="연결 그리기"><svg class="ico xs"><use href="#i-link"/></svg></button>
        </div>
        <button class="btn sm edit-only" id="btnBulk" title="스크린샷 여러 장을 한 번에 등록"><svg class="ico xs"><use href="#i-stack"/></svg>화면 일괄 등록</button>
        <div class="tool-sep edit-only"></div>
        <button class="btn icon sm edit-only" id="btnUndo" title="되돌리기 (Ctrl+Z)" disabled><svg class="ico xs"><use href="#i-undo"/></svg></button>
        <button class="btn icon sm edit-only" id="btnRedo" title="다시 실행 (Ctrl+Shift+Z)" disabled><svg class="ico xs"><use href="#i-redo"/></svg></button>
        <div class="tool-sep edit-only"></div>
        <button class="btn sm edit-only" id="btnAutoLayout" title="흐름 순서대로 정렬"><svg class="ico xs"><use href="#i-grid"/></svg>정렬<svg class="ico xs"><use href="#i-chev"/></svg></button>
        <button class="btn sm edit-only on" id="btnSnap" title="자석 정렬 — 다른 페이지에 맞춰 달라붙기"><svg class="ico xs"><use href="#i-magnet"/></svg></button>
        <button class="btn sm edit-only" id="btnLanes" title="캔버스를 드래그해서 구간(스윔레인) 배경 그리기"><svg class="ico xs"><use href="#i-lanes"/></svg>구간 그리기</button>
        <button class="btn icon sm" id="btnMinimap" title="미니맵 표시/숨김"><svg class="ico xs"><use href="#i-map"/></svg></button>
        <button class="btn sm" id="btnFocus" title="카드에서 무엇을 크게 볼지"><svg class="ico xs" id="focusIco"><use href="#i-density"/></svg><span id="focusName">전체</span><svg class="ico xs"><use href="#i-chev"/></svg></button>
      </div>
      <div class="minimap glass" id="minimap"><svg id="minimapSvg" viewBox="0 0 168 112"></svg></div>
      <div class="flow-zoom glass">
        <button class="btn icon sm" id="zOut"><svg class="ico xs"><use href="#i-zout"/></svg></button>
        <span class="zoomval" id="zVal">100%</span>
        <button class="btn icon sm" id="zIn"><svg class="ico xs"><use href="#i-zin"/></svg></button>
        <button class="btn icon sm" id="zFit" title="화면 맞춤"><svg class="ico xs"><use href="#i-fit"/></svg></button>
      </div>
      <div class="flow-seltools glass" id="flowSelTools" style="display:none">
        <button class="btn sm" id="btnFlowEdit"><svg class="ico xs"><use href="#i-edit"/></svg><span id="flowSelToolsLabel">설정</span></button>
      </div>
    </div>

    <div class="splitter-h" id="splitH" role="separator" aria-orientation="horizontal" tabindex="0"></div>

    <div class="deck" id="deck">
      <aside class="pane side glass" id="paneLeft">
        <div class="pane-head">
          <h2><svg class="ico"><use href="#i-mega"/></svg>CRM 캠페인</h2>
          <span class="count" id="campCount">0</span>
          <div class="spacer"></div>
          <button class="btn sm" id="btnExpLeft" title="위쪽 여정 지도를 줄이고 이 영역을 위로 넓게 확장합니다"><svg class="ico xs"><use href="#i-fit"/></svg><span id="expLeftLabel">확장</span></button>
          <button class="btn sm edit-only" id="btnAddCamp"><svg class="ico xs"><use href="#i-plus"/></svg>추가</button>
        </div>
        <div class="pane-body" id="campList"></div>
        <div class="pane-foot" id="layerLinkFoot" style="display:none"></div>
      </aside>
      <div class="splitter-v" id="splitL" role="separator" aria-orientation="vertical" tabindex="0"></div>

      <section class="pane center glass" id="paneStage">
        <div class="pane-head">
          <h2><svg class="ico"><use href="#i-layers"/></svg><span id="stageTitle">페이지를 선택하세요</span></h2>
          <div class="spacer"></div>
          <div class="stage-tools" id="stageTools">
            <div class="seg edit-only" id="layerTools">
              <button class="btn sm on" data-tool="select" title="선택"><svg class="ico xs"><use href="#i-cursor"/></svg></button>
              <button class="btn sm" data-tool="rect" title="사각형"><svg class="ico xs"><use href="#i-square"/></svg></button>
              <button class="btn sm" data-tool="ellipse" title="원"><svg class="ico xs"><use href="#i-circle"/></svg></button>
              <button class="btn sm" data-tool="arrow" title="화살표"><svg class="ico xs"><use href="#i-arrow"/></svg></button>
              <button class="btn sm" data-tool="text" title="텍스트"><svg class="ico xs"><use href="#i-text"/></svg></button>
              <button class="btn sm" data-tool="pen" title="펜"><svg class="ico xs"><use href="#i-pen"/></svg></button>
            </div>
            <div class="swatches edit-only" id="swatches"></div>
            <div class="seg edit-only" id="strokeSeg"></div>
            <div class="tool-sep edit-only"></div>
            <button class="btn icon sm edit-only" id="btnShot" title="스크린샷 올리기"><svg class="ico xs"><use href="#i-camera"/></svg></button>
            <button class="btn icon sm edit-only" id="btnLayerImg" title="이미지 레이어 추가"><svg class="ico xs"><use href="#i-copy"/></svg></button>
            <div class="tool-sep"></div>
            <button class="btn icon sm" id="sOut"><svg class="ico xs"><use href="#i-zout"/></svg></button>
            <span class="zoomval" id="sVal">맞춤</span>
            <button class="btn icon sm" id="sIn"><svg class="ico xs"><use href="#i-zin"/></svg></button>
            <button class="btn sm on" id="sFit" title="화면 맞춤 방식 선택"><svg class="ico xs"><use href="#i-fit"/></svg><span id="sFitName">가로 맞춤</span><svg class="ico xs"><use href="#i-chev"/></svg></button>
          </div>
        </div>
        <div class="stage-wrap" id="stageWrap">
          <div id="stageScroll"><div id="stageDoc"></div></div>
          <div class="stage-empty" id="stageEmpty">
            <div class="empty">
              <svg class="ico"><use href="#i-image"/></svg>
              <div>여정 지도에서 페이지를 선택하면<br>화면과 레이어를 여기서 편집합니다</div>
            </div>
          </div>
          <div class="dropzone">이미지를 놓으면 화면으로 등록됩니다</div>
        </div>
        <div class="pane-foot stage-foot" id="stageFoot"></div>
      </section>

      <div class="splitter-v" id="splitR" role="separator" aria-orientation="vertical" tabindex="0"></div>

      <aside class="pane side glass" id="paneRight">
        <div class="pane-head">
          <h2><svg class="ico"><use href="#i-tag"/></svg>태깅 설정</h2>
          <span class="count" id="tagCount">0</span>
          <div class="spacer"></div>
          <button class="btn sm" id="btnExpRight" title="위쪽 여정 지도를 줄이고 이 영역을 위로 넓게 확장합니다"><svg class="ico xs"><use href="#i-fit"/></svg><span id="expRightLabel">확장</span></button>
          <button class="btn sm" id="btnToggleAllTags" title="모든 태그를 펼치거나 접습니다"><svg class="ico xs"><use href="#i-grid"/></svg>모두 펼치기</button>
          <button class="btn sm edit-only" id="btnAddTag"><svg class="ico xs"><use href="#i-plus"/></svg>추가</button>
        </div>
        <div class="pane-subhead">
          <select class="field" id="tagJumpSelect"><option value="">등록된 태그로 이동…</option></select>
        </div>
        <div class="pane-body" id="tagList"></div>
      </aside>
    </div>
  </section>

  <!-- ============== TAG LIST VIEW ============== -->
  <section class="view" id="view-tags">
    <div class="listwrap glass">
      <div class="toolrow">
        <div class="seg" id="tagPlatFilter">
          <button class="btn sm on" data-p="all">전체</button>
          <button class="btn sm" data-p="amplitude">Amplitude</button>
          <button class="btn sm" data-p="braze">Braze</button>
          <button class="btn sm" data-p="ga4">GA4</button>
        </div>
        <select class="field" id="tagBoardFilter"></select>
        <select class="field" id="tagNodeFilter"></select>
        <select class="field" id="tagStatusFilter">
          <option value="all">모든 상태</option><option value="live">적용됨</option>
          <option value="todo">작업 예정</option><option value="deprecated">폐기</option>
        </select>
