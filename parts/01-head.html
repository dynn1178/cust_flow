<title>Customer Journey Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
/* ============ tokens ============ */
:root{
  --bg:#e8ecf7; --bg-2:#dce4f5; --bg-3:#f3f5fb;
  --ink:#131a2c; --ink-2:#495372; --ink-3:#7b849f;
  --glass:rgba(255,255,255,.60); --glass-2:rgba(255,255,255,.40); --glass-3:rgba(255,255,255,.80);
  --stroke:rgba(19,26,44,.13); --stroke-2:rgba(19,26,44,.07);
  --shadow:0 18px 44px -24px rgba(20,28,58,.55); --shadow-sm:0 6px 18px -12px rgba(20,28,58,.55);
  --accent:#4a63e7; --accent-ink:#fff; --accent-soft:rgba(74,99,231,.13);
  --amp:#1f6feb; --braze:#f2622e; --ga4:#c9861b; --camp:#7c4ddb;
  --ok:#0f9a70; --warn:#c8830f; --bad:#d94559;
  --grid:rgba(19,26,44,.055);
  --aur-1:rgba(74,99,231,.24); --aur-2:rgba(124,77,219,.20); --aur-3:rgba(31,111,235,.16); --aur-4:rgba(242,98,46,.12);
  color-scheme:light;
  --r-lg:20px; --r-md:14px; --r-sm:10px; --r-xs:7px;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
/* 기본은 라이트. 다크는 사용자가 토글했을 때만 (data-theme="dark") */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0a0b; --bg-2:#121214; --bg-3:#18181b;
  --ink:#ededf0; --ink-2:#a6a6ad; --ink-3:#74747c;
  --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.03); --glass-3:rgba(32,32,35,.92);
  --stroke:rgba(255,255,255,.12); --stroke-2:rgba(255,255,255,.06);
  --shadow:0 22px 50px -26px rgba(0,0,0,.95); --shadow-sm:0 8px 20px -14px rgba(0,0,0,.9);
  --accent:#8494ff; --accent-ink:#0b0b0d; --accent-soft:rgba(132,148,255,.16);
  --amp:#5c9dff; --braze:#ff8256; --ga4:#e5ab48; --camp:#a983f5;
  --ok:#31c99a; --warn:#e0a83c; --bad:#ff6b7d;
  --grid:rgba(255,255,255,.055);
  --aur-1:rgba(255,255,255,.05); --aur-2:rgba(255,255,255,.035); --aur-3:rgba(255,255,255,.028); --aur-4:rgba(132,148,255,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--f-ui); color:var(--ink); background:var(--bg);
  font-size:14px; line-height:1.5; overflow:hidden; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(58% 45% at 12% 8%, var(--aur-1), transparent 70%),
    radial-gradient(48% 40% at 88% 4%, var(--aur-2), transparent 70%),
    radial-gradient(52% 48% at 72% 92%, var(--aur-3), transparent 72%),
    radial-gradient(40% 40% at 8% 88%, var(--aur-4), transparent 70%),
    linear-gradient(160deg,var(--bg) 0%,var(--bg-2) 100%);
}
button,input,select,textarea{font:inherit; color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink) 18%,transparent);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
body.ro .edit-only{display:none !important}
body.viewer .staff-only{display:none !important}
.avatar{width:22px; height:22px; border-radius:99px; flex:none; object-fit:cover; border:1px solid var(--stroke)}
.avatar.ph{display:grid; place-items:center; background:var(--glass-2); color:var(--ink-3)}
.rolechip{display:inline-flex; align-items:center; height:17px; padding:0 6px; border-radius:99px; margin-left:5px;
  font-size:10px; font-weight:700; background:color-mix(in srgb,var(--c) 18%,transparent);
  color:color-mix(in srgb,var(--c) 80%,var(--ink)); border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}
#btnAuth{max-width:230px}
#authName{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ============ glass primitives ============ */
.glass{
  background:var(--glass); border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(22px) saturate(150%); backdrop-filter:blur(22px) saturate(150%);
  box-shadow:var(--shadow);
}
/* 큰 판(상단바·지도·패널·목록)에서는 유리 blur를 뺀다.
   뒤에 있는 것은 움직이지 않는 그라데이션 한 장뿐이라 흐려도 눈에 띄는 차이가
   없는 반면, 그 안에서 스크롤하거나 지도를 끌 때마다 브라우저가 그 넓은 면적을
   매 프레임 다시 블러 합성해야 해서 프레임이 크게 떨어진다. blur는 내용 위에
   겹쳐 뜨는 작은 조각(미니맵·툴바·메뉴·팝오버·토스트)에만 남긴다. */
/* 모달도 같은 이유로 뺀다 — 안에서 목록이나 긴 입력 폼을 스크롤할 때마다
   브라우저가 모달 뒤 배경 전체를 다시 블러 합성해 눈에 띄게 버벅인다. */
.topbar.glass,.flow.glass,.pane.glass,.listwrap.glass,.modal.glass{-webkit-backdrop-filter:none; backdrop-filter:none}
.modal.glass{background:var(--bg-3)}
.btn{
  display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 11px;
  border-radius:var(--r-sm); border:1px solid var(--stroke); background:var(--glass-2);
  color:var(--ink-2); font-size:12.5px; font-weight:500; cursor:pointer; white-space:nowrap;
  transition:background .13s,color .13s,border-color .13s;
}
.btn:hover{background:var(--glass-3); color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.sm{height:26px; padding:0 8px; font-size:11.5px; border-radius:var(--r-xs)}
.btn.icon{width:32px; padding:0; justify-content:center}
.btn.icon.sm{width:26px}
.btn.on{background:var(--accent); border-color:transparent; color:var(--accent-ink)}
.btn.primary{background:var(--accent); border-color:transparent; color:var(--accent-ink); font-weight:600}
.btn.primary:hover{filter:brightness(1.08); color:var(--accent-ink)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 16%,transparent); color:var(--bad); border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn[disabled]{opacity:.4; pointer-events:none}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.xs{width:13px;height:13px}
.seg{display:inline-flex; padding:3px; gap:2px; border-radius:var(--r-md); background:var(--glass-2); border:1px solid var(--stroke-2)}
.seg.wrap{flex-wrap:wrap}
.seg .btn{border:0; background:transparent; box-shadow:none; height:26px}
.seg .btn.on{background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow-sm)}
.rowseg{display:flex; gap:6px; flex-wrap:wrap}
.posrow{display:flex; align-items:center; gap:8px}
.posrow input[type=range]{flex:1; accent-color:var(--accent)}
.posrow input[type=range]:disabled{opacity:.4}
.posrow input[type=number]{width:48px; padding:5px 4px; text-align:center; flex:none}
.posrow .btn.icon{flex:none}
.chip{
  display:inline-flex; align-items:center; gap:5px; height:21px; padding:0 8px; border-radius:99px;
  font-size:11px; font-weight:600; white-space:nowrap;
  background:color-mix(in srgb,var(--c,var(--ink-3)) 16%,transparent);
  color:color-mix(in srgb,var(--c,var(--ink-3)) 78%,var(--ink));
  border:1px solid color-mix(in srgb,var(--c,var(--ink-3)) 30%,transparent);
}
.dot{width:7px;height:7px;border-radius:99px;background:var(--c,var(--ink-3));flex:none}
.lbl{font-size:10.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
.field{width:100%; height:32px; padding:0 10px; border-radius:var(--r-sm); border:1px solid var(--stroke);
  background:var(--glass-2); color:var(--ink); font-size:13px}
textarea.field{height:auto; padding:8px 10px; resize:vertical; min-height:60px; line-height:1.5; font-family:var(--f-ui)}
select.field{cursor:pointer}
.field:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.hues{display:flex; gap:5px; flex-wrap:wrap}
.hue{width:22px; height:22px; border-radius:7px; cursor:pointer; padding:0;
  border:1px solid var(--stroke); background:color-mix(in srgb,var(--h) 80%,transparent)}
.hue.on{outline:2px solid var(--ink); outline-offset:1px}
.seg-check{display:flex; gap:5px; flex-wrap:wrap}
.chkbtn{display:inline-flex; align-items:center; gap:5px; height:27px; padding:0 10px; border-radius:var(--r-sm);
  border:1px solid var(--stroke-2); background:var(--glass-2); font-size:12px; cursor:pointer; user-select:none}
.chkbtn input{margin:0}
.chkbtn:has(input:checked){background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.fgroup{border:1px solid var(--stroke-2); border-radius:var(--r-md); background:var(--glass-2)}
.fgroup > summary{cursor:pointer; padding:9px 10px; font-size:11.5px; font-weight:600; color:var(--ink-2);
  list-style:none; display:flex; align-items:center; gap:6px}
.fgroup > summary::-webkit-details-marker{display:none}
.fgroup > summary::before{content:"▸"; font-size:10px; color:var(--ink-3); transition:transform .12s}
.fgroup[open] > summary::before{transform:rotate(90deg)}
.fgroup-body{display:flex; flex-direction:column; gap:10px; padding:0 10px 10px}
.proplist{display:flex; flex-direction:column; gap:6px}
.linklist{display:flex; flex-direction:column; gap:6px}
.linkrow{display:grid; grid-template-columns:1fr 1.4fr auto auto; gap:6px; align-items:center}
.linkrow input.field.mono{font-family:var(--f-mono); font-size:12px}
.empty{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  padding:26px 16px; color:var(--ink-3); font-size:12.5px; text-align:center}
.empty .ico{width:22px;height:22px;opacity:.55}

/* ============ shell ============ */
.app{height:100%; display:flex; flex-direction:column; gap:8px; padding:8px}
.topbar{display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:var(--r-lg); flex:none; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:9px}
.brandname{font-size:13.5px; font-weight:700; letter-spacing:-.025em; white-space:nowrap; color:var(--ink)}
.brandsep{width:1px; height:16px; background:var(--stroke); flex:none}
@media (max-width:1360px){ .brandname,.brandsep{display:none} }
.brand-mark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--camp) 70%,var(--accent)));
  color:#fff; box-shadow:var(--shadow-sm)}
.brand-mark .ico{width:16px;height:16px;stroke-width:1.9}
.spacer{flex:1}
.savechip{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-3); padding:0 4px; white-space:nowrap}
.savechip .dot{--c:var(--ok)}
.savechip[data-state="dirty"] .dot{--c:var(--warn)}
.savechip[data-state="off"] .dot{--c:var(--ink-3)}
.view{display:none; flex:1; min-height:0; position:relative}   /* 확장한 패널이 이 상자를 기준으로 세로 전체를 채운다 */
.view.on{display:flex; flex-direction:column; gap:8px}

/* 보드 드롭다운 · 공용 메뉴 */
.boardbtn{max-width:220px}
.boardbtn .bn{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.menu{position:fixed; z-index:130; width:290px; border-radius:var(--r-md); padding:6px; display:flex; flex-direction:column; gap:2px;
  max-height:70vh; overflow:auto}
.menu .mi{display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:var(--r-xs); cursor:pointer;
  font-size:12.5px; border:0; background:transparent; color:var(--ink-2); text-align:left; width:100%}
.menu .mi:hover{background:var(--glass-2); color:var(--ink)}
.menu .mi.on{background:var(--accent-soft); color:var(--ink); font-weight:600}
.menu .mi .cnt{margin-left:auto; font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3)}
.menu .sepline{height:1px; background:var(--stroke-2); margin:5px 2px}

/* ============ flow canvas ============ */
.flow{position:relative; border-radius:var(--r-lg); overflow:hidden; flex:none; min-height:130px}
.flow-grid{position:absolute; inset:0;
  background-image:radial-gradient(circle at 1px 1px,var(--grid) 1px,transparent 0);
  background-size:22px 22px; pointer-events:none}
#flowSurface{position:absolute; inset:0; cursor:grab; touch-action:none; user-select:none}
#flowSurface.panning{cursor:grabbing}
#flowSurface.linking{cursor:crosshair}
#flowWorld{position:absolute; top:0; left:0; transform-origin:0 0; width:0; height:0}
#edgeLayer{position:absolute; overflow:visible; left:0; top:0; width:1px; height:1px; pointer-events:none}
/* 카드(.node)와 겹칠 때 항상 이 레이어가 클릭을 먼저 받도록 z-index를 명시한다
   — DOM 순서(카드보다 뒤)만 믿지 않고 쌓임 순서를 확실히 고정한다 */
#edgeHandlesLayer{position:absolute; overflow:visible; left:0; top:0; width:1px; height:1px; pointer-events:none; z-index:15}
#edgeLayer .hit{stroke:transparent; stroke-width:18; fill:none; pointer-events:stroke; cursor:pointer}
#edgeLayer path.wire{fill:none; stroke-linecap:round; transition:stroke .12s}
#edgeLayer text{font:600 10.5px var(--f-ui); fill:var(--ink-2); paint-order:stroke;
  stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; pointer-events:none}
#edgeHandles circle{pointer-events:auto; cursor:grab}
#edgeHandles .wp{fill:var(--bg-3); stroke:var(--accent); stroke-width:2}
/* 점 추가 손잡이 — 항상 실제 선 위에 붙여 놓고(위치 계산은 JS에서),
   원 안에 + 표시를 넣어 "누르면 점이 생긴다"는 용도를 바로 알 수 있게 한다.
   예전엔 옅은 색 원뿐이라 선에서 떨어져 보이고 용도도 불분명했다. */
#edgeHandles .wpadd{cursor:copy}
#edgeHandles .wpadd circle{fill:var(--accent); opacity:.55; stroke:var(--bg-3); stroke-width:1.5}
#edgeHandles .wpadd path{stroke:var(--bg-3); stroke-width:1.4; stroke-linecap:round; pointer-events:none}
#edgeHandles .wpadd:hover circle{opacity:1}
/* 높이 고정 점 — 건드리기 전엔 옅은 노란 힌트, 위·아래로 끌어 높이를 고정하면
   진한 노란 점으로 바뀐다(자동/고정 상태를 색으로 바로 구분) */
#edgeHandles .wpadd.hgt{cursor:ns-resize}
#edgeHandles .wpadd.hgt circle{fill:#f2c94c; opacity:.65; stroke:#8a6d1a; stroke-width:1.5}
#edgeHandles .wpadd.hgt path{stroke:#8a6d1a}
#edgeHandles .wpadd.hgt:hover circle{opacity:1}
#edgeHandles .wp.hgt{fill:#f2c94c; stroke:#8a6d1a; stroke-width:2; cursor:ns-resize}
/* 높이를 고정한 노란 점 옆의 × — 더블클릭을 몰라도 눌러서 바로 자동으로 되돌릴 수 있게 항상 보여준다 */
#edgeHandles .wp-reset circle{fill:var(--bg-3); stroke:var(--stroke-2); stroke-width:1.5; cursor:pointer}
#edgeHandles .wp-reset path{stroke:var(--ink-3); stroke-width:1.6; stroke-linecap:round; pointer-events:none}
#edgeHandles .wp-reset:hover circle{fill:var(--bad); stroke:var(--bad)}
#edgeHandles .wp-reset:hover path{stroke:#fff}
#guideG .guide{stroke:var(--accent); stroke-width:1; stroke-dasharray:4 4; opacity:.85}
/* 끌고 있는 동안에는 그림자·전환 효과를 끈다 — 카드마다 그림자를 다시
   그리느라 이동이 끊기지 않도록. 그림자는 .node가 아니라 .node-frame에 있다 */
.flow.busy .node,.flow.busy .node-frame{transition:none}
.flow.busy .node-frame{box-shadow:none}

/* ============ 노드 카드 — "액자형" ============
   카드 자체는 배경·테두리 없는 투명한 그릇이고, 이름은 이미지 프레임 위,
   배지·목록은 그 아래에 온다. 이미지 프레임만 실제로 테두리·그림자를 가진
   "액자"처럼 보인다. 제목·목록 글자는 프레임 안에 갇혀 있지 않으므로 축소해도
   (약 60% 축소까지는 거의 그대로) 잘 읽히도록 여유 있게 보정한다 — 다만 카드가
   무한정 커지면 옆 카드와 겹치니 상한(min())은 계속 둔다. */
.node{
  position:absolute; width:max(190px,min(240px,calc(190px / max(var(--zoom,1),.79)))); cursor:grab;
  contain:layout style; user-select:none; border-radius:var(--r-md); padding:4px; transition:background .15s;
}
.node.size-s{width:max(150px,min(200px,calc(150px / max(var(--zoom,1),.75))))}
.node.size-m{width:max(190px,min(240px,calc(190px / max(var(--zoom,1),.79))))}
.node.size-l{width:max(240px,min(290px,calc(240px / max(var(--zoom,1),.83))))}
.node:hover,.node.dragging{background:var(--glass-2)}
.node.sel{background:var(--accent-soft)}
.node.dragging{cursor:grabbing; z-index:20}
.node.dim{opacity:.38}
.node.dim:hover,.node.dim.sel{opacity:.95}

/* 프레임 — 이름·이미지·배지를 하나의 테두리로 묶는다. 확대·축소해도 이
   덩어리가 통째로 같이 움직이므로 안쪽 글자가 넘칠 걱정이 없다. 태그·캠페인
   목록(.node-main)은 이 프레임 바깥 아래에 그대로 노출된다. 투박한 진한
   테두리 대신, 앱 전체에 쓰는 글라스 톤(반투명 배경 + 옅은 테두리 + 은은한
   그림자)으로 통일해 더 정돈돼 보이게 한다. */
.node-frame{position:relative; border-radius:var(--r-md); background:var(--glass-3); border:1px solid var(--stroke);
  box-shadow:var(--shadow-sm); overflow:hidden; transition:border-color .15s,box-shadow .15s}
.node.sharp .node-frame{border-radius:5px}
.node.hued .node-frame{border-color:color-mix(in srgb,var(--nc) 55%,var(--stroke))}
/* 강조 효과 — 색 하나만으로는 부족하다는 요청으로 굵기·채우기·상단바·그림자를 더했다.
   emph-border(기본)는 위 .node.hued 규칙만으로 충분해 별도 규칙이 없다. */
.node.hued.emph-thick .node-frame{border-width:3px; border-color:var(--nc)}
.node.hued.emph-fill .node-frame{background:color-mix(in srgb,var(--nc) 14%,var(--glass-3)); border-color:color-mix(in srgb,var(--nc) 45%,var(--stroke))}
.node.hued.emph-bar .node-frame{border-top-width:5px; border-top-color:var(--nc)}
.node.hued.emph-glow .node-frame{border-color:color-mix(in srgb,var(--nc) 40%,var(--stroke));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--nc) 35%,transparent),0 6px 18px -2px color-mix(in srgb,var(--nc) 50%,transparent),var(--shadow-sm)}
.node.sel .node-frame{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
/* 연결그리기 모드에서 클릭해 둔 출발 페이지 — 도착 페이지를 클릭하기 전까지
   계속 살아있는 표시라, 옅은 강조로는 놓치기 쉽다. 굵은 테두리 + 은은하게
   맥동하는 링 + 위쪽 라벨로 눈에 띄게 강조한다. */
.node.link-src .node-frame{border-color:var(--camp); border-width:2px;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--camp) 45%,transparent), var(--shadow);
  animation:linksrc-pulse 1.3s ease-in-out infinite}
@keyframes linksrc-pulse{
  0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--camp) 45%,transparent), var(--shadow)}
  50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--camp) 22%,transparent), var(--shadow)}
}
.node.link-src::after{
  content:"연결 시작점"; position:absolute; left:50%; top:-12px; transform:translateX(-50%);
  background:var(--camp); color:#fff; font-size:10.5px; font-weight:700; line-height:1;
  padding:4px 9px; border-radius:99px; white-space:nowrap; box-shadow:var(--shadow-sm); pointer-events:none; z-index:5}
/* 연동 페이지 목록에서 링크를 눌러 이 노드로 왔다는 것을 잠깐 눈에 띄게 알려준다 —
   선택 표시(.sel)는 계속 남지만, 이 맥동은 두 번만 뛰고 저절로 사라진다 */
.node.pageflash .node-frame{animation:pageflash-pulse .8s ease-out 2}
@keyframes pageflash-pulse{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent), var(--shadow)}
  100%{box-shadow:0 0 0 14px color-mix(in srgb,var(--accent) 0%,transparent), var(--shadow)}
}

.node-title{padding:8px 8px 7px; display:flex; flex-direction:column; align-items:center; gap:1px; text-align:center}
/* 항상 한 줄로만 — 확대·축소에 따라 폭 대비 글자 크기 비율이 달라져 2줄로
   접혔다 펴졌다 하면, 그때마다 카드 높이가 바뀌어 거기 붙은 연결선(화살표)까지
   흔들린다. 넘치는 이름은 말줄임표로 자르고 title 속성으로 전체를 보여준다. */
.node-name{font-size:max(14.5px,min(24px,calc(14.5px / max(var(--zoom,1),.6)))); font-weight:700; letter-spacing:-.02em; line-height:1.24; word-break:keep-all; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.node.size-s .node-name{font-size:max(13px,min(21px,calc(13px / max(var(--zoom,1),.6))))}
.node.size-l .node-name{font-size:max(16.5px,min(27px,calc(16.5px / max(var(--zoom,1),.6))))}
.node-path{font-family:var(--f-mono); font-size:max(14px,min(19px,calc(14px / max(var(--zoom,1),.6)))); color:var(--ink-3); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* 이미지 — 프레임에 이미 테두리·그림자가 있으니 여기서는 모서리만 잡는다 */
.node-pic{position:relative; height:129px; background:var(--glass-2); overflow:hidden; display:grid; place-items:center}
.node.size-s .node-pic{height:99px}
.node.size-l .node-pic{height:165px}
.node-pic img{width:100%; height:100%; object-fit:cover; object-position:top center; display:block}
.node-pic .ph{display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--ink-3); font-size:10.5px}
.node-pic .ph .ico{width:18px;height:18px;opacity:.5}
.node-warn{position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:99px; display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb,var(--warn) 20%,var(--glass-3)); border:1px solid color-mix(in srgb,var(--warn) 45%,transparent); color:var(--warn)}
.node-warn .ico{width:12px; height:12px; stroke-width:2.2}
.thumb-acts{position:absolute; left:6px; right:6px; bottom:6px; display:flex; gap:5px; justify-content:space-between;
  align-items:flex-end; pointer-events:none; opacity:0; transition:opacity .15s}
.node:hover .thumb-acts,.thumb-acts:focus-within{opacity:1}
.node-pic .pick{padding:0; border:0; background:transparent; cursor:pointer; pointer-events:auto; min-width:0}
.node-pic .pick span{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; color:var(--ink);
  background:var(--glass-3); border:1px solid var(--stroke); border-radius:99px; padding:6px 12px; box-shadow:var(--shadow-sm);
  white-space:nowrap; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.node-pic .pick span .ico{width:15px; height:15px}
.node-pic .pick:hover span{border-color:var(--accent); color:var(--accent)}
.node.size-s .node-pic .pick span{font-size:11.5px; padding:5px 10px}

/* 키워드형 — 화면 이미지 없이 이름만 다는 작은 알약(pill) 카드. 사진 영역이
   없는 만큼 카드 자체도 같은 3단계 크기에서 훨씬 작게 잡는다(NSIZE_KEYWORD). */
.node.kind-keyword.size-s{width:max(96px,min(130px,calc(96px / max(var(--zoom,1),.75))))}
.node.kind-keyword.size-m{width:max(124px,min(160px,calc(124px / max(var(--zoom,1),.79))))}
.node.kind-keyword.size-l{width:max(152px,min(190px,calc(152px / max(var(--zoom,1),.83))))}
.node.kind-keyword .node-frame{border-radius:999px; padding:8px 14px; display:flex; align-items:center; justify-content:center}
.kw-pill{display:flex; align-items:center; gap:6px; min-width:0}
.kw-name{font-size:max(12.5px,min(18px,calc(12.5px / max(var(--zoom,1),.6)))); font-weight:700; letter-spacing:-.02em;
  color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.node.kind-keyword.size-l .kw-name{font-size:max(14.5px,min(21px,calc(14.5px / max(var(--zoom,1),.6))))}
.kw-badges{padding:6px 4px 0}

/* 프레임(.node-frame)과 달리 배경이 없어서, 카드 밑을 지나가는 연결선이
   태그·캠페인 목록 글자 위로 그대로 비쳐 보였다. 프레임과 같은 톤의 배경을
   깔아 그 아래를 지나는 선이 가려지게 한다. */
.node-main{padding:8px 4px 2px; display:flex; flex-direction:column; gap:7px;
  background:var(--glass-3); border-radius:var(--r-md); box-shadow:var(--shadow-sm)}
.node-badges{display:flex; flex-wrap:wrap; gap:4px; justify-content:center; padding:8px 8px 9px}
.bdg{display:inline-flex; align-items:center; gap:4px; min-height:23px; padding:3px 7px; border-radius:7px;
  font-size:11px; font-weight:600; font-family:var(--f-mono);
  background:color-mix(in srgb,var(--c) 15%,transparent); color:color-mix(in srgb,var(--c) 78%,var(--ink));
  border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.bdg b{font-size:max(14px,min(19px,calc(14px / var(--zoom,1)))); font-weight:700; line-height:1.15; font-variant-numeric:tabular-nums}
.bdg .ico{width:12px;height:12px;stroke-width:2.1; flex:none}
.bdg.big{min-height:27px; padding:4px 10px; border-radius:8px}
.bdg.big b{font-size:max(17px,min(23px,calc(17px / var(--zoom,1))))}
.bdg.big .ico{width:14px;height:14px}
.node.size-s .bdg{min-height:21px} .node.size-s .bdg b{font-size:max(12.5px,min(17px,calc(12.5px / var(--zoom,1))))}
.node.size-l .bdg b{font-size:max(15.5px,min(21px,calc(15.5px / var(--zoom,1))))}

/* 목록 — 태그·캠페인이 여러 개면 그냥 아래로 계속 쌓인다(잘리지 않음) */
.node-list{display:flex; flex-direction:column; gap:6px; padding-top:6px; border-top:1px dashed var(--stroke-2)}
.g-row{display:flex; align-items:flex-start; gap:6px; font-size:max(16px,min(21px,calc(16px / max(var(--zoom,1),.65))))}
.g-dot{width:6px; height:6px; border-radius:99px; flex:none; margin-top:.5em}
.g-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px}
.g-name{color:var(--ink); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.g-name.mono{font-family:var(--f-mono)}
.g-row.simple .g-name{font-weight:500; color:var(--ink-2)}
.g-meta{font-size:.84em; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
/* 여정 지도 노드의 실적 두 줄 — 위는 값(퍼센트), 아래는 증감. 캠페인
   이름과 같은 크기(1em)라 확대/축소에 함께 따라간다 */
.perfline{display:flex; flex-direction:column; font-family:var(--f-mono); font-weight:600; margin-top:1px}
.perfline .pf-vals{display:flex; align-items:center; gap:4px; flex-wrap:wrap; row-gap:1px}
.perfline .pf-deltas{display:flex; align-items:center; gap:4px; margin-top:1px}
.perfline .mon{color:var(--ink-3); font-weight:500; font-size:.74em; white-space:nowrap}
.perfline .ctr,.perfline .sep,.perfline .cvr{white-space:nowrap}
/* 값은 오르든 내리든 그냥 수치로 읽히도록 검정으로 통일한다 — 색은
   증감(화살표) 쪽에서만 방향을 알려준다 */
.perfline .ctr,.perfline .cvr{color:var(--ink)}
.perfline .sep{color:var(--ink-3); opacity:.6}
/* 국내 관행대로 상승은 빨강, 하락은 파랑 — 표본을 감안해도 의미 있는
   변화만 진하게(sig), 흐린 화살표는 노이즈일 수 있다는 뜻 */
.perfline .pf-deltas{font-size:.72em; font-weight:400}
.perfline i{font-style:normal; font-weight:700; opacity:.45; white-space:nowrap}
.perfline i.sig{opacity:1}
.perfline i.up{color:#e0483f}
.perfline i.dn{color:#1a54d6}
/* 예전엔 margin-left:auto로 오른쪽 끝까지 밀어 붙였는데, 그러면 한 줄에
   다 들어갈 공간이 있어도 굳이 남은 폭을 전부 요구하는 셈이라 줄바꿈이
   필요 이상으로 자주 일어났다 — 그냥 cvr 바로 뒤에 붙여서 필요한 만큼만
   차지하게 한다. */
.g-more{font-size:max(12px,min(15.5px,calc(12px / max(var(--zoom,1),.65)))); color:var(--ink-3); padding-left:12px}
.g-empty{font-size:max(11px,min(14px,calc(11px / max(var(--zoom,1),.65)))); color:var(--ink-3); text-align:center; padding-top:2px}
.g-miss{font-size:max(11px,min(14px,calc(11px / max(var(--zoom,1),.65)))); color:var(--warn); display:flex; align-items:center; gap:6px}
.g-miss .ico{width:12px; height:12px; flex:none}
.flow-tools{position:absolute; top:10px; left:10px; display:flex; gap:6px; z-index:30; padding:5px;
  border-radius:var(--r-md); flex-wrap:wrap; max-width:calc(100% - 20px); align-items:center}
.flow-zoom{position:absolute; bottom:10px; right:10px; display:flex; gap:4px; z-index:30; padding:5px;
  border-radius:var(--r-md); align-items:center}
.minimap{position:absolute; top:10px; right:10px; z-index:29; width:168px; height:112px; border-radius:var(--r-md); overflow:hidden; cursor:crosshair}
.minimap svg{width:100%; height:100%; display:block; touch-action:none}
.minimap .mm-view{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5; vector-effect:non-scaling-stroke; pointer-events:none}
#laneLayer{position:absolute; left:0; top:0; pointer-events:none; z-index:0}
#flowSurface.lane-drawing{cursor:crosshair}
#flowSurface.multi-selecting .node{cursor:cell}
.marquee{position:absolute; border:1.5px dashed var(--accent); border-radius:4px;
  background:color-mix(in srgb,var(--accent) 10%,transparent); pointer-events:none}
.lane{position:absolute; border-radius:10px; background:color-mix(in srgb,var(--lc) 7%,transparent);
  border:1.5px dashed color-mix(in srgb,var(--lc) 45%,transparent)}
.lane-preview{opacity:.85; box-shadow:inset 0 0 0 2px var(--lc)}
/* 라벨은 "누르면 뭔가 된다"는 느낌이 들도록 호버 시 살짝 떠오르고 진해진다 —
   드래그하면 이동, 그냥 클릭하면 이름·색 편집이 열린다는 두 가지 동작을 다
   암시해야 해서 move 커서 + 수정 아이콘을 같이 둔다. */
.lane-label{position:absolute; top:10px; left:10px; pointer-events:auto; cursor:move; display:inline-flex; align-items:center; gap:7px;
  padding:7px 15px; border-radius:99px; font-size:14px; font-weight:700; letter-spacing:-.01em;
  background:color-mix(in srgb,var(--lc) 26%,var(--bg-3)); color:color-mix(in srgb,var(--lc) 88%,var(--ink)); white-space:nowrap; box-shadow:var(--shadow-sm);
  transition:box-shadow .15s,transform .15s,background .15s}
.lane-label:hover{background:color-mix(in srgb,var(--lc) 42%,var(--bg-3)); box-shadow:var(--shadow); transform:translateY(-1px)}
.lane-label:active{transform:translateY(0)}
.lane-editcue{display:flex; flex:none; opacity:0; transition:opacity .15s}
.lane-label:hover .lane-editcue{opacity:.8}
.lane-editcue .ico{width:12px; height:12px; stroke-width:2.2}
.lane-edge{position:absolute; pointer-events:auto; z-index:1}
.lane-edge.l{left:-6px; top:0; bottom:0; width:12px; cursor:ew-resize}
.lane-edge.r{right:-6px; top:0; bottom:0; width:12px; cursor:ew-resize}
.lane-edge.t{top:-6px; left:0; right:0; height:12px; cursor:ns-resize}
.lane-edge.b{bottom:-6px; left:0; right:0; height:12px; cursor:ns-resize}
.lane-edge:hover{background:color-mix(in srgb,var(--lc) 22%,transparent)}
.zoomval{font-family:var(--f-mono); font-size:11px; color:var(--ink-2); min-width:38px; text-align:center}
.flow-seltools{position:absolute; bottom:54px; right:10px; z-index:30; padding:5px; border-radius:var(--r-md)}
.splitter-h{height:9px; flex:none; cursor:row-resize; display:grid; place-items:center; border-radius:99px; touch-action:none}
.splitter-h::after{content:""; width:54px; height:3px; border-radius:99px; background:var(--stroke); transition:background .16s,width .16s}
.splitter-h:hover::after{background:var(--accent); width:80px}
.splitter-v{width:9px; flex:none; cursor:col-resize; display:grid; place-items:center; touch-action:none}
.splitter-v::after{content:""; height:54px; width:3px; border-radius:99px; background:var(--stroke); transition:background .16s,height .16s}
.splitter-v:hover::after{background:var(--accent); height:80px}
