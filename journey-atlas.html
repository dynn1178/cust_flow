<title>Customer Journey Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
/* ============ tokens ============ */
:root{
  --bg:#e8ecf7; --bg-2:#dce4f5; --bg-3:#f3f5fb;
  --ink:#131a2c; --ink-2:#495372; --ink-3:#7b849f;
  --glass:rgba(255,255,255,.60); --glass-2:rgba(255,255,255,.40); --glass-3:rgba(255,255,255,.80);
  --stroke:rgba(19,26,44,.13); --stroke-2:rgba(19,26,44,.07);
  --shadow:0 18px 44px -24px rgba(20,28,58,.55); --shadow-sm:0 6px 18px -12px rgba(20,28,58,.55);
  --accent:#4a63e7; --accent-ink:#fff; --accent-soft:rgba(74,99,231,.13);
  --amp:#1f6feb; --braze:#f2622e; --ga4:#c9861b; --camp:#7c4ddb;
  --ok:#0f9a70; --warn:#c8830f; --bad:#d94559;
  --grid:rgba(19,26,44,.055);
  --aur-1:rgba(74,99,231,.24); --aur-2:rgba(124,77,219,.20); --aur-3:rgba(31,111,235,.16); --aur-4:rgba(242,98,46,.12);
  color-scheme:light;
  --r-lg:20px; --r-md:14px; --r-sm:10px; --r-xs:7px;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
/* 기본은 라이트. 다크는 사용자가 토글했을 때만 (data-theme="dark") */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0a0b; --bg-2:#121214; --bg-3:#18181b;
  --ink:#ededf0; --ink-2:#a6a6ad; --ink-3:#74747c;
  --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.03); --glass-3:rgba(32,32,35,.92);
  --stroke:rgba(255,255,255,.12); --stroke-2:rgba(255,255,255,.06);
  --shadow:0 22px 50px -26px rgba(0,0,0,.95); --shadow-sm:0 8px 20px -14px rgba(0,0,0,.9);
  --accent:#8494ff; --accent-ink:#0b0b0d; --accent-soft:rgba(132,148,255,.16);
  --amp:#5c9dff; --braze:#ff8256; --ga4:#e5ab48; --camp:#a983f5;
  --ok:#31c99a; --warn:#e0a83c; --bad:#ff6b7d;
  --grid:rgba(255,255,255,.055);
  --aur-1:rgba(255,255,255,.05); --aur-2:rgba(255,255,255,.035); --aur-3:rgba(255,255,255,.028); --aur-4:rgba(132,148,255,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--f-ui); color:var(--ink); background:var(--bg);
  font-size:14px; line-height:1.5; overflow:hidden; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(58% 45% at 12% 8%, var(--aur-1), transparent 70%),
    radial-gradient(48% 40% at 88% 4%, var(--aur-2), transparent 70%),
    radial-gradient(52% 48% at 72% 92%, var(--aur-3), transparent 72%),
    radial-gradient(40% 40% at 8% 88%, var(--aur-4), transparent 70%),
    linear-gradient(160deg,var(--bg) 0%,var(--bg-2) 100%);
}
button,input,select,textarea{font:inherit; color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink) 18%,transparent);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
body.ro .edit-only{display:none !important}
body.viewer .staff-only{display:none !important}
.avatar{width:22px; height:22px; border-radius:99px; flex:none; object-fit:cover; border:1px solid var(--stroke)}
.avatar.ph{display:grid; place-items:center; background:var(--glass-2); color:var(--ink-3)}
.rolechip{display:inline-flex; align-items:center; height:17px; padding:0 6px; border-radius:99px; margin-left:5px;
  font-size:10px; font-weight:700; background:color-mix(in srgb,var(--c) 18%,transparent);
  color:color-mix(in srgb,var(--c) 80%,var(--ink)); border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}
#btnAuth{max-width:230px}
#authName{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ============ glass primitives ============ */
.glass{
  background:var(--glass); border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(22px) saturate(150%); backdrop-filter:blur(22px) saturate(150%);
  box-shadow:var(--shadow);
}
.btn{
  display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 11px;
  border-radius:var(--r-sm); border:1px solid var(--stroke); background:var(--glass-2);
  color:var(--ink-2); font-size:12.5px; font-weight:500; cursor:pointer; white-space:nowrap;
  transition:background .13s,color .13s,border-color .13s;
}
.btn:hover{background:var(--glass-3); color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.sm{height:26px; padding:0 8px; font-size:11.5px; border-radius:var(--r-xs)}
.btn.icon{width:32px; padding:0; justify-content:center}
.btn.icon.sm{width:26px}
.btn.on{background:var(--accent); border-color:transparent; color:var(--accent-ink)}
.btn.primary{background:var(--accent); border-color:transparent; color:var(--accent-ink); font-weight:600}
.btn.primary:hover{filter:brightness(1.08); color:var(--accent-ink)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 16%,transparent); color:var(--bad); border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn[disabled]{opacity:.4; pointer-events:none}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.xs{width:13px;height:13px}
.seg{display:inline-flex; padding:3px; gap:2px; border-radius:var(--r-md); background:var(--glass-2); border:1px solid var(--stroke-2)}
.seg.wrap{flex-wrap:wrap}
.seg .btn{border:0; background:transparent; box-shadow:none; height:26px}
.seg .btn.on{background:var(--glass-3); color:var(--ink); box-shadow:var(--shadow-sm)}
.rowseg{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  display:inline-flex; align-items:center; gap:5px; height:21px; padding:0 8px; border-radius:99px;
  font-size:11px; font-weight:600;
  background:color-mix(in srgb,var(--c,var(--ink-3)) 16%,transparent);
  color:color-mix(in srgb,var(--c,var(--ink-3)) 78%,var(--ink));
  border:1px solid color-mix(in srgb,var(--c,var(--ink-3)) 30%,transparent);
}
.dot{width:7px;height:7px;border-radius:99px;background:var(--c,var(--ink-3));flex:none}
.lbl{font-size:10.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
.field{width:100%; height:32px; padding:0 10px; border-radius:var(--r-sm); border:1px solid var(--stroke);
  background:var(--glass-2); color:var(--ink); font-size:13px}
textarea.field{height:auto; padding:8px 10px; resize:vertical; min-height:60px; line-height:1.5; font-family:var(--f-ui)}
select.field{cursor:pointer}
.field:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.hues{display:flex; gap:5px; flex-wrap:wrap}
.hue{width:22px; height:22px; border-radius:7px; cursor:pointer; padding:0;
  border:1px solid var(--stroke); background:color-mix(in srgb,var(--h) 80%,transparent)}
.hue.on{outline:2px solid var(--ink); outline-offset:1px}
.empty{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  padding:26px 16px; color:var(--ink-3); font-size:12.5px; text-align:center}
.empty .ico{width:22px;height:22px;opacity:.55}

/* ============ shell ============ */
.app{height:100%; display:flex; flex-direction:column; gap:8px; padding:8px}
.topbar{display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:var(--r-lg); flex:none; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:9px}
.brandname{font-size:13.5px; font-weight:700; letter-spacing:-.025em; white-space:nowrap; color:var(--ink)}
.brandsep{width:1px; height:16px; background:var(--stroke); flex:none}
@media (max-width:1360px){ .brandname,.brandsep{display:none} }
.brand-mark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--camp) 70%,var(--accent)));
  color:#fff; box-shadow:var(--shadow-sm)}
.brand-mark .ico{width:16px;height:16px;stroke-width:1.9}
#docTitle{font-size:14.5px; font-weight:600; border:1px solid transparent; background:transparent;
  border-radius:var(--r-xs); padding:3px 6px; width:146px; letter-spacing:-.01em}
#docTitle:hover{background:var(--glass-2)}
#docTitle:focus{background:var(--glass-3); border-color:var(--stroke); outline:none}
.spacer{flex:1}
.savechip{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-3); padding:0 4px; white-space:nowrap}
.savechip .dot{--c:var(--ok)}
.savechip[data-state="dirty"] .dot{--c:var(--warn)}
.savechip[data-state="off"] .dot{--c:var(--ink-3)}
.view{display:none; flex:1; min-height:0}
.view.on{display:flex; flex-direction:column; gap:8px}

/* 보드 드롭다운 · 공용 메뉴 */
.boardbtn{max-width:220px}
.boardbtn .bn{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.menu{position:fixed; z-index:130; width:290px; border-radius:var(--r-md); padding:6px; display:flex; flex-direction:column; gap:2px;
  max-height:70vh; overflow:auto}
.menu .mi{display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:var(--r-xs); cursor:pointer;
  font-size:12.5px; border:0; background:transparent; color:var(--ink-2); text-align:left; width:100%}
.menu .mi:hover{background:var(--glass-2); color:var(--ink)}
.menu .mi.on{background:var(--accent-soft); color:var(--ink); font-weight:600}
.menu .mi .cnt{margin-left:auto; font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3)}
.menu .sepline{height:1px; background:var(--stroke-2); margin:5px 2px}

/* ============ flow canvas ============ */
.flow{position:relative; border-radius:var(--r-lg); overflow:hidden; flex:none; min-height:130px}
.flow-grid{position:absolute; inset:0;
  background-image:radial-gradient(circle at 1px 1px,var(--grid) 1px,transparent 0);
  background-size:22px 22px; pointer-events:none}
#flowSurface{position:absolute; inset:0; cursor:grab; touch-action:none}
#flowSurface.panning{cursor:grabbing}
#flowSurface.linking{cursor:crosshair}
#flowWorld{position:absolute; top:0; left:0; transform-origin:0 0; width:0; height:0}
#edgeLayer{position:absolute; overflow:visible; left:0; top:0; width:1px; height:1px; pointer-events:none}
#edgeLayer .hit{stroke:transparent; stroke-width:18; fill:none; pointer-events:stroke; cursor:pointer}
#edgeLayer path.wire{fill:none; stroke-linecap:round; transition:stroke .12s}
#edgeLayer text{font:600 10.5px var(--f-ui); fill:var(--ink-2); paint-order:stroke;
  stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; pointer-events:none}
#edgeHandles circle{pointer-events:auto; cursor:grab}
#edgeHandles .wp{fill:var(--bg-3); stroke:var(--accent); stroke-width:2}
#edgeHandles .wpadd{fill:var(--accent); opacity:.32; stroke:var(--bg-3); stroke-width:1.5}
#edgeHandles .wpadd:hover{opacity:.95}
#guideG .guide{stroke:var(--accent); stroke-width:1; stroke-dasharray:4 4; opacity:.85}
.flow.busy .node{box-shadow:none}

.node{
  position:absolute; width:190px; border-radius:var(--r-md); overflow:hidden; cursor:grab;
  background:var(--glass-3); border:1px solid var(--stroke); box-shadow:var(--shadow-sm);
  contain:layout style; transition:box-shadow .15s,border-color .15s;
}
.node.size-s{width:150px} .node.size-m{width:190px} .node.size-l{width:240px}
.node.sharp{border-radius:5px}
.node.hued{border-color:color-mix(in srgb,var(--nc) 42%,var(--stroke))}
.node.hued::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--nc); z-index:3}
.node:hover{box-shadow:var(--shadow)}
.node.sel{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.node.dragging{cursor:grabbing; z-index:20}
.node.link-src{border-color:var(--camp); box-shadow:0 0 0 2px color-mix(in srgb,var(--camp) 30%,transparent)}
.node.drop-on{outline:2px solid var(--accent); outline-offset:3px}
.node-thumb{height:86px; background:var(--glass-2); position:relative; display:grid; place-items:center; overflow:hidden;
  border-bottom:1px solid var(--stroke-2)}
.node.size-s .node-thumb{height:66px}
.node.size-l .node-thumb{height:110px}
.node-thumb img{width:100%; height:100%; object-fit:cover; object-position:top center; display:block}
.node-thumb .ph{display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--ink-3); font-size:10.5px}
.node-thumb .ph .ico{width:18px;height:18px;opacity:.5}
.node-kind{position:absolute; top:6px; left:6px; height:18px; padding:0 7px; border-radius:99px; font-size:10px;
  font-weight:600; display:flex; align-items:center; background:var(--glass-3); border:1px solid var(--stroke);
  color:var(--ink-2)}
.node.hued .node-kind{color:color-mix(in srgb,var(--nc) 70%,var(--ink)); border-color:color-mix(in srgb,var(--nc) 40%,transparent)}
.node-main{padding:9px 10px 10px; display:flex; flex-direction:column; gap:6px}
.node-name{font-size:14.5px; font-weight:700; letter-spacing:-.022em; line-height:1.24; word-break:keep-all; color:var(--ink)}
.node.size-s .node-name{font-size:13px}
.node.size-l .node-name{font-size:16.5px}
.node-path{font-family:var(--f-mono); font-size:10px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:-4px}
.node-badges{display:flex; flex-wrap:wrap; gap:4px}
.bdg{display:inline-flex; align-items:center; gap:4px; height:23px; padding:0 7px; border-radius:7px;
  font-size:11px; font-weight:600; font-family:var(--f-mono);
  background:color-mix(in srgb,var(--c) 15%,transparent); color:color-mix(in srgb,var(--c) 78%,var(--ink));
  border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.bdg b{font-size:14px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums}
.bdg .ico{width:12px;height:12px;stroke-width:2.1}
.bdg.big{height:27px; padding:0 10px; border-radius:8px}
.bdg.big b{font-size:17px}
.bdg.big .ico{width:14px;height:14px}
.node.size-s .bdg{height:21px} .node.size-s .bdg b{font-size:12.5px}
.node.size-l .bdg b{font-size:15.5px}

/* 보기 모드 — 페이지 이름 아래에 해당 항목만 크게 */
.node-focus{display:flex; flex-direction:column; gap:4px; padding-top:7px; border-top:1px dashed var(--stroke-2)}
.fitem{display:flex; align-items:flex-start; gap:6px; line-height:1.35; color:var(--ink)}
.fitem .ico{color:var(--c); width:13px; height:13px; stroke-width:2.1; flex:none; margin-top:2px}
.ftext{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px}
.fev{font-size:12.5px; font-weight:600; letter-spacing:-.012em; word-break:keep-all; overflow-wrap:anywhere;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.fmeta{font-size:10px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.node-focus.tags .fev{font-family:var(--f-mono); font-size:11.5px; word-break:break-all}
.node.size-l .fev{font-size:13.5px}
.node.size-l .node-focus.tags .fev{font-size:12.5px}
.node.size-s .fev{font-size:11.5px}
.node.size-s .fmeta{display:none}
.fdot{width:7px; height:7px; border-radius:99px; flex:none; margin-top:4px}
.fitem.more{font-size:10.5px; color:var(--ink-3); padding-left:19px}
.fnone{font-size:11px; color:var(--ink-3); padding-top:7px; border-top:1px dashed var(--stroke-2)}
.node.dim{opacity:.38}
.node.dim:hover,.node.dim.sel{opacity:.95}
.node-camps{display:flex; flex-direction:column; gap:3px; padding-top:6px; border-top:1px dashed var(--stroke-2)}
.ncamp{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--ink-2); line-height:1.35}
.ncamp .ico{color:var(--c); width:11px; height:11px; stroke-width:2}
.nc-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nc-dot{width:6px; height:6px; border-radius:99px; flex:none}
.ncamp.more{color:var(--ink-3); padding-left:16px}
.thumb-acts{position:absolute; left:6px; right:6px; bottom:6px; display:flex; gap:5px; justify-content:space-between;
  align-items:flex-end; pointer-events:none; opacity:0; transition:opacity .15s}
.node:hover .thumb-acts,.thumb-acts:focus-within{opacity:1}
.node-thumb .pick{padding:0; border:0; background:transparent; cursor:pointer; pointer-events:auto; min-width:0}
.node-thumb .pick span{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:600; color:var(--ink);
  background:var(--glass-3); border:1px solid var(--stroke); border-radius:99px; padding:3px 8px; box-shadow:var(--shadow-sm);
  white-space:nowrap; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.node-thumb .pick:hover span{border-color:var(--accent); color:var(--accent)}
.node.size-s .node-thumb .pick span{font-size:10px; padding:3px 6px}
.port{pointer-events:none; position:absolute; width:13px; height:13px; border-radius:99px; background:var(--bg-3);
  border:2px solid var(--accent); opacity:0; transition:opacity .15s,transform .15s; cursor:crosshair; z-index:5}
.node:hover .port,.node.sel .port{opacity:1; pointer-events:auto}
.port:hover{transform:scale(1.35)}
.port.e{right:-7px; top:50%; margin-top:-6.5px} .port.w{left:-7px; top:50%; margin-top:-6.5px}
.port.s{bottom:-7px; left:50%; margin-left:-6.5px} .port.n{top:-7px; left:50%; margin-left:-6.5px}
.flow-tools{position:absolute; top:10px; left:10px; display:flex; gap:6px; z-index:30; padding:5px;
  border-radius:var(--r-md); flex-wrap:wrap; max-width:calc(100% - 20px); align-items:center}
.flow-zoom{position:absolute; bottom:10px; right:10px; display:flex; gap:4px; z-index:30; padding:5px;
  border-radius:var(--r-md); align-items:center}
.zoomval{font-family:var(--f-mono); font-size:11px; color:var(--ink-2); min-width:38px; text-align:center}
.flow-drop{position:absolute; inset:10px; z-index:26; display:none; place-items:center; pointer-events:none;
  border:2px dashed var(--accent); border-radius:var(--r-md); background:var(--accent-soft);
  font-weight:600; color:var(--accent); font-size:13px; text-align:center; line-height:1.6}
.flow.dragover .flow-drop{display:grid}
.splitter-h{height:9px; flex:none; cursor:row-resize; display:grid; place-items:center; border-radius:99px; touch-action:none}
.splitter-h::after{content:""; width:54px; height:3px; border-radius:99px; background:var(--stroke); transition:background .16s,width .16s}
.splitter-h:hover::after{background:var(--accent); width:80px}
.splitter-v{width:9px; flex:none; cursor:col-resize; display:grid; place-items:center; touch-action:none}
.splitter-v::after{content:""; height:54px; width:3px; border-radius:99px; background:var(--stroke); transition:background .16s,height .16s}
.splitter-v:hover::after{background:var(--accent); height:80px}

/* ============ lower deck ============ */
.deck{flex:1; min-height:0; display:flex}
.pane{border-radius:var(--r-lg); overflow:hidden; display:flex; flex-direction:column; min-width:0}
.pane.side{flex:none}
.pane.center{flex:1}
.pane-head{display:flex; align-items:center; gap:8px; padding:9px 11px; flex:none;
  border-bottom:1px solid var(--stroke-2); background:var(--glass-2)}
.pane-head h2{margin:0; font-size:12.5px; font-weight:600; letter-spacing:-.01em; display:flex; align-items:center; gap:7px}
.pane-head h2 .ico{width:14px;height:14px;color:var(--ink-3)}
.count{font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); background:var(--glass-2);
  border:1px solid var(--stroke-2); border-radius:6px; padding:1px 5px}
.pane-body{flex:1; min-height:0; overflow:auto; padding:10px; display:flex; flex-direction:column; gap:8px}
.pane-foot{flex:none; padding:8px 10px; border-top:1px solid var(--stroke-2); background:var(--glass-2)}

/* cards in side panels */
.card{border-radius:var(--r-md); border:1px solid var(--stroke); background:var(--glass-2); padding:9px 10px;
  display:flex; flex-direction:column; gap:7px; position:relative; transition:border-color .16s,background .16s}
.card:hover{background:var(--glass-3); border-color:var(--stroke)}
.card.pinned{border-color:color-mix(in srgb,var(--camp) 45%,transparent)}
.card-top{display:flex; align-items:flex-start; gap:8px}
.card-title{font-size:12.5px; font-weight:600; line-height:1.3; flex:1; word-break:break-word; letter-spacing:-.01em}
.card-acts{display:flex; gap:3px; opacity:0; transition:opacity .16s}
.card:hover .card-acts,.card:focus-within .card-acts{opacity:1}
.meta{display:flex; flex-wrap:wrap; gap:5px 10px; font-size:11px; color:var(--ink-3)}
.meta b{font-weight:500; color:var(--ink-2)}
.kv{display:flex; gap:6px; font-size:11px; font-family:var(--f-mono); color:var(--ink-2); flex-wrap:wrap}
.kv span{background:var(--glass-2); border:1px solid var(--stroke-2); border-radius:5px; padding:1px 5px}
.evt{font-family:var(--f-mono); font-size:11.5px; color:var(--ink); background:var(--glass-2);
  border:1px solid var(--stroke-2); border-radius:6px; padding:2px 6px; display:inline-block; word-break:break-all}
.linkline{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--camp); font-weight:500}

/* ============ stage ============ */
.stage-wrap{flex:1; min-height:0; position:relative; overflow:hidden; background:
  repeating-conic-gradient(var(--stroke-2) 0% 25%, transparent 0% 50%) 50%/18px 18px}
#stageScroll{position:absolute; inset:0; overflow:auto; display:grid; justify-items:center; align-items:center;
  justify-content:safe center; align-content:safe center; padding:18px}
#stageDoc{position:relative; transform-origin:center center; box-shadow:var(--shadow); border-radius:6px;
  background:var(--bg-3); flex:none}
#stageDoc img.shot{display:block; width:100%; height:100%; object-fit:contain; border-radius:6px; pointer-events:none; user-select:none}
#layerSvg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
#layerSvg .lyr{cursor:pointer}
#layerSvg .lyr.sel .shape{stroke-dasharray:none; filter:drop-shadow(0 0 0 transparent)}
#layerSvg .selbox{fill:none; stroke:var(--accent); stroke-width:1.5; stroke-dasharray:5 4; vector-effect:non-scaling-stroke}
#layerSvg .handle{fill:var(--bg-3); stroke:var(--accent); stroke-width:1.5; cursor:nwse-resize; vector-effect:non-scaling-stroke}
#layerSvg text.ltext{font-family:var(--f-ui); font-weight:600; dominant-baseline:hanging; white-space:pre}
#layerSvg .pin{cursor:pointer}
#layerSvg .pin circle{stroke:var(--bg-3); stroke-width:2}
#layerSvg .pin text{font:700 10px var(--f-mono); fill:#fff; text-anchor:middle; dominant-baseline:central; pointer-events:none}
.stage-empty{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none}
.stage-tools{display:flex; align-items:center; gap:5px; flex-wrap:wrap}
.tool-sep{width:1px; height:20px; background:var(--stroke); margin:0 2px}
.swatches{display:flex; gap:3px; align-items:center}
.sw{width:17px; height:17px; border-radius:5px; border:2px solid transparent; cursor:pointer; padding:0;
  box-shadow:0 0 0 1px var(--stroke)}
.sw.on{border-color:var(--ink); box-shadow:0 0 0 1px var(--bg-3) inset}
.stage-foot{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-3)}
.dropzone{position:absolute; inset:8px; border-radius:var(--r-md); border:2px dashed var(--accent);
  background:var(--accent-soft); display:none; place-items:center; font-weight:600; color:var(--accent); z-index:40}
.stage-wrap.dragover .dropzone{display:grid}

/* 일괄 등록 */
.bulk{display:flex; flex-direction:column; gap:6px; max-height:44vh; overflow:auto; padding-right:2px}
.brow{display:flex; align-items:center; gap:9px; padding:6px 8px; border:1px solid var(--stroke-2);
  border-radius:var(--r-sm); background:var(--glass-2)}
.brow .avatar{width:26px; height:26px}
.brow img{width:36px; height:50px; object-fit:cover; object-position:top center; border-radius:5px;
  border:1px solid var(--stroke-2); background:var(--bg-3); flex:none}
.brow .fn{flex:1; min-width:0; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.brow .fn em{display:block; font-style:normal; font-size:10.5px; color:var(--ink-3)}
.brow select{width:158px; height:28px; font-size:12px; flex:none}
.brow.done{opacity:.5}
.bulkbar{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-3)}

/* ============ list views ============ */
.listwrap{flex:1; min-height:0; border-radius:var(--r-lg); overflow:hidden; display:flex; flex-direction:column}
.toolrow{display:flex; align-items:center; gap:8px; padding:10px 12px; flex-wrap:wrap; border-bottom:1px solid var(--stroke-2); background:var(--glass-2)}
.toolrow .field{width:auto; min-width:120px}
.scroller{flex:1; min-height:0; overflow:auto; padding:2px 0 12px}
table.tbl{width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px}
table.tbl th{position:sticky; top:0; z-index:2; text-align:left; padding:9px 12px; font-size:10.5px; font-weight:600;
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); background:var(--glass-3);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-bottom:1px solid var(--stroke); white-space:nowrap}
table.tbl td{padding:9px 12px; border-bottom:1px solid var(--stroke-2); vertical-align:top}
table.tbl tr:hover td{background:var(--glass-2)}
table.tbl td.nowrap{white-space:nowrap}
.rowacts{display:flex; gap:4px; opacity:0; transition:opacity .16s}
tr:hover .rowacts{opacity:1}
.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:10px; padding:12px}
.ccard{border-radius:var(--r-md); border:1px solid var(--stroke); background:var(--glass-2); padding:12px;
  display:flex; flex-direction:column; gap:9px; position:relative; overflow:hidden}
.ccard::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c,var(--camp))}
.ccard h3{margin:0; font-size:13.5px; font-weight:600; letter-spacing:-.01em; padding-left:4px}
.ccard .where{display:flex; flex-wrap:wrap; gap:4px}
.pagechip{font-size:10.5px; padding:2px 7px; border-radius:99px; background:var(--glass-2);
  border:1px solid var(--stroke-2); color:var(--ink-2); cursor:pointer}
.pagechip:hover{border-color:var(--accent); color:var(--accent)}
.statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; padding:12px 12px 0}
.stat{border-radius:var(--r-md); border:1px solid var(--stroke); background:var(--glass-2); padding:10px 12px;
  display:flex; flex-direction:column; gap:2px}
.stat .n{font-family:var(--f-mono); font-size:20px; font-weight:600; letter-spacing:-.02em; color:var(--c,var(--ink))}
.stat .t{font-size:11px; color:var(--ink-3)}

/* ============ modal / popover / toast ============ */
.scrim{position:fixed; inset:0; z-index:100; background:color-mix(in srgb,var(--bg) 55%,transparent);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); display:grid; place-items:center; padding:20px}
.modal{width:min(560px,100%); max-height:88vh; border-radius:var(--r-lg); display:flex; flex-direction:column; overflow:hidden}
.modal-head{display:flex; align-items:center; gap:9px; padding:14px 16px; border-bottom:1px solid var(--stroke-2)}
.modal-head h3{margin:0; font-size:15px; font-weight:600; letter-spacing:-.015em; flex:1}
.modal-body{padding:16px; overflow:auto; display:flex; flex-direction:column; gap:13px}
.modal-foot{padding:12px 16px; border-top:1px solid var(--stroke-2); display:flex; gap:8px; justify-content:flex-end;
  background:var(--glass-2)}
.frow{display:flex; flex-direction:column; gap:5px}
.frow.two{flex-direction:row; gap:10px} .frow.two>*{flex:1; min-width:0}
.hint{font-size:11px; color:var(--ink-3)}
.proprow{display:flex; gap:6px; align-items:center}
.proprow .field{font-family:var(--f-mono); font-size:12px}
.popover{position:fixed; z-index:120; border-radius:var(--r-md); padding:10px; display:flex; flex-direction:column; gap:9px;
  width:250px; box-shadow:var(--shadow); max-height:88vh; overflow:auto}
.popover.wide{width:302px}
.toast .btn{margin-left:6px; height:22px}
.lockrow{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-2)}
.lockrow .ico{color:var(--ink-3)}
.stale{color:var(--warn)}
#toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:200; display:flex;
  flex-direction:column; gap:6px; align-items:center; pointer-events:none}
.toast{border-radius:99px; padding:8px 16px; font-size:12.5px; font-weight:500; box-shadow:var(--shadow);
  background:var(--glass-3); border:1px solid var(--stroke); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  animation:pop .22s ease-out}
.toast.bad{color:var(--bad)} .toast.ok{color:var(--ok)}
@keyframes pop{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important}}
@media (max-width:860px){
  .deck{flex-direction:column; overflow:auto}
  .pane.side{width:auto !important; flex:none; height:220px}
  .splitter-v{display:none}
  .pane.center{min-height:320px}
}
</style>

let dbPromise = null;

  });
}

  if (e.route === "line") return "M " + [g.p1].concat(g.wps, [g.p2]).map(p => p.x + " " + p.y).join(" L ");

  if (!g.wps.length) {                              // 기본 곡선 — 연결점 방향으로 부드럽게 빠져나간다
    const dist = Math.hypot(g.p2.x - g.p1.x, g.p2.y - g.p1.y);

/* 움직이는 동안에는 GPU 레이어로 부드럽게, 멈추면 레이어를 풀어

let settleTimer = 0;
function settleTransform() {
  const v = B().view, w = $("#flowWorld");
  w.style.willChange = "auto";
  w.style.transform = "translate(" + v.panX + "px," + v.panY + "px) scale(" + v.zoom + ")";
}

  if (live) {
    w.style.willChange = "transform";
    w.style.transform = "translate3d(" + v.panX + "px," + v.panY + "px,0) scale(" + v.zoom + ")";
    settleTimer = setTimeout(settleTransform, 160);

  v.panX = cx - (cx - v.panX) * (z / old);

  nodes.forEach(n => { const q = nodeRect(n); x1 = Math.min(x1, q.x); y1 = Math.min(y1, q.y); x2 = Math.max(x2, q.x + q.w + 90); y2 = Math.max(y2, q.y + q.h); });

/* ---------------- 자석 정렬 ---------------- */
const SNAP_T = 7;
function snapPos(n, x, y) {
  const guides = [];
  if (!state.ui.snap) return { x: Math.round(x), y: Math.round(y), guides };
  const sz = NSZ[n.id] || { w: nodeW(n), h: 150 };
  const mine = { x: [x, x + sz.w / 2, x + sz.w], y: [y, y + sz.h / 2, y + sz.h] };
  let bx = null, by = null;
  B().nodes.forEach(o => {
    if (o.id === n.id) return;
    const r = nodeRect(o);
    [r.x, r.x + r.w / 2, r.x + r.w].forEach(ov => mine.x.forEach(mv => {
      const d = Math.abs(mv - ov);
      if (d <= SNAP_T && (!bx || d < bx.d)) bx = { d, at: ov, shift: ov - mv, o: r };
    }));
    [r.y, r.y + r.h / 2, r.y + r.h].forEach(ov => mine.y.forEach(mv => {
      const d = Math.abs(mv - ov);
      if (d <= SNAP_T && (!by || d < by.d)) by = { d, at: ov, shift: ov - mv, o: r };
    }));
  });
  const nx = Math.round(bx ? x + bx.shift : Math.round(x / GRID) * GRID);
  const ny = Math.round(by ? y + by.shift : Math.round(y / GRID) * GRID);
  if (bx) guides.push({ v: true, at: bx.at, a: Math.min(ny, bx.o.y) - 26, b: Math.max(ny + sz.h, bx.o.y + bx.o.h) + 26 });
  if (by) guides.push({ v: false, at: by.at, a: Math.min(nx, by.o.x) - 26, b: Math.max(nx + sz.w, by.o.x + by.o.w) + 26 });

}

  const g = $("#guideG");
  const html = (guides || []).map(q => q.v
    ? '<line class="guide" x1="' + q.at + '" y1="' + q.a + '" x2="' + q.at + '" y2="' + q.b + '"></line>'
    : '<line class="guide" x1="' + q.a + '" y1="' + q.at + '" x2="' + q.b + '" y2="' + q.at + '"></line>').join("");
  if (g.innerHTML !== html) g.innerHTML = html;
}

/* ---------------- 상호작용 ---------------- */
function initFlow() {
  const surf = $("#flowSurface");
  const busy = on => $("#flowPane").classList.toggle("busy", on);
  const toWorld = (ev, r) => ({ x: (ev.clientX - r.left - B().view.panX) / B().view.zoom, y: (ev.clientY - r.top - B().view.panY) / B().view.zoom });

  surf.addEventListener("wheel", e => {
    e.preventDefault();
    const r = surf.getBoundingClientRect();
    zoomTo(B().view.zoom * (e.deltaY < 0 ? 1.12 : 0.893), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  surf.addEventListener("pointerdown", e => {
    const r = surf.getBoundingClientRect();
    const wp = e.target.closest("[data-wp]"), add = e.target.closest("[data-add]");
    const port = e.target.closest("[data-port]");
    const nodeEl = e.target.closest("[data-node]");
    const edgeHit = e.target.closest("[data-edge]");
    const editable = canEdit();

    if (editable && (wp || add) && sel.edge) {           /* 경로 꺾임점 드래그 · 추가 */
      e.preventDefault(); e.stopPropagation();
      const ed = edgeById(sel.edge);
      let idx;
      if (wp) idx = +wp.dataset.wp;
      else { idx = +add.dataset.add; ed.points.splice(idx, 0, toWorld(e, r)); }
      const paint = onFrame(p => {
        ed.points[idx] = { x: Math.round(p.x), y: Math.round(p.y) };
        geomEdge(ed, EDGE_EL[ed.id]); drawEdgeHandles();
      });
      const mv = ev => paint(toWorld(ev, r));
      const up = () => {
        surf.removeEventListener("pointermove", mv); surf.removeEventListener("pointerup", up);
        markDirty(); geomEdge(ed, EDGE_EL[ed.id]); drawEdgeHandles();
      };
      surf.setPointerCapture(e.pointerId);
      surf.addEventListener("pointermove", mv); surf.addEventListener("pointerup", up);
      return;
    }

    if (editable && port) {                              /* 포트 드래그 → 연결 */
      e.preventDefault(); e.stopPropagation();
      const from = port.dataset.port, ghost = $("#ghostWire");
      const rf = nodeRect(nodeById(from));
      const c0 = { x: rf.x + rf.w / 2, y: rf.y + rf.h / 2 };
      ghost.style.display = "";
      const paint = onFrame(p => ghost.setAttribute("d", "M " + c0.x + " " + c0.y + " L " + p.x + " " + p.y));
      const mv = ev => paint(toWorld(ev, r));
      const up = ev => {
        surf.removeEventListener("pointermove", mv); surf.removeEventListener("pointerup", up);
        ghost.style.display = "none";
        const tgt = document.elementFromPoint(ev.clientX, ev.clientY);
        const tn = tgt && tgt.closest("[data-node]");
        if (tn) addEdge(from, tn.dataset.node);
      };
      surf.setPointerCapture(e.pointerId);
      surf.addEventListener("pointermove", mv); surf.addEventListener("pointerup", up);
      return;
    }

    if (nodeEl) {                                        /* 노드 선택 · 이동 */
      const id = nodeEl.dataset.node;
      if (editable && flowMode === "link") {
        e.preventDefault();
        if (!linkFrom) { linkFrom = id; paintSelection(); toast("연결할 도착 페이지를 클릭하세요"); }
        else { addEdge(linkFrom, id); linkFrom = null; paintSelection(); }
        return;
      }
      if (sel.node !== id) selectNode(id);
      if (sel.edge) { sel.edge = null; drawEdges(); }
      if (!editable) return;
      const n = nodeById(id), sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y;
      let moved = false;
      nodeEl.classList.add("dragging"); busy(true);
      const paint = onFrame(() => { nodeEl.style.left = n.x + "px"; nodeEl.style.top = n.y + "px"; moveEdgesOf(id); });
      const mv = ev => {
        const dx = (ev.clientX - sx) / B().view.zoom, dy = (ev.clientY - sy) / B().view.zoom;
        if (!moved && Math.abs(dx) + Math.abs(dy) < 3) return;
        moved = true;
        const s = snapPos(n, ox + dx, oy + dy);
        n.x = s.x; n.y = s.y;
        drawGuides(s.guides);
        paint();
      };
      const up = () => {
        surf.removeEventListener("pointermove", mv); surf.removeEventListener("pointerup", up);
        nodeEl.classList.remove("dragging"); busy(false); drawGuides([]);
        if (moved) { nodeEl.style.left = n.x + "px"; nodeEl.style.top = n.y + "px"; moveEdgesOf(id); markDirty(); }
      };
      surf.setPointerCapture(e.pointerId);
      surf.addEventListener("pointermove", mv); surf.addEventListener("pointerup", up);
      return;
    }

/* ---------------- 자동 정렬 ----------------
   지금 자리를 기준점으로 삼아 흐름 순서대로 다시 세운다.
   화면(zoom·pan)은 건드리지 않으므로 시야가 튀지 않고, 되돌리기를 제공한다. */
function autoLayout() {
  const nodes = B().nodes, edges = B().edges;
  if (!nodes.length) return;
  const prev = nodes.map(n => ({ id: n.id, x: n.x, y: n.y }));
  const ox = Math.min.apply(null, nodes.map(n => n.x));
  const oy = Math.min.apply(null, nodes.map(n => n.y));

  const parent = {}; nodes.forEach(n => parent[n.id] = n.id);
  const find = a => parent[a] === a ? a : (parent[a] = find(parent[a]));
  edges.forEach(e => { if (parent[e.from] && parent[e.to]) parent[find(e.from)] = find(e.to); });
  const groups = {};
  nodes.forEach(n => (groups[find(n.id)] = groups[find(n.id)] || []).push(n));

  let cursorY = oy;
  Object.keys(groups).forEach(key => {
    const g = groups[key], ids = g.map(n => n.id);
    const inner = edges.filter(e => ids.indexOf(e.from) >= 0 && ids.indexOf(e.to) >= 0 && e.from !== e.to);
    const depth = {}; ids.forEach(id => depth[id] = 0);
    for (let pass = 0; pass < ids.length + 2; pass++) {
      let moved = false;
      inner.forEach(e => { if (depth[e.to] < depth[e.from] + 1) { depth[e.to] = depth[e.from] + 1; moved = true; } });
      if (!moved) break;
    }
    const cols = {};
    g.forEach(n => (cols[depth[n.id]] = cols[depth[n.id]] || []).push(n));
    const colKeys = Object.keys(cols).map(Number).sort((a, b) => a - b);
    const order = {};
    colKeys.forEach((c, ci) => {
      cols[c].forEach((n, i) => {
        if (!ci) { order[n.id] = i; return; }
        const ps = inner.filter(e => e.to === n.id).map(e => order[e.from]).filter(v => v != null);
        order[n.id] = ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : i + 0.5;
      });
      cols[c].sort((a, b) => order[a.id] - order[b.id]);
      cols[c].forEach((n, i) => order[n.id] = i);
    });
    const rowH = [];
    const maxRows = Math.max.apply(null, colKeys.map(c => cols[c].length));
    for (let i = 0; i < maxRows; i++) {
      rowH[i] = Math.max.apply(null, colKeys.map(c => cols[c][i] ? (NSZ[cols[c][i].id] ? NSZ[cols[c][i].id].h : 150) : 0).concat([110]));
    }
    let x = ox;
    colKeys.forEach(c => {
      let y = cursorY;
      const colW = Math.max.apply(null, cols[c].map(n => NSZ[n.id] ? NSZ[n.id].w : nodeW(n)));
      cols[c].forEach((n, i) => {
        n.x = Math.round(x / GRID) * GRID;
        n.y = Math.round(y / GRID) * GRID;
        y += rowH[i] + 56;
      });
      x += colW + 78;
    });
    cursorY += rowH.reduce((a, b) => a + b + 56, 0) + 30;
  });

  markDirty(); renderFlow();
  toast("흐름 순서대로 정렬했습니다", "ok", {
    label: "되돌리기",
    fn: () => { prev.forEach(p => { const n = nodeById(p.id); if (n) { n.x = p.x; n.y = p.y; } }); markDirty(); renderFlow(); }
  });
}

/* ========================================================================
   스테이지 — 화면 크게 보기 · 레이어 그리기 · 캠페인 배치
   렌더 원칙: 화면 이미지는 한 번만 붙이고, 레이어 SVG만 다시 그린다.

let mounted = { id: null, src: null, w: 0, h: 0 };

function docSize(n) { return { w: n.shotW || DOC_W, h: n.shotH || DOC_H }; }
function stageScale(n) {
  const d = docSize(n);
  if (stageZoom) return stageZoom;
  const box = $("#stageScroll").getBoundingClientRect();
  return clamp(Math.min((box.width - 36) / d.w, (box.height - 36) / d.h), 0.05, 4);
}
function bbox(l) {
  if (l.kind === "pen") {
    const xs = l.points.map(p => p[0]), ys = l.points.map(p => p[1]);
    return { x: Math.min.apply(null, xs), y: Math.min.apply(null, ys), w: Math.max.apply(null, xs) - Math.min.apply(null, xs), h: Math.max.apply(null, ys) - Math.min.apply(null, ys) };

  else if (l.kind === "pen")

  else if (l.kind === "image")

}

      img.onload = () => {
        const r = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * r)), h = Math.max(1, Math.round(img.height * r));
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        const type = supportsWebp() ? "image/webp" : (keepAlpha ? "image/png" : "image/jpeg");
        res({ src: cv.toDataURL(type, quality), w, h, type });
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
async function setShot(file, node, quiet) {
  const n = node || curNode(); if (!n || !file) return;
  try {
    const big = await readImage(file, 1200, 0.82, false);
    const th = await readImage(file, 300, 0.6, false);
    n.shotData = big.src; n.shotW = big.w; n.shotH = big.h; n.shotType = big.type;
    n.thumb = th.src; n.shotDirty = true;
    if (n.id === sel.node) stageZoom = null;
    markDirty();
    if (!quiet) {
      renderFlow();
      if (n.id === sel.node) renderStage();
      toast("화면 이미지를 등록했습니다 · " + Math.round(big.src.length / 1365) + "KB", "ok");
    }
  } catch (e) {
    if (quiet) throw e;
    toast("이미지를 읽지 못했습니다", "bad");
  }
}
async function addImageLayer(file) {
  const n = curNode(); if (!n || !file) return;
  try {
    const im = await readImage(file, 640, 0.82, true);
    const d = docSize(n), r = Math.min(1, (d.w * 0.55) / im.w);
    n.layers.push({ id: uid("l"), kind: "image", src: im.src, x: Math.round(d.w * 0.1), y: Math.round(d.h * 0.1), w: Math.round(im.w * r), h: Math.round(im.h * r), campId: null });
    sel.layer = n.layers[n.layers.length - 1].id;
    markDirty(); renderFlow(); renderStage(); renderPanels();
  } catch (e) { toast("이미지를 읽지 못했습니다", "bad"); }
}
function removeShot() {

/* ---------------- 레이어 상호작용 ---------------- */
function initStage() {
  const doc = $("#stageDoc"), wrap = $("#stageWrap");
  const toDoc = ev => {
    const n = curNode(), d = docSize(n), r = doc.getBoundingClientRect();
    return { x: (ev.clientX - r.left) / (r.width / d.w), y: (ev.clientY - r.top) / (r.height / d.h) };
  };

  doc.addEventListener("pointerdown", e => {
    const n = curNode(); if (!n || !canEdit()) return;
    const p = toDoc(e);
    const handle = e.target.closest("[data-handle]");
    const lyrEl = e.target.closest("[data-layer]");

    if (layerTool !== "select") {                       /* 새 레이어 그리기 */
      e.preventDefault();
      if (layerTool === "text") {
        openForm({
          title: "텍스트 레이어", icon: "text",
          fields: [{ k: "text", label: "내용" }, { k: "size", label: "글자 크기(px)", ph: "18" }],
          values: { text: "", size: "18" },
          onSave: v => {
            n.layers.push({ id: uid("l"), kind: "text", text: v.text || "텍스트", size: Number(v.size) || 18, x: Math.round(p.x), y: Math.round(p.y), color: drawColor, campId: null });
            sel.layer = n.layers[n.layers.length - 1].id;
            setTool("select"); markDirty(); renderFlow(); renderStage(); renderPanels();
          }
        });
        return;
      }
      const l = layerTool === "pen"
        ? { id: uid("l"), kind: "pen", points: [[p.x, p.y]], color: drawColor, stroke: 4, campId: null }
        : { id: uid("l"), kind: layerTool, x: p.x, y: p.y, w: 0, h: 0, color: drawColor, stroke: 3, fill: "none", campId: null };
      n.layers.push(l); sel.layer = l.id;
      const mv = ev => {
        const q = toDoc(ev);
        if (l.kind === "pen") { const last = l.points[l.points.length - 1]; if (Math.abs(q.x - last[0]) + Math.abs(q.y - last[1]) > 2) l.points.push([q.x, q.y]); }
        else { l.w = q.x - l.x; l.h = q.y - l.y; }
        paintLayers();
      };
      const up = () => {
        doc.removeEventListener("pointermove", mv); doc.removeEventListener("pointerup", up);
        if (l.kind !== "pen" && Math.abs(l.w) < 6 && Math.abs(l.h) < 6) { n.layers = n.layers.filter(x => x.id !== l.id); sel.layer = null; }
        if (l.kind === "pen" && l.points.length < 3) { n.layers = n.layers.filter(x => x.id !== l.id); sel.layer = null; }
        setTool("select"); markDirty(); renderFlow(); renderStage(); renderPanels();
      };
      doc.setPointerCapture(e.pointerId);
      doc.addEventListener("pointermove", mv); doc.addEventListener("pointerup", up);
      return;
    }

    if (handle && sel.layer) {                           /* 리사이즈 */
      e.preventDefault();
      const l = n.layers.find(x => x.id === sel.layer);
      const mv = ev => { const q = toDoc(ev); l.w = q.x - l.x; l.h = q.y - l.y; paintLayers(); };
      const up = () => { doc.removeEventListener("pointermove", mv); doc.removeEventListener("pointerup", up); markDirty(); renderLayers(); };
      doc.setPointerCapture(e.pointerId);
      doc.addEventListener("pointermove", mv); doc.addEventListener("pointerup", up);
      return;
    }

    if (lyrEl) {                                         /* 선택 + 이동 */
      e.preventDefault();
      const l = n.layers.find(x => x.id === lyrEl.dataset.layer);
      if (sel.layer !== l.id) { sel.layer = l.id; renderLayers(); renderStageFoot(n, l); renderPanels(); }
      const st = { x: p.x, y: p.y }, orig = l.kind === "pen" ? l.points.map(q => q.slice()) : { x: l.x, y: l.y };
      let moved = false;
      const mv = ev => {
        const q = toDoc(ev), dx = q.x - st.x, dy = q.y - st.y;
        if (!moved && Math.abs(dx) + Math.abs(dy) < 1) return;
        moved = true;
        if (l.kind === "pen") l.points = orig.map(pt => [pt[0] + dx, pt[1] + dy]);
        else { l.x = orig.x + dx; l.y = orig.y + dy; }
        paintLayers();
      };
      const up = () => { doc.removeEventListener("pointermove", mv); doc.removeEventListener("pointerup", up); if (moved) { markDirty(); renderLayers(); } };
      doc.setPointerCapture(e.pointerId);
      doc.addEventListener("pointermove", mv); doc.addEventListener("pointerup", up);
      return;
    }
    if (sel.layer) { sel.layer = null; renderLayers(); renderStageFoot(n, null); renderPanels(); }
  });

  $("#stageFoot").addEventListener("click", e => {
    const b = e.target.closest("[data-lact]"); if (!b) return;
    const n = curNode(), i = n.layers.findIndex(x => x.id === sel.layer);
    if (i < 0) return;
    const l = n.layers[i];
    if (b.dataset.lact === "del") { n.layers.splice(i, 1); sel.layer = null; }
    if (b.dataset.lact === "front") { n.layers.splice(i, 1); n.layers.push(l); }
    if (b.dataset.lact === "back") { n.layers.splice(i, 1); n.layers.unshift(l); }
    markDirty(); renderFlow(); renderStage(); renderPanels();
  });

  $("#layerTools").addEventListener("click", e => {
    const b = e.target.closest("[data-tool]"); if (b) setTool(b.dataset.tool);
  });
  $("#swatches").innerHTML = SWATCH.map(c => '<button class="sw' + (c === drawColor ? " on" : "") + '" data-c="' + c + '" style="background:' + c + '" title="' + c + '"></button>').join("");
  $("#swatches").addEventListener("click", e => {
    const b = e.target.closest("[data-c]"); if (!b) return;
    drawColor = b.dataset.c;
    $$(".sw").forEach(x => x.classList.toggle("on", x === b));
    const n = curNode(), L = n && n.layers.find(x => x.id === sel.layer);
    if (L) { L.color = drawColor; markDirty(); renderLayers(); }
  });

  $("#btnShot").addEventListener("click", () => {
    const n = curNode();
    if (n && shotSrc(n)) {
      openForm({
        title: "화면 이미지", icon: "image", okText: "새 이미지 올리기",
        fields: [], note: "현재 등록된 화면을 교체하거나 삭제합니다. 레이어는 그대로 유지됩니다.",
        values: {}, onSave: () => pickFile(setShot),
        onDelete: () => confirmDel("이 화면의 이미지를 삭제할까요?", removeShot)
      });
    } else pickFile(setShot);
  });
  $("#btnLayerImg").addEventListener("click", () => pickFile(addImageLayer));
  $("#sIn").addEventListener("click", () => { stageZoom = clamp(stageScale(curNode()) * 1.2, .1, 4); renderStage(); });
  $("#sOut").addEventListener("click", () => { stageZoom = clamp(stageScale(curNode()) / 1.2, .1, 4); renderStage(); });
  $("#sFit").addEventListener("click", () => { stageZoom = null; renderStage(); });

  ["dragenter", "dragover"].forEach(t => wrap.addEventListener(t, e => { e.preventDefault(); wrap.classList.add("dragover"); }));
  ["dragleave", "drop"].forEach(t => wrap.addEventListener(t, e => { e.preventDefault(); if (t === "dragleave" && wrap.contains(e.relatedTarget)) return; wrap.classList.remove("dragover"); }));
  wrap.addEventListener("drop", e => {
    if (!canEdit()) return;
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && /^image\//.test(f.type)) { const n = curNode(); n && shotSrc(n) ? addImageLayer(f) : setShot(f); }
  });
  document.addEventListener("paste", e => {
    if (!canEdit()) return;
    const items = e.clipboardData && e.clipboardData.items; if (!items) return;
    for (const it of items) {
      if (it.type && it.type.indexOf("image") === 0) {
        const f = it.getAsFile();
        if (f) { const n = curNode(); n && shotSrc(n) ? addImageLayer(f) : setShot(f); e.preventDefault(); }
        return;
      }
    }
  });
  const fitSoon = onFrame(() => { if (!stageZoom) renderStage(); });
  new ResizeObserver(fitSoon).observe($("#stageScroll"));
}

/* ========================================================================
   저장 위치 — Artifact 공유본 / 로컬 폴더(구글 드라이브 동기화 폴더 등)
   폴더 모드는 File System Access API를 쓴다. 보드는 폴더에
     journey.json  · 여정/태그/캠페인 정의 (이미지 제외, 가벼움)
     img/*.webp    · 화면 이미지 원본
   두 갈래로 저장되고, Drive 데스크톱이 동기화를 담당한다.
   ======================================================================== */
const folder = { dir: null, name: "", auto: false, lastMod: 0, timer: null };

function fsSupported() { return typeof window.showDirectoryPicker === "function"; }
function blobToDataUrl(b) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });
}
async function writeFile(dirHandle, name, blob) {
  const fh = await dirHandle.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(blob); await w.close();
}
async function ensurePerm() {
  if (!folder.dir) return false;
  try {
    if ((await folder.dir.queryPermission({ mode: "readwrite" })) === "granted") return true;
    if ((await folder.dir.requestPermission({ mode: "readwrite" })) === "granted") return true;
  } catch (e) { /* 아래에서 안내 */ }
  toast("폴더 접근 권한이 필요합니다. 저장소에서 다시 연결하세요.", "bad");
  return false;
}

async function connectFolder() {
  if (!fsSupported()) { toast("이 브라우저는 폴더 연결을 지원하지 않습니다(Chrome·Edge에서 가능).", "bad"); return; }
  let dir;
  try {
    dir = await window.showDirectoryPicker({ id: "jta-board", mode: "readwrite" });
  } catch (e) { if (e && e.name !== "AbortError") toast("폴더를 열지 못했습니다", "bad"); return; }
  folder.dir = dir; folder.name = dir.name;
  try { await idbSet("folderHandle", dir); } catch (e) { /* 핸들 저장 불가 시 이번 세션만 유지 */ }
  let hasFile = false;
  try { await dir.getFileHandle("journey.json"); hasFile = true; } catch (e) {}
  if (hasFile) {
    const go = () => folderLoad(true).then(() => toast("폴더의 보드를 불러왔습니다", "ok"));
    if (dirty) confirmDel("폴더에 이미 보드가 있습니다. 지금 화면의 저장 안 된 변경을 버리고 불러올까요?", go);
    else go();
  } else {
    await folderSave();
  }
  setAutoSync(true);
  updateStorageUI();
}
async function folderSave() {
  if (!(await ensurePerm())) return;
  setSaveChip("dirty", "저장 중…");
  const snap = buildSnapshot();
  try {
    await hostUploadAll(snap);
    if (snap.uploads.length || snap.removals.length) {
      const imgDir = await folder.dir.getDirectoryHandle("img", { create: true });
      for (const u of snap.uploads) await writeFile(imgDir, u.ref.slice(4), u.blob);
      for (const r of snap.removals) { try { await imgDir.removeEntry(r.slice(4)); } catch (e) {} }
    }
    await writeFile(folder.dir, "journey.json", new Blob([JSON.stringify(snap.data, null, 2)], { type: "application/json" }));
    snap.commit(); dirty = false;
    try { folder.lastMod = (await (await folder.dir.getFileHandle("journey.json")).getFile()).lastModified; } catch (e) {}
    setSaveChip("ok", folder.name + " · " + timeAgo(state.updatedAt));
    saveDraft();
    toast("폴더에 저장했습니다" + (snap.uploads.length ? " · 이미지 " + snap.uploads.length + "개" : ""), "ok");
  } catch (e) {
    setSaveChip("dirty", "저장 안 됨");
    toast("폴더에 저장하지 못했습니다: " + (e && e.message ? e.message : ""), "bad");
  }
  updateStorageUI();
}
async function folderLoad(force) {
  if (!(await ensurePerm())) return;
  if (!force && dirty) { toast("저장 안 된 변경이 있어 불러오지 않았습니다", "bad"); return; }
  try {
    const f = await (await folder.dir.getFileHandle("journey.json")).getFile();
    const data = normalize(JSON.parse(await f.text()));
    let imgDir = null;
    try { imgDir = await folder.dir.getDirectoryHandle("img"); } catch (e) {}
    if (imgDir) {
      for (const b of data.boards) {
        for (const n of b.nodes) {
          if (n.shot && n.shot.ref) {
            try {
              const fh = await imgDir.getFileHandle(n.shot.ref.slice(4));
              n.shotData = await blobToDataUrl(await fh.getFile());
            } catch (e) { /* 파일이 없으면 썸네일로 대체 */ }
          }
        }
      }
    }
    state = data;
    savedRefs = collectRefs();
    const cb = B();
    sel = { node: cb.sel && cb.nodes.some(n => n.id === cb.sel) ? cb.sel : (cb.nodes[0] || {}).id || null, edge: null, layer: null };
    dirty = false; folder.lastMod = f.lastModified;
    mounted = { id: null, src: null, w: 0, h: 0 };
    $("#nodeLayer").innerHTML = "";
    Object.keys(EDGE_EL).forEach(k => { EDGE_EL[k].g.remove(); delete EDGE_EL[k]; });
    renderAll(); applyMode();
    setSaveChip("ok", folder.name + " · " + timeAgo(state.updatedAt));
    saveDraft();
  } catch (e) { toast("폴더에서 불러오지 못했습니다", "bad"); }
  updateStorageUI();
}
function setAutoSync(on) {
  folder.auto = on;
  clearInterval(folder.timer);
  if (on && folder.dir) folder.timer = setInterval(checkFolder, 15000);
}
async function checkFolder() {
  if (!folder.dir || dirty || document.hidden) return;
  try {
    if ((await folder.dir.queryPermission({ mode: "readwrite" })) !== "granted") return;
    const f = await (await folder.dir.getFileHandle("journey.json")).getFile();
    if (f.lastModified > folder.lastMod + 500) {
      await folderLoad(true);
      toast("폴더의 최신본으로 갱신했습니다", "ok");
    }
  } catch (e) { /* 파일이 잠깐 없는 순간은 무시 */ }
}
async function disconnectFolder() {
  setAutoSync(false);
  folder.dir = null; folder.name = "";
  try { await idbDel("folderHandle"); } catch (e) {}
  updateStorageUI();
  setSaveChip("dirty", "폴더 연결 해제됨");
}
async function restoreFolder() {
  if (!fsSupported()) return false;
  let h = null;
  try { h = await idbGet("folderHandle"); } catch (e) {}
  if (!h) return false;
  folder.dir = h; folder.name = h.name;
  let perm = "prompt";
  try { perm = await h.queryPermission({ mode: "readwrite" }); } catch (e) {}
  if (perm === "granted") { await folderLoad(true); setAutoSync(true); return true; }
  updateStorageUI();
  setSaveChip("off", folder.name + " · 권한 확인 필요");
  return "needs-permission";
}

/* ---------------- 이미지 호스팅(선택) ----------------
   업로드 엔드포인트를 지정하면 화면 이미지를 그쪽에 올리고 JSON에는 URL만 남긴다.
   설정값(토큰 포함)은 공유되는 JSON이 아니라 이 브라우저에만 저장한다. */
const HOST_KEY = "jta:imghost";
function hostCfg() { try { return JSON.parse(localStorage.getItem(HOST_KEY) || "null"); } catch (e) { return null; } }
function setHostCfg(c) { try { c ? localStorage.setItem(HOST_KEY, JSON.stringify(c)) : localStorage.removeItem(HOST_KEY); } catch (e) {} }
function dig(obj, path) { return String(path || "").split(".").reduce((o, k) => (o == null ? o : o[k]), obj); }
async function hostUploadAll(snap) {
  const cfg = hostCfg();
  if (!cfg || !cfg.url || !snap.uploads.length) return;
  const done = [];
  for (const u of snap.uploads) {
    const fd = new FormData();
    fd.append(cfg.field || "image", u.blob, u.ref.slice(4));
    const headers = {};
    if (cfg.auth) headers.Authorization = cfg.auth;
    let res;
    try {
      res = await fetch(cfg.url, { method: "POST", headers, body: fd });
    } catch (err) {
      throw new Error("이미지 호스팅에 접속하지 못했습니다. (Artifact 화면 안에서는 외부 업로드가 차단됩니다)");
    }
    if (!res.ok) throw new Error("이미지 업로드 실패 " + res.status);
    const j = await res.json().catch(() => null);
    const url = j ? dig(j, cfg.path || "data.link") : null;
    if (!url) throw new Error("응답에서 " + (cfg.path || "data.link") + " 경로를 찾지 못했습니다");
    snap.data.boards.forEach(b => b.nodes.forEach(n => {
      if (n.id === u.node.id) n.shot = { url, w: u.node.shotW, h: u.node.shotH };
    }));
    const i = snap.used.indexOf(u.ref);
    if (i >= 0) snap.used.splice(i, 1);
    done.push(u.ref);
  }
  snap.uploads.length = 0;                     // 파일로는 올리지 않는다
  toast("이미지 " + done.length + "개를 호스팅에 올렸습니다", "ok");
}
function openHostModal() {
  const c = hostCfg() || { url: "", field: "image", auth: "", path: "data.link" };
  openForm({
    title: "이미지 호스팅", icon: "up", okText: "저장",
    deleteText: hostCfg() ? "설정 삭제" : null,
    note: "화면 이미지를 외부 저장소에 올리고 JSON에는 URL만 남깁니다. 사내 S3·R2 업로더나 imgur 같은 서비스를 쓸 수 있습니다.<br>" +
      "<b>주의</b> — ① Artifact 화면 안에서는 보안 정책상 외부 업로드·표시가 모두 막히므로 내려받은 파일이나 자체 호스팅에서만 동작합니다. " +
      "② 공개 호스팅에 올린 이미지는 URL만 알면 누구나 볼 수 있으니 사내 화면 캡처에는 권장하지 않습니다. " +
      "③ 토큰은 이 브라우저에만 저장되고 공유 JSON에는 들어가지 않습니다.",
    fields: [
      { k: "url", label: "업로드 URL (POST · multipart)", mono: true, ph: "https://api.imgur.com/3/image" },

/* ========================================================================
   화면 이미지 등록 — 캔버스 드롭 · 노드에서 바로 올리기 · 일괄 등록
   ======================================================================== */
function pickFiles(cb) {
  const inp = $("#filesPick"); inp.value = "";
  inp.onchange = () => { const f = Array.prototype.slice.call(inp.files || []); if (f.length) cb(f); };
  inp.click();
}
function pickDir(cb) {
  const inp = $("#dirPick"); inp.value = "";
  inp.onchange = () => {
    const f = Array.prototype.slice.call(inp.files || []).filter(x => /^image\//.test(x.type));
    if (f.length) cb(f); else toast("폴더에 이미지가 없습니다", "bad");
  };
  inp.click();
}
function baseName(f) { return (f.name || "").replace(/\.[a-z0-9]+$/i, ""); }
function normName(s) {
  return String(s || "").toLowerCase()
    .replace(/\.[a-z0-9]+$/i, "")
    .replace(/^[\s._-]*\d+[\s._-]*/, "")      // 01_, 1-, 02 같은 앞 번호 제거
    .replace(/[\s._\-/:()\[\]{}·,]+/g, "");
}
/* 파일명 ↔ 페이지 이름·경로 자동 매칭 */
function guessNode(file) {
  const f = normName(file.name);
  if (!f) return null;
  let best = null, score = 0;
  B().nodes.forEach(n => {
    [n.name, n.path].forEach(cand => {
      const t = normName(cand);
      if (!t || t.length < 2) return;
      let sc = 0;
      if (t === f) sc = 100;
      else if (t.indexOf(f) === 0 || f.indexOf(t) === 0) sc = 80;      // 앞에서부터 일치
      else if (t.indexOf(f) >= 0 || f.indexOf(t) >= 0) sc = 66;        // 어딘가 포함
      if (sc > score || (sc === score && sc > 0 && best && shotSrc(best) && !shotSrc(n))) { score = sc; best = n; }
    });
  });
  return score >= 66 ? best : null;
}
/* 새 페이지 자리 — 기존 노드 아래쪽으로 줄맞춰 */
function freeSpot(i) {
  let maxY = 0, minX = 60;
  B().nodes.forEach(n => { maxY = Math.max(maxY, n.y + (NSZ[n.id] ? NSZ[n.id].h : 150)); minX = Math.min(minX, n.x); });
  return { x: minX + (i % 6) * 262, y: (B().nodes.length ? maxY + 60 : 90) + Math.floor(i / 6) * 236 };
}
function addNodeFor(name, at) {
  const p = at || freeSpot(0);
  const n = {
    id: uid("n"), kind: "page", name: name || "새 페이지", path: "", note: "",
    x: Math.round(p.x), y: Math.round(p.y), shot: null, shotData: null, thumb: null,
    shotW: DOC_W, shotH: DOC_H, hue: "none", size: "m", sharp: false, tags: [], camps: [], layers: []
  };
  B().nodes.push(n);
  return n;
}

/* ---------------- 일괄 등록 ---------------- */
function openBulkModal(files) {
  const rows = (files || []).map((f, i) => ({ file: f, target: (guessNode(f) || {}).id || "__new__", thumb: "", i }));
  const opt = (v, label, on) => '<option value="' + v + '"' + (on ? " selected" : "") + ">" + esc(label) + "</option>";
  const rowHtml = r =>
    '<div class="brow" data-row="' + r.i + '">' +
      '<img src="' + (r.thumb || "") + '" alt="">' +
      '<div class="fn">' + esc(r.file.name) + "<em>" + Math.round(r.file.size / 1024) + "KB</em></div>" +
      '<select class="field" data-target="' + r.i + '">' +
        opt("__new__", "+ 새 페이지로 추가", r.target === "__new__") +
        opt("__skip__", "건너뛰기", r.target === "__skip__") +
        B().nodes.map(n => opt(n.id, n.name, r.target === n.id)).join("") +
      "</select>" +
    "</div>";

  const body = rows.length
    ? '<p class="hint">파일 이름을 페이지 이름·경로와 맞춰 자동으로 짝지었습니다. 틀린 것만 바꾸세요. ' +
      '<span class="mono">01_홈.png</span>처럼 번호가 붙어 있어도 인식합니다.</p>' +
      '<div class="bulk" id="bulkList">' + rows.map(rowHtml).join("") + "</div>" +
      '<label class="bulkbar"><input type="checkbox" id="bulkChain"> 새로 만든 페이지를 파일 순서대로 연결하기</label>' +
      '<div class="bulkbar" id="bulkStatus"></div>'
    : '<div class="empty" style="border:2px dashed var(--stroke); border-radius:var(--r-md); padding:30px">' +
      ico("stack") + "<div>스크린샷 여러 장을 한 번에 등록합니다<br>여기에 파일을 끌어다 놓거나 아래에서 고르세요</div>" +
      '<div style="display:flex; gap:6px; margin-top:6px">' +
        '<button class="btn" data-more>' + ico("image", "xs") + "파일 고르기</button>" +
        '<button class="btn" data-dir>' + ico("folder", "xs") + "폴더에서 가져오기</button></div></div>";

  const root = modalHost();
  root.innerHTML =
    '<div class="scrim"><div class="modal glass" style="width:min(620px,100%)" role="dialog" aria-modal="true">' +
      '<div class="modal-head">' + ico("stack") + '<h3>화면 일괄 등록</h3><button class="btn icon sm" data-x>' + ico("close", "xs") + "</button></div>" +
      '<div class="modal-body" id="bulkBody">' + body + "</div>" +
      '<div class="modal-foot">' +
        (rows.length ? '<button class="btn" data-more>' + ico("plus", "xs") + "파일 더 담기</button>" : "") +
        '<div class="spacer"></div><button class="btn" data-x>취소</button>' +
        (rows.length ? '<button class="btn primary" data-run>' + rows.length + "장 등록</button>" : "") +
      "</div>" +
    "</div></div>";

  rows.forEach(async r => {                       // 미리보기는 뒤에서 채운다
    try {
      const t = await readImage(r.file, 90, 0.5, false);
      r.thumb = t.src;
      const el = $('[data-row="' + r.i + '"] img');
      if (el) el.src = t.src;
    } catch (e) {}
  });

  root.addEventListener("change", e => {
    const s = e.target.closest("[data-target]");
    if (s) rows[+s.dataset.target].target = s.value;
  });
  const modal = $(".modal", root);
  ["dragenter", "dragover"].forEach(t => modal.addEventListener(t, e => { e.preventDefault(); }));
  modal.addEventListener("drop", e => {
    e.preventDefault();
    const f = Array.prototype.slice.call(e.dataTransfer.files || []).filter(x => /^image\//.test(x.type));
    if (f.length) openBulkModal((files || []).concat(f));
  });
  root.addEventListener("click", async e => {
    if (e.target.closest("[data-x]") || e.target.classList.contains("scrim")) return closeModal();
    if (e.target.closest("[data-more]")) { closeModal(); return pickFiles(more => openBulkModal((files || []).concat(more))); }
    if (e.target.closest("[data-dir]")) { closeModal(); return pickDir(more => openBulkModal((files || []).concat(more))); }
    const run = e.target.closest("[data-run]");
    if (!run) return;
    run.disabled = true;
    const chain = $("#bulkChain").checked;
    const status = $("#bulkStatus");
    const made = [];
    let done = 0, failed = 0, seen = 0;
    for (const r of rows) {
      seen++;
      if (r.target === "__skip__") continue;
      status.textContent = "처리 중… " + seen + " / " + rows.length;
      const el = $('[data-row="' + r.i + '"]');
      try {
        const node = r.target === "__new__" ? addNodeFor(baseName(r.file), freeSpot(made.length)) : nodeById(r.target);
        if (!node) continue;
        if (r.target === "__new__") made.push(node);
        await setShot(r.file, node, true);
        done++;
      } catch (err) { failed++; }
      if (el) el.classList.add("done");
    }
    if (chain) {
      for (let i = 1; i < made.length; i++) {
        if (!B().edges.some(x => x.from === made[i - 1].id && x.to === made[i].id))
          B().edges.push({ id: uid("e"), from: made[i - 1].id, to: made[i].id, label: "", style: "solid", kind: "arrow",
            route: "curve", hue: "none", width: 2, a1: "auto", a2: "auto", points: [] });
      }
    }
    closeModal();
    markDirty(); renderFlow(); renderPanels();
    if (made.length) { selectNode(made[0].id); fitFlow(); } else renderStage();
    toast(done + "장 등록 완료" + (made.length ? " · 새 페이지 " + made.length + "개" : "") + (failed ? " · 실패 " + failed : ""), failed ? "bad" : "ok");
  });
}

/* ---------------- 캔버스 드래그&드롭 · 노드 버튼 ---------------- */
function initImport() {
  const flow = $("#flowPane"), surf = $("#flowSurface");
  $("#btnBulk").addEventListener("click", () => openBulkModal([]));
  const editable = () => canEdit();

  const nodeUnder = ev => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.closest ? el.closest("[data-node]") : null;
  };
  let hot = null;
  const setHot = el => {
    if (hot === el) return;
    if (hot) hot.classList.remove("drop-on");
    hot = el; if (hot) hot.classList.add("drop-on");
  };
  const hasFiles = e => e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") >= 0;

  ["dragenter", "dragover"].forEach(t => surf.addEventListener(t, e => {
    if (!hasFiles(e) || !editable()) return;
    e.preventDefault();
    flow.classList.add("dragover");
    setHot(nodeUnder(e));
  }));
  surf.addEventListener("dragleave", e => {
    if (surf.contains(e.relatedTarget)) return;
    flow.classList.remove("dragover"); setHot(null);
  });
  surf.addEventListener("drop", async e => {
    if (!hasFiles(e) || !editable()) return;
    e.preventDefault();
    flow.classList.remove("dragover");
    const target = hot; setHot(null);
    const files = Array.prototype.slice.call(e.dataTransfer.files || []).filter(f => /^image\//.test(f.type));
    if (!files.length) return;
    if (files.length > 1) return openBulkModal(files);          // 여러 장이면 매칭 화면으로
    let node = target ? nodeById(target.dataset.node) : null;
    if (!node) {                                               // 빈 곳 → 그 자리에 새 페이지
      const r = surf.getBoundingClientRect();
      node = addNodeFor(baseName(files[0]), {
        x: (e.clientX - r.left - state.ui.panX) / state.ui.zoom - 93,
        y: (e.clientY - r.top - state.ui.panY) / state.ui.zoom - 75
      });
    }
    try { await setShot(files[0], node, true); } catch (err) { toast("이미지를 읽지 못했습니다", "bad"); }
    markDirty(); renderFlow(); selectNode(node.id);
    toast(target ? node.name + " 화면을 등록했습니다" : "새 페이지 " + node.name + " 를 만들었습니다", "ok");
  });

  $("#nodeLayer").addEventListener("click", e => {
    const b = e.target.closest("[data-pick]");
    if (!b) return;
    e.stopPropagation();
    const id = b.dataset.pick;
    pickFile(f => setShot(f, nodeById(id)));
  });
}

/* ========================================================================
   관리자 모드 — 비밀번호를 아는 사람만 편집, 나머지는 보기 전용
   비밀번호 자체는 어디에도 저장하지 않는다. 저장되는 것은
   임의 salt + PBKDF2-SHA256 200,000회 해시뿐이라 파일을 열어봐도 원문이 없다.
   (다만 이 도구는 서버가 없으므로, 데이터 자체를 감추는 보안이 아니라
    "실수로 고치는 것"을 막는 편집 잠금이다. 아래 안내 문구로 명시한다.)
   ======================================================================== */
let admin = false;
const SESS_KEY = "jta:admin:" + location.pathname;
const PW_ITER = 200000;

function hasLock() { return !!(state.lock && state.lock.hash); }
function canEdit() {
  if (supaOn()) return isStaff();          // 서버 모드: 역할이 곧 권한 (서버에서 강제)
  return admin || !hasLock();
}
function subtleOK() { return !!(window.crypto && crypto.subtle && crypto.subtle.deriveBits); }

function b64(bytes) { let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s); }
function unb64(str) { const bin = atob(str), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
async function derive(pw, saltB64, iter) {
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: unb64(saltB64), iterations: iter || PW_ITER, hash: "SHA-256" }, key, 256);
  return b64(new Uint8Array(bits));
}
async function setPassword(pw) {
  const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
  state.lock = { salt, iter: PW_ITER, hash: await derive(pw, salt, PW_ITER), changedAt: Date.now() };
  admin = true;
  try { sessionStorage.setItem(SESS_KEY, state.lock.hash); } catch (e) {}
  markDirty(); applyMode();
}
async function verifyPassword(pw) {
  if (!hasLock()) return true;
  const h = await derive(pw, state.lock.salt, state.lock.iter);
  return h === state.lock.hash;
}
function pwAgeDays() { return state.lock && state.lock.changedAt ? Math.floor((Date.now() - state.lock.changedAt) / 86400000) : null; }

function applyMode() {
  const ro = !canEdit();
  document.body.classList.toggle("ro", ro);
  const b = $("#btnLock");
  $("use", b).setAttribute("href", ro ? "#i-lock" : "#i-unlock");
  $("#lockText").textContent = ro ? "보기 전용" : (hasLock() ? "관리자" : "잠금 없음");
  b.classList.toggle("on", !ro && hasLock());
  if (ro) { sel.layer = null; setTool("select"); }
  const age = pwAgeDays();
  b.title = hasLock()
    ? (ro ? "관리자 비밀번호를 입력하면 편집할 수 있습니다" : "관리자 모드 · 비밀번호 변경 " + (age === 0 ? "오늘" : age + "일 전"))
    : "아직 잠금이 없습니다 — 누구나 편집할 수 있어요";
  renderFlow(); renderStage(); renderPanels();
}

function initLock() {
  try {
    if (hasLock() && sessionStorage.getItem(SESS_KEY) === state.lock.hash) admin = true;

  mounted = { id: null, src: null, w: 0, h: 0 };

      saveFile((B().name || "board").replace(/[\\/:*?"<>|]/g, "") + ".board.json", JSON.stringify({ jtaBoard: 1, board: b }, null, 2), "application/json");

        fr.onload = () => {
          try {

            if (!b || !b.nodes) throw new Error("형식이 아닙니다");

            state.boards.push(board);
            switchBoard(state.boards.length - 1); syncBoardName();

          } catch (err) { toast("보드 JSON을 읽지 못했습니다", "bad"); }
        };
        fr.readAsText(f);
      };
      inp.click();
    }
  });
}

function saveSession(s) {
  session = s;
  try { s ? localStorage.setItem(SESS, JSON.stringify(s)) : localStorage.removeItem(SESS); } catch (e) {}
}

function here() { return location.origin + location.pathname + location.search; }
function readCallback() {                        // 로그인 후 되돌아온 주소의 #토큰
  const h = location.hash || "";
  if (h.indexOf("access_token=") < 0) return false;
  const q = new URLSearchParams(h.slice(1));
  saveSession({
    access_token: q.get("access_token"),
    refresh_token: q.get("refresh_token"),
    expires_at: Date.now() + (Number(q.get("expires_in")) || 3600) * 1000
  });
  history.replaceState(null, "", location.pathname + location.search);

  /* Supabase 는 Redirect URLs 허용 목록에 없는 주소를 무시하고 Site URL 로 보낸다.
     토큰은 이미 이 브라우저에 저장했으니, 같은 사이트라면 원래 있던 페이지로 되돌린다. */
  let back = null;

  if (back && back.indexOf(location.origin) === 0 && back !== here()) {
    location.replace(back);
    return "redirect";
  }
  return true;
}
async function ensureToken() {
  if (!session) return null;
  if (session.expires_at - Date.now() > 60000) return session.access_token;
  const c = supaCfg();
  let r;
  try {
    r = await fetch(c.url + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      headers: { apikey: c.anon, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    });
  } catch (e) {
    return session.access_token;          // 네트워크 문제 — 세션은 그대로 두고 재시도에 맡긴다
  }
  if (!r.ok) {                            // 서버가 거절한 경우에만 로그아웃
    if (r.status === 400 || r.status === 401 || r.status === 403) { saveSession(null); me = null; }
    return null;
  }
  const j = await r.json();
  saveSession({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000 });
  return session.access_token;
}
async function sapi(path, opts) {
  const c = supaCfg(), token = await ensureToken();
  const o = Object.assign({ headers: {} }, opts || {});
  o.headers = Object.assign({ apikey: c.anon, Authorization: "Bearer " + (token || c.anon) }, o.headers);
  const r = await fetch(c.url + path, o);
  if (!r.ok) {
    const txt = await r.text().catch(() => "");
    const err = new Error(txt || r.status);
    err.status = r.status;
    throw err;
  }
  return r.status === 204 ? null : r.json().catch(() => null);
}

async function signImages(data) {                 // 비공개 버킷 → 7일짜리 서명 주소
  const c = supaCfg();
  const paths = [];
  data.boards.forEach(b => b.nodes.forEach(n => { if (n.shot && n.shot.path) paths.push(n.shot.path); }));
  if (!paths.length) return;
  try {
    const res = await sapi("/storage/v1/object/sign/" + c.bucket, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ expiresIn: 604800, paths })
    });
    const map = {};
    (res || []).forEach(r => { if (r.signedURL) map[r.path || r.signedURL] = c.url + "/storage/v1" + r.signedURL; });
    data.boards.forEach(b => b.nodes.forEach(n => {
      if (n.shot && n.shot.path && map[n.shot.path]) n.shot.url = map[n.shot.path];
    }));
  } catch (e) { /* 서명 실패 시 썸네일만 보인다 */ }
}
async function serverSave() {
  if (!me) { toast("먼저 구글 계정으로 로그인하세요", "bad"); return; }
  if (!isStaff()) { toast("편집 권한이 없습니다. 서버관리자에게 운영자 권한을 요청하세요.", "bad"); return; }
  const c = supaCfg();
  setSaveChip("dirty", "저장 중…");
  const snap = buildSnapshot();
  try {
    for (const u of snap.uploads) {              // 이미지 → Storage
      const path = u.ref.slice(4);
      await sapi("/storage/v1/object/" + c.bucket + "/" + path, {
        method: "POST",
        headers: { "Content-Type": u.blob.type, "x-upsert": "true" },
        body: u.blob
      });
      snap.data.boards.forEach(b => b.nodes.forEach(n => {
        if (n.id === u.node.id) n.shot = { path, w: u.node.shotW, h: u.node.shotH };
      }));
    }
    snap.uploads.length = 0;
    const body = { id: c.docId, title: state.title, data: snap.data, updated_at: new Date().toISOString(), updated_by: me.id };
    let res;
    if (docStamp) {                               // 내가 불러온 판본 위에만 덮어쓴다
      res = await sapi("/rest/v1/jta_docs?id=eq." + encodeURIComponent(c.docId) +
        "&updated_at=eq." + encodeURIComponent(docStamp), {
        method: "PATCH",
        headers: { "Content-Type": "application/json", Prefer: "return=representation" },
        body: JSON.stringify(body)
      });
      if (!res || !res.length) {                  // 아무 행도 안 바뀜 = 그 사이 누가 저장함
        setSaveChip("dirty", "저장 안 됨");
        return toast("다른 사람이 먼저 저장했습니다. 새로고침해 최신본을 받은 뒤 다시 저장하세요.", "bad");
      }
    } else {                                      // 문서가 아직 없다 → 새로 만든다
      res = await sapi("/rest/v1/jta_docs", {
        method: "POST",
        headers: { "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=representation" },
        body: JSON.stringify(body)
      });
      if (!res || !res.length) throw new Error("문서를 만들지 못했습니다");
    }
    docStamp = res[0].updated_at;
    snap.commit();
    await signImages(state);
    dirty = false;
    mounted = { id: null, src: null, w: 0, h: 0 };
    renderFlow(); renderStage();
    setSaveChip("ok", "서버 저장됨 · 방금");
    toast("서버에 저장했습니다. 다른 사람도 새로고침하면 보입니다.", "ok");
  } catch (e) {
    setSaveChip("dirty", "저장 안 됨");
    toast("저장 실패: " + String(e.message || e).slice(0, 120), "bad");
  }
}
